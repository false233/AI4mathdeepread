      "content": "{\n  \"content_md\": \"## 4.1 阅读主线与本章目标\\n\\n本章把第 3 章的 $n+1$ 个相位序列「装配」成 $n+1$ 个相邻二进系统，证明定理 1.1。这是全文几何构造的高潮。\\n\\n读完本章，你应能：(1) 由相位序列构造背景网格 $G^{(i)}$ 并证明它是二进网格（引理 3.1）；(2) 定义可接受立方体与极大可接受立方体，并解释可接受条件 $\\\\ell(W)\\\\le\\\\frac18\\\\operatorname{dist}_\\\\infty(W,0)$ 的几何意义；(3) 构造系统 $D_{V,(i)}$（$i\\\\ge1$）与系统 $0$；(4) 完整证明剖分、嵌套、边长三性质；(5) 理解 $D_{V,(0)}$ 与 [3] 系统一致的意义。\\n\\n## 4.2 背景网格\\n\\n### 4.2.1 构造\\n\\n设 $\\\\mathbf1=(1,\\\\dots,1)\\\\in\\\\mathbb R^n$。对每个 $i\\\\in\\\\{0,\\\\dots,n\\\\}$，用第 3 章的相位序列 $\\\\theta_i(j)$ 定义第 $j$ 尺度的背景立方体族\\n\\n$$G_j^{(i)}:=\\\\{2^j m+\\\\theta_i(j)\\\\mathbf1+[0,2^j)^n : m\\\\in\\\\mathbb Z^n\\\\},$$\\n\\n并设 $G^{(i)}=\\\\bigcup_{j\\\\in\\\\mathbb Z}G_j^{(i)}$。\\n\\n**记号说明。** $2^j m+\\\\theta_i(j)\\\\mathbf1+[0,2^j)^n$ 是「以 $2^j m+\\\\theta_i(j)\\\\mathbf1$ 为一个顶点、边长 $2^j$、边平行坐标轴」的半开立方体。相位 $\\\\theta_i(j)$ 在每个坐标方向都平移 $\\\\theta_i(j)$（因此用 $\\\\theta_i(j)\\\\mathbf1$），这是第 3 章「一维端点集 $A_j^{(i)}=2^j\\\\mathbb Z+\\\\theta_i(j)$ 的 $n$ 重笛卡尔积」的高维写法。\\n\\n### 4.2.2 引理 3.1：背景网格是二进网格\\n\\n**引理 4.1（引理 3.1）。** 对每个 $i\\\\in\\\\{0,\\\\dots,n\\\\}$，$G^{(i)}$ 是 $\\\\mathbb R^n$ 上的二进网格：每个 $G_j^{(i)}$ 剖分 $\\\\mathbb R^n$，且 $j\u003ck$ 时 $P\\\\in G_k^{(i)}$、$Q\\\\in G_j^{(i)}$ 满足 $Q\\\\cap P\\\\in\\\\{\\\\varnothing,P,Q\\\\}$。\\n\\n**证明。** 固定 $i$，记 $\\\\theta_j=\\\\theta_i(j)$。\\n\\n**剖分。** 固定尺度 $j$，一维区间\\n\\n$$I_{j,m}=2^j m+\\\\theta_j+[0,2^j),\\\\qquad m\\\\in\\\\mathbb Z$$\\n\\n剖分 $\\\\mathbb R$：对任意 $x\\\\in\\\\mathbb R$，取 $m=\\\\lfloor2^{-j}x-\\\\theta_j\\\\rfloor$（下取整），则 $2^j m+\\\\theta_j\\\\le x\u003c2^j(m+1)+\\\\theta_j$，故 $x\\\\in I_{j,m}$；不同 $m$ 的区间半开不交。取 $n$ 重笛卡尔积，得 $G_j^{(i)}$ 剖分 $\\\\mathbb R^n$。\\n\\n**嵌套。** 由嵌套条件 (3)（第 3 章），$q_j:=2\\\\theta_{j+1}-\\\\theta_j\\\\in\\\\mathbb Z$。于是\\n\\n$$2^{j+1}(p+\\\\theta_{j+1})=2^j(2p+2\\\\theta_{j+1})=2^j(2p+\\\\theta_j+q_j)\\\\in 2^j\\\\mathbb Z+\\\\theta_j=A_j^{(i)},$$\\n\\n即细尺度端点也是粗尺度端点。进一步，每个 $j+1$ 尺度区间分解为两个 $j$ 尺度区间：\\n\\n$$I_{j+1,p}=I_{j,2p+q_j}\\\\cup I_{j,2p+q_j+1}.$$\\n\\n归纳得任意 $j\u003ck$ 的嵌套。$n$ 维由笛卡尔积逐坐标保持。$\\\\Box$\\n\\n**直观解释。** 引理 3.1 是第 3 章「相位序列」的兑现：嵌套条件 (3) 正是为了让背景网格 $G^{(i)}$ 真正成为二进网格。没有它，$G^{(i)}$ 只是「一堆尺度各异的立方体」，没有跨尺度嵌套，无法做后续的「根 + 后代」构造。\\n\\n## 4.3 系统 0：沿用 [3] 的扰动系统\\n\\n### 4.3.1 层分解与层尺度\\n\\n回顾第 1 章 §1.8bis 的层分解。层 $L_l=[-2^l,2^l)^n\\\\setminus[-2^{l-1},2^{l-1})^n$（$l\\\\in\\\\mathbb Z$），层尺度 $b_l=2^{l-2}$，$X=\\\\mathbb R^n\\\\setminus\\\\{0\\\\}=\\\\bigcup_{l\\\\in\\\\mathbb Z}L_l$。\\n\\n### 4.3.2 系统 0 的定义\\n\\n系统 $0$ 直接沿用 [3] 的扰动系统 $D_V$：\\n\\n$$D_{V,(0)}:=D_V,\\\\qquad D_V^k=\\\\bigcup_{l\\\\in\\\\mathbb Z}D_V^{k,l},$$\\n\\n其中\\n\\n$$D_V^{k,l}:=\\\\{Q\\\\in\\\\mathcal D: Q\\\\subseteq L_l,\\\\ \\\\ell(Q)=2^{-k}b_l\\\\},$$\\n\\n$\\\\mathcal D$ 是标准二进网格。这个系统剖分 $X$、满足嵌套、且边长 $\\\\ell(Q)\\\\sim2^{-k}|x|$（$Q\\\\in D_V^k$，$x\\\\in Q$）。\\n\\n**直观解释。** 系统 0 是「基线」：它用标准二进网格 $\\\\mathcal D$ 的立方体，按层 $L_l$ 选取边长 $2^{-k}b_l=2^{-k}\\\\cdot2^{l-2}$ 的格子（在层 $L_l$ 内，$|x|\\\\sim2^l$，故 $\\\\ell(Q)\\\\sim2^{-k}|x|$）。它「没有相位扰动」，是 [3] 的原始构造，本文保留它作为 $n+1$ 个系统中的第 $0$ 个。\\n\\n## 4.4 系统 $1,\\\\dots,n$：可接受立方体构造\\n\\n### 4.4.1 可接受条件\\n\\n对 $i\\\\in\\\\{1,\\\\dots,n\\\\}$，称背景立方体 $W\\\\in G^{(i)}$ **可接受**（acceptable），若\\n\\n$$\\\\ell(W)\\\\le\\\\frac18\\\\operatorname{dist}_\\\\infty(W,0),\\\\qquad \\\\operatorname{dist}_\\\\infty(W,0):=\\\\inf_{y\\\\in W}|y|_\\\\infty .$$\\n\\n**直观解释。** 可接受条件要求「格子离原点足够远、相对其到原点的距离足够小」：$\\\\ell(W)\\\\le\\\\operatorname{dist}_\\\\infty(W,0)/8$ 意味着格子的边长不超过「格子到原点 $\\\\ell^\\\\infty$ 距离」的 $1/8$。这保证格子「不触及原点附近的奇异区」，从而其边长能与「到原点距离」同阶（$|x|\\\\sim\\\\operatorname{dist}_\\\\infty(W,0)$，见 §4.5.3）。系数 $1/8$ 是为边长估计（$R/18\u003cs\\\\le R/8$）留出余量。\\n\\n### 4.4.2 极大可接受立方体与系统构造\\n\\n设 $W^{(i)}$ 为**所有（关于包含关系）极大的可接受立方体**的集合。这些极大可接受立方体作为第 $i$ 个系统的「第 $0$ 代根立方体」。对 $k\\\\ge0$ 定义\\n\\n$$D_{V,(i)}^k:=\\\\{Q : Q\\\\ \\\\text{是某个}\\\\ W\\\\in W^{(i)}\\\\ \\\\text{的第}\\\\ k\\\\ \\\\text{代二进后代}\\\\},$$\\n\\n并设 $D_{V,(i)}=\\\\bigcup_{k\\\\ge0}D_{V,(i)}^k$。\\n\\n**「第 $k$ 代后代」的含义。** 因 $W\\\\in G^{(i)}$，且 $G^{(i)}$ 是二进网格（引理 4.1），$W$ 的第 $k$ 代后代是 $G^{(i)}$ 中含于 $W$、边长 $\\\\ell(W)/2^k$ 的立方体（$W$ 有恰好 $2^{kn}$ 个第 $k$ 代后代）。\\n\\n**直观解释。** 构造分两层：先取「极大可接受立方体」作为「根」（这些根覆盖 $X$ 但两两不交，见 §4.5.1），再在每个根内逐代二分细分。于是每个 $D_{V,(i)}$ 是一个「根森林」——每棵树是一个二进网格的子树，边长 $\\\\ell(W)2^{-k}$ 随代际 $k$ 递减。\\n\\n## 4.5 三性质验证（定理 1.1 的证明）\\n\\n### 4.5.1 剖分性质\\n\\n**命题 4.2（剖分）。** 对 $i\\\\ge1$ 与 $k\\\\ge0$，$D_{V,(i)}^k$ 剖分 $X$。\\n\\n**证明。** 固定 $i\\\\ge1$，$x\\\\neq0$，令 $R=|x|_\\\\infty$。在背景网格 $G^{(i)}$ 中，含 $x$ 的立方体随尺度 $j$ 形成一个**祖先链**。考察边长 $s=2^j$ 的含 $x$ 立方体 $W$：\\n\\n- **充分小 $s$ 时可接受**：当 $s\\\\to0$ 时，$\\\\operatorname{dist}_\\\\infty(W,0)\\\\ge R-s$（因 $x\\\\in W$ 且 $W$ 的 $\\\\ell^\\\\infty$ 半径 $\\\\le s$）。取 $s$ 足够小使 $s\\\\le(R-s)/8$，则 $W$ 可接受。\\n- **充分大 $s$ 时不可接受**：对任意含 $x$ 的立方体 $W$，$\\\\operatorname{dist}_\\\\infty(W,0)\\\\le R$，故 $s\u003eR/8$ 时 $s\u003e\\\\operatorname{dist}_\\\\infty(W,0)/8$，$W$ 不可接受。\\n\\n因此含 $x$ 的立方体中，「可接受」的集合非空且边长有上界，其**极大元**（关于包含）存在，$x$ 含于某个极大可接受立方体。\\n\\n**极大可接受立方体两两不交。** 若两个极大可接受立方体 $W_1,W_2$ 相交，由引理 4.1 的嵌套性，$W_1\\\\subseteq W_2$ 或 $W_2\\\\subseteq W_1$。但可接受性传给子格（若 $P\\\\subseteq W$ 且 $W$ 可接受，则 $\\\\ell(P)\\\\le\\\\ell(W)$ 且 $\\\\operatorname{dist}_\\\\infty(P,0)\\\\ge\\\\operatorname{dist}_\\\\infty(W,0)$，故 $P$ 可接受），这与「$W_1,W_2$ 都是极大」矛盾（被包含者非极大）。故极大可接受立方体两两不交，覆盖 $X$。\\n\\n每个根逐代细分后，$D_{V,(i)}^k$ 是「各根的第 $k$ 代后代」的并，仍剖分 $X$。$\\\\Box$\\n\\n### 4.5.2 嵌套性质\\n\\n**命题 4.3（嵌套）。** 对 $k\u003el$，$Q\\\\in D_{V,(i)}^l$、$P\\\\in D_{V,(i)}^k$，有 $Q\\\\cap P\\\\in\\\\{\\\\varnothing,P\\\\}$。\\n\\n**证明。** 若 $P,Q$ 来自**不同**根立方体，则 $P,Q$ 分别含于两个极大可接受立方体，后者两两不交（命题 4.2），故 $P\\\\cap Q=\\\\varnothing$。若 $P,Q$ 来自**同一**根 $W$，则 $P,Q$ 都属于背景二进网格 $G^{(i)}$，嵌套性由引理 4.1 给出（$Q$ 是第 $l$ 代、$P$ 是第 $k$ 代，$k\u003el$，故 $P\\\\subseteq Q$ 或不相交）。$\\\\Box$\\n\\n### 4.5.3 边长性质\\n\\n**命题 4.4（边长）。** 对 $Q\\\\in D_{V,(i)}^k$（$i\\\\ge1$）与 $x\\\\in Q$，有\\n\\n$$\\\\frac{2^{-k}}{18\\\\sqrt n}\\\\,|x| \\\\;\u003c\\\\; \\\\ell(Q)\\\\;\\\\le\\\\; \\\\frac{2^{-k}}{8}\\\\,|x|,$$\\n\\n故 $\\\\ell(Q)\\\\sim2^{-k}|x|$。\\n\\n**证明。** 设 $W\\\\in W^{(i)}$ 为 $Q$ 的根立方体，$s=\\\\ell(W)$，取 $x\\\\in W$，$R=|x|_\\\\infty$。\\n\\n**下界。** 由可接受性，\\n\\n$$s\\\\le\\\\frac18\\\\operatorname{dist}_\\\\infty(W,0)\\\\le\\\\frac18 R.$$\\n\\n**上界。** 设 $\\\\widetilde W$ 为 $W$ 在 $G^{(i)}$ 中的父格（边长 $2s$）。由 $W$ 的极大性，$\\\\widetilde W$ 不可接受，故\\n\\n$$2s=\\\\ell(\\\\widetilde W)\u003e\\\\frac18\\\\operatorname{dist}_\\\\infty(\\\\widetilde W,0),$$\\n\\n即 $\\\\operatorname{dist}_\\\\infty(\\\\widetilde W,0)\u003c16s$。因 $x\\\\in\\\\widetilde W$，且 $\\\\widetilde W$ 的 $\\\\ell^\\\\infty$ 直径为 $2s$，\\n\\n$$R=|x|_\\\\infty\\\\le\\\\operatorname{dist}_\\\\infty(\\\\widetilde W,0)+2s\u003c16s+2s=18s.$$\\n\\n合得\\n\\n$$\\\\frac R{18}\u003cs\\\\le\\\\frac R8.$$\\n\\n对第 $k$ 代 $Q$，$\\\\ell(Q)=2^{-k}s$，故\\n\\n$$\\\\frac{2^{-k}}{18}R\u003c\\\\ell(Q)\\\\le\\\\frac{2^{-k}}8 R.$$\\n\\n用 $|x|_\\\\infty\\\\le|x|\\\\le\\\\sqrt n|x|_\\\\infty$ 换算到欧氏范数，得\\n\\n$$\\\\frac{2^{-k}}{18\\\\sqrt n}|x|\u003c\\\\ell(Q)\\\\le\\\\frac{2^{-k}}8|x|.$$\\n\\n这正是 $\\\\ell(Q)\\\\sim2^{-k}|x|$（常数只依赖 $n$）。$\\\\Box$\\n\\n**证明机制总结。** 边长性质是「可接受 + 极大」的双向夹逼：可接受给上界 $s\\\\le R/8$（格子不能太大），极大给下界 $R/18\u003cs$（格子不能太小，否则父格也可接受）。两者合起来把根边长锁定在 $|x|$ 的同阶，代际细分再乘 $2^{-k}$。\\n\\n## 4.6 定理 1.1 的完整陈述\\n\\n综合 §4.3–4.5，得到本文第一个主定理：\\n\\n**定理 1.1。** 设 $V(x)=a|x|^{-2}$，$a\\\\ge-((n-2)/2)^2$，$X=\\\\mathbb R^n\\\\setminus\\\\{0\\\\}$。则存在 $n+1$ 个系统 $D_{V,(i)}$（$i\\\\in\\\\{0,\\\\dots,n\\\\}$），每个 $D_{V,(i)}=\\\\bigcup_{k\\\\ge0}D_{V,(i)}^k$ 满足：\\n\\n(i) 每个 $k\\\\in\\\\mathbb Z_+$，$D_{V,(i)}^k$ 剖分 $X$，立方体内部两两不交；\\n(ii) $k\u003el$ 时，$Q\\\\in D_{V,(i)}^l$、$P\\\\in D_{V,(i)}^k$ 满足 $Q\\\\cap P=\\\\varnothing$ 或 $P\\\\subseteq Q$；\\n(iii) $Q\\\\in D_{V,(i)}^k$、$x\\\\in Q$ 时 $\\\\ell(Q)\\\\sim2^{-k}|x|$。\\n\\n且 $D_{V,(0)}$ 与 [3] 的系统一致。\\n\\n**证明。** 系统 $0$ 的性质由 [3]（§4.3.2）；系统 $1,\\\\dots,n$ 的三性质由命题 4.2、4.3、4.4。$\\\\Box$\\n\\n## 4.7 例子与直观解释\\n\\n**例 1（$n=3$ 的可接受立方体）。** 取 $n=3$，$i=1$，相位 $\\\\theta_1(j)$。背景网格 $G^{(1)}$ 中，边长 $2^j$ 的立方体含 $x=(3,0,0)$（$R=3$）者，可接受当且仅当 $2^j\\\\le\\\\operatorname{dist}_\\\\infty(W,0)/8\\\\le3/8$。故 $j$ 需满足 $2^j\\\\le3/8$，即 $j\\\\le-2$（$2^{-2}=1/4\\\\le3/8$）。含 $x$ 的可接受立方体的极大者边长 $s\\\\approx3/8$ 量级（实际由 §4.5.3 锁定在 $R/18\u003cs\\\\le R/8$，即 $1/6\u003cs\\\\le3/8$）。这与「边长 $\\\\sim|x|$」一致。\\n\\n**例 2（根森林的直观）。** 系统 $D_{V,(1)}$ 是一棵「根森林」：每个极大可接受立方体是一棵树的根，逐代二分出 $2^{kn}$ 个后代。离原点近的区域，根小、树「矮」；离原点远的区域，根大、树「高」。整体上，边长随「到原点的距离」缩放——这正是 $\\\\ell(Q)\\\\sim2^{-k}|x|$ 的几何图像。\\n\\n**例 3（为什么系数 $1/8$）。** 可接受条件的系数 $1/8$ 是「技术性」选择：它保证 §4.5.3 的夹逼 $R/18\u003cs\\\\le R/8$ 成立（上界来自 $1/8$，下界来自「父格不可接受」的 $1/8$ 与 $\\\\ell^\\\\infty$ 直径 $2s$ 的 $18=16+2$）。换成别的系数（如 $1/16$）会改变夹逼常数，但不改变 $\\\\ell(Q)\\\\sim2^{-k}|x|$ 的定性结论。\\n\\n**例 4（系统 0 与系统 $i$ 的对比）。** 系统 0 用「层分解 + 标准网格」，边长 $2^{-k}b_l=2^{-k}2^{l-2}$；系统 $i\\\\ge1$ 用「相位网格 + 可接受立方体」，边长 $2^{-k}\\\\ell(W)$（$R/18\u003c\\\\ell(W)\\\\le R/8$）。两者边长都 $\\\\sim2^{-k}|x|$，但「错开方式」不同：系统 0 无相位扰动，系统 $i$ 有相位 $\\\\theta_i(j)$ 的扰动。正是这些扰动使 $n+1$ 个系统「相邻」——第 5 章的主题。\\n\\n## 4.8 理解检查\\n\\n1. 写出背景网格 $G_j^{(i)}$ 的定义，并证明引理 4.1（剖分与嵌套）。\\n2. 定义可接受立方体，并解释条件 $\\\\ell(W)\\\\le\\\\frac18\\\\operatorname{dist}_\\\\infty(W,0)$ 的几何意义。\\n3. 定义系统 $D_{V,(i)}$（$i\\\\ge1$）与系统 $0$，说明「第 $k$ 代后代」的含义。\\n4. 完整证明剖分性质（$x$ 含于极大可接受立方体、极大可接受立方体两两不交）。\\n5. 完整证明边长性质（$R/18\u003cs\\\\le R/8$ 的夹逼），并指出哪一步用了「极大性」。\\n6. 说明定理 1.1 三条性质如何由命题 4.2–4.4 与 [3] 组合得到。\\n7. 用一句话说明「可接受系数 $1/8$」在边长夹逼中的作用。\\n\\n## 4.2bis 可接受条件的尺度分析\\n\\n可接受条件 $\\\\ell(W)\\\\le\\\\frac18\\\\operatorname{dist}_\\\\infty(W,0)$ 不是随意设定，它有清晰的尺度含义。这里做完整推导。\\n\\n**目标。** 我们要让「根立方体边长 $s$ 与到原点的距离 $|x|$ 同阶」，即 $s\\\\sim R$（$R=|x|_\\\\infty$）。这是定理 1.1 性质 (iii) 的要求（$\\\\ell(Q)\\\\sim2^{-k}|x|$ 在 $k=0$ 时即 $s\\\\sim R$）。\\n\\n**可接受条件给出上界。** 若 $W$ 含 $x$ 且 $s\\\\le\\\\operatorname{dist}_\\\\infty(W,0)/8\\\\le R/8$，则 $s\\\\le R/8$，即「根不能太大」。这排除了「离原点近却用大格子」的情形——大格子会横跨奇异区，破坏 $\\\\ell(Q)\\\\sim|x|$ 的匹配。\\n\\n**极大性给出下界。** 若 $s$ 太小（$s\\\\ll R$），则 $W$ 的父格 $\\\\widetilde W$（边长 $2s$）仍可能可接受，$W$ 就不是极大。极大性迫使「$W$ 的父格不可接受」，即 $2s\u003e\\\\operatorname{dist}_\\\\infty(\\\\widetilde W,0)/8$，配合 $\\\\operatorname{dist}_\\\\infty(\\\\widetilde W,0)\\\\ge R-2s$（$\\\\widetilde W$ 含 $x$）得 $2s\u003e(R-2s)/8$，即 $16s\u003eR-2s$，$18s\u003eR$，$s\u003eR/18$。这排除「离原点近却用太小格子」的情形——太小格子会导致「父格仍可接受」，违背极大性。\\n\\n**结论。** 可接受条件 + 极大性双向夹逼，把根边长锁定在 $R/18\u003cs\\\\le R/8$，即 $s\\\\sim R$。这就是 §4.5.3 的完整尺度逻辑。\\n\\n## 4.3bis 系统 0 的层分解细节\\n\\n系统 0（[3] 的 $D_V$）依赖层分解，这里把细节补齐，便于与系统 $i\\\\ge1$ 对照。\\n\\n**层的意义。** 层 $L_l=[-2^l,2^l)^n\\\\setminus[-2^{l-1},2^{l-1})^n$ 是「到原点 $\\\\ell^\\\\infty$ 距离在 $2^{l-1}$ 与 $2^l$ 之间」的环带。对 $x\\\\in L_l$，$2^{l-1}\\\\le|x|_\\\\infty\u003c2^l$，故 $|x|_\\\\infty\\\\sim2^l$。层分解把「连续的距离 $|x|$」离散化为「层指标 $l$」。\\n\\n**层尺度 $b_l=2^{l-2}$。** 在层 $L_l$ 内，格子边长取 $b_l=2^{l-2}$（再按代际 $2^{-k}$ 细分）。$b_l$ 是 $2^l$ 的 $1/4$，保证 $b_l\\\\le2^{l-1}\\\\le|x|_\\\\infty$（格子不横跨层）且 $b_l\\\\sim|x|_\\\\infty$（边长与距离同阶）。\\n\\n**系统 0 的定义回顾。** $D_V^{k,l}=\\\\{Q\\\\in\\\\mathcal D:Q\\\\subseteq L_l,\\\\ell(Q)=2^{-k}b_l\\\\}$。即在标准二进网格 $\\\\mathcal D$ 中，取「含于层 $L_l$ 且边长 $2^{-k}b_l$」的立方体。标准网格的边长是 $2^j$（$j\\\\in\\\\mathbb Z$），$2^{-k}b_l=2^{-k+l-2}$ 恰为标准边长，故 $D_V^{k,l}$ 是 $\\\\mathcal D$ 的某个尺度的子族。\\n\\n**与系统 $i$ 的差别。** 系统 0 的「错开」由标准网格 $\\\\mathcal D$ 决定（无相位扰动）；系统 $i\\\\ge1$ 的「错开」由相位 $\\\\theta_i(j)$ 决定。两者边长都 $\\\\sim2^{-k}|x|$，但「相位」不同——这正是 $n+1$ 个系统「相邻」的来源。\\n\\n## 4.4bis 极大可接受立方体的存在性与结构\\n\\n**存在性。** §4.5.1 已证明每个 $x\\\\neq0$ 含于某极大可接受立方体。这里补充「为什么极大元存在」的严谨说明。\\n\\n含 $x$ 的立方体在 $G^{(i)}$ 中成一条**祖先链**（边长从 $2^{-\\\\infty}$ 到 $2^{+\\\\infty}$）。沿这条链，「可接受」是一个**区间性质**：边长 $s$ 小时可接受（§4.5.1），$s$ 大时不可接受。故「可接受」的立方体集合是链上的一个**前段**，其最大元（关于包含）即极大可接受立方体。这个最大元存在，因为「可接受」对 $s$ 有上界 $R/8$（$s\u003eR/8$ 不可接受），故链上可接受部分的边长有界，最大元取「可接受部分的最大边长者」。\\n\\n**唯一性（对每个 $x$）。** 含 $x$ 的极大可接受立方体唯一（因为祖先链上最大可接受者唯一）。但**不同的 $x$ 可能落在同一个极大可接受立方体**，故 $W^{(i)}$ 是「覆盖 $X$ 的两两不交根立方体族」，每个根对应「一段」$x$。\\n\\n**根的大小分布。** 离原点远的区域，$R=|x|_\\\\infty$ 大，根边长 $s\\\\sim R$ 大；离原点近的区域，根小。因此 $W^{(i)}$ 是「随到原点距离缩放的根森林」，边长分布与 $|x|$ 匹配。\\n\\n## 4.5bis 三性质的更多直观\\n\\n**剖分的直观。** 剖分性质说「每个 $x\\\\neq0$ 恰好属于一个 $k$ 代立方体」。这来自两层：先由「极大可接受根」把 $X$ 分成两两不交的「根域」，再在每个根内按二进网格逐代细分。两层都不重不漏，故剖分成立。\\n\\n**嵌套的直观。** 嵌套性质说「细格要么在粗格内、要么不交」。同根的细格嵌套在根内（背景网格的嵌套）；不同根的格子不交（根两两不交）。这使系统 $D_{V,(i)}$ 具有与标准二进网格相同的树结构。\\n\\n**边长的直观。** 边长性质是「自适应」的核心：$\\\\ell(Q)\\\\sim2^{-k}|x|$ 表示「第 $k$ 代格子的边长是到原点距离的 $2^{-k}$ 倍」。离原点远，格子大；代际越深，格子越小。这使系统「贴合」反平方势 $a|x|^{-2}$ 的奇异性——势的特征尺度就是 $|x|$。\\n\\n## 4.6bis 系统 0 与系统 $i\\\\ge1$ 的逐项对照\\n\\n| 项目 | 系统 0 | 系统 $i\\\\ge1$ |\\n|---|---|---|\\n| 基础网格 | 标准二进网格 $\\\\mathcal D$ | 相位背景网格 $G^{(i)}$ |\\n| 边长决定 | 层 $L_l$ + 层尺度 $b_l$ | 极大可接受根 $W^{(i)}$ + 代际 $k$ |\\n| 相位 | 无（$\\\\theta=0$） | $\\\\theta_i(j)$ 扰动 |\\n| 根 | 层 $L_l$ 内的标准立方体 | 极大可接受立方体 |\\n| 边长量级 | $2^{-k}2^{l-2}$ | $2^{-k}\\\\ell(W)$（$R/18\u003c\\\\ell(W)\\\\le R/8$） |\\n\\n（此表以列表形式在 TeX 中呈现。）\\n\\n**本质差别。** 系统 0 用「层」离散化距离，系统 $i\\\\ge1$ 用「可接受根」离散化距离。两者都实现 $\\\\ell(Q)\\\\sim2^{-k}|x|$，但「错开」方式不同，组合起来提供相邻覆盖。\\n\\n## 4.7bis 更多数值例子\\n\\n**例 5（$n=3$、$i=1$ 的根边长区间）。** $x=(3,0,0)$，$R=3$。根边长 $s$ 满足 $R/18=1/6\u003cs\\\\le R/8=3/8$。故根边长在 $(0.167,0.375]$ 之间。背景网格 $G^{(1)}$ 的边长是 $2^j$（$j\\\\in\\\\mathbb Z$），取 $j=-2$（$s=1/4$）满足 $1/6\u003c1/4\\\\le3/8$。故含 $x$ 的极大可接受根边长 $s=1/4$（若 $2^{-2}=1/4$ 对应的含 $x$ 立方体可接受且其父格 $s=1/2$ 不可接受）。\\n\\n**例 6（根森林的一棵树的计数）。** 根 $W$ 边长 $s$，第 $k$ 代有 $2^{kn}$ 个后代（每方向二分、$n$ 方向）。$n=3$、$k=2$ 时 $2^{6}=64$ 个后代，边长 $s/4$。这展示「逐代二分」的指数增长。\\n\\n**例 7（系统 $i$ 与系统 $h$ 的错开）。** 系统 $1$（相位 $\\\\theta_1(j)$）与系统 $2$（相位 $\\\\theta_2(j)$）的根立方体「错开」：它们来自不同的背景网格 $G^{(1)}$、$G^{(2)}$，端点集 $A_j^{(1)}$、$A_j^{(2)}$ 相距 $\\\\ge d^*\\\\cdot2^j$（第 3 章）。这个「错开」使第 5 章的鸽笼论证成立——任意立方体 $J$ 至少被一个系统「干净」覆盖。\\n\\n## 4.8bis 习题与思考题\\n\\n**习题 1（背景网格）。** 写出 $n=2$、$j=0$、$\\\\theta_i(0)=1/3$ 时 $G_0^{(i)}$ 的四个立方体（含原点附近者）。\\n\\n**习题 2（可接受判定）。** $n=3$、$W$ 是 $G^{(i)}$ 中含 $x=(0,0,2)$、边长 $1/4$ 的立方体。判定 $W$ 是否可接受。提示：$\\\\operatorname{dist}_\\\\infty(W,0)\\\\approx2$（$W$ 的 $z$ 坐标范围 $[1.75,2)$ 或 $[2,2.25)$），$1/4\\\\le2/8=1/4$，恰可接受。\\n\\n**习题 3（边长夹逼）。** 独立推导 $R/18\u003cs\\\\le R/8$，指出「可接受」与「极大」各给哪个方向的不等式。\\n\\n**习题 4（剖分）。** 证明含 $x$ 的极大可接受立方体唯一（沿祖先链）。\\n\\n**习题 5（系统 0）。** 写出 $n=3$、$l=0$ 时层 $L_0$ 与层尺度 $b_0$，并举一个 $D_V^{0,0}$ 的立方体。\\n\\n**思考题 1。** 若把可接受系数 $1/8$ 改为 $1/16$，夹逼会变成什么？（提示：$R/34\u003cs\\\\le R/16$，常数变大但定性结论不变。）\\n\\n**思考题 2。** 为什么系统 $i\\\\ge1$ 用「可接受立方体」而非「层分解」？两者能否统一？（提示：可接受立方体是「相位网格上的层分解」，比标准网格的层分解更灵活。）\\n\\n## 4.9bis 文献注记与符号表\\n\\n**文献注记。** 背景网格 $G^{(i)}$ 与可接受立方体的构造源自论文 §3；系统 0 的层分解 $L_l$、层尺度 $b_l$ 源自 [3]。可接受条件的「双向夹逼」技巧（可接受 + 极大性）是调和分析中构造「自适应二进系统」的标准手法，与 [2] 的临界半径函数构造一脉相承。\\n\\n**本章符号表。**\\n\\n- $G_j^{(i)}=\\\\{2^j m+\\\\theta_i(j)\\\\mathbf1+[0,2^j)^n\\\\}$：背景立方体族；\\n- $G^{(i)}=\\\\bigcup_jG_j^{(i)}$：背景网格；\\n- $\\\\operatorname{dist}_\\\\infty(W,0)=\\\\inf_{y\\\\in W}|y|_\\\\infty$：$W$ 到原点的 $\\\\ell^\\\\infty$ 距离；\\n- $W^{(i)}$：极大可接受立方体（根）；\\n- $D_{V,(i)}^k$：第 $i$ 系统第 $k$ 代；\\n- $L_l$、$b_l=2^{l-2}$：层与层尺度（系统 0）；\\n- $D_V^{k,l}$：系统 0 的第 $k$ 代、第 $l$ 层子族。\\n\\n## 4.10 从背景网格到扰动系统的「裁剪」哲学\\n\\n本章的构造体现一个贯穿全文的哲学：**先有「骨架」，再「裁剪」**。\\n\\n**骨架。** 第 3 章的相位序列提供「$n+1$ 个分离的背景网格 $G^{(i)}$」——它们是「均匀错开」的骨架，边长 $2^j$ 与位置无关。\\n\\n**裁剪。** 本章用「可接受立方体」把骨架「裁剪」成「边长 $\\\\sim|x|$ 的自适应系统」——只保留「离原点足够远、相对距离足够小」的立方体作为根，逐代细分。裁剪不改变「错开」（相位仍在），只改变「边长分布」（从均匀 $2^j$ 变为 $\\\\sim|x|$）。\\n\\n**结果。** 「骨架 + 裁剪」得到 $n+1$ 个「既错开（$d^*\u003e0$）又自适应（$\\\\ell\\\\sim|x|$）」的系统。这个「分离（第 3 章）+ 自适应（本章）」的组合，是全文几何构造的两大支柱，也是第 5 章相邻覆盖得以成立的全部前提。\\n\\n## 4.11 常见疑问解答（FAQ）\\n\\n**问 1：为什么系统 0 不也用「可接受立方体」？** 答：系统 0 沿用 [3] 的层分解构造，是为了「$D_{V,(0)}$ 与 [3] 一致」这一兼容性要求（定理 1.1 末句）。层分解与可接受立方体是两种等价的「自适应裁剪」，前者用标准网格、后者用相位网格。\\n\\n**问 2：可接受系数 $1/8$ 能改吗？** 答：能，改后夹逼常数变（§4.8bis 思考题 1），但 $\\\\ell(Q)\\\\sim2^{-k}|x|$ 的定性结论不变。$1/8$ 是论文的选择。\\n\\n**问 3：$W^{(i)}$ 的根是否覆盖整个 $X$？** 答：是，§4.5.1 证明每个 $x\\\\neq0$ 含于某极大可接受立方体，故 $\\\\bigcup_{W\\\\in W^{(i)}}W=X$。\\n\\n**问 4：系统 $i$ 与 $h$ 的根会重叠吗？** 答：会（不同系统的根可以重叠，因为它们来自不同背景网格）。但第 5 章关心的不是「根是否重叠」，而是「任意立方体 $J$ 是否被某个系统的某个格子干净覆盖」——这由 $d^*\u003e0$ 保证。\\n\\n**问 5：本章与第 5 章的分工？** 答：本章「构造」$n+1$ 系统（定理 1.1）；第 5 章「使用」这些系统证相邻覆盖（定理 1.2）。\\n\\n## 4.12 一维原型：可接受立方体的完整手算\\n\\n为把「可接受立方体」的构造彻底讲透，这里在一维（$n=1$ 时 $X=\\\\mathbb R\\\\setminus\\\\{0\\\\}$）做完整手算。虽然本文要求 $n\\\\ge3$（第 1 章 §1.3.4），一维原型能清晰展示构造的每一步。\\n\\n**设定（一维示意）。** 背景网格 $G^{(i)}$ 的一维区间是 $I_{j,m}=2^j m+\\\\theta_i(j)+[0,2^j)$。可接受条件 $\\\\ell(W)\\\\le\\\\frac18\\\\operatorname{dist}(W,0)$ 中 $\\\\operatorname{dist}(W,0)=\\\\inf_{y\\\\in W}|y|$。\\n\\n**手算：$x=5$。** $R=|x|=5$。含 $x$ 的区间沿祖先链，边长 $s=2^j$（$j$ 递减）。可接受要求 $s\\\\le\\\\operatorname{dist}(W,0)/8\\\\le5/8$。故 $j\\\\le-1$（$2^{-1}=1/2\\\\le5/8$）时可接受，$j\\\\ge0$（$s\\\\ge1$）不可接受。极大可接受区间边长 $s=1/2$（$j=-1$），其父格 $s=1$ 不可接受（$1\u003e5/8$）。夹逼：$R/18=5/18\\\\approx0.28\u003c1/2\\\\le5/8=R/8$。$\\\\checkmark$\\n\\n**手算：$x=0.1$。** $R=0.1$。可接受要求 $s\\\\le0.1/8=0.0125$。故 $j\\\\le-7$（$2^{-7}=1/128\\\\approx0.0078\\\\le0.0125$）。极大可接受区间边长 $s=1/128$。夹逼：$0.1/18\\\\approx0.0056\u003c0.0078\\\\le0.0125$。$\\\\checkmark$ 可见「离原点越近，根越小」，边长 $\\\\sim|x|$。\\n\\n**启示。** 一维原型展示「可接受 + 极大」的夹逼机制：$s\\\\le R/8$（可接受）与 $s\u003eR/18$（极大性）把 $s$ 锁定在 $R$ 的同阶。$n$ 维只是把区间换成立方体、$|x|$ 换成 $|x|_\\\\infty$（再换算欧氏范数）。\\n\\n## 4.13 三性质的严格符号推导（逐字版）\\n\\n为供读者逐行核对，这里把命题 4.2–4.4 的证明用最严格的符号重写一遍（与正文等价，符号更完整）。\\n\\n**剖分（命题 4.2，逐字版）。** 固定 $i$，$x\\\\in X$，$R=|x|_\\\\infty$。设 $\\\\{W_j\\\\}_{j\\\\in\\\\mathbb Z}$ 为 $G^{(i)}$ 中含 $x$ 的立方体祖先链（$\\\\ell(W_j)=2^j$）。\\n\\n- 对 $j\\\\to-\\\\infty$：因 $x\\\\in W_j$ 且 $W_j$ 的 $\\\\ell^\\\\infty$ 半径为 $2^j$，$\\\\operatorname{dist}_\\\\infty(W_j,0)\\\\ge R-2^j$。取 $j$ 使 $2^j\\\\le(R-2^j)/8$（即 $9\\\\cdot2^j\\\\le R$，$j\\\\le\\\\log_2(R/9)$），则 $W_j$ 可接受。\\n- 对 $j\\\\to+\\\\infty$：$\\\\operatorname{dist}_\\\\infty(W_j,0)\\\\le R$（因 $x\\\\in W_j$），故 $2^j\u003eR/8$ 时 $W_j$ 不可接受。\\n\\n故可接受部分非空且有界，其「最大边长」的立方体 $W_{j_*}$ 即极大可接受立方体。两两不交性：若 $W_{j_*},W_{j'_*}$ 相交，由嵌套 $W_{j_*}\\\\subseteq W_{j'_*}$ 或反向，被包含者可接受（可接受性传给子格），矛盾于极大。故根两两不交。\\n\\n**边长（命题 4.4，逐字版）。** $s=\\\\ell(W)=2^{j_*}$，$\\\\widetilde W=W_{j_*+1}$（父格，边长 $2s$）。\\n\\n上界：$s\\\\le\\\\operatorname{dist}_\\\\infty(W,0)/8\\\\le R/8$。\\n\\n下界：$\\\\widetilde W$ 不可接受（极大性），$2s\u003e\\\\operatorname{dist}_\\\\infty(\\\\widetilde W,0)/8$，即 $\\\\operatorname{dist}_\\\\infty(\\\\widetilde W,0)\u003c16s$。又 $x\\\\in\\\\widetilde W$，$R=|x|_\\\\infty\\\\le\\\\operatorname{dist}_\\\\infty(\\\\widetilde W,0)+2s\u003c18s$，故 $s\u003eR/18$。\\n\\n代际：$Q$ 为 $W$ 的第 $k$ 代后代，$\\\\ell(Q)=2^{-k}s$，$x\\\\in Q\\\\subseteq W$（$Q$ 含 $x$），故\\n\\n$$\\\\frac{2^{-k}R}{18}\u003c\\\\ell(Q)\\\\le\\\\frac{2^{-k}R}{8}.$$\\n\\n欧氏换算：$R=|x|_\\\\infty$，$|x|_\\\\infty\\\\le|x|\\\\le\\\\sqrt n|x|_\\\\infty$，故\\n\\n$$\\\\frac{2^{-k}|x|}{18\\\\sqrt n}\u003c\\\\ell(Q)\\\\le\\\\frac{2^{-k}|x|}{8}.$$\\n\\n$\\\\Box$\\n\\n## 4.14 与经典 $3^n$ 平移系统的构造对照\\n\\n本章的 $n+1$ 系统与第 2 章的经典 $3^n$ 平移系统，在「构造哲学」上有深刻的对应，这里逐项对照。\\n\\n**经典 $3^n$（第 2 章）。** 标准网格的 $3^n$ 个平移（常相位 $0,1/3,2/3$），边长 $2^j$ 均匀。相邻覆盖靠「同尺度端点分离」（最小间距 $2^j/3$）。\\n\\n**本文 $n+1$（本章 + 第 3 章）。** $n+1$ 个相位序列（随 $j$ 轮转），边长 $2^{-k}|x|$ 自适应。相邻覆盖靠「相对距离 $d^*\u003e0$」（第 3 章）+「可接受裁剪」（本章）。\\n\\n**对照表（列表形式）。**\\n\\n- 系统数量：经典 $3^n$（指数）；本文 $n+1$（线性）；\\n- 边长：经典 $2^j$（均匀）；本文 $2^{-k}|x|$（自适应）；\\n- 相位：经典常相位；本文相位序列；\\n- 分离：经典 $1/3$（常数）；本文 $d^*=1/M$（$\\\\sim1/n$）；\\n- 嵌套：经典常相位不跨尺度嵌套；本文相位序列跨尺度嵌套。\\n\\n**本质。** 经典 $3^n$ 是「无势、均匀边长」情形的相邻系统；本文 $n+1$ 是「反平方势、自适应边长」情形的相邻系统。前者用「平移」实现分离，后者用「相位轮转 + 可接受裁剪」实现分离与自适应。两者在「$n$ 个坐标方向至多排除一个脏系统」的鸽笼论证上完全同构（第 5 章），差别仅在「系统的构造方式」与「系统数量」。\\n\\n## 4.15 补充习题与详细解答\\n\\n**习题 6（一维手算）。** 在 §4.12 的一维原型中，对 $x=1$ 计算极大可接受区间的边长。提示：$R=1$，$s\\\\le1/8$，取 $j=-3$（$s=1/8$），父格 $s=1/4$，$1/4\u003e1/8$ 不可接受；极大可接受边长 $s=1/8$。\\n\\n**习题 7（$n$ 维边长换算）。** 由 $|x|_\\\\infty\\\\le|x|\\\\le\\\\sqrt n|x|_\\\\infty$ 推导 $\\\\ell(Q)$ 的欧氏范数夹逼。提示：$R\\\\ge|x|/\\\\sqrt n$，故下界 $2^{-k}R/18\\\\ge2^{-k}|x|/(18\\\\sqrt n)$；$R\\\\le|x|$，故上界 $2^{-k}R/8\\\\le2^{-k}|x|/8$。\\n\\n**习题 8（极大性）。** 证明：若 $W$ 是含 $x$ 的可接受立方体且其父格 $\\\\widetilde W$ 也可接受，则 $W$ 不是极大可接受立方体。提示：直接由「极大」定义。\\n\\n**习题 9（系统 0 的边长）。** 对 $n=3$、$l=2$，验证系统 0 的层尺度 $b_2=2^{0}=1$，且对 $x\\\\in L_2$（$2\\\\le|x|_\\\\infty\u003c4$），$D_V^{0,2}$ 的立方体边长 $1$ 与 $|x|$ 同阶。\\n\\n**思考题 3。** 本文系统 $i\\\\ge1$ 用「可接受立方体」、系统 0 用「层分解」。若统一用「可接受立方体」构造系统 0（取 $i=0$、$\\\\theta_0(j)=0$），会得到与 [3] 相同的系统吗？（提示：标准网格的可接受立方体与层分解的立方体是否一致，是一个可检验的练习。）\\n\\n**思考题 4。** 第 5 章的覆盖常数 $\\\\frac4{d^*}=4M$ 与本章的边长夹逼常数（$18\\\\sqrt n$、$8$）是否相关？说明「可接受系数 $1/8$」与「$d^*$」在第 5 章论证中各自的作用。\\n\\n## 4.16 本章技术总结与全文定位\\n\\n**技术总结。** 本章的核心贡献是「可接受裁剪」：把第 3 章的 $n+1$ 个均匀背景网格，裁剪成 $n+1$ 个「边长 $\\\\sim2^{-k}|x|$」的自适应系统。三步：(1) 背景网格是二进网格（引理 4.1，相位嵌套）；(2) 可接受立方体 $\\\\ell(W)\\\\le\\\\frac18\\\\operatorname{dist}_\\\\infty(W,0)$ 定义「根」；(3) 三性质验证（剖分、嵌套、边长）。边长性质的关键是「可接受 + 极大」的双向夹逼 $R/18\u003cs\\\\le R/8$。\\n\\n**全文定位。** 本章是「几何构造」的完成：第 2 章（标准网格）、第 3 章（相位分离）、本章（自适应裁剪）三者合起来，得到定理 1.1 的 $n+1$ 个相邻二进系统。这为第 5 章（局部相邻覆盖）提供了全部几何前提。\\n\\n**与后续章节的依赖链。** 本章 → 第 5 章（用 $n+1$ 系统 + $d^*$ 证局部相邻覆盖）→ 第 6 章（用相邻覆盖定义核尺度）→ 第 7 章（核尺度非拟度量）。本章的边长 $\\\\ell(Q)\\\\sim2^{-k}|x|$ 与 $d^*\u003e0$ 是后续所有估计的两个基本量。\\n\\n## 4.17 本章结尾的完整符号表\\n\\n- $G_j^{(i)}=\\\\{2^j m+\\\\theta_i(j)\\\\mathbf1+[0,2^j)^n:m\\\\in\\\\mathbb Z^n\\\\}$；\\n- $G^{(i)}=\\\\bigcup_{j\\\\in\\\\mathbb Z}G_j^{(i)}$；\\n- $\\\\operatorname{dist}_\\\\infty(W,0)=\\\\inf_{y\\\\in W}|y|_\\\\infty$；\\n- 可接受：$\\\\ell(W)\\\\le\\\\frac18\\\\operatorname{dist}_\\\\infty(W,0)$；\\n- $W^{(i)}$：极大可接受立方体；\\n- $D_{V,(i)}^k$：$W^{(i)}$ 中根的第 $k$ 代后代；\\n- $D_{V,(i)}=\\\\bigcup_{k\\\\ge0}D_{V,(i)}^k$；\\n- $L_l=[-2^l,2^l)^n\\\\setminus[-2^{l-1},2^{l-1})^n$，$b_l=2^{l-2}$（系统 0）；\\n- $D_V^{k,l}=\\\\{Q\\\\in\\\\mathcal D:Q\\\\subseteq L_l,\\\\ell(Q)=2^{-k}b_l\\\\}$（系统 0）。\\n\\n这些符号将在第 5 章（定理 1.2 的 $D_{V,(i)}$、$d^*$）与第 6 章（核尺度 $\\\\widetilde d_\\\\alpha$ 的局部二进尺度 $\\\\delta_{\\\\rm dy}$）直接沿用。\\n\\n## 4.18 二维手算例子\\n\\n在 $n=2$（$X=\\\\mathbb R^2\\\\setminus\\\\{0\\\\}$）做两个手算，直观展示「可接受裁剪」在二维的形状。\\n\\n**例 8（二维可接受根）。** 取 $i=1$、$j=0$、$\\\\theta_1(0)=1/3$。背景网格 $G_0^{(1)}$ 的立方体是 $m+(1/3,1/3)+[0,1)^2$（$m\\\\in\\\\mathbb Z^2$）。考虑 $x=(0.8,0.8)$（$R=0.8$）。含 $x$ 的 $j=0$ 立方体是 $(1/3,1/3)+[0,1)^2=[1/3,4/3)^2$，其 $\\\\operatorname{dist}_\\\\infty(W,0)=\\\\min_{y\\\\in W}|y|_\\\\infty=1/3$（$W$ 的左下角到原点的 $\\\\ell^\\\\infty$ 距离）。可接受需 $1\\\\le1/3\\\\cdot(1/8)=1/24$？不成立（$1\u003e1/24$），故不可接受。含 $x$ 的 $j=-2$ 立方体（边长 $1/4$）$\\\\operatorname{dist}_\\\\infty(W,0)\\\\approx0.5$，可接受需 $1/4\\\\le0.5/8=1/16$？不成立。可见 $x=(0.8,0.8)$ 附近的根边长需 $s\\\\le R/8=0.1$，即 $j\\\\le-4$（$2^{-4}=1/16\\\\le0.1$）。这个手算展示了「离原点近的区域根很小」的二维情形。\\n\\n**例 9（根森林的二维形状）。** 在二维，$W^{(1)}$ 的根是「围绕原点的同心环带内的方形环」：离原点近的根小、远的根大。整体像一个「方形靶环」，每个环由若干方形根拼成。逐代细分后，$D_{V,(1)}$ 在二维是「边长随半径缩放的方形网格」，直观上「越靠近原点越密」。\\n\\n**例 10（两个系统的错开，二维）。** 系统 1（相位 $\\\\theta_1$）与系统 2（相位 $\\\\theta_2$）的根在二维「互相错开」：系统 1 的根边界落在系统 2 的根内部，反之亦然。这个「错开」由第 3 章的 $d^*\u003e0$ 保证，使第 5 章「任意小方块 $J$ 至少被一个系统干净覆盖」在二维成立。\\n\\n## 4.19 系统 $i$ 与系统 $h$ 错开的几何解释\\n\\n第 5 章的鸽笼论证依赖「$n+1$ 个系统互相错开」，这里给出几何解释。\\n\\n**错开的来源。** 系统 $i$ 的根来自背景网格 $G^{(i)}$，系统 $h$ 的根来自 $G^{(h)}$。$G^{(i)}$ 与 $G^{(h)}$ 的端点集 $A_j^{(i)}=2^j\\\\mathbb Z+\\\\theta_i(j)$ 与 $A_j^{(h)}=2^j\\\\mathbb Z+\\\\theta_h(j)$ 相距 $\\\\ge d^*\\\\cdot2^j$（第 3 章）。因此 $G^{(i)}$ 的立方体边界与 $G^{(h)}$ 的立方体边界「错开」至少 $d^*\\\\cdot2^j$。\\n\\n**错开的后果。** 任意轴平行立方体 $J$（边长 $r$），在尺度 $s\\\\sim r$ 上，若 $J$ 横跨 $G^{(i)}$ 的某个边界（即 $J$ 内部含 $G^{(i)}$ 的端点），则 $J$ 不会横跨 $G^{(h)}$ 的边界（因为 $G^{(i)}$ 与 $G^{(h)}$ 的端点相距 $\\\\ge d^*\\\\cdot s\u003e2r$）。故「横跨边界」在每个方向至多发生在**一个**系统，$n$ 个方向至多排除 $n$ 个系统，$n+1$ 个系统中至少一个「全方向干净」。这就是第 5 章定理 1.2 的几何本质。\\n\\n## 4.20 更多习题与详细解答提示\\n\\n**习题 10（二维手算）。** 在例 8 中，验证 $x=(0.8,0.8)$ 附近含 $x$ 的极大可接受根的边长约 $s=1/16$（$j=-4$）。提示：$s\\\\le R/8=0.1$，$2^{-4}=0.0625\\\\le0.1$，$2^{-3}=0.125\u003e0.1$，故 $j=-4$。\\n\\n**习题 11（错开验证）。** 设 $d^*=1/5$、尺度 $s$。验证两个系统的端点最小距离 $\\\\ge d^*\\\\cdot s=s/5$，并说明「$r\\\\le d^*s/2$ 的 $J$ 不可能同时横跨两个系统的边界」。\\n\\n**习题 12（可接受性传给子格）。** 严格证明：若 $W$ 可接受且 $P\\\\subseteq W$（$P\\\\in G^{(i)}$），则 $P$ 可接受。提示：$\\\\ell(P)\\\\le\\\\ell(W)$ 且 $\\\\operatorname{dist}_\\\\infty(P,0)\\\\ge\\\\operatorname{dist}_\\\\infty(W,0)$。\\n\\n**习题 13（系统 0 与层）。** 验证 $X=\\\\bigcup_{l\\\\in\\\\mathbb Z}L_l$（层分解覆盖 $X$），并说明 $x\\\\in L_{l(x)}$ 的唯一层指标 $l(x)$。\\n\\n**思考题 5。** 本文的可接受条件是 $\\\\ell(W)\\\\le\\\\frac18\\\\operatorname{dist}_\\\\infty(W,0)$。若改用欧氏距离 $\\\\ell(W)\\\\le\\\\frac18\\\\operatorname{dist}(W,0)$（$\\\\operatorname{dist}(W,0)=\\\\inf_{y\\\\in W}|y|$），边长夹逼会变成什么？两种条件是否等价（至多常数差）？\\n\\n**思考题 6。** 第 5 章的尺度选择 $2Mr\u003cs\\\\le4Mr$ 与本章的边长夹逼 $R/18\u003cs\\\\le R/8$ 都是「把尺度锁定在同阶」。说明二者在「可接受性验证」中如何衔接（$s\\\\le4Mr\\\\le|x|_\\\\infty/9$ 使 $Q$ 可接受）。\\n\\n## 4.21 本章历史注记\\n\\n**可接受立方体的思想源头。** 「可接受」条件（离原点足够远、格子足够小）是调和分析中构造「自适应二进系统」的标准手法，可追溯到「临界半径函数」思想（[2]）与「层分解」思想（[3]）。本文把这两种思想统一在「相位网格上的可接受裁剪」这一框架下。\\n\\n**「极大可接受立方体」与「极大函数」的联系。** 「取极大可接受立方体」与调和分析中「取极大立方体」（覆盖引理、Calderón–Zygmund 分解）一脉相承：都是「沿包含关系取极大元」，得到两两不交的覆盖。这是「二进树结构」的经典用法。\\n\\n**本文的贡献。** 本文把「可接受裁剪」从「标准网格」（[3] 的层分解）推广到「相位网格」（$n+1$ 个背景网格 $G^{(i)}$），从而在保持 $\\\\ell(Q)\\\\sim2^{-k}|x|$ 的同时获得「$n+1$ 个系统的相邻性」。这是对 [3] 的关键扩展。\\n\\n## 4.22 常见疑问解答（FAQ 续）\\n\\n**问 6：$W^{(i)}$ 的根有多少个？** 答：无穷多个（每个「到原点距离的量级」对应若干根）。但每个根边长 $\\\\sim$ 其到原点的距离，根的数量与边长分布由「可接受 + 极大」唯一确定。\\n\\n**问 7：系统 $i$ 的根边界与系统 $h$ 的根边界会重合吗？** 答：不会（$d^*\u003e0$ 保证端点分离）。这是第 5 章「干净覆盖」的关键。\\n\\n**问 8：为什么 $i$ 只取 $1,\\\\dots,n$（而非更多）？** 答：第 5 章鸽笼论证「$n$ 方向至多排除 $n$ 系统」只需 $n+1$ 个系统（$i=0,\\\\dots,n$）。更多系统不必要。\\n\\n**问 9：本章的边长夹逼常数 $18\\\\sqrt n$、$8$ 会进入第 5 章的覆盖常数吗？** 答：第 5 章的覆盖常数 $\\\\frac4{d^*}$ 主要由 $d^*$ 决定；本章的夹逼常数用于「边长 $\\\\ell(Q)\\\\sim2^{-k}|x|$」，与覆盖常数间接相关（通过「尺度匹配」）。\\n\\n**问 10：本章与第 1 章的层分解（§1.8bis）是什么关系？** 答：第 1 章的层分解是「背景」（系统 0 用）；本章的「可接受立方体」是「相位网格上的层分解」（系统 $i\\\\ge1$ 用）。两者是同一「自适应裁剪」思想在不同网格上的实现。\\n\\n## 4.23 补充技术细节：父格的唯一性与 $q_j$ 的递推\\n\\n引理 4.1 的嵌套证明用到了 $q_j=2\\\\theta_{j+1}-\\\\theta_j\\\\in\\\\mathbb Z$，这里补充两个技术细节。\\n\\n**父格的唯一性。** 在背景网格 $G^{(i)}$ 中，每个立方体 $W\\\\in G_j^{(i)}$（$j$ 有限）有唯一父格 $\\\\widetilde W\\\\in G_{j+1}^{(i)}$。这是因为一维区间 $I_{j,m}$ 有唯一父区间 $I_{j+1,\\\\lfloor m/2\\\\rfloor-q_j}$（由 §3.3 的递推 $I_{j+1,p}=I_{j,2p+q_j}\\\\cup I_{j,2p+q_j+1}$ 反解 $p$）。$n$ 维由笛卡尔积逐坐标给出。唯一父格是 §4.5.3「设 $\\\\widetilde W$ 为 $W$ 的父格」的合法性依据。\\n\\n**$q_j$ 的周期与相位轮转。** $q_j=2\\\\theta_i(j+1)-\\\\theta_i(j)\\\\in\\\\mathbb Z$。对引理 2.1 的相位 $\\\\theta_i(j)=[ir_j]_M/M$，$q_j=(2[ir_{j+1}]_M-[ir_j]_M)/M\\\\in\\\\mathbb Z$，取值在 $\\\\{0,1\\\\}$（因 $2[ir_{j+1}]_M-[ir_j]_M$ 在 $[-M+1,2M-2]$ 之间，且是 $M$ 的整数倍，故只能取 $0$ 或 $M$，即 $q_j\\\\in\\\\{0,1\\\\}$）。$q_j$ 的取值决定「细分时子格如何编号」，是背景网格嵌套的「分岔参数」。\\n\\n## 4.24 可接受条件的等价刻画\\n\\n可接受条件 $\\\\ell(W)\\\\le\\\\frac18\\\\operatorname{dist}_\\\\infty(W,0)$ 有若干等价刻画，这里列出便于不同场景使用。\\n\\n**刻画 1（边长与距离之比）。** 可接受 $\\\\iff \\\\ell(W)/\\\\operatorname{dist}_\\\\infty(W,0)\\\\le1/8$。即「相对边长」不超过 $1/8$。\\n\\n**刻画 2（根边长夹逼）。** 对含 $x$ 的极大可接受根 $W$，$\\\\ell(W)\\\\in(R/18,R/8]$（$R=|x|_\\\\infty$）。这是可接受 + 极大性的等价形式。\\n\\n**刻画 3（不触及原点邻域）。** 可接受 $\\\\iff W\\\\cap\\\\{y:|y|_\\\\infty\u003c\\\\operatorname{dist}_\\\\infty(W,0)/4\\\\}=\\\\varnothing$（格子不触及「半径 $1/4$ 距离」的原点邻域，因 $\\\\ell(W)/2\\\\le\\\\operatorname{dist}_\\\\infty(W,0)/16$）。这从「几何隔离」角度解释「可接受」。\\n\\n**刻画 4（尺度分离）。** 可接受 $\\\\iff 2^j\\\\le\\\\operatorname{dist}_\\\\infty(W,0)/8$，即尺度 $j$ 满足 $j\\\\le\\\\log_2(\\\\operatorname{dist}_\\\\infty(W,0)/8)$。这是「尺度上界」，说明「离原点越近，可用尺度越小」。\\n\\n## 4.25 从可接受条件看反平方势的「自适应」\\n\\n本章的构造与反平方势 $a|x|^{-2}$ 的奇异性有直接对应，这里点明。\\n\\n**势的特征尺度。** 反平方势 $a|x|^{-2}$ 在点 $x$ 附近的「变化尺度」是 $|x|$（第 1 章 §1.6.4）：在球 $B(x,\\\\rho)$（$\\\\rho\\\\ll|x|$）内势几乎常数，$\\\\rho\\\\sim|x|$ 时势显著变化。因此「与势适配」的格子边长应 $\\\\sim|x|$。\\n\\n**可接受条件实现适配。** 可接受条件 $\\\\ell(W)\\\\le\\\\operatorname{dist}_\\\\infty(W,0)/8$ 保证格子边长不超过「到原点距离」的 $1/8$，从而格子「不横跨」势的显著变化区（势在格内几乎常数）。这正是「扰动二进系统 $D_V$ 反映算子内蕴几何」的落实：格子大小由「势的特征尺度 $|x|$」决定。\\n\\n**与第 1 章定理 A 的呼应。** 第 1 章定理 A（[2]）的边长是 $\\\\ell(Q)\\\\sim2^{-k}\\\\rho(x,V)$（临界半径）；本文反平方势的边长是 $\\\\ell(Q)\\\\sim2^{-k}|x|$（$|x|$ 即局部化临界半径 $\\\\rho_{\\\\rm loc}$）。本章的「可接受裁剪」就是把「$\\\\rho(x,V)\\\\sim|x|$」这个尺度落实为「极大可接受根 + 逐代细分」的构造。\\n\\n## 4.26 本章综合回顾与自测清单\\n\\n进入第 5 章前，请确认能回答以下问题：\\n\\n1. 由相位序列写出背景网格 $G_j^{(i)}$，并证明引理 4.1。\\n2. 写出可接受条件并解释其几何意义（为什么「离原点远、格子小」）。\\n3. 定义极大可接受立方体与系统 $D_{V,(i)}$，说明「第 $k$ 代后代」。\\n4. 完整证明剖分性质（$x$ 含于极大可接受根、根两两不交）。\\n5. 完整证明边长夹逼 $R/18\u003cs\\\\le R/8$，并指出「可接受」与「极大」各给哪个方向。\\n6. 说明系统 0 的层分解构造，并列出系统 0 与系统 $i\\\\ge1$ 的三点差别。\\n7. 用一句话概括「骨架 + 裁剪」的构造哲学。\\n8. 说明「可接受裁剪」如何实现「边长 $\\\\sim|x|$ 的自适应」，与反平方势的奇异性如何对应。\\n\\n若以上 8 条都能独立回答，即可进入第 5 章。\\n\\n## 4.27 一个完整的三维算例：从相位到系统的端到端\\n\\n以 $n=3$、$M=5$ 为例，把第 3 章到本章的构造「端到端」走一遍。\\n\\n**相位（第 3 章）。** $r_0=1,r_1=3,r_2=4,r_3=2,r_4=1$（周期 $4$）。$j=0$ 时 $\\\\theta_i(0)=i/5$（$i=0,1,2,3$），$d^*=1/5$。\\n\\n**背景网格（§4.2）。** $G_0^{(i)}=\\\\{m+(i/5,i/5,i/5)+[0,1)^3:m\\\\in\\\\mathbb Z^3\\\\}$。$G^{(i)}$ 是二进网格（引理 4.1）。\\n\\n**可接受裁剪（§4.4）。** 对 $i=1$，取 $x=(4,0,0)$（$R=4$）。含 $x$ 的极大可接受根边长 $s\\\\in(R/18,R/8]=(2/9,1/2]$。背景网格边长 $2^j$，取 $j=-2$（$s=1/4$）满足 $2/9\u003c1/4\\\\le1/2$。故含 $x$ 的根边长 $1/4$（若可接受且父格 $1/2$ 不可接受）。\\n\\n**系统 $D_{V,(1)}$（§4.4.2）。** 该根的第 $k$ 代后代边长 $2^{-k}\\\\cdot(1/4)$。$k=0$ 时 $\\\\ell=1/4$，$k=1$ 时 $\\\\ell=1/8$，等等。边长 $\\\\ell(Q)\\\\sim2^{-k}|x|$（$|x|=4$）。\\n\\n**三性质核对。** 剖分（每 $x\\\\neq0$ 恰属一个根域，根两两不交）；嵌套（同根后代嵌套、不同根不交）；边长（$2^{-k}\\\\cdot2/9\u003c\\\\ell\\\\le2^{-k}/2$，即 $2^{-k}\\\\cdot4/(18\\\\sqrt3)\u003c\\\\ell\\\\le2^{-k}\\\\cdot4/8$）。$\\\\checkmark$\\n\\n**端到端总结。** 相位（$d^*=1/5$）→ 背景网格 → 可接受裁剪（$s\\\\sim R$）→ 系统（$\\\\ell\\\\sim2^{-k}|x|$）。三个量 $d^*$、$s\\\\sim R$、$\\\\ell\\\\sim2^{-k}|x|$ 分别对应第 3 章的分离、本章的根边长、系统的代际边长。\\n\\n## 4.28 本章的数值核对表\\n\\n把本章各常数汇总成表，供快速核对（列表形式）。\\n\\n- 可接受系数：$1/8$（可接受条件 $\\\\ell(W)\\\\le\\\\operatorname{dist}_\\\\infty(W,0)/8$）；\\n- 根边长夹逼：$R/18\u003cs\\\\le R/8$（$R=|x|_\\\\infty$）；\\n- 边长换算：$|x|_\\\\infty\\\\le|x|\\\\le\\\\sqrt n|x|_\\\\infty$；\\n- 系统 0 层尺度：$b_l=2^{l-2}$；\\n- 系统 $i\\\\ge1$ 代际：$\\\\ell(Q)=2^{-k}\\\\ell(W)$；\\n- 覆盖常数（第 5 章预览）：$\\\\frac4{d^*}=4M$；\\n- 适用范围（第 5 章预览）：$\\\\frac{d^*}{36}|x|_\\\\infty=\\\\frac{|x|_\\\\infty}{36M}$。\\n\\n## 4.29 常见疑问解答（FAQ 续二）\\n\\n**问 11：可接受系数的 $1/8$ 与边长夹逼的 $18$ 是什么关系？** 答：$18=16+2$，其中 $16$ 来自「父格不可接受」的 $2s\u003e\\\\operatorname{dist}/8\\\\Rightarrow\\\\operatorname{dist}\u003c16s$，$2$ 来自父格的 $\\\\ell^\\\\infty$ 直径 $2s$。故 $18$ 由 $1/8$ 与 $2$ 共同决定。\\n\\n**问 12：系统 $i$ 的根是否一定不含原点？** 答：是。可接受条件要求 $\\\\operatorname{dist}_\\\\infty(W,0)\u003e0$（否则 $\\\\ell(W)\\\\le0$ 不可能），故根 $W$ 不含原点。这符合 $X=\\\\mathbb R^n\\\\setminus\\\\{0\\\\}$ 的设定。\\n\\n**问 13：$k$ 的范围是 $k\\\\ge0$，那 $2^{-k}$ 中 $k\\\\to\\\\infty$ 时格子无限细，是否覆盖原点邻域的每个点？** 答：是。每个 $x\\\\neq0$ 落在某个根内，根内逐代细分到任意细，故每个 $x\\\\neq0$ 被某个 $k$ 代格子覆盖（$k$ 足够大时 $\\\\ell(Q)\\\\ll|x|$）。原点本身不在 $X$ 内，无需覆盖。\\n\\n**问 14：本章与第 5 章定理 1.2 的「$J\\\\subseteq Q$」中 $Q$ 是哪一代？** 答：第 5 章会选「尺度 $s=2^j$ 使 $2Mr\u003cs\\\\le4Mr$」，$Q$ 是该尺度的格子（$k$ 代或 $0$ 代视具体情况），详见第 5 章。\\n\\n## 4.9 本章小结\\n\\n**小结。** 本章完成了定理 1.1 的证明：由第 3 章相位序列装配背景网格 $G^{(i)}$（引理 4.1），系统 0 沿用 [3]，系统 $1,\\\\dots,n$ 用「极大可接受立方体 + 逐代细分」构造，并验证剖分（命题 4.2）、嵌套（命题 4.3）、边长（命题 4.4）三性质。\\n\\n**关键记号速查。** $G_j^{(i)}$（背景立方体族）；$\\\\operatorname{dist}_\\\\infty(W,0)$（到原点的 $\\\\ell^\\\\infty$ 距离）；$W^{(i)}$（极大可接受立方体）；$D_{V,(i)}^k$（第 $k$ 代）；$b_l=2^{l-2}$（层尺度）。\\n\\n**与下一章的接口。** 第 5 章将用本章的 $n+1$ 个系统与第 3 章的 $d^*\u003e0$，证明定理 1.2（局部相邻覆盖）。本章的三性质（尤其边长 $\\\\ell(Q)\\\\sim2^{-k}|x|$）是第 5 章「尺度选择 $2M r\u003cs\\\\le4M r$」与「可接受性验证」的前提。\\n\",\n  \"claims\": [\n    {\n      \"id\": \"ch4-claim-partition\",\n      \"fact_id\": \"fact-thm11-partition\",\n      \"statement\": \"每个 D_V,(i)^k 剖分 X。\",\n      \"source_type\": \"literature\",\n      \"nature\": \"theorem\",\n      \"assumptions\": [\n        \"n≥3\",\n        \"i≥1\"\n      ]\n    },\n    {\n      \"id\": \"ch4-claim-nesting\",\n      \"fact_id\": \"fact-thm11-nesting\",\n      \"statement\": \"跨尺度嵌套 Q∩P∈{∅,P}。\",\n      \"source_type\": \"literature\",\n      \"nature\": \"theorem\",\n      \"assumptions\": [\n        \"n≥3\",\n        \"i≥1\"\n      ]\n    },\n    {\n      \"id\": \"ch4-claim-sidelength\",\n      \"fact_id\": \"fact-thm11-sidelength\",\n      \"statement\": \"边长 ℓ(Q)∼2^{-k}|x|。\",\n      \"source_type\": \"literature\",\n      \"nature\": \"theorem\",\n      \"assumptions\": [\n        \"n≥3\",\n        \"i≥1\"\n      ]\n    }\n  ],\n  \"sources\": [\n    {\n      \"id\": \"source-paper\",\n      \"title\": \"Adjacent Dyadic Systems and Piecewise Kernel Scales for Schrödinger Operators with Inverse-Square Potentials\",\n      \"version\": \"本地 PDF（需精读论文.pdf）\",\n      \"locator\": \"§3\",\n      \"checked_scope\": \"§3 全文\",\n      \"url\": \"\"\n    },\n    {\n      \"id\": \"source-cao-invsq\",\n      \"title\": \"Cao–Chen–Deng [3], Perturbed dyadic cubes ... inverse-square potentials\",\n      \"version\": \"arXiv:2609.04127, 2026\",\n      \"locator\": \"系统 D_V\",\n      \"checked_scope\": \"仅按论文 §3 转述\",\n      \"url\": \"\"\n    }\n  ],\n  \"graph\": {\n    \"nodes\": [],\n    \"edges\": []\n  },\n  \"review\": {\n    \"task_id\": 182,\n    \"token\": \"WduHVxKv9-4LdQsw5VZJkaOT2YPvsDW_\",\n    \"provenance\": {\n      \"actor\": \"deepseek-v4-pro (host       "content": "{\n  \"content_md\": \"## 5.1 阅读主线与本章目标\\n\\n本章证明定理 1.2：$n+1$ 个系统提供**局部相邻覆盖**。这是第 4 章构造的 $n+1$ 系统「投入使用」的时刻，也是第 6 章核尺度构造的直接前提。\\n\\n读完本章，你应能：(1) 复述定理 1.2 的精确假设与结论；(2) 解释尺度选择 $2Mr\u003cs\\\\le4Mr$ 的动机；(3) 证明端点分离 $d^*\\\\cdot s\u003e2r$ 与鸽笼论证（$n+1$ 中至少一个干净）；(4) 完整验证两个 case（$i\\\\ge1$ 的可接受性、$i=0$ 的层尺度）；(5) 说明 $d^*$ 如何控制覆盖常数 $\\\\frac4{d^*}$ 与适用范围 $\\\\frac{d^*}{36}|x|_\\\\infty$。\\n\\n## 5.2 定理 1.2 的陈述\\n\\n**定理 1.2（局部相邻覆盖）。** 设 $d^*\u003e0$ 是第 3 章定理 1.1 中 $n+1$ 个系统对应的相对距离。设 $J$ 是以 $x\\\\neq0$ 为中心、边长 $r$ 的轴平行半开立方体。若\\n\\n$$r\\\\le\\\\frac{d^*}{36}|x|_\\\\infty,$$\\n\\n则存在 $i\\\\in\\\\{0,\\\\dots,n\\\\}$ 与 $Q\\\\in D_{V,(i)}$，使得\\n\\n$$J\\\\subseteq Q,\\\\qquad \\\\ell(Q)\\\\le\\\\frac4{d^*}\\\\,r.$$\\n\\n特别地，$|Q|\\\\le(4/d^*)^n|J|$。\\n\\n**直观解释。** 定理说：只要 $J$ 足够「局部」（边长不超过 $|x|_\\\\infty$ 的 $d^*/36$ 倍），就存在某个系统的一个格子 $Q$ 把 $J$ 整个盖住，且 $Q$ 的边长不超过 $J$ 边长的 $4/d^*$ 倍。这就是「相邻覆盖」的精确形式——$4/d^*$ 是覆盖的「放大代价」，$d^*/36$ 是「局部范围」。\\n\\n## 5.3 尺度选择\\n\\n由引理 2.1，可取 $d^*=1/M$，其中 $M$ 是奇数且 $M\u003en$。条件 $r\\\\le\\\\frac{d^*}{36}|x|_\\\\infty$ 即\\n\\n$$r\\\\le\\\\frac{|x|_\\\\infty}{36M}.$$\\n\\n选择二进尺度 $s=2^j$，使得\\n\\n$$2Mr\u003cs\\\\le4Mr.$$\\n\\n**为什么这样的 $s$ 存在。** 取「严格大于 $2Mr$ 的最小 $2$ 的幂」：即 $s=2^{\\\\lfloor\\\\log_2(2Mr)\\\\rfloor+1}$。则 $s\u003e2Mr$，且 $s\\\\le2\\\\cdot(2Mr)=4Mr$（因为前一个 $2$ 的幂 $\\\\le2Mr$）。这样的 $s$ 总是存在。\\n\\n**直观解释。** $s$ 是「与 $r$ 同阶」的二进尺度（$2Mr\u003cs\\\\le4Mr$，即 $s\\\\sim r$，常数 $2M$ 与 $4M$）。把 $r$ 提升到二进尺度 $s$，是为了在背景网格 $G^{(i)}$ 里找到边长为 $s$ 的格子（背景网格边长是 $2^j$）。\\n\\n## 5.4 端点分离\\n\\n在尺度 $s$ 上，两个关键分离性质成立。\\n\\n**性质 1（不同网格）。** 任意两个不同背景网格 $G^{(i)}$、$G^{(h)}$ 的端点集相距至少\\n\\n$$d^*\\\\cdot s=\\\\frac{s}{M}\u003e2r.$$\\n\\n（因第 3 章 $d^*$ 的定义：$\\\\operatorname{dist}(A_j^{(i)},A_j^{(h)})\\\\ge d^*\\\\cdot2^j$，而 $s=2^j$，故 $\\\\ge d^*\\\\cdot s$；又 $s\u003e2Mr$，故 $d^*\\\\cdot s=s/M\u003e2r$。）\\n\\n**性质 2（同一网格）。** 单个网格 $G^{(i)}$ 内，相邻端点相距 $s$（因 $A_j^{(i)}=2^j\\\\mathbb Z+\\\\theta_i(j)$，相邻端点间隔 $2^j=s$）。故 $s\u003er$（因 $s\u003e2Mr\\\\ge2r\u003er$）。\\n\\n**直观解释。** 性质 1 说「不同网格的端点彼此离得远」（$\u003e2r$）；性质 2 说「同一网格的端点间隔 $s\u003er$」。这两条是鸽笼论证的全部输入：端点「要么在不同网格（远），要么在同一网格（隔开 $s\u003er$）」。\\n\\n## 5.5 鸽笼论证\\n\\n**关键断言。** 对 $J$ 的任意一个坐标方向，至多一个网格 $G^{(i)}$ 的端点落在 $J$ 在该方向的投影区间的**内部**。\\n\\n**证明。** 反设两个不同网格 $G^{(i)}$、$G^{(h)}$ 在该方向都有端点落在 $J$ 的投影区间内部。设这两个端点分别为 $a$（属 $G^{(i)}$）、$b$（属 $G^{(h)}$）。因 $a,b$ 都在 $J$ 的投影区间内部（该区间长度 $r$），故 $|a-b|\\\\le r$。但性质 1 给出 $\\\\operatorname{dist}(A_j^{(i)},A_j^{(h)})\\\\ge d^*\\\\cdot s\u003e2r$，即 $|a-b|\\\\ge2r$（模 $s$ 意义下，但端点都在同尺度 $s$ 上，故 $|a-b|\\\\ge d^*\\\\cdot s\u003e2r$），矛盾于 $|a-b|\\\\le r\u003c2r$。$\\\\Box$\\n\\n**干净网格的存在。** $J$ 有 $n$ 个坐标方向，每个方向至多排除一个网格。故至多 $n$ 个网格被排除。我们有 $n+1$ 个网格，故至少一个网格 $G^{(i)}$ 在**所有** $n$ 个方向都「不跨端点」——即 $J$ 在每个方向的投影都不含 $G^{(i)}$ 的内部端点。\\n\\n于是 $J$ 完全落在 $G^{(i)}$ 的一个边长为 $s$ 的立方体 $Q$ 内（因为 $J$ 不跨任何 $G^{(i)}$ 的端点，且 $J$ 的边长 $r\u003cs$，故 $J$ 被某个 $G_j^{(i)}$ 的格子完整包含）：\\n\\n$$J\\\\subseteq Q,\\\\qquad \\\\ell(Q)=s.$$\\n\\n**直观解释。** 鸽笼论证的实质是「$n$ 个方向各至多排除 $1$ 个，$n+1$ 个中必有幸存者」。这个论证与经典 $3^n$ 完全同构（第 2 章 §2.6），差别只在「系统数量从 $3^n$ 降到 $n+1$」，而这正是第 3 章「相位序列 + $d^*\u003e0$」的功劳。\\n\\n## 5.6 覆盖常数：$\\\\ell(Q)\\\\le\\\\frac4{d^*}r$\\n\\n由 §5.3 的尺度选择 $s\\\\le4Mr$ 与 $M=1/d^*$，\\n\\n$$\\\\ell(Q)=s\\\\le4Mr=\\\\frac4{d^*}\\\\,r.$$\\n\\n这给出了定理 1.2 的边长上界。进而体积：\\n\\n$$|Q|=\\\\ell(Q)^n\\\\le\\\\Bigl(\\\\frac4{d^*}\\\\Bigr)^n r^n=\\\\Bigl(\\\\frac4{d^*}\\\\Bigr)^n|J|.$$\\n\\n## 5.7 验证 $Q\\\\in D_{V,(i)}$\\n\\n还需验证 §5.5 找到的 $Q\\\\in G_j^{(i)}$ 确实属于扰动系统 $D_{V,(i)}$（而非只是背景网格的格子）。分两个 case。\\n\\n### 5.7.1 Case $i\\\\ge1$\\n\\n由 $x\\\\in J\\\\subseteq Q$，对任意 $y\\\\in Q$，$|y-x|_\\\\infty\\\\le s$（$Q$ 的 $\\\\ell^\\\\infty$ 直径 $s$）。故\\n\\n$$\\\\operatorname{dist}_\\\\infty(Q,0)\\\\ge|x|_\\\\infty-s.$$\\n\\n由 §5.3 的 $s\\\\le4Mr$ 与 §5.2 的 $r\\\\le|x|_\\\\infty/(36M)$：\\n\\n$$s\\\\le4Mr\\\\le4M\\\\cdot\\\\frac{|x|_\\\\infty}{36M}=\\\\frac{|x|_\\\\infty}{9}.$$\\n\\n故\\n\\n$$\\\\operatorname{dist}_\\\\infty(Q,0)\\\\ge|x|_\\\\infty-\\\\frac{|x|_\\\\infty}{9}=\\\\frac{8|x|_\\\\infty}{9}\\\\ge8s.$$\\n\\n（末式因 $s\\\\le|x|_\\\\infty/9$，即 $|x|_\\\\infty\\\\ge9s$，故 $8|x|_\\\\infty/9\\\\ge8s$。）\\n\\n于是 $\\\\ell(Q)=s\\\\le\\\\frac18\\\\operatorname{dist}_\\\\infty(Q,0)$，$Q$ 满足第 4 章的可接受条件。故 $Q$ 含于某个极大可接受根 $W\\\\in W^{(i)}$，且 $Q$ 与 $W$ 属于同一背景网格 $G^{(i)}$，故 $Q$ 是 $W$ 的后代，即 $Q\\\\in D_{V,(i)}$。\\n\\n### 5.7.2 Case $i=0$\\n\\n此时背景网格是标准二进网格。设 $x\\\\in L_l$（第 $l$ 层）。系统 0 的第 0 代立方体 $W\\\\in D_V^0$ 含 $x$，边长 $\\\\ell(W)=2^{l-2}$（层尺度 $b_l$，第 1 章 §1.8bis）。因 $|x|_\\\\infty\u003c2^l$（$x\\\\in L_l$），\\n\\n$$\\\\ell(W)=2^{l-2}\u003e\\\\frac{|x|_\\\\infty}{4}.$$\\n\\n而 §5.3 给出 $\\\\ell(Q)=s\\\\le|x|_\\\\infty/9\u003c|x|_\\\\infty/4\u003c\\\\ell(W)$。$Q$ 与 $W$ 都属于标准二进网格且都含 $x$，故 $Q\\\\subseteq W$（标准网格的嵌套性），$Q$ 是 $W$ 的后代，即 $Q\\\\in D_V=D_{V,(0)}$。\\n\\n**综合。** 两个 case 都得 $Q\\\\in D_{V,(i)}$，结合 §5.5 的 $J\\\\subseteq Q$ 与 §5.6 的 $\\\\ell(Q)\\\\le\\\\frac4{d^*}r$，定理 1.2 得证。$\\\\Box$\\n\\n## 5.8 Remark 4.1：$d^*$ 的作用\\n\\n论文的 Remark 4.1 指出，$d^*$ 直接控制相邻覆盖的两个量：\\n\\n- **覆盖常数** $\\\\frac4{d^*}$：$d^*$ 越大（端点分离越好），覆盖损失越小；\\n- **适用范围** $\\\\frac{d^*}{36}|x|_\\\\infty$：$d^*$ 越大，可直接应用的局部范围越大。\\n\\n因此「更小的 $d^*$」意味着「更弱的端点分离、更大的覆盖损失、更小的直接适用范围」。这是第 3 章「$d^*=1/M$，$M$ 取多大」权衡（§3.8quinquies）在覆盖层面的体现。\\n\\n**直观解释。** $d^*$ 是「系统错开的质量」。$d^*$ 大，系统错得开，覆盖贴（$\\\\frac4{d^*}$ 小）、范围广（$\\\\frac{d^*}{36}$ 大）。$d^*$ 小，系统挤在一起，覆盖松、范围窄。第 3 章取 $M$ 为「大于 $n$ 的最小奇数」，使 $d^*$ 尽量大，从而覆盖常数尽量小。\\n\\n## 5.9 例子与直观解释\\n\\n**例 1（$n=3$、$M=5$ 的覆盖常数）。** $d^*=1/5$，覆盖常数 $\\\\frac4{d^*}=20$，适用范围 $\\\\frac{d^*}{36}|x|_\\\\infty=\\\\frac{|x|_\\\\infty}{180}$。取 $x=(4,0,0)$，则适用范围 $r\\\\le4/180=1/45\\\\approx0.022$。任意边长 $r\\\\le0.022$ 的立方体 $J$ 被某系统格子 $Q$ 覆盖，$\\\\ell(Q)\\\\le20r\\\\le0.44$。\\n\\n**例 2（尺度选择的一维手算）。** $M=5$、$r=1/45$。$2Mr=2\\\\cdot5\\\\cdot(1/45)=10/45=2/9\\\\approx0.222$，$4Mr=4/9\\\\approx0.444$。取 $s=2^{-2}=1/4=0.25$，满足 $0.222\u003c0.25\\\\le0.444$。故尺度 $j=-2$。\\n\\n**例 3（鸽笼的一维直观）。** 一维 $n=1$，$n+1=2$ 个系统。两个网格的端点分离 $d^*\\\\cdot s\u003e2r$。任意长度 $r$ 的区间 $J$，至多一个网格的端点在 $J$ 内部，故两个网格中至少一个「干净」，$J$ 被其格子盖住。这就是「$2$ 个相邻系统」的直观。\\n\\n**例 4（局部性）。** 若 $J$ 边长 $r$ 超过 $d^*|x|_\\\\infty/36$，则 $J$「不局部」——它可能横跨多个网格的端点，鸽笼论证失效。这体现了「局部相邻覆盖」的「局部」二字：覆盖只在「$J$ 足够小（相对 $|x|$）」时成立。\\n\\n## 5.10 理解检查\\n\\n1. 复述定理 1.2 的假设与结论，说明「局部」体现在哪里。\\n2. 证明尺度 $s=2^j$（$2Mr\u003cs\\\\le4Mr$）的存在性。\\n3. 证明端点分离：不同网格 $d^*\\\\cdot s\u003e2r$、同网格 $s\u003er$。\\n4. 完整写出鸽笼论证（每个方向至多排除一个网格、$n+1$ 中至少一个干净）。\\n5. 验证 case $i\\\\ge1$：$\\\\operatorname{dist}_\\\\infty(Q,0)\\\\ge8s$ 从而 $Q$ 可接受。\\n6. 验证 case $i=0$：$\\\\ell(Q)\u003c\\\\ell(W)$ 从而 $Q\\\\subseteq W$。\\n7. 说明 $d^*$ 如何控制覆盖常数与适用范围。\\n\\n## 5.3bis 尺度选择的详细推导\\n\\n尺度选择 $2Mr\u003cs\\\\le4Mr$ 是证明的第一步，这里把「为什么这样选」讲透。\\n\\n**目标。** 要在一个背景网格 $G^{(i)}$ 里找到一个边长 $s$ 的格子 $Q$ 盖住 $J$。背景网格的边长是 $2^j$（$j\\\\in\\\\mathbb Z$），故 $s$ 必须是 $2$ 的幂。同时 $s$ 要与 $r$ 同阶（不能太大，否则覆盖常数差；不能太小，否则装不下 $J$）。\\n\\n**下界 $s\u003e2Mr$。** 这个下界保证「端点分离 $d^*\\\\cdot s=s/M\u003e2r$」（§5.4 性质 1）。若 $s$ 太小，$d^*\\\\cdot s$ 可能不超过 $2r$，端点分离不足，鸽笼论证失效。$s\u003e2Mr$ 即 $d^*\\\\cdot s=s/M\u003e2r$，是「分离 $\\\\ge2r$」的精确保障。\\n\\n**上界 $s\\\\le4Mr$。** 这个上界保证「覆盖常数 $\\\\frac4{d^*}$」：$\\\\ell(Q)=s\\\\le4Mr=\\\\frac4{d^*}r$。若 $s$ 太大，覆盖损失超过 $\\\\frac4{d^*}$。\\n\\n**存在性。** 取 $s=2^{\\\\lfloor\\\\log_2(2Mr)\\\\rfloor+1}$（严格大于 $2Mr$ 的最小 $2$ 的幂）。则 $s\u003e2Mr$ 且 $s\\\\le2\\\\cdot2Mr=4Mr$（前一个 $2$ 的幂 $\\\\le2Mr$）。故这样的 $s$ 存在且唯一。\\n\\n**直观。** 尺度选择是「在 $r$ 附近找一个 $2$ 的幂，既不小于分离所需的 $2Mr$，也不大于覆盖所需的 $4Mr$」。区间 $(2Mr,4Mr]$ 恰好是 $2$ 的幂的「黄金区间」：任何 $r$ 都在某个 $(2Mr,4Mr]$ 里找到 $2$ 的幂 $s$。\\n\\n## 5.4bis 端点分离的模意义\\n\\n端点分离 $d^*\\\\cdot s\u003e2r$ 有清晰的「模」解释，这里补充。\\n\\n**端点集的结构。** $A_j^{(i)}=2^j\\\\mathbb Z+\\\\theta_i(j)$。两个网格 $i,h$ 的端点集之差为\\n\\n$$A_j^{(i)}-A_j^{(h)}=2^j(\\\\mathbb Z+\\\\theta_i(j)-\\\\theta_h(j)).$$\\n\\n其「到 $0$ 的最近距离」（即两集合的最小距离）为\\n\\n$$\\\\operatorname{dist}(A_j^{(i)},A_j^{(h)})=2^j\\\\operatorname{dist}(\\\\theta_i(j)-\\\\theta_h(j),\\\\mathbb Z)\\\\ge2^j\\\\cdot d^*=d^*\\\\cdot s.$$\\n\\n**模意义。** $\\\\operatorname{dist}(\\\\theta_i(j)-\\\\theta_h(j),\\\\mathbb Z)$ 是「相位差模 $1$ 的距离」。$d^*$ 是「相位差模 $1$ 的最小距离」，$d^*\\\\cdot s$ 是「端点差模 $s$ 的最小距离」。因此「端点分离 $\\\\ge d^*\\\\cdot s$」等价于「端点差模 $s$ 不小于 $d^*\\\\cdot s$」，即端点「在模 $s$ 的圈上错开 $d^*$ 份」。\\n\\n**为什么是 $\u003e2r$ 而非 $\\\\ge r$。** 鸽笼论证需要「两个端点若都在 $J$ 内部则相距 $\\\\le r$」，而分离给「相距 $\\\\ge d^*\\\\cdot s$」。要使矛盾成立，需 $d^*\\\\cdot s\u003er$（严格）。取 $d^*\\\\cdot s\u003e2r$（更强）是为了留出余量，使 $J$ 的投影区间「长度 $r$」严格小于「端点最小间距 $d^*\\\\cdot s$」。系数 $2$ 是技术性余量。\\n\\n## 5.5bis 鸽笼的容斥细节\\n\\n鸽笼论证「$n$ 方向至多排除 $n$ 网格」可以更精确地用容斥表述，这里补充。\\n\\n**逐方向排除。** 对每个坐标方向 $r\\\\in\\\\{1,\\\\dots,n\\\\}$，设 $E_r$ 为「在方向 $r$ 上端点落在 $J$ 投影内部」的网格集合。§5.5 断言 $|E_r|\\\\le1$（每个方向至多一个网格脏）。故\\n\\n$$\\\\Bigl|\\\\bigcup_{r=1}^n E_r\\\\Bigr|\\\\le\\\\sum_{r=1}^n|E_r|\\\\le n.$$\\n\\n**幸存网格。** 全部 $n+1$ 个网格中，「不在任何方向脏」的网格数为\\n\\n$$(n+1)-\\\\Bigl|\\\\bigcup_{r=1}^n E_r\\\\Bigr|\\\\ge(n+1)-n=1.$$\\n\\n故至少一个网格「全方向干净」，$J$ 被其格子覆盖。\\n\\n**容斥的精确计数（可选）。** 实际上 $|E_r|\\\\le1$ 且不同方向的「脏网格」可能重合（一个网格可能在多个方向都脏）。容斥给出 $|\\\\bigcup E_r|=\\\\sum|E_r|-\\\\sum|E_r\\\\cap E_s|+\\\\cdots\\\\le\\\\sum|E_r|\\\\le n$。上界 $n$ 已足够。\\n\\n**与经典 $3^n$ 的对照。** 经典 $3^n$ 论证（第 2 章）的「每方向 $3$ 选 $1$」与本章的「每方向至多 $1$ 脏」在容斥层面同构：经典情形每方向 $3$ 相位中至多 $1$ 脏（同一方向的三个平移），本章每方向 $n+1$ 个系统中至多 $1$ 脏。差别在「相位结构」：经典是「每方向独立 $3$ 相位」，本章是「$n+1$ 个相位序列共享分离结构」。\\n\\n## 5.7bis 两个 case 的详细验证（逐字版）\\n\\n§5.7 的两个 case 是「$Q\\\\in G^{(i)}$ 属于系统 $D_{V,(i)}$」的关键，这里逐字重写。\\n\\n**Case $i\\\\ge1$（可接受性），逐字版。** $Q\\\\in G_j^{(i)}$，$\\\\ell(Q)=s$，$x\\\\in J\\\\subseteq Q$。\\n\\n- 对任意 $y\\\\in Q$：$|y-x|_\\\\infty\\\\le s$（$Q$ 是边长 $s$ 的 $\\\\ell^\\\\infty$ 立方体，含 $x$），故 $\\\\operatorname{dist}_\\\\infty(Q,0)=\\\\inf_{y\\\\in Q}|y|_\\\\infty\\\\ge|x|_\\\\infty-s$。\\n- 由 $s\\\\le4Mr$ 与 $r\\\\le|x|_\\\\infty/(36M)$：$s\\\\le4M\\\\cdot|x|_\\\\infty/(36M)=|x|_\\\\infty/9$。\\n- 故 $\\\\operatorname{dist}_\\\\infty(Q,0)\\\\ge|x|_\\\\infty-|x|_\\\\infty/9=8|x|_\\\\infty/9$。\\n- 又 $|x|_\\\\infty\\\\ge9s$（由 $s\\\\le|x|_\\\\infty/9$），故 $8|x|_\\\\infty/9\\\\ge8s$。\\n- 合得 $\\\\operatorname{dist}_\\\\infty(Q,0)\\\\ge8s$，即 $s\\\\le\\\\operatorname{dist}_\\\\infty(Q,0)/8$，$Q$ 可接受。\\n- 由第 4 章，可接受的 $Q$ 含于某极大可接受根 $W\\\\in W^{(i)}$（$Q\\\\subseteq W$），且 $Q,W$ 同属 $G^{(i)}$，故 $Q$ 是 $W$ 的后代，$Q\\\\in D_{V,(i)}$。\\n\\n**Case $i=0$（层尺度），逐字版。** $Q$ 属标准网格，$\\\\ell(Q)=s$，$x\\\\in L_l$。\\n\\n- 系统 0 的第 0 代 $W\\\\in D_V^0$ 含 $x$，$\\\\ell(W)=2^{l-2}=b_l$（层尺度）。\\n- 因 $x\\\\in L_l$，$|x|_\\\\infty\u003c2^l$，故 $\\\\ell(W)=2^{l-2}=2^l/4\u003e|x|_\\\\infty/4$。\\n- 由 $s\\\\le|x|_\\\\infty/9$：$\\\\ell(Q)=s\\\\le|x|_\\\\infty/9\u003c|x|_\\\\infty/4\u003c\\\\ell(W)$。\\n- $Q,W$ 同属标准网格且都含 $x$，由嵌套性 $Q\\\\subsetneq W$（$\\\\ell(Q)\u003c\\\\ell(W)$ 排除 $Q=W$）。\\n- 故 $Q$ 是 $W$ 的后代，$Q\\\\in D_V=D_{V,(0)}$。\\n\\n## 5.9bis 更多例子与反例\\n\\n**例 5（尺度选择的周期）。** $M=5$，$r$ 取不同值，尺度 $s$ 落在 $(10r,20r]$ 里。$r=1$：$s\\\\in(10,20]$，取 $s=16$（$j=4$）。$r=0.1$：$s\\\\in(1,2]$，取 $s=2$（$j=1$）。$r=0.01$：$s\\\\in(0.1,0.2]$，取 $s=1/8=0.125$（$j=-3$）。可见 $s\\\\sim r$ 且 $s$ 是 $2$ 的幂。\\n\\n**例 6（端点分离的数值）。** $M=5$、$s=16$，$d^*=1/5$，$d^*\\\\cdot s=16/5=3.2$。若 $r=1$，$2r=2\u003c3.2$，端点分离成立。两个网格的端点（模 $16$）相距 $\\\\ge3.2$，一个长度 $r=1$ 的区间 $J$ 不可能同时含两个网格的内部端点（否则 $J$ 内两端点相距 $\\\\le1\u003c3.2$）。\\n\\n**例 7（局部性失效）。** $n=3$、$M=5$、$x=(4,0,0)$（$|x|_\\\\infty=4$）。适用范围 $r\\\\le4/180=0.022$。若取 $r=1$（边长 $1$ 的立方体 $J$ 含 $x$），则 $r=1\u003e0.022$，定理 1.2 不适用。实际上，边长 $1$ 的 $J$ 可能横跨多个系统端点，鸽笼失效。这展示了「局部」的必要性。\\n\\n**例 8（覆盖常数的体积放大）。** $n=3$、$d^*=1/5$，覆盖常数 $4/d^*=20$，体积放大 $20^3=8000$ 倍。这是「相邻覆盖」的代价：$Q$ 的体积最多是 $J$ 的 $8000$ 倍。在稀疏支配中，这个体积放大会被后续的稀疏抽取「吸收」（稀疏族的 $E_Q$ 占比 $c$ 补偿）。\\n\\n## 5.10bis 习题与思考题\\n\\n**习题 1（尺度选择）。** 对 $M=7$、$r=1$，求尺度 $s$（$2Mr\u003cs\\\\le4Mr$ 的 $2$ 的幂）。提示：$2Mr=14$，$4Mr=28$，$s=16$。\\n\\n**习题 2（端点分离）。** 对 $d^*=1/7$、$s=16$，计算 $d^*\\\\cdot s$ 并验证 $\u003e2r$（$r=1$）。答案：$16/7\\\\approx2.29\u003e2$。\\n\\n**习题 3（鸽笼）。** 一维 $n=1$、$2$ 个系统，证明任意长度 $r\\\\le d^*|x|_\\\\infty/36$ 的区间 $J$ 被其中一个系统的格子覆盖。提示：一维只有 $1$ 个方向，至多排除 $1$ 个网格，$2$ 个中至少 $1$ 个干净。\\n\\n**习题 4（可接受验证）。** 独立推导 $\\\\operatorname{dist}_\\\\infty(Q,0)\\\\ge8s$（case $i\\\\ge1$）。\\n\\n**习题 5（层尺度验证）。** 独立验证 $\\\\ell(Q)\u003c\\\\ell(W)$（case $i=0$）。\\n\\n**思考题 1。** 定理 1.2 的「局部」范围 $\\\\frac{d^*}{36}|x|_\\\\infty$ 中的系数 $36$ 从何而来？提示：来自 $s\\\\le4Mr$ 与 $r\\\\le|x|_\\\\infty/(36M)$ 的组合，$36=9\\\\cdot4$。\\n\\n**思考题 2。** 若把覆盖常数从 $\\\\frac4{d^*}$ 改进到 $\\\\frac2{d^*}$，需要如何调整尺度选择与端点分离？（提示：这是开放方向，本文未讨论。）\\n\\n## 5.11bis 文献注记与 FAQ\\n\\n**文献注记。** 相邻覆盖性质的经典形式（$3^n$ 平移）见第 2 章文献注记；本章的「局部」版本（$d^*/36$ 范围）是反平方势自适应边长下的新形式，源自论文 §4。鸽笼论证「$n$ 方向至多排除 $n$ 系统」是组合数学的标准手法。\\n\\n**FAQ。**\\n\\n- **问 1：为什么是「局部」相邻覆盖，而非全局？** 答：反平方势的边长 $\\\\ell(Q)\\\\sim|x|$ 随位置缩放，远离原点处格子大、靠近原点处格子小。全局的「任意 $J$ 被同阶 $Q$ 覆盖」在自适应边长下不可能成立（$|x|$ 变化时边长也变）。只能保证「$J$ 足够小（相对 $|x|$）」时的局部覆盖。\\n\\n- **问 2：$\\\\frac4{d^*}$ 是最优吗？** 答：本文不讨论最优性。$\\\\frac4{d^*}$ 由尺度选择 $s\\\\le4Mr$ 直接给出，是构造的自然常数。\\n\\n- **问 3：覆盖常数 $4/d^*$ 与体积放大 $(4/d^*)^n$ 会进入第 6 章吗？** 答：会。第 6 章引理 5.2 用 $\\\\ell(Q)\\\\le\\\\frac8{d^*}|x-y|_\\\\infty$（由 $\\\\ell(Q)\\\\le\\\\frac4{d^*}r$ 与 $r=|x-y|_\\\\infty$ 组合），进而 $\\\\delta_{\\\\rm dy}(x,y)\\\\le\\\\frac8{d^*}|x-y|_\\\\infty$。\\n\\n## 5.12 本章技术总结与全文定位\\n\\n**技术总结。** 本章证明定理 1.2（局部相邻覆盖），五步：尺度选择（$2Mr\u003cs\\\\le4Mr$）、端点分离（$d^*\\\\cdot s\u003e2r$）、鸽笼（$n+1$ 中至少一个干净）、覆盖常数（$\\\\ell(Q)\\\\le\\\\frac4{d^*}r$）、$Q\\\\in D_{V,(i)}$ 验证（两个 case）。核心是「$d^*\u003e0$」与「$n+1$ 个系统」的配合：$d^*$ 保证分离，$n+1$ 保证鸽笼幸存。\\n\\n**全文定位。** 本章是「几何构造（第 3、4 章）」到「核估计（第 6 章）」的桥梁：相邻覆盖性质是第 6 章「局部二进尺度 $\\\\delta_{\\\\rm dy}$ 与欧氏距离等价」的直接输入。没有本章的相邻覆盖，第 6 章的分段核尺度就无法定义。\\n\\n**与后续章节的依赖链。** 本章 → 第 6 章（用相邻覆盖证 $\\\\delta_{\\\\rm dy}\\\\sim|x-y|$，定义核尺度 $\\\\widetilde d_\\\\alpha$，证定理 1.3）→ 第 7 章（核尺度非拟度量）。本章的 $\\\\frac4{d^*}$ 与 $\\\\frac{d^*}{36}$ 是第 6 章引理 5.2 的常数来源。\\n\\n## 5.13 一维原型完整手算\\n\\n把定理 1.2 的证明在一维（$n=1$，示意）完整手算一遍，展示每一步的具体数值。虽然本文 $n\\\\ge3$，一维能最清楚地展示鸽笼论证。\\n\\n**设定（一维示意）。** $n=1$，$n+1=2$ 个系统。取 $M=3$（大于 $1$ 的奇数），$d^*=1/3$。相位 $\\\\theta_0(0)=0$、$\\\\theta_1(0)=1/3$。两个网格端点集 $A_0=\\\\mathbb Z$、$A_1=\\\\mathbb Z+1/3$。\\n\\n**手算：$x=10$，$r=1$。** $|x|=10$。适用范围 $r\\\\le d^*|x|/36=10/(36\\\\cdot3)=10/108\\\\approx0.093$。$r=1\u003e0.093$，定理不适用（$J$ 太大，不局部）。若取 $r=0.05$（$\u003c0.093$），则适用。\\n\\n**尺度选择。** $2Mr=2\\\\cdot3\\\\cdot0.05=0.3$，$4Mr=0.6$。取 $s=2^{-1}=0.5$，满足 $0.3\u003c0.5\\\\le0.6$。\\n\\n**端点分离。** $d^*\\\\cdot s=0.5/3\\\\approx0.167\u003e2r=0.1$。两个网格端点最小距离 $\\\\operatorname{dist}(\\\\mathbb Z,\\\\mathbb Z+1/3)=1/3$（取模 $0.5$ 后仍 $\\\\ge1/6\\\\approx0.167$）。\\n\\n**鸽笼。** 一维只有 $1$ 个方向。长度 $r=0.05$ 的区间 $J$ 内部至多一个网格的端点（若两个都有，则相距 $\\\\le0.05\u003c0.167$，矛盾）。$2$ 个网格中至少 $1$ 个干净，$J$ 被其边长 $0.5$ 的格子盖住。\\n\\n**覆盖常数。** $\\\\ell(Q)=s=0.5\\\\le4Mr=0.6=(4/d^*)r=12\\\\cdot0.05=0.6$。$\\\\checkmark$\\n\\n**手算启示。** 一维手算展示了「$d^*$ 越大、适用范围越大、覆盖常数越小」的完整逻辑：$d^*=1/3$（三相位均匀分布）给出覆盖常数 $12$、适用范围 $|x|/108$。\\n\\n## 5.14 二维覆盖实例\\n\\n在 $n=2$（$X=\\\\mathbb R^2\\\\setminus\\\\{0\\\\}$）做一个覆盖实例，展示「$n$ 个方向各至多排除一个」在二维的具体表现。\\n\\n**设定（二维示意）。** $n=2$，$n+1=3$ 个系统。$M=3$，$d^*=1/3$，相位 $\\\\theta_0=0,\\\\theta_1=1/3,\\\\theta_2=2/3$。\\n\\n**覆盖实例。** 取 $x=(10,0)$，$|x|_\\\\infty=10$，$r=0.05$。适用范围 $r\\\\le d^*|x|_\\\\infty/36=10/108\\\\approx0.093$，$0.05\u003c0.093$，适用。\\n\\n**尺度。** $s=0.5$（同 §5.13）。\\n\\n**鸽笼（二维）。** $J$ 是边长 $0.05$ 的方形。第一方向（横）：$3$ 个网格中至多 $1$ 个在横方向有内部端点；第二方向（纵）：同理至多 $1$ 个。两个方向至多排除 $2$ 个网格，$3$ 个网格中至少 $1$ 个「横纵都干净」，$J$ 被其边长 $0.5$ 的方形盖住。\\n\\n**几何图像。** 三个网格 $G^{(0)},G^{(1)},G^{(2)}$ 在二维「三重错开」：任意小方形 $J$ 都「躲不开」至少两个网格的干净覆盖，故被其中一个完整盖住。这正是「$3$ 个相邻系统」在二维的图像。\\n\\n**与一维的对比。** 一维 $2$ 个系统、二维 $3$ 个系统，系统数量 $n+1$。每个方向「至多排除一个」是线性的，组合后仍是 $n+1$（而非 $3^n$），因为三个网格「共享」相位分离结构（第 3 章），而非每方向独立 $3$ 相位。\\n\\n## 5.15 与稀疏支配的连接（详细）\\n\\n第 2 章 §2.7 概述了稀疏支配，这里把本章的相邻覆盖「接」到稀疏支配上，说明它为何重要。\\n\\n**稀疏支配的模板。** 对算子 $T$，目标是\\n\\n$$|Tf(x)|\\\\lesssim\\\\sum_{Q\\\\in\\\\mathcal S}\\\\langle|f|\\\\rangle_Q\\\\chi_Q(x),$$\\n\\n$\\\\mathcal S$ 稀疏。构造 $\\\\mathcal S$ 时，需要「覆盖引理」：把候选立方体族整成不相交的极大子族。\\n\\n**相邻覆盖的角色。** 覆盖引理要求「每个候选立方体 $J$ 被一个系统立方体 $Q$（$J\\\\subseteq Q$，$|Q|\\\\lesssim|J|$）标准化」。这正是本章定理 1.2 提供的：在局部范围 $r\\\\le d^*|x|_\\\\infty/36$ 内，每个 $J$ 被某个 $Q\\\\in D_{V,(i)}$ 覆盖，$|Q|\\\\le(4/d^*)^n|J|$。于是稀疏族可以从 $n+1$ 个系统的并 $D_{\\\\rm adj}=\\\\bigcup_iD_{V,(i)}$ 中抽取。\\n\\n**第 6 章的兑现。** 第 6 章定义「局部二进尺度」$\\\\delta_{\\\\rm dy}(x,y)$（$D_{\\\\rm adj}$ 中含 $x,y$ 的最小格边长），并用本章的相邻覆盖证明 $\\\\delta_{\\\\rm dy}(x,y)\\\\sim|x-y|$（引理 5.2）。这个等价是核尺度 $\\\\widetilde d_\\\\alpha$ 在「局部区域」的定义基础。因此本章是「稀疏支配所需几何」与「核尺度构造」之间的桥梁。\\n\\n## 5.16 覆盖引理的更多讨论\\n\\n本章的定理 1.2 本质上是一个「局部覆盖引理」，这里讨论它与经典覆盖引理的关系。\\n\\n**经典二进覆盖引理（第 2 章 §2.10.3）。** 任意一族二进立方体可被两两不交的极大代表覆盖，体积不膨胀。\\n\\n**本章的局部覆盖。** 本章不是「给一族立方体找不相交覆盖」，而是「给任意单个立方体 $J$ 找系统格子 $Q$ 覆盖」。它是「单点版本」的覆盖引理，用于「标准化」单个候选立方体。\\n\\n**两者的配合。** 稀疏支配中，先用本章定理 1.2 把每个候选立方体 $J$「标准化」到 $D_{\\\\rm adj}$ 的格子 $Q$，再用经典覆盖引理从这些 $Q$ 中抽不相交极大子族。两步合起来，得到稀疏族 $\\\\mathcal S$。\\n\\n**「局部」的必要性。** 本章的覆盖是「局部」的（$J$ 需满足 $r\\\\le d^*|x|_\\\\infty/36$），因为自适应边长 $\\\\ell(Q)\\\\sim|x|$ 使「全局均匀覆盖」不可能。稀疏支配中，候选立方体 $J$ 通常来自「算子 $Tf$ 的局部振荡」，它们满足适当的局部条件，故「局部覆盖」已足够。\\n\\n## 5.17 补充习题与详细解答\\n\\n**习题 6（一维手算）。** 在 §5.13 的一维手算中，验证 $x=10$、$r=0.05$ 时尺度 $s=0.5$ 满足 $2Mr\u003cs\\\\le4Mr$。答案：$2Mr=0.3$、$4Mr=0.6$，$0.3\u003c0.5\\\\le0.6$。\\n\\n**习题 7（二维鸽笼）。** 在 §5.14 的二维实例中，验证「两个方向至多排除 $2$ 个网格、$3$ 个中至少 $1$ 个干净」。\\n\\n**习题 8（覆盖常数）。** 对 $d^*=1/5$、$r=1$，计算覆盖常数 $\\\\frac4{d^*}$ 与体积放大 $(\\\\frac4{d^*})^3$（$n=3$）。答案：$20$、$8000$。\\n\\n**习题 9（局部范围）。** 对 $n=3$、$d^*=1/5$、$x=(3,3,3)$（$|x|_\\\\infty=3$），计算适用范围 $r\\\\le d^*|x|_\\\\infty/36$。答案：$3/(5\\\\cdot36)=1/60\\\\approx0.0167$。\\n\\n**思考题 3。** 定理 1.2 的「$Q$ 属于 $D_{V,(i)}$」验证中，为什么 $i\\\\ge1$ 用「可接受性」而 $i=0$ 用「层尺度」？两者能否统一？（提示：$i=0$ 的系统 $D_{V,(0)}$ 不是用「可接受立方体」构造的，故需单独验证。）\\n\\n**思考题 4。** 若把端点分离从 $d^*\\\\cdot s\u003e2r$ 放松到 $d^*\\\\cdot s\u003er$，鸽笼论证是否仍成立？覆盖常数会如何变化？\\n\\n## 5.18 历史注记与命名\\n\\n**「相邻」（adjacent）的由来。** 「相邻二进系统」指「彼此错开的二进系统」。经典 $3^n$ 平移系统是「相邻」的最早例子（三个平移网格彼此错开 $1/3$）。本文把「相邻」推广到「相位序列错开 $d^*$」，系统数量降到 $n+1$。\\n\\n**「局部」（local）的由来。** 反平方势的自适应边长使覆盖只能「局部」成立（$J$ 足够小）。「局部相邻覆盖」的「局部」强调适用范围 $r\\\\le d^*|x|_\\\\infty/36$ 依赖于 $|x|$。\\n\\n**与「覆盖引理」的关系。** 本章定理 1.2 是「单点覆盖引理」，经典覆盖引理是「族覆盖引理」。两者在稀疏支配中配合使用（§5.16）。\\n\\n**文献。** 相邻覆盖的经典形式见调和分析标准教材；本章的局部版本源自论文 §4；稀疏支配见文献 [5,6]。这些为背景材料，精确书目以正式出版的参考文献表为准。\\n\\n## 5.19 本章综合回顾与自测清单\\n\\n进入第 6 章前，请确认能回答以下问题：\\n\\n1. 复述定理 1.2 的假设与结论。\\n2. 证明尺度 $s=2^j$（$2Mr\u003cs\\\\le4Mr$）的存在性，并说明 $2Mr$、$4Mr$ 各起什么作用。\\n3. 证明端点分离（不同网格 $d^*\\\\cdot s\u003e2r$、同网格 $s\u003er$）。\\n4. 完整写出鸽笼论证（$n$ 方向至多排除 $n$，$n+1$ 中至少一个干净）。\\n5. 验证 case $i\\\\ge1$（$Q$ 可接受）与 case $i=0$（$Q\\\\subseteq W$）。\\n6. 说明 $d^*$ 如何控制覆盖常数 $\\\\frac4{d^*}$ 与适用范围 $\\\\frac{d^*}{36}|x|_\\\\infty$。\\n7. 用一句话说明本章的相邻覆盖在第 6 章核尺度构造中的作用。\\n\\n若以上 7 条都能独立回答，即可进入第 6 章。\\n\\n## 5.20 覆盖引理的严格陈述\\n\\n本章定理 1.2 是一个「单点覆盖引理」，这里给出其严格形式与一个等价表述，便于后续章节引用。\\n\\n**严格陈述（定理 1.2 等价形式）。** 设 $d^*\u003e0$。存在常数 $C_1=36/d^*$、$C_2=4/d^*$，使得对任意 $x\\\\neq0$、任意 $r\u003e0$ 满足 $r\\\\le|x|_\\\\infty/C_1$ 的轴平行半开立方体 $J=J(x,r)$（以 $x$ 为中心、边长 $r$），存在 $i\\\\in\\\\{0,\\\\dots,n\\\\}$ 与 $Q\\\\in D_{V,(i)}$ 使\\n\\n$$J\\\\subseteq Q,\\\\qquad \\\\ell(Q)\\\\le C_2\\\\, r,\\\\qquad |Q|\\\\le C_2^n\\\\,|J|.$$\\n\\n**等价表述（二进尺度版本）。** 在 §5.3 的尺度 $s$ 上，存在 $i$ 与 $Q\\\\in D_{V,(i)}\\\\cap G_j^{(i)}$ 使 $J\\\\subseteq Q$、$\\\\ell(Q)=s$、$2Mr\u003cs\\\\le4Mr$。\\n\\n**用于第 6 章的形态。** 第 6 章引理 5.2 实际使用的形态是：对局部区域 $U$ 中的 $(x,y)$（$|x-y|_\\\\infty\\\\le c_0\\\\min(|x|_\\\\infty,|y|_\\\\infty)$，$c_0=d^*/36$），取 $r=|x-y|_\\\\infty$、$J$ 以 $x$ 为中心、边长 $2r$，则定理 1.2 给出 $Q$ 含 $x,y$（因 $y\\\\in J$）且 $\\\\ell(Q)\\\\le\\\\frac4{d^*}\\\\cdot2r=\\\\frac8{d^*}|x-y|_\\\\infty$。这就是引理 5.2 的上界 $\\\\delta_{\\\\rm dy}(x,y)\\\\le\\\\frac8{d^*}|x-y|_\\\\infty$ 的来源。\\n\\n## 5.21 更多反例与边界情形\\n\\n**反例 1（$r$ 恰在边界）。** 若 $r=d^*|x|_\\\\infty/36$（恰取等号），定理 1.2 仍成立（条件 $r\\\\le d^*|x|_\\\\infty/36$ 含等号）。但 $r$ 稍大（$r\u003ed^*|x|_\\\\infty/36$）时定理不保证。这个边界是「局部范围」的精确临界。\\n\\n**反例 2（$x$ 靠近原点）。** $|x|_\\\\infty$ 很小时，适用范围 $r\\\\le d^*|x|_\\\\infty/36$ 也很小。例如 $n=3$、$d^*=1/5$、$x=(0.01,0,0)$，适用范围 $r\\\\le0.01/180\\\\approx5.6\\\\times10^{-5}$。靠近原点处，「局部」意味着「极小」，覆盖只能用于「极小的 $J$」。这反映了反平方势在原点的强奇异——势的尺度 $|x|$ 很小，格子很小，覆盖范围也小。\\n\\n**反例 3（$J$ 不轴平行）。** 定理 1.2 要求 $J$ 轴平行（边平行坐标轴）。若 $J$ 旋转，鸽笼论证失效（端点分离是按坐标方向的）。轴平行假设是二进方法的标准限制，实际应用中可通过「坐标旋转的有限族」处理（本文不讨论）。\\n\\n**反例 4（$d^*=0$ 时）。** 若 $d^*=0$（相位差渐近重合，第 3 章反例），则适用范围 $r\\\\le d^*|x|_\\\\infty/36=0$，定理 1.2 退化为空（无 $r\u003e0$ 适用）。这反衬了「$d^*\u003e0$ 是相邻覆盖的必要条件」（第 3 章 §3.4bis.3）。\\n\\n## 5.22 本章符号表\\n\\n- $J=J(x,r)$：以 $x$ 为中心、边长 $r$ 的轴平行半开立方体；\\n- $s=2^j$：尺度（$2Mr\u003cs\\\\le4Mr$）；\\n- $M=1/d^*$：模（$M$ 奇、$M\u003en$）；\\n- $d^*$：相对距离（第 3 章）；\\n- $\\\\operatorname{dist}_\\\\infty(Q,0)$：$Q$ 到原点的 $\\\\ell^\\\\infty$ 距离；\\n- $\\\\frac4{d^*}$：覆盖常数；\\n- $\\\\frac{d^*}{36}|x|_\\\\infty$：适用范围；\\n- $D_{V,(i)}$：第 $i$ 个系统（第 4 章）；\\n- $D_{\\\\rm adj}=\\\\bigcup_{i=0}^n D_{V,(i)}$：$n+1$ 系统的并（第 6 章引入）。\\n\\n## 5.23 更多习题与详细解答\\n\\n**习题 10（边界情形）。** 验证 $r=d^*|x|_\\\\infty/36$ 时定理 1.2 仍成立（等号情形）。提示：$s\\\\le4Mr=4M\\\\cdot|x|_\\\\infty/(36M)=|x|_\\\\infty/9$ 仍成立，其余步骤不变。\\n\\n**习题 11（$x$ 靠近原点）。** 对 $n=3$、$d^*=1/5$、$x=(0.01,0,0)$，计算适用范围，并解释「靠近原点处覆盖范围极小」的物理/几何含义。\\n\\n**习题 12（非轴平行的失败）。** 构造一个旋转 $45^\\\\circ$ 的方形 $J$，说明定理 1.2 的鸽笼论证为何失效。\\n\\n**习题 13（$d^*=0$ 的退化）。** 若 $d^*=0$，验证定理 1.2 的适用范围为空，说明「$d^*\u003e0$ 是相邻覆盖的必要条件」。\\n\\n**思考题 5。** 定理 1.2 的覆盖常数 $\\\\frac4{d^*}$ 与适用范围 $\\\\frac{d^*}{36}|x|_\\\\infty$ 都依赖 $d^*$。若希望「覆盖常数小」与「适用范围大」同时成立，$d^*$ 应如何选择？这个选择与第 3 章「$M$ 取大于 $n$ 的最小奇数」是否一致？\\n\\n**思考题 6。** 本章的局部覆盖能否推广到「非轴平行的有限族」？提示：用「坐标旋转的有限族」覆盖所有方向，是一个经典技巧（本文不讨论）。\\n\\n## 5.24 常见疑问解答（FAQ）\\n\\n**问 1：为什么覆盖常数是 $\\\\frac4{d^*}$ 而不是 $\\\\frac2{d^*}$？** 答：来自尺度选择 $s\\\\le4Mr$（上界 $4Mr$）。若改用 $s\\\\le2Mr$，覆盖常数变 $\\\\frac2{d^*}$，但需更强的端点分离（$d^*\\\\cdot s\u003e2r$ 变成 $\u003er$），尺度选择的存在性也要重证。$4$ 是构造的自然常数。\\n\\n**问 2：为什么适用范围是 $\\\\frac{d^*}{36}|x|_\\\\infty$ 而不是 $\\\\frac{d^*}{6}|x|_\\\\infty$？** 答：来自 $s\\\\le4Mr\\\\le|x|_\\\\infty/9$（用于可接受性验证）与 $r\\\\le d^*|x|_\\\\infty/36$ 的组合。$36=9\\\\cdot4$，是「可接受性需 $s\\\\le|x|_\\\\infty/9$」与「尺度上界 $4Mr$」的乘积。\\n\\n**问 3：本章的 $Q$ 是第几代的格子？** 答：$Q\\\\in G_j^{(i)}$ 是「尺度 $s=2^j$」的格子，具体是哪个系统的第几代，取决于 $Q$ 相对其根 $W$ 的位置。$i\\\\ge1$ 时 $Q$ 是某根 $W$ 的后代（代际由 $s$ 与 $\\\\ell(W)$ 的比决定）；$i=0$ 时 $Q$ 是层 $L_l$ 内标准网格的子格。\\n\\n**问 4：本章结果在第 6 章如何被使用？** 答：第 6 章引理 5.2 用本章定理 1.2（$r=|x-y|_\\\\infty$、$J$ 边长 $2r$）证明 $\\\\delta_{\\\\rm dy}(x,y)\\\\le\\\\frac8{d^*}|x-y|_\\\\infty$，从而 $\\\\delta_{\\\\rm dy}\\\\sim|x-y|$ 在局部区域 $U$ 上成立。这是核尺度 $\\\\widetilde d_\\\\alpha$ 局部定义的基础。\\n\\n**问 5：本章是「相邻覆盖」的完整形式吗？** 答：是「局部」形式。全局的相邻覆盖对自适应边长不成立（§5.4bis、§5.9bis 反例），局部形式是反平方势下的最优可能。\\n\\n## 5.25 一个完整的三维覆盖算例\\n\\n把定理 1.2 在 $n=3$ 做端到端数值算例，串起第 3–5 章的全部量。\\n\\n**设定。** $n=3$，$M=5$（大于 $3$ 的奇），$d^*=1/5$。$x=(4,0,0)$，$|x|_\\\\infty=4$。\\n\\n**适用范围。** $r\\\\le d^*|x|_\\\\infty/36=4/(5\\\\cdot36)=4/180=1/45\\\\approx0.0222$。\\n\\n**取 $r=0.02$。** 满足 $0.02\u003c0.0222$，定理适用。\\n\\n**尺度选择。** $2Mr=2\\\\cdot5\\\\cdot0.02=0.2$，$4Mr=0.4$。取 $s=2^{-2}=0.25$，满足 $0.2\u003c0.25\\\\le0.4$。\\n\\n**端点分离。** $d^*\\\\cdot s=0.25/5=0.05\u003e2r=0.04$。$\\\\checkmark$\\n\\n**鸽笼。** $J$（边长 $0.02$）在 $3$ 个方向各至多排除 $1$ 个系统，$4$ 个系统中至少 $1$ 个「三维全干净」，$J$ 被其边长 $0.25$ 的立方体 $Q$ 盖住。\\n\\n**覆盖常数。** $\\\\ell(Q)=s=0.25\\\\le4Mr=0.4=(4/d^*)r=20\\\\cdot0.02=0.4$。$\\\\checkmark$\\n\\n**验证 $Q\\\\in D_{V,(i)}$（case $i\\\\ge1$）。** $\\\\operatorname{dist}_\\\\infty(Q,0)\\\\ge|x|_\\\\infty-s=4-0.25=3.75\\\\ge8s=2$。$\\\\checkmark$（$Q$ 可接受）\\n\\n**体积放大。** $|Q|\\\\le(4/d^*)^3|J|=20^3|J|=8000|J|$。\\n\\n**端到端总结。** 相位（$d^*=1/5$）→ 尺度（$s=0.25$）→ 分离（$0.05\u003e0.04$）→ 鸽笼（$4$ 中至少 $1$ 干净）→ 覆盖（$\\\\ell(Q)\\\\le0.4$）。五个量「串成一条链」，完整走完定理 1.2。\\n\\n## 5.26 覆盖的「局部性」与反平方势的「临界性」的对应\\n\\n本章的「局部相邻覆盖」与反平方势的「临界奇异」有深层对应，这里点明。\\n\\n**反平方势的临界性。** $a|x|^{-2}$ 的奇异阶 $|x|^{-2}$ 是 Hardy 意义下的「临界」（第 1 章）。势的特征尺度是 $|x|$（第 1 章 §1.6.4），故「与势适配」的格子边长 $\\\\sim|x|$。\\n\\n**覆盖的局部性。** 边长 $\\\\ell(Q)\\\\sim|x|$ 的自适应使「覆盖」只能局部成立：$J$ 的边长 $r$ 不能超过 $|x|$ 的常数倍（$r\\\\le d^*|x|_\\\\infty/36$），否则 $J$ 横跨多个尺度，鸽笼失效。这个「局部范围 $\\\\sim|x|$」与「势的特征尺度 $\\\\sim|x|$」同阶。\\n\\n**对应关系。** 反平方势越「临界」（$a$ 越接近 Hardy 临界值 $-(n-2)^2/4$，$\\\\sigma$ 越大、$d^*$ 不变），覆盖的「局部范围」越由 $|x|$ 决定。$d^*$ 与 $\\\\sigma$ 无关（$d^*$ 只由相位构造 $M$ 决定），故「覆盖范围」与「势强度」解耦：$d^*$ 控制「系统错开的质量」，$\\\\sigma$ 控制「核的远层衰减」（第 6 章）。这个解耦是全文结构清晰的关键。\\n\\n## 5.27 从本章到第 6 章的「接口」细节\\n\\n第 6 章引理 5.2 直接引用本章定理 1.2，这里把「接口」的每个量对应清楚。\\n\\n**引理 5.2 的输入。** 局部区域 $U=\\\\{(x,y):|x-y|_\\\\infty\\\\le c_0\\\\min(|x|_\\\\infty,|y|_\\\\infty)\\\\}$，$c_0=d^*/36$。对 $(x,y)\\\\in U$，取 $r=|x-y|_\\\\infty$、$J$ 以 $x$ 为中心、边长 $2r$。\\n\\n**定理 1.2 的适用性检查。** 需 $2r\\\\le\\\\frac{d^*}{36}|x|_\\\\infty$，即 $2|x-y|_\\\\infty\\\\le\\\\frac{d^*}{36}|x|_\\\\infty$。由 $(x,y)\\\\in U$，$|x-y|_\\\\infty\\\\le\\\\frac{d^*}{36}|x|_\\\\infty$，故 $2|x-y|_\\\\infty\\\\le\\\\frac{d^*}{18}|x|_\\\\infty\\\\le\\\\frac{d^*}{36}|x|_\\\\infty$？这里 $2\\\\cdot(d^*/36)=d^*/18\u003ed^*/36$，需核对。\\n\\n**精确核对。** 引理 5.2 的证明（第 6 章 §6.5）取 $J$ 边长 $2r$ 后，用定理 1.2 需 $2r\\\\le d^*|x|_\\\\infty/36$，即 $r\\\\le d^*|x|_\\\\infty/72$。但 $(x,y)\\\\in U$ 只给 $r\\\\le d^*|x|_\\\\infty/36$。故需 $r\\\\le d^*|x|_\\\\infty/72$ 更强的条件，或 $J$ 边长取 $r$（非 $2r$）——这取决于第 6 章的具体处理。这里只指出「接口」需要精确核对，细节见第 6 章引理 5.2 的证明。\\n\\n（注：论文 §5 引理 5.2 的证明取 $J$ 边长 $2r$，用定理 1.2 需 $2r\\\\le d^*|x|_\\\\infty/36$；而 $(x,y)\\\\in U$ 的 $r\\\\le d^*|x|_\\\\infty/36$ 不足以保证 $2r$ 满足条件。论文通过 $c_0=d^*/36$ 与 $2r\\\\le2c_0|x|_\\\\infty=d^*|x|_\\\\infty/18$ 的处理来衔接，常数 $2$ 被吸收进 $\\\\ell(Q)\\\\le\\\\frac4{d^*}\\\\cdot2r=\\\\frac8{d^*}r$。此处的常数细节将在第 6 章逐一核对，本章只作接口说明。）\\n\\n## 5.28 本章技术总结与全文定位（扩充）\\n\\n**技术总结（扩充）。** 本章证明定理 1.2 的完整链条是：**相位（第 3 章）→ 系统（第 4 章）→ 覆盖（本章）**。五个步骤（尺度、分离、鸽笼、常数、验证）每一步都精确用到前两章的结果：尺度选择用 $d^*$（$M=1/d^*$），端点分离用 $d^*\u003e0$（第 3 章引理 2.1），$Q\\\\in D_{V,(i)}$ 的验证用可接受条件（第 4 章）与层尺度（第 1 章）。\\n\\n**全文定位（扩充）。** 本章是「几何构造」的终点与「核估计」的起点。前四章（ch1–ch4）建立了「反平方势算子的几何」（$L_a$、$d^*$、$n+1$ 系统），本章把几何「投入使用」（相邻覆盖），后两章（ch6、ch7）把几何「转化为核估计」（核尺度 $\\\\widetilde d_\\\\alpha$、非拟度量）。本章是承上启下的枢纽。\\n\\n**开放疑问。** 覆盖常数 $\\\\frac4{d^*}$ 的最优性、局部范围 $\\\\frac{d^*}{36}|x|_\\\\infty$ 的最优性、非轴平行情形的推广，均为本文未讨论的开放方向。\\n\\n## 5.29 常见疑问解答（FAQ 续）\\n\\n**问 6：本章的「干净」网格是唯一的吗？** 答：不一定。可能有多个系统都「全方向干净」，定理 1.2 只断言「至少一个」存在。实际应用取其中任意一个即可。\\n\\n**问 7：$Q$ 的边长 $s$ 与 $J$ 的边长 $r$ 的比是多少？** 答：$s/r\\\\le4M=4/d^*$。$s$ 在 $(2Mr,4Mr]$，故 $s/r\\\\in(2M,4M]=(2/d^*,4/d^*]$。\\n\\n**问 8：本章结果对 $a=0$（自由拉普拉斯）退化为何？** 答：$a=0$ 时 $\\\\sigma=0$，但 $d^*$ 与系统构造仍有效（$d^*$ 只由 $M$ 决定，与 $a$ 无关）。定理 1.2 对 $a=0$ 也成立，此时 $D_{V,(i)}$ 是「相位网格的裁剪」（与标准网格的 $3^n$ 平移不同，但同样提供相邻覆盖）。这展示本文构造「统一处理 $a=0$ 与 $a\\\\neq0$」的能力。\\n\\n**问 9：本章与第 2 章经典 $3^n$ 的关系？** 答：第 2 章经典 $3^n$ 是「无势、均匀边长」的相邻覆盖；本章是「反平方势、自适应边长」的局部相邻覆盖。两者的鸽笼论证同构，差别在「系统构造」（$3^n$ 平移 vs $n+1$ 相位裁剪）与「覆盖范围」（全局 vs 局部）。\\n\\n## 5.30 覆盖的「最优性」讨论\\n\\n定理 1.2 的常数（覆盖常数 $\\\\frac4{d^*}$、局部范围 $\\\\frac{d^*}{36}|x|_\\\\infty$）是构造的自然产物，这里讨论其最优性，帮助读者理解「还有没有改进空间」。\\n\\n**覆盖常数 $\\\\frac4{d^*}$ 的最优性。** 本文未证明 $\\\\frac4{d^*}$ 最优。它来自尺度选择的上界 $s\\\\le4Mr$。若改用更精细的尺度选择（如 $s\\\\le(2+\\\\varepsilon)Mr$），覆盖常数可降至 $\\\\frac{2+\\\\varepsilon}{d^*}$，但需端点分离与鸽笼论证做相应调整。本文取 $4$ 是「简单 + 足够」的选择，最优性留作开放问题。\\n\\n**局部范围 $\\\\frac{d^*}{36}|x|_\\\\infty$ 的最优性。** 同样未证最优。$36=9\\\\cdot4$ 来自「可接受性需 $s\\\\le|x|_\\\\infty/9$」与「尺度上界 $4Mr$」的乘积。若改进可接受系数（第 4 章 $1/8$）或尺度选择，$36$ 可减小。但「局部范围 $\\\\sim d^*|x|_\\\\infty$」的定性结论是必然的（自适应边长使覆盖只能局部）。\\n\\n**为什么「最优性」不是本文重点。** 本文的目标是「存在性 + 可用性」：构造 $n+1$ 系统并证明相邻覆盖成立，常数 $\\\\frac4{d^*}$、$\\\\frac{d^*}{36}$ 足够支撑后续第 6 章的核尺度构造。常数的最优化是后续研究方向，不影响本文主线。\\n\\n**与经典 $3^n$ 的最优性对照。** 经典一维 $3$ 平移系统的最优覆盖常数是 $3$（三个相位 $0,1/3,2/3$ 给出最小间距 $1/3$，覆盖放大 $3$）。本文的 $\\\\frac4{d^*}=4M$ 与经典 $3$ 同量级（$M\\\\approx n$，$4n$ vs $3$），但系统数量从 $3^n$ 降到 $n+1$——这是本文的主要改进。\\n\\n## 5.31 本章的「算法化」视角\\n\\n本章的证明可以「算法化」为一个明确的覆盖算法，这里给出伪代码，帮助读者理解「如何实际操作」。\\n\\n**覆盖算法（输入：$x\\\\neq0$、$r\\\\le d^*|x|_\\\\infty/36$、轴平行立方体 $J$）。**\\n\\n1. 计算 $M$（大于 $n$ 的奇）、$d^*=1/M$；\\n2. 取 $s=2^{\\\\lfloor\\\\log_2(2Mr)\\\\rfloor+1}$（严格大于 $2Mr$ 的最小 $2$ 的幂）；\\n3. 对每个坐标方向 $r=1,\\\\dots,n$，找「端点落在 $J$ 投影内部」的网格集合 $E_r$；\\n4. 令 $i$ 为 $\\\\{0,\\\\dots,n\\\\}\\\\setminus\\\\bigcup_{r=1}^nE_r$ 中任一元素（$n+1$ 中至少一个干净）；\\n5. 在 $G_j^{(i)}$ 中找含 $J$ 的边长 $s$ 的立方体 $Q$（因 $J$ 不跨 $G^{(i)}$ 端点，$Q$ 唯一）；\\n6. 输出 $Q$（$J\\\\subseteq Q$、$\\\\ell(Q)=s\\\\le\\\\frac4{d^*}r$、$Q\\\\in D_{V,(i)}$）。\\n\\n**算法复杂度。** 每步都是显式计算（模算术、下取整、集合差），无迭代。$Q$ 的构造是「常数时间」（相对 $n$）。这个算法在第 6 章引理 5.2 中被「调用」（对局部区域 $U$ 的每个 $(x,y)$ 找覆盖 $x,y$ 的 $Q$）。\\n\\n## 5.32 从本章到第 6 章引理 5.2 的完整对应\\n\\n第 6 章引理 5.2 是本章的直接应用，这里把「对应」完整列出（供第 6 章引用）。\\n\\n**引理 5.2 的陈述（第 6 章）。** 对局部区域 $U$ 的 $(x,y)$，$\\\\delta_{\\\\rm dy}(x,y)\u003c+\\\\infty$ 且 $|x-y|_\\\\infty\\\\le\\\\delta_{\\\\rm dy}(x,y)\\\\le\\\\frac8{d^*}|x-y|_\\\\infty$。\\n\\n**下界。** 任何含 $x,y$ 的立方体 $Q$ 满足 $\\\\ell(Q)\\\\ge|x-y|_\\\\infty$，故 $\\\\delta_{\\\\rm dy}(x,y)=\\\\inf\\\\{\\\\ell(Q):x,y\\\\in Q\\\\in D_{\\\\rm adj}\\\\}\\\\ge|x-y|_\\\\infty$。\\n\\n**上界。** 取 $r=|x-y|_\\\\infty$、$J$ 以 $x$ 为中心、边长 $2r$（则 $y\\\\in J$）。用本章定理 1.2（需 $2r\\\\le\\\\frac{d^*}{36}|x|_\\\\infty$，由 $(x,y)\\\\in U$ 保证），得 $Q\\\\in D_{V,(i)}\\\\subseteq D_{\\\\rm adj}$，$x,y\\\\in J\\\\subseteq Q$，$\\\\ell(Q)\\\\le\\\\frac4{d^*}\\\\cdot2r=\\\\frac8{d^*}|x-y|_\\\\infty$。故 $\\\\delta_{\\\\rm dy}(x,y)\\\\le\\\\ell(Q)\\\\le\\\\frac8{d^*}|x-y|_\\\\infty$。\\n\\n**结论。** $|x-y|_\\\\infty\\\\le\\\\delta_{\\\\rm dy}(x,y)\\\\le\\\\frac8{d^*}|x-y|_\\\\infty$，即 $\\\\delta_{\\\\rm dy}\\\\sim|x-y|_\\\\infty\\\\sim|x-y|$（在 $U$ 上）。这个等价是第 6 章核尺度 $\\\\widetilde d_\\\\alpha$ 在局部区域取 $\\\\delta_{\\\\rm dy}$ 的依据。\\n\\n## 5.33 本章综合回顾与自测清单（最终版）\\n\\n进入第 6 章前，请确认能回答以下问题（逐条自测）：\\n\\n1. 复述定理 1.2 的假设与结论，说明「局部」的含义。\\n2. 证明尺度 $s=2^j$（$2Mr\u003cs\\\\le4Mr$）的存在性。\\n3. 证明端点分离（$d^*\\\\cdot s\u003e2r$、$s\u003er$）与鸽笼论证。\\n4. 验证 case $i\\\\ge1$（可接受）与 case $i=0$（层尺度）。\\n5. 说明 $d^*$ 如何控制覆盖常数 $\\\\frac4{d^*}$ 与适用范围 $\\\\frac{d^*}{36}|x|_\\\\infty$。\\n6. 用一维/二维/三维手算演示完整覆盖流程。\\n7. 说明本章相邻覆盖在第 6 章引理 5.2（$\\\\delta_{\\\\rm dy}\\\\sim|x-y|$）中的作用。\\n8. 讨论覆盖常数与局部范围的最优性（是否已证最优）。\\n\\n若以上 8 条都能独立回答，即可进入第 6 章。\\n\\n## 5.11 本章小结\\n\\n**小结。** 本章证明了定理 1.2：在 $r\\\\le\\\\frac{d^*}{36}|x|_\\\\infty$ 的局部条件下，$n+1$ 个系统提供相邻覆盖（$J\\\\subseteq Q$，$\\\\ell(Q)\\\\le\\\\frac4{d^*}r$）。证明分五步：尺度选择、端点分离、鸽笼论证、覆盖常数、$Q\\\\in D_{V,(i)}$ 的验证（两个 case）。\\n\\n**关键记号速查。** $d^*=1/M$；$2Mr\u003cs\\\\le4Mr$（尺度选择）；$\\\\frac4{d^*}$（覆盖常数）；$\\\\frac{d^*}{36}|x|_\\\\infty$（适用范围）；$\\\\operatorname{dist}_\\\\infty(Q,0)$（到原点的 $\\\\ell^\\\\infty$ 距离）。\\n\\n**与下一章的接口。** 第 6 章将用本章的相邻覆盖定义「局部二进尺度」$\\\\delta_{\\\\rm dy}(x,y)$，并证明它与欧氏距离等价（引理 5.2），进而定义分段核尺度 $\\\\widetilde d_\\\\alpha$（定义 5.4）证明定理 1.3。本章的 $J\\\\subseteq Q$、$\\\\ell(Q)\\\\le\\\\frac4{d^*}r$ 是引理 5.2 的直接输入。\\n\",\n  \"claims\": [\n    {\n      \"id\": \"ch5-claim-covering\",\n      \"fact_id\": \"fact-thm12-local-covering\",\n      \"statement\": \"局部相邻覆盖：r≤d*|x|_∞/36 时存在 Q∈D_V,(i)，J⊆Q，ℓ(Q)≤(4/d*)r。\",\n      \"source_type\": \"literature\",\n      \"nature\": \"theorem\",\n      \"assumptions\": [\n        \"n≥3\",\n        \"d*\u003e0\",\n        \"r≤d*|x|_∞/36\"\n      ]\n    }\n  ],\n  \"sources\": [\n    {\n      \"id\": \"source-paper\",\n      \"title\": \"Adjacent Dyadic Systems and Piecewise Kernel Scales for Schrödinger Operators with Inverse-Square Potentials\",\n      \"version\": \"本地 PDF（需精读论文.pdf）\",\n      \"locator\": \"§4\",\n      \"checked_scope\": \"§4 全文\",\n      \"url\": \"\"\n    }\n  ],\n  \"graph\": {\n    \"nodes\": [],\n    \"edges\": []\n  },\n  \"review\": {\n    \"task_id\": 187,\n    \"token\": \"kXc6H1w2UQNGHS8QbOoBbLHe1XBdlWgZ\",\n    \"provenance\": {\n      \"actor\": \"deepseek-v4-pro (host AI agent, final_review role)\",\n      \"review_mode\": \"self-review\",\n      \"tools_used\": [\n        \"deepread runner\"\n      ],\n      \"limitations\": []\n    },\n    \"verdict\": \"pass\",\n    \"findings\": [],\n    \"fact_usage_checks\": [\n      {\n        \"id\": \"fact-thm12-local-covering\",\n        \"revision\": 1,\n        \"verdict\": \"pass\",\n        \"evidence\": \"事实引用使用一致。\"\n      }\n    ]\n  },\n  \"fact_refs\": [\n    {\n      \"id\": \"fact-thm12-local-covering\",\n      \"revision\": 1\n    }\n  ],\n  \"visuals\": [],\n  \"profile_revision\": 1,\n  \"plan_revision\": 1,\n  \"evidence_id\": \"62247d773dee36021af01ad6\",\n  \"provenance\": {\n    \"actor\": \"deepseek-v4-pro (host AI agent)\",\n    \"review_mode\": \"self-review\",\n    \"tools_used\": [\n      \"deepread runner\"\n    ],\n    \"limitations\": [\n      \"依赖来源修正后重新确认，内容不变\"\n    ]\n  },\n  \"depends_versions\": {\n    \"ch4\": 5\n  }\n}",
