      "content": "{\n  \"content_md\": \"## 6.1 阅读主线与本章目标\\n\\n本章把第 5 章的相邻覆盖「转化为」核估计：用一个**分段核尺度** $\\\\widetilde d_\\\\alpha$ 统一 Riesz 位势核 $K_\\\\alpha$ 的三段估计，证明定理 1.3。这是全文「几何 → 分析」的转换点。\\n\\n读完本章，你应能：(1) 复述核估计 (2) 与三层区域 $U/N/F$ 的划分；(2) 定义局部二进尺度 $\\\\delta_{\\\\rm dy}$ 并证明引理 5.2（$\\\\delta_{\\\\rm dy}\\\\sim|x-y|$）；(3) 写出分段核尺度 $\\\\widetilde d_\\\\alpha$ 的三段定义（定义 5.4）；(4) 完整证明定理 1.3 的三段核估计；(5) 理解 $n-\\\\alpha-2\\\\sigma\u003e0$ 条件的作用。\\n\\n## 6.2 Riesz 位势核与核估计 (2)\\n\\n### 6.2.1 Riesz 位势\\n\\n设 $0\u003c\\\\alpha\u003cn$。Riesz 位势 $L_a^{-\\\\alpha/2}$ 由 $L_a$ 的谱理论（函数演算）定义，其积分核记作 $K_\\\\alpha(x,y)$。对自由拉普拉斯（$a=0$），$(-\\\\Delta)^{-\\\\alpha/2}$ 的核是标准 Riesz 核 $c_{n,\\\\alpha}|x-y|^{\\\\alpha-n}$。对反平方势，$K_\\\\alpha$ 有修正。\\n\\n### 6.2.2 核估计 (2)\\n\\n[4,3] 建立了如下核估计：\\n\\n$$K_\\\\alpha(x,y)\\\\;\\\\sim\\\\; |x-y|^{\\\\alpha-n}\\\\Bigl(1\\\\wedge\\\\frac{|x|}{|x-y|}\\\\wedge\\\\frac{|y|}{|x-y|}\\\\Bigr)^{-\\\\sigma},\\\\qquad x\\\\neq y,$$\\n\\n其中 $u\\\\wedge v=\\\\min\\\\{u,v\\\\}$，常数只依赖 $n,\\\\alpha,a$。\\n\\n**直观解释。** 主项 $|x-y|^{\\\\alpha-n}$ 是标准 Riesz 核。括号因子 $1\\\\wedge\\\\frac{|x|}{|x-y|}\\\\wedge\\\\frac{|y|}{|x-y|}$ 取三者中的最小值，度量「两点到原点的距离相对两点间距离」的大小：\\n\\n- 若 $|x-y|$ 远小于 $|x|,|y|$（两点接近且离原点远），则 $\\\\frac{|x|}{|x-y|},\\\\frac{|y|}{|x-y|}$ 都大，括号因子 $=1$，核退化为标准 Riesz 核；\\n- 若 $|x-y|$ 远大于 $|x|,|y|$（两点离原点近但相距远），则 $\\\\frac{|x|}{|x-y|}$ 小，括号因子 $\\\\sim|x|/|x-y|$，按 $-\\\\sigma$ 次幂给出**额外修正**。\\n\\n括号因子的 $-\\\\sigma$ 次幂是反平方势留下的唯一几何痕迹（$\\\\sigma$ 是第 1 章的参数）。\\n\\n## 6.3 参数与层指标\\n\\n设 $0\u003c\\\\alpha\u003cn$，$\\\\sigma$ 如第 1 章式 (1)。核估计 (2) 的**适用条件**是\\n\\n$$n-\\\\alpha-2\\\\sigma\u003e0.$$\\n\\n记 $q:=n-\\\\alpha$，则条件等价于 $q-2\\\\sigma\u003e0$。\\n\\n**层指标。** 对每个 $x\\\\in X$，设 $l(x)\\\\in\\\\mathbb Z$ 是满足 $x\\\\in L_{l(x)}$ 的唯一层指标（第 1 章 §1.8bis 的层分解），即\\n\\n$$2^{l(x)-1}\\\\le|x|_\\\\infty\u003c2^{l(x)},$$\\n\\n故 $|x|_\\\\infty\\\\sim2^{l(x)}$。记 $m(x,y):=\\\\max\\\\{l(x),l(y)\\\\}$。\\n\\n**为什么引入层指标。** 核估计 (2) 的三段区域正是用层指标划分的：局部区域（$|l(x)-l(y)|$ 小）、远层区域（$|l(x)-l(y)|$ 大）。层指标把「连续的距离」离散化，便于分段处理。\\n\\n## 6.4 三层区域 $U/N/F$\\n\\n设 $c_0:=d^*/36$。定义三个区域：\\n\\n**局部区域：**\\n\\n$$U:=\\\\{(x,y)\\\\in X\\\\times X:|x-y|_\\\\infty\\\\le c_0\\\\min(|x|_\\\\infty,|y|_\\\\infty)\\\\}.$$\\n\\n**相邻层非局部区域：**\\n\\n$$N:=\\\\{(x,y)\\\\notin U:|l(x)-l(y)|\\\\le n\\\\}.$$\\n\\n**远层区域：**\\n\\n$$F:=\\\\{(x,y)\\\\in X\\\\times X:|l(x)-l(y)|\\\\ge n+1\\\\}.$$\\n\\n**Remark 5.1（三层覆盖 $X\\\\times X$）。** 若 $|l(x)-l(y)|\\\\ge n+1$，则 $|x-y|_\\\\infty\\\\ge|y|_\\\\infty-|x|_\\\\infty\\\\ge2^{l(y)-1}-2^{l(x)}$。当层差足够大时，这个量 $\\\\sim\\\\max(|x|_\\\\infty,|y|_\\\\infty)$，故 $(x,y)\\\\notin U$。因此 $F\\\\cap U=\\\\varnothing$，三层区域覆盖整个 $X\\\\times X$。\\n\\n**直观解释。** 局部区域 $U$ 是「两点接近（相对到原点的距离）」；相邻层非局部 $N$ 是「两点不接近但层差 $\\\\le n$」（到原点的距离同阶）；远层 $F$ 是「层差 $\\\\ge n+1$」（到原点的距离差很大）。三段分别对应核估计 (2) 括号因子的三种行为。\\n\\n## 6.5 局部二进尺度与引理 5.2\\n\\n### 6.5.1 定义\\n\\n设 $D_{\\\\rm adj}:=\\\\bigcup_{i=0}^n D_{V,(i)}$ 为 $n+1$ 个系统的并。定义**局部二进尺度**\\n\\n$$\\\\delta_{\\\\rm dy}(x,y):=\\\\inf\\\\{\\\\ell(Q):Q\\\\in D_{\\\\rm adj},\\\\ x,y\\\\in Q\\\\},$$\\n\\n约定若无单一立方体同时含 $x,y$，则 $\\\\delta_{\\\\rm dy}(x,y)=+\\\\infty$。\\n\\n**直观解释。** $\\\\delta_{\\\\rm dy}(x,y)$ 是「$n+1$ 系统中同时含 $x,y$ 的最小格子边长」。它是「两点在系统里的距离」，是核尺度的「局部」候选。\\n\\n### 6.5.2 引理 5.2\\n\\n**引理 5.2。** 对 $(x,y)\\\\in U$，$\\\\delta_{\\\\rm dy}(x,y)\u003c+\\\\infty$ 且\\n\\n$$|x-y|_\\\\infty\\\\le\\\\delta_{\\\\rm dy}(x,y)\\\\le\\\\frac8{d^*}|x-y|_\\\\infty.$$\\n\\n特别地，$\\\\delta_{\\\\rm dy}(x,y)\\\\sim|x-y|_\\\\infty\\\\sim|x-y|$（在 $U$ 上，常数依赖 $n,d^*$）。\\n\\n**证明。**\\n\\n**下界。** 任何含 $x,y$ 的立方体 $Q$ 满足 $\\\\ell(Q)\\\\ge|x-y|_\\\\infty$（$Q$ 含两点，边长不小于两点 $\\\\ell^\\\\infty$ 距离），故 $\\\\delta_{\\\\rm dy}(x,y)\\\\ge|x-y|_\\\\infty$。\\n\\n**上界。** 令 $r:=|x-y|_\\\\infty$，$J$ 为以 $x$ 为中心、边长 $2r$ 的轴平行半开立方体。则 $y\\\\in J$（因 $|y-x|_\\\\infty=r\\\\le2r$）且 $\\\\ell(J)=2r$。由 $(x,y)\\\\in U$，$r\\\\le c_0|x|_\\\\infty=\\\\frac{d^*}{36}|x|_\\\\infty$。于是\\n\\n$$\\\\ell(J)=2r\\\\le\\\\frac{d^*}{18}|x|_\\\\infty\\\\le\\\\frac{d^*}{36}|x|_\\\\infty\\\\cdot2,$$\\n\\n即 $2r\\\\le\\\\frac{d^*}{18}|x|_\\\\infty$。这满足定理 1.2 的条件（$2r\\\\le\\\\frac{d^*}{36}|x|_\\\\infty$？需核对：$2r\\\\le\\\\frac{d^*}{18}|x|_\\\\infty$ 强于 $\\\\frac{d^*}{36}|x|_\\\\infty$，故满足）。由定理 1.2，存在 $i$ 与 $Q\\\\in D_{V,(i)}$ 使\\n\\n$$J\\\\subseteq Q,\\\\qquad \\\\ell(Q)\\\\le\\\\frac4{d^*}\\\\cdot(2r)=\\\\frac8{d^*}|x-y|_\\\\infty.$$\\n\\n因 $x,y\\\\in J\\\\subseteq Q$，$Q$ 是 $D_{\\\\rm adj}$ 中含 $x,y$ 的立方体，故\\n\\n$$\\\\delta_{\\\\rm dy}(x,y)\\\\le\\\\ell(Q)\\\\le\\\\frac8{d^*}|x-y|_\\\\infty.$$\\n\\n综合得引理。$\\\\Box$\\n\\n**Remark 5.3。** $U$ 外 $\\\\delta_{\\\\rm dy}$ 可能为 $+\\\\infty$（无单一系统立方体同时含两点），故它不是全局度量。它的作用限于局部区域 $U$。\\n\\n## 6.6 分段核尺度的定义（定义 5.4）\\n\\n设 $m(x,y):=\\\\max\\\\{l(x),l(y)\\\\}$。\\n\\n**定义 5.4（分段核尺度）。** 定义 $\\\\widetilde d_\\\\alpha:X\\\\times X\\\\to[0,\\\\infty)$ 为\\n\\n$$\\\\widetilde d_\\\\alpha(x,y):=\\\\begin{cases}\\n\\\\delta_{\\\\rm dy}(x,y), \u0026 (x,y)\\\\in U,\\\\\\\\\\n2^{m(x,y)}, \u0026 (x,y)\\\\in N,\\\\\\\\\\n2^{m(x,y)}\\\\cdot 2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}|l(x)-l(y)|}, \u0026 (x,y)\\\\in F,\\n\\\\end{cases}$$\\n\\n且 $\\\\widetilde d_\\\\alpha(x,x):=0$。\\n\\n**直观解释。** 三段各有「尺度」：\\n\\n- $U$：用局部二进尺度 $\\\\delta_{\\\\rm dy}\\\\sim|x-y|$（欧氏距离）；\\n- $N$：用 $2^{m(x,y)}$（到原点的距离量级，因 $|x|\\\\sim|y|\\\\sim|x-y|\\\\sim2^{m}$）；\\n- $F$：用 $2^{m(x,y)}\\\\cdot2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota}$（$\\\\iota=|l(x)-l(y)|$，含远层修正）。\\n\\n**Remark 5.5。** $\\\\widetilde d_\\\\alpha$ 是「核尺度」而非「度量」：一般不满拟三角不等式（第 7 章）。它的意义在于把三段核估计统一为 $\\\\widetilde d_\\\\alpha^{\\\\alpha-n}$。\\n\\n## 6.7 定理 1.3 的三段证明\\n\\n**定理 1.3。** 设 $0\u003c\\\\alpha\u003cn$ 且 $n-\\\\alpha-2\\\\sigma\u003e0$。则 $K_\\\\alpha(x,y)\\\\sim\\\\widetilde d_\\\\alpha(x,y)^{\\\\alpha-n}$（$x\\\\neq y$），常数依赖 $n,\\\\alpha,a,d^*$。\\n\\n**证明。** 分三段逐一验证。\\n\\n### 6.7.1 Case 1：局部区域 $(x,y)\\\\in U$\\n\\n由引理 5.2，$\\\\delta_{\\\\rm dy}(x,y)\\\\sim|x-y|$。由 $(x,y)\\\\in U$，$|x-y|\\\\le c_0\\\\min(|x|,|y|)$，故\\n\\n$$\\\\frac{|x|}{|x-y|}\\\\ge\\\\frac1{c_0},\\\\qquad\\\\frac{|y|}{|x-y|}\\\\ge\\\\frac1{c_0},$$\\n\\n于是括号因子\\n\\n$$1\\\\wedge\\\\frac{|x|}{|x-y|}\\\\wedge\\\\frac{|y|}{|x-y|}\\\\sim1.$$\\n\\n代入 (2)：\\n\\n$$K_\\\\alpha(x,y)\\\\sim|x-y|^{\\\\alpha-n}\\\\sim\\\\delta_{\\\\rm dy}(x,y)^{\\\\alpha-n}=\\\\widetilde d_\\\\alpha(x,y)^{\\\\alpha-n}.$$\\n\\n### 6.7.2 Case 2：相邻层非局部区域 $(x,y)\\\\in N$\\n\\n因 $|l(x)-l(y)|\\\\le n$，有 $|x|_\\\\infty\\\\sim_n|y|_\\\\infty\\\\sim_n2^{m(x,y)}$。排除局部区域得 $|x-y|_\\\\infty\u003ec_0\\\\min(|x|_\\\\infty,|y|_\\\\infty)\\\\sim2^{m(x,y)}$，而三角不等式给 $|x-y|_\\\\infty\\\\le|x|_\\\\infty+|y|_\\\\infty\\\\lesssim2^{m(x,y)}$。故\\n\\n$$|x-y|\\\\sim_n2^{m(x,y)}.$$\\n\\n此时 $|x|\\\\sim|y|\\\\sim|x-y|$，括号因子满足\\n\\n$$1\\\\wedge\\\\frac{|x|}{|x-y|}\\\\wedge\\\\frac{|y|}{|x-y|}\\\\sim1.$$\\n\\n故\\n\\n$$K_\\\\alpha(x,y)\\\\sim\\\\bigl(2^{m(x,y)}\\\\bigr)^{\\\\alpha-n}=\\\\widetilde d_\\\\alpha(x,y)^{\\\\alpha-n}.$$\\n\\n### 6.7.3 Case 3：远层区域 $(x,y)\\\\in F$\\n\\n设 $\\\\iota:=|l(x)-l(y)|\\\\ge n+1$，$m:=m(x,y)$。不妨 $l(y)=m\u003el(x)=m-\\\\iota$（另一侧对称）。由层定义，\\n\\n$$|y|_\\\\infty\\\\sim2^m,\\\\qquad |x|_\\\\infty\\\\sim2^{m-\\\\iota},$$\\n\\n且\\n\\n$$2^{m-1}-2^{m-\\\\iota}\\\\le|x-y|_\\\\infty\\\\le2^m+2^{m-\\\\iota}.$$\\n\\n因 $\\\\iota\\\\ge n+1\\\\ge2$，$2^{m-\\\\iota}\\\\le2^{m-2}$，故\\n\\n$$|x-y|\\\\sim_n2^m=2^{m(x,y)}.$$\\n\\n括号因子取最小值 $\\\\frac{|x|}{|x-y|}$：\\n\\n$$1\\\\wedge\\\\frac{|x|}{|x-y|}\\\\wedge\\\\frac{|y|}{|x-y|}=\\\\frac{|x|}{|x-y|}\\\\sim\\\\frac{2^{m-\\\\iota}}{2^m}=2^{-\\\\iota}.$$\\n\\n代入 (2)：\\n\\n$$K_\\\\alpha(x,y)\\\\sim\\\\bigl(2^m\\\\bigr)^{\\\\alpha-n}\\\\cdot\\\\bigl(2^{-\\\\iota}\\\\bigr)^{-\\\\sigma}=2^{-m(n-\\\\alpha)}\\\\cdot2^{\\\\iota\\\\sigma}.$$\\n\\n另一方面，由定义 5.4，\\n\\n$$\\\\widetilde d_\\\\alpha(x,y)^{\\\\alpha-n}=\\\\Bigl(2^m\\\\cdot2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota}\\\\Bigr)^{\\\\alpha-n}=2^{m(\\\\alpha-n)}\\\\cdot2^{\\\\iota\\\\sigma}=2^{-m(n-\\\\alpha)}\\\\cdot2^{\\\\iota\\\\sigma}.$$\\n\\n二者相等，故 $K_\\\\alpha\\\\sim\\\\widetilde d_\\\\alpha^{\\\\alpha-n}$。\\n\\n**综合。** 三段都成立，定理 1.3 得证。$\\\\Box$\\n\\n**证明机制总结。** 三段的核心是「括号因子的三种行为」：$U$ 上 $\\\\sim1$（$|x-y|$ 小）；$N$ 上 $\\\\sim1$（$|x|,|y|,|x-y|$ 同阶）；$F$ 上 $\\\\sim2^{-\\\\iota}$（$|x-y|$ 大，括号因子由 $\\\\frac{|x|}{|x-y|}$ 主导）。$\\\\widetilde d_\\\\alpha$ 的三段定义正是为「匹配」这三种行为而设计，使 $K_\\\\alpha\\\\sim\\\\widetilde d_\\\\alpha^{\\\\alpha-n}$ 处处成立。\\n\\n## 6.8 例子与直观解释\\n\\n**例 1（自由拉普拉斯 $a=0$）。** $a=0$ 时 $\\\\sigma=0$，$n-\\\\alpha-2\\\\sigma=n-\\\\alpha\u003e0$（因 $\\\\alpha\u003cn$）恒成立。定义 5.4 中 $F$ 段的 $2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota}=2^0=1$，故 $\\\\widetilde d_\\\\alpha$ 在 $F$ 上也是 $2^{m(x,y)}$，与 $N$ 段一致。此时 $\\\\widetilde d_\\\\alpha$ 退化为「局部 $\\\\delta_{\\\\rm dy}$ + 非局部 $2^{m}$」，且 $K_\\\\alpha\\\\sim|x-y|^{\\\\alpha-n}$（标准 Riesz 核）。这验证了「$\\\\sigma=0$ 时核尺度退化为标准情形」的直觉。\\n\\n**例 2（$\\\\sigma$ 的作用）。** $\\\\sigma\\\\neq0$ 时，$F$ 段的修正因子 $2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota}$ 随层差 $\\\\iota$ 变化：$\\\\sigma\u003e0$ 时随 $\\\\iota$ 递减（远层核更小），$\\\\sigma\u003c0$ 时递增。这反映「反平方势在远层的衰减/增长」，是 $\\\\sigma$ 的几何痕迹。\\n\\n**例 3（$n=3$、$\\\\alpha=1$、$\\\\sigma$ 的条件）。** $n-\\\\alpha-2\\\\sigma=2-2\\\\sigma\u003e0\\\\iff\\\\sigma\u003c1$。故 $\\\\sigma\\\\ge1$ 时定理 1.3 不适用（核估计 (2) 的三段统一失效）。这是「$\\\\alpha$ 与 $\\\\sigma$ 的适用范围」约束。\\n\\n**例 4（$U$ 内的 $\\\\delta_{\\\\rm dy}$）。** $n=3$、$M=5$（$d^*=1/5$），$x=(4,0,0)$、$y=(4.01,0,0)$，$|x-y|_\\\\infty=0.01$。$U$ 条件 $0.01\\\\le c_0\\\\min(4,4.01)=d^*\\\\cdot4/36=4/180\\\\approx0.022$ 成立。引理 5.2 给 $0.01\\\\le\\\\delta_{\\\\rm dy}\\\\le\\\\frac8{1/5}\\\\cdot0.01=0.4$，即 $\\\\delta_{\\\\rm dy}\\\\sim0.01$。\\n\\n## 6.9 理解检查\\n\\n1. 复述核估计 (2)，并解释括号因子的几何含义。\\n2. 定义三层区域 $U/N/F$，并说明 Remark 5.1（三层覆盖 $X\\\\times X$）。\\n3. 定义局部二进尺度 $\\\\delta_{\\\\rm dy}$，并完整证明引理 5.2。\\n4. 写出分段核尺度 $\\\\widetilde d_\\\\alpha$ 的三段定义（定义 5.4）。\\n5. 完整证明定理 1.3 的三段核估计（$U$、$N$、$F$）。\\n6. 说明条件 $n-\\\\alpha-2\\\\sigma\u003e0$ 的作用。\\n7. 解释 $\\\\sigma=0$ 时核尺度的退化行为。\\n\\n## 6.4bis 三层区域的完整几何\\n\\n三层区域 $U/N/F$ 是分段核尺度的骨架，这里把每层的几何图像与「为何这样分」讲透。\\n\\n**局部区域 $U$。** $U$ 是「两点接近」的区域：$|x-y|_\\\\infty\\\\le c_0\\\\min(|x|_\\\\infty,|y|_\\\\infty)$。几何上，对固定 $x$，$U$ 是「以 $x$ 为中心、半径 $c_0|x|_\\\\infty$ 的 $\\\\ell^\\\\infty$ 球」内（含 $y$）。在这个球内，$|y|\\\\sim|x|$（两点到原点的距离同阶），且 $|x-y|\\\\lesssim|x|$（两点距离不超过到原点的距离的常数倍）。核估计 (2) 的括号因子在此为 $\\\\sim1$（因 $|x-y|\\\\lesssim|x|,|y|$ 使 $\\\\frac{|x|}{|x-y|},\\\\frac{|y|}{|x-y|}\\\\gtrsim1$），核退化为标准 Riesz 核。\\n\\n**相邻层非局部 $N$。** $N$ 是「不在 $U$ 内、但层差 $\\\\le n$」的区域。几何上，两点「不接近」（$|x-y|\u003ec_0\\\\min(|x|,|y|)$）但「到原点的距离同阶」（层差 $\\\\le n$ 使 $|x|\\\\sim_n|y|\\\\sim_n2^{m}$）。此时三角不等式与「非局部」合起来给 $|x-y|\\\\sim2^{m}$（§6.7.2），括号因子仍 $\\\\sim1$。\\n\\n**远层 $F$。** $F$ 是「层差 $\\\\ge n+1$」的区域，即两点到原点的距离「差一个 $2^n$ 倍以上」。几何上，一点离原点近、一点远，$|x-y|\\\\sim$ 较远者的到原点距离 $2^{m}$。括号因子由「较近者的 $|x|/|x-y|$」主导，$\\\\sim2^{-\\\\iota}$（$\\\\iota$ 层差），给核带来「远层修正」$2^{\\\\iota\\\\sigma}$。\\n\\n**为什么层差用 $n$ 分界。** $|l(x)-l(y)|\\\\le n$ 与 $|l(x)-l(y)|\\\\ge n+1$ 的分界 $n$ 与「$|x|_\\\\infty\\\\le|x|\\\\le\\\\sqrt n|x|_\\\\infty$」的维数因子 $\\\\sqrt n$ 相关：层差 $\\\\le n$ 时 $|x|$ 与 $|y|$ 的欧氏范数差不超过 $2^n\\\\sqrt n$ 倍，仍在「同阶」范围；层差 $\\\\ge n+1$ 时差超过 $2^{n+1}$ 倍，进入「远层」。$n$ 是「同阶」与「远层」的自然分界。\\n\\n## 6.2bis 核估计 (2) 的尺度分析\\n\\n核估计 (2) 的括号因子有清晰的尺度分析，这里完整推导。\\n\\n**括号因子的三种尺度。** 对 $x\\\\neq y$，考虑比值 $|x|/|x-y|$ 与 $|y|/|x-y|$。\\n\\n- **$|x-y|\\\\ll\\\\min(|x|,|y|)$（局部）**：$\\\\frac{|x|}{|x-y|},\\\\frac{|y|}{|x-y|}\\\\gg1$，$1\\\\wedge\\\\frac{|x|}{|x-y|}\\\\wedge\\\\frac{|y|}{|x-y|}=1$。核 $\\\\sim|x-y|^{\\\\alpha-n}$（标准 Riesz 核，无修正）。\\n\\n- **$|x-y|\\\\sim|x|\\\\sim|y|$（相邻层非局部）**：$\\\\frac{|x|}{|x-y|},\\\\frac{|y|}{|x-y|}\\\\sim1$，括号因子 $\\\\sim1$。核 $\\\\sim|x-y|^{\\\\alpha-n}\\\\sim2^{m(\\\\alpha-n)}$。\\n\\n- **$|x-y|\\\\gg|x|$ 且 $|y|\\\\gg|x|$（远层）**：$\\\\frac{|x|}{|x-y|}\\\\ll1$，$\\\\frac{|y|}{|x-y|}\\\\sim1$，括号因子 $=\\\\frac{|x|}{|x-y|}\\\\sim2^{-\\\\iota}$。核 $\\\\sim|x-y|^{\\\\alpha-n}\\\\cdot2^{\\\\iota\\\\sigma}$。\\n\\n**尺度分析与三层区域的对应。** 这三种尺度恰好对应 $U/N/F$ 三层。核估计 (2) 是「连续」的表述（用 $|x|/|x-y|$ 比值），三层区域是「离散」的表述（用层指标 $l(x),l(y)$）。分段核尺度 $\\\\widetilde d_\\\\alpha$ 把「连续的三段」离散化为「三段的 $\\\\widetilde d_\\\\alpha$」，使 $K_\\\\alpha\\\\sim\\\\widetilde d_\\\\alpha^{\\\\alpha-n}$。\\n\\n## 6.5bis 局部二进尺度 $\\\\delta_{\\\\rm dy}$ 的更多性质\\n\\n**$\\\\delta_{\\\\rm dy}$ 与 $D_{\\\\rm adj}$ 的关系。** $\\\\delta_{\\\\rm dy}(x,y)$ 是「$n+1$ 个系统的并 $D_{\\\\rm adj}$ 中含 $x,y$ 的最小格边长」。因 $D_{\\\\rm adj}$ 是 $n+1$ 个系统的并，$\\\\delta_{\\\\rm dy}$ 能「共享」$n+1$ 个系统的覆盖能力——这是第 5 章相邻覆盖的直接产物。\\n\\n**$\\\\delta_{\\\\rm dy}=+\\\\infty$ 的情形。** 若 $x,y$ 相距太远（相对到原点的距离），无单一系统立方体同时含两点，$\\\\delta_{\\\\rm dy}=+\\\\infty$。这发生在 $U$ 外（$N$ 或 $F$），因为 $U$ 内引理 5.2 保证 $\\\\delta_{\\\\rm dy}\u003c+\\\\infty$。因此 $\\\\delta_{\\\\rm dy}$ 只在 $U$ 上有意义，故 $\\\\widetilde d_\\\\alpha$ 在 $N/F$ 用 $2^{m}$（而非 $\\\\delta_{\\\\rm dy}$）。\\n\\n**$\\\\delta_{\\\\rm dy}$ 是「局部度量」。** 在 $U$ 上，$\\\\delta_{\\\\rm dy}\\\\sim|x-y|$，故 $\\\\delta_{\\\\rm dy}$ 在 $U$ 上是「与欧氏距离等价的局部度量」。但它不满足全局拟三角不等式（$U$ 外无定义/为 $+\\\\infty$），故不是全局度量。这是第 7 章「$\\\\widetilde d_\\\\alpha$ 非拟度量」的伏笔。\\n\\n## 6.7bis 三段证明的详细推导（逐字版）\\n\\n§6.7 的三段证明这里逐字重写，补全每一处不等式的依据。\\n\\n**Case 1（$U$）逐字版。** $(x,y)\\\\in U$：$|x-y|_\\\\infty\\\\le c_0\\\\min(|x|_\\\\infty,|y|_\\\\infty)$。因 $|x-y|\\\\le\\\\sqrt n|x-y|_\\\\infty$ 且 $|x|_\\\\infty\\\\le|x|$：\\n\\n$$|x-y|\\\\le\\\\sqrt n\\\\, c_0|x|_\\\\infty\\\\le\\\\sqrt n\\\\, c_0|x|.$$\\n\\n取 $c_0=d^*/36$ 足够小，$|x-y|\\\\le\\\\frac12|x|$（对充分大的隐含常数调整），故 $\\\\frac{|x|}{|x-y|}\\\\ge2$，同理 $\\\\frac{|y|}{|x-y|}\\\\ge2$。于是 $1\\\\wedge\\\\frac{|x|}{|x-y|}\\\\wedge\\\\frac{|y|}{|x-y|}=1$。核估计 (2) 给 $K_\\\\alpha\\\\sim|x-y|^{\\\\alpha-n}$。引理 5.2 给 $|x-y|\\\\sim\\\\delta_{\\\\rm dy}$，故 $K_\\\\alpha\\\\sim\\\\delta_{\\\\rm dy}^{\\\\alpha-n}=\\\\widetilde d_\\\\alpha^{\\\\alpha-n}$。\\n\\n**Case 2（$N$）逐字版。** $(x,y)\\\\in N$：$|l(x)-l(y)|\\\\le n$，故 $2^{l(x)}\\\\sim_n2^{l(y)}\\\\sim_n2^{m}$，即 $|x|_\\\\infty\\\\sim_n|y|_\\\\infty\\\\sim_n2^{m}$。非局部：$|x-y|_\\\\infty\u003ec_0\\\\min(|x|_\\\\infty,|y|_\\\\infty)\\\\sim2^{m}$。三角不等式：$|x-y|_\\\\infty\\\\le|x|_\\\\infty+|y|_\\\\infty\\\\lesssim2^{m}$。合得 $|x-y|_\\\\infty\\\\sim2^{m}$。欧氏范数等价：$|x-y|\\\\sim_n|x-y|_\\\\infty\\\\sim_n2^{m}$。此时 $|x|\\\\sim|y|\\\\sim|x-y|$，括号因子 $\\\\sim1$。核 $K_\\\\alpha\\\\sim|x-y|^{\\\\alpha-n}\\\\sim2^{m(\\\\alpha-n)}=\\\\widetilde d_\\\\alpha^{\\\\alpha-n}$。\\n\\n**Case 3（$F$）逐字版。** $\\\\iota\\\\ge n+1$，$m=m(x,y)$，$l(y)=m\u003el(x)=m-\\\\iota$。层定义：$2^{l(x)-1}\\\\le|x|_\\\\infty\u003c2^{l(x)}=2^{m-\\\\iota}$，$2^{m-1}\\\\le|y|_\\\\infty\u003c2^m$。故 $|y|_\\\\infty\\\\sim2^m$、$|x|_\\\\infty\\\\sim2^{m-\\\\iota}$。距离：$|x-y|_\\\\infty\\\\ge|y|_\\\\infty-|x|_\\\\infty\\\\ge2^{m-1}-2^{m-\\\\iota}\\\\ge2^{m-1}-2^{m-2}=2^{m-2}$（$\\\\iota\\\\ge2$），且 $|x-y|_\\\\infty\\\\le|y|_\\\\infty+|x|_\\\\infty\\\\le2^m+2^{m-\\\\iota}\\\\le2^m+2^{m-2}$。合得 $|x-y|_\\\\infty\\\\sim2^m$，欧氏 $|x-y|\\\\sim_n2^m$。括号因子：$1\\\\wedge\\\\frac{|x|}{|x-y|}\\\\wedge\\\\frac{|y|}{|x-y|}=\\\\frac{|x|}{|x-y|}$（因 $|x|\\\\ll|x-y|\\\\sim|y|$），$\\\\sim\\\\frac{2^{m-\\\\iota}}{2^m}=2^{-\\\\iota}$。核 $K_\\\\alpha\\\\sim(2^m)^{\\\\alpha-n}(2^{-\\\\iota})^{-\\\\sigma}=2^{-m(n-\\\\alpha)}2^{\\\\iota\\\\sigma}$。而 $\\\\widetilde d_\\\\alpha^{\\\\alpha-n}=(2^m\\\\cdot2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota})^{\\\\alpha-n}=2^{m(\\\\alpha-n)}2^{\\\\iota\\\\sigma}=2^{-m(n-\\\\alpha)}2^{\\\\iota\\\\sigma}$。相等。$\\\\Box$\\n\\n## 6.8bis 更多例子\\n\\n**例 5（$N$ 段的数值）。** $n=3$、$\\\\alpha=1$、$\\\\sigma=1/2$、$d^*=1/5$。取 $x=(4,0,0)$（$l(x)=2$，$|x|_\\\\infty=4\\\\in[2,4)$？$2^{2-1}=2\\\\le4\u003c2^2=4$，故 $l(x)=3$，重新取 $|x|_\\\\infty=3\\\\in[2,4)$，$l(x)=2$）、$y=(3,0,0)$（$|y|_\\\\infty=3$，$l(y)=2$）。层差 $|l(x)-l(y)|=0\\\\le n=3$，属 $N$（若 $(x,y)\\\\notin U$）。$m=2$，$2^m=4$。$N$ 段 $\\\\widetilde d_\\\\alpha=2^m=4$，$K_\\\\alpha\\\\sim4^{\\\\alpha-n}=4^{-2}=1/16$（$n-\\\\alpha=2$）。\\n\\n**例 6（$F$ 段的数值）。** $x=(1,0,0)$（$l(x)=0$，$|x|_\\\\infty=1\\\\in[1,2)$？$2^{0-1}=1/2\\\\le1\u003c2^0=1$，故 $l(x)=1$）、$y=(8,0,0)$（$|y|_\\\\infty=8$，$2^{3-1}=4\\\\le8\u003c8$，$l(y)=4$）。层差 $\\\\iota=|1-4|=3\\\\ge n+1=4$？$n=3$ 时 $n+1=4$，$\\\\iota=3\u003c4$，不属 $F$。取 $y=(16,0,0)$（$l(y)=5$，$2^{4-1}=8\\\\le16\u003c16$，$l(y)=5$），$\\\\iota=4\\\\ge4$，属 $F$。$m=5$，$2^m=32$。$\\\\widetilde d_\\\\alpha=32\\\\cdot2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\cdot4}$。\\n\\n**例 7（$\\\\sigma$ 的符号对 $F$ 段的影响）。** $\\\\sigma\u003e0$：$2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota}\u003c1$，$\\\\widetilde d_\\\\alpha\u003c2^m$（远层尺度更小，核更集中）；$\\\\sigma\u003c0$：$2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota}\u003e1$，$\\\\widetilde d_\\\\alpha\u003e2^m$（远层尺度更大）。这对应「斥势（$\\\\sigma\u003c0$，$a$ 大）使核在远层更强」的物理直觉。\\n\\n**例 8（$n-\\\\alpha-2\\\\sigma\u003e0$ 的边界）。** $n=3$、$\\\\alpha=1$，条件 $2-2\\\\sigma\u003e0\\\\iff\\\\sigma\u003c1$。$\\\\sigma=1$ 时（$a$ 使 $\\\\sigma=1$），条件恰失效，定理 1.3 的三段统一不再保证。这个边界是「核尺度方法」的适用范围。\\n\\n## 6.9bis 习题与思考题\\n\\n**习题 1（层指标）。** 对 $n=3$，计算 $x=(3,0,0)$、$y=(5,0,0)$ 的层指标 $l(x),l(y)$ 与 $m(x,y)$。提示：$3\\\\in[2,4)$ 故 $l(x)=2$；$5\\\\in[4,8)$ 故 $l(y)=3$；$m=3$。\\n\\n**习题 2（三层判定）。** 判定 $(x,y)$（$x=(3,0,0)$、$y=(5,0,0)$，$n=3$、$d^*=1/5$）属于 $U/N/F$ 哪层。提示：$|x-y|_\\\\infty=2$，$c_0\\\\min(|x|_\\\\infty,|y|_\\\\infty)=(1/180)\\\\cdot3=1/60\\\\approx0.017$，$2\u003e0.017$ 不在 $U$；$|l(x)-l(y)|=1\\\\le3$，属 $N$。\\n\\n**习题 3（$F$ 段核）。** 对 $n=3$、$\\\\alpha=1$、$\\\\sigma=1/2$，计算 $x=(1,0,0)$、$y=(16,0,0)$ 的 $\\\\widetilde d_\\\\alpha$。提示：$\\\\iota=4$、$m=5$，$\\\\widetilde d_\\\\alpha=32\\\\cdot2^{-\\\\frac{1/2}{2}\\\\cdot4}=32\\\\cdot2^{-1}=16$。\\n\\n**习题 4（引理 5.2）。** 独立证明引理 5.2 的上界 $\\\\delta_{\\\\rm dy}\\\\le\\\\frac8{d^*}|x-y|_\\\\infty$。\\n\\n**思考题 1。** 为什么 $N$ 段用 $2^{m(x,y)}$ 而非 $\\\\delta_{\\\\rm dy}$？（提示：$N$ 上 $\\\\delta_{\\\\rm dy}$ 可能为 $+\\\\infty$。）\\n\\n**思考题 2。** $F$ 段的修正指数 $\\\\frac{\\\\sigma}{n-\\\\alpha}$ 从何而来？（提示：让 $\\\\widetilde d_\\\\alpha^{\\\\alpha-n}=2^{m(\\\\alpha-n)}2^{\\\\iota\\\\sigma}$ 匹配核 $2^{-m(n-\\\\alpha)}2^{\\\\iota\\\\sigma}$。）\\n\\n**思考题 3。** 若 $\\\\sigma=0$，$\\\\widetilde d_\\\\alpha$ 在 $F$ 段退化为 $2^m$，与 $N$ 段一致。此时 $\\\\widetilde d_\\\\alpha$ 是否成为拟度量？（第 7 章将回答：$\\\\sigma=0$ 时 $\\\\widetilde d_\\\\alpha=|x-y|$ 是度量。）\\n\\n## 6.10bis 文献注记与 FAQ\\n\\n**文献注记。** Riesz 位势 $L_a^{-\\\\alpha/2}$ 与核估计 (2) 来自 [4,3]（反平方势的 Sobolev 空间与核估计）。三层区域与分段核尺度是本文的新构造（定义 5.4）。核尺度（kernel scale）的概念在度量几何与调和分析中有广泛使用，本文的 $\\\\widetilde d_\\\\alpha$ 是「分段」的核尺度，非度量。\\n\\n**FAQ。**\\n\\n- **问 1：$\\\\widetilde d_\\\\alpha$ 为什么是「核尺度」而非「度量」？** 答：它满足 $K_\\\\alpha\\\\sim\\\\widetilde d_\\\\alpha^{\\\\alpha-n}$（核估计的尺度），但不满足拟三角不等式（第 7 章）。「核尺度」强调「刻画核衰减的二元函数」，「度量」要求拟三角不等式。\\n\\n- **问 2：$n-\\\\alpha-2\\\\sigma\u003e0$ 的作用？** 答：它保证 $F$ 段 $|x-y|\\\\sim2^m$ 与括号因子 $\\\\sim2^{-\\\\iota}$ 的推导成立（$\\\\iota\\\\ge2$ 时 $2^{m-\\\\iota}\\\\le2^{m-2}$）。若 $\\\\sigma$ 太大，核在远层的衰减/增长失控，三段统一失效。\\n\\n- **问 3：$\\\\delta_{\\\\rm dy}$ 与 $\\\\widetilde d_\\\\alpha$ 的关系？** 答：$\\\\widetilde d_\\\\alpha$ 在 $U$ 上取 $\\\\delta_{\\\\rm dy}$，在 $N/F$ 取 $2^m$（或其修正）。$\\\\delta_{\\\\rm dy}$ 是「局部二进尺度」，$\\\\widetilde d_\\\\alpha$ 是「全局分段核尺度」。\\n\\n- **问 4：本章与第 7 章的分工？** 答：本章「定义并证明」核尺度统一核估计（定理 1.3）；第 7 章「证明」核尺度非拟度量（命题 1.4）。\\n\\n## 6.11 Riesz 位势的谱理论背景\\n\\n本章的 $K_\\\\alpha$ 来自 Riesz 位势 $L_a^{-\\\\alpha/2}$，这里补足其谱理论背景，帮助读者理解「核」从何而来。\\n\\n**函数演算。** $L_a$ 是自伴非负算子（第 1 章），由谱定理可定义 $L_a$ 的 Borel 函数演算。对 $\\\\alpha\u003e0$，$L_a^{-\\\\alpha/2}=\\\\int_0^\\\\infty\\\\lambda^{-\\\\alpha/2}\\\\,dE_{L_a}(\\\\lambda)$（$E_{L_a}$ 是谱测度）。这是「Riesz 位势」的定义。\\n\\n**积分核。** $L_a^{-\\\\alpha/2}$ 作为 $L^2$ 上的自伴算子，其 Schwartz 核 $K_\\\\alpha(x,y)$ 满足 $\\\\langle L_a^{-\\\\alpha/2}f,g\\\\rangle=\\\\iint K_\\\\alpha(x,y)f(y)\\\\overline{g(x)}\\\\,dx\\\\,dy$。$K_\\\\alpha$ 的存在性与逐点估计正是核估计 (2) 的内容。\\n\\n**自由情形的对照。** $a=0$（$L_0=-\\\\Delta$）时，$(-\\\\Delta)^{-\\\\alpha/2}$ 的核是 $c_{n,\\\\alpha}|x-y|^{\\\\alpha-n}$（标准 Riesz 核），由 Fourier 变换 $|\\\\xi|^{-\\\\alpha}$ 的逆变换给出。反平方势 $a\\\\neq0$ 时，核有修正，核估计 (2) 刻画了修正的「括号因子」。\\n\\n**为什么关心核。** 核估计 $K_\\\\alpha\\\\sim\\\\widetilde d_\\\\alpha^{\\\\alpha-n}$ 是许多定量估计的基础：加权范数、稀疏支配、端点估计等都要从「核的逐点大小」出发。本章把核估计「几何化」为核尺度 $\\\\widetilde d_\\\\alpha$，使后续估计能「像欧氏距离一样」处理。\\n\\n## 6.12 三层区域与层指标的更详细讨论\\n\\n**层指标 $l(x)$ 的精确性。** $l(x)$ 是「$|x|_\\\\infty$ 的二进制对数下取整」：$l(x)=\\\\lfloor\\\\log_2|x|_\\\\infty\\\\rfloor+1$（当 $|x|_\\\\infty$ 恰为 $2$ 的幂时取该幂对应的层）。更精确地，$x\\\\in L_l\\\\iff 2^{l-1}\\\\le|x|_\\\\infty\u003c2^l$。故 $l(x)$ 是「$|x|_\\\\infty$ 所在二进层」。\\n\\n**层差 $|l(x)-l(y)|$ 的意义。** $|l(x)-l(y)|=k$ 表示「$|x|_\\\\infty$ 与 $|y|_\\\\infty$ 相差 $2^k$ 倍左右」。$|l(x)-l(y)|\\\\le n$ 表示「相差不超过 $2^n$ 倍」（同阶），$|l(x)-l(y)|\\\\ge n+1$ 表示「相差超过 $2^{n+1}$ 倍」（远层）。\\n\\n**为什么 $n$ 是分界。** $n$ 与「$|x|_\\\\infty$ 与 $|x|$ 的等价常数 $\\\\sqrt n$」相关：$|x|_\\\\infty\\\\le|x|\\\\le\\\\sqrt n|x|_\\\\infty$。当层差 $\\\\le n$ 时，$|x|$ 与 $|y|$ 的欧氏范数差 $\\\\le2^n\\\\sqrt n$ 倍（同阶）；层差 $\\\\ge n+1$ 时差 $\\\\ge2^{n+1}$ 倍（远层）。$n$ 是「同阶」与「远层」的临界。\\n\\n**$m(x,y)$ 的作用。** $m(x,y)=\\\\max\\\\{l(x),l(y)\\\\}$ 是「较远者的层」，$2^{m}$ 是「较远者的到原点距离量级」。在 $N/F$ 段，$\\\\widetilde d_\\\\alpha$ 用 $2^m$ 作为「尺度基准」，因为 $|x-y|\\\\sim2^m$（$N$ 段 §6.7.2、$F$ 段 §6.7.3）。\\n\\n## 6.13 分段核尺度的更多性质\\n\\n**$\\\\widetilde d_\\\\alpha$ 的对称性。** $\\\\widetilde d_\\\\alpha(x,y)=\\\\widetilde d_\\\\alpha(y,x)$：三层区域 $U/N/F$ 对称（$|x-y|$、$|l(x)-l(y)|$ 都对称），$\\\\delta_{\\\\rm dy}$ 对称，$m(x,y)$ 对称，故 $\\\\widetilde d_\\\\alpha$ 对称。\\n\\n**$\\\\widetilde d_\\\\alpha$ 的正性与自反。** $\\\\widetilde d_\\\\alpha(x,x)=0$（定义），$\\\\widetilde d_\\\\alpha(x,y)\u003e0$（$x\\\\neq y$ 时三段都 $\u003e0$）。但**不满足拟三角不等式**（第 7 章），故非拟度量。\\n\\n**$\\\\widetilde d_\\\\alpha$ 的连续性（分层）。** $\\\\widetilde d_\\\\alpha$ 在三层内分别是 $\\\\delta_{\\\\rm dy}$（$U$）、$2^m$（$N$）、$2^m2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota}$（$F$），都是「层指标 $l(x),l(y)$ 的函数 + 局部 $\\\\delta_{\\\\rm dy}$」，是「分段连续」的（每层内连续，层边界可能不连续）。这种「分段」结构是「核尺度非度量」的来源之一。\\n\\n**$\\\\widetilde d_\\\\alpha$ 与 $|x-y|$ 的关系。** $U$ 上 $\\\\widetilde d_\\\\alpha\\\\sim|x-y|$（引理 5.2）；$N/F$ 上 $\\\\widetilde d_\\\\alpha\\\\sim2^m\\\\sim|x-y|$（§6.7.2、§6.7.3 的 $|x-y|\\\\sim2^m$）。故**处处 $\\\\widetilde d_\\\\alpha\\\\sim|x-y|$**？不完全是——$F$ 段 $\\\\widetilde d_\\\\alpha=2^m2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota}$，而 $|x-y|\\\\sim2^m$，故 $\\\\widetilde d_\\\\alpha/|x-y|\\\\sim2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota}$，随 $\\\\iota$ 变化。因此 $\\\\widetilde d_\\\\alpha$ 与 $|x-y|$ **不处处等价**（$F$ 段有修正）。这正是「核尺度非度量」的根源。\\n\\n## 6.14 与标准 Riesz 核的对比\\n\\n**标准 Riesz 核。** $(-\\\\Delta)^{-\\\\alpha/2}$ 的核 $c|x-y|^{\\\\alpha-n}$ 是「纯距离」的幂，对应核尺度 $|x-y|$（度量）。\\n\\n**反平方势的核。** $K_\\\\alpha\\\\sim|x-y|^{\\\\alpha-n}\\\\cdot(\\\\text{括号因子})^{-\\\\sigma}$，括号因子在 $F$ 段 $\\\\sim2^{-\\\\iota}$，故核 $\\\\sim2^{-m(n-\\\\alpha)}2^{\\\\iota\\\\sigma}$。核尺度 $\\\\widetilde d_\\\\alpha$ 在 $F$ 段 $=2^m2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota}$，与 $|x-y|\\\\sim2^m$ 差一个 $2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota}$ 因子。\\n\\n**对比总结。** 标准情形「核 $\\\\sim$ 距离的幂，尺度是距离（度量）」；反平方势「核 $\\\\sim$ 核尺度的幂，核尺度在远层偏离距离（非度量）」。这个「偏离」由 $\\\\sigma\\\\neq0$ 造成，是第 7 章命题 1.4 的核心。\\n\\n## 6.15 一个完整的数值算例：三段核估计\\n\\n以 $n=3$、$\\\\alpha=1$、$\\\\sigma=1/2$、$d^*=1/5$ 为例，走一遍三段核估计。\\n\\n**设定。** $q=n-\\\\alpha=2$，条件 $q-2\\\\sigma=2-1=1\u003e0$ 满足。$c_0=d^*/36=1/180$。\\n\\n**$U$ 段。** $x=(4,0,0)$（$l(x)=3$，$|x|_\\\\infty=4\\\\in[4,8)$？$2^{3-1}=4\\\\le4\u003c8$，$l(x)=3$）、$y=(4.01,0,0)$。$|x-y|_\\\\infty=0.01\\\\le c_0\\\\cdot4=4/180\\\\approx0.022$，属 $U$。$\\\\delta_{\\\\rm dy}\\\\sim0.01$，$K_\\\\alpha\\\\sim0.01^{\\\\alpha-n}=0.01^{-2}=10^4$。$\\\\widetilde d_\\\\alpha=\\\\delta_{\\\\rm dy}\\\\sim0.01$，$\\\\widetilde d_\\\\alpha^{\\\\alpha-n}\\\\sim10^4$。$\\\\checkmark$\\n\\n**$N$ 段。** $x=(4,0,0)$、$y=(3,0,0)$。$|x-y|_\\\\infty=1\u003e0.022$ 不在 $U$；$|l(x)-l(y)|=0\\\\le3$，属 $N$。$m=3$，$2^m=8$。$K_\\\\alpha\\\\sim8^{-2}=1/64$。$\\\\widetilde d_\\\\alpha=8$，$\\\\widetilde d_\\\\alpha^{-2}=1/64$。$\\\\checkmark$\\n\\n**$F$ 段。** $x=(1,0,0)$（$l(x)=1$）、$y=(16,0,0)$（$l(y)=5$）。$\\\\iota=4\\\\ge4$，属 $F$。$m=5$，$2^m=32$。$\\\\widetilde d_\\\\alpha=32\\\\cdot2^{-\\\\frac{1/2}{2}\\\\cdot4}=32\\\\cdot2^{-1}=16$。$\\\\widetilde d_\\\\alpha^{\\\\alpha-n}=16^{-2}=1/256$。核 $K_\\\\alpha\\\\sim2^{-m(n-\\\\alpha)}2^{\\\\iota\\\\sigma}=32^{-2}\\\\cdot2^{4\\\\cdot(1/2)}=2^{-10}\\\\cdot2^2=2^{-8}=1/256$。$\\\\checkmark$\\n\\n**端到端总结。** 三段都验证 $K_\\\\alpha\\\\sim\\\\widetilde d_\\\\alpha^{\\\\alpha-n}$，数值一致。这个算例把「三层区域 → $\\\\widetilde d_\\\\alpha$ → 核估计」完整走了一遍。\\n\\n## 6.16 补充习题与详细解答\\n\\n**习题 5（层指标计算）。** 对 $n=3$，计算 $x=(1,0,0)$、$y=(2,0,0)$、$z=(4,0,0)$ 的层指标。答案：$l(x)=1$（$1\\\\in[1,2)$）、$l(y)=2$（$2\\\\in[2,4)$）、$l(z)=3$（$4\\\\in[4,8)$）。\\n\\n**习题 6（$\\\\widetilde d_\\\\alpha$ 对称性）。** 验证 $\\\\widetilde d_\\\\alpha(x,y)=\\\\widetilde d_\\\\alpha(y,x)$。\\n\\n**习题 7（$F$ 段核）。** 对 $n=3$、$\\\\alpha=1$、$\\\\sigma=1/2$，计算 $x=(1,0,0)$、$y=(32,0,0)$ 的 $\\\\widetilde d_\\\\alpha$ 与 $K_\\\\alpha$。提示：$\\\\iota=5$、$m=6$，$\\\\widetilde d_\\\\alpha=64\\\\cdot2^{-5/4}=64/2^{5/4}$，$K_\\\\alpha\\\\sim2^{-12}2^{5/2}=2^{-9.5}$。\\n\\n**习题 8（三层判定）。** 判定 $x=(2,0,0)$、$y=(2,2,0)$（$n=3$）属于哪层。提示：$|x-y|_\\\\infty=2$，$|x|_\\\\infty=|y|_\\\\infty=2$，$c_0\\\\min=2/180$，$2\u003e2/180$ 不在 $U$；$l(x)=l(y)=2$，层差 $0$，属 $N$。\\n\\n**思考题 4。** 证明 $\\\\widetilde d_\\\\alpha$ 在 $N$ 段与 $F$ 段的边界（$|l(x)-l(y)|=n+1$）不连续（作为 $\\\\iota$ 的函数），说明「分段」带来的不连续性。\\n\\n**思考题 5。** 若把 $F$ 段的修正指数 $\\\\frac{\\\\sigma}{n-\\\\alpha}$ 改为别的值，核估计 $K_\\\\alpha\\\\sim\\\\widetilde d_\\\\alpha^{\\\\alpha-n}$ 是否仍成立？（提示：修正指数必须使 $\\\\widetilde d_\\\\alpha^{\\\\alpha-n}$ 的 $\\\\iota$ 指数等于 $\\\\sigma$，即 $(\\\\alpha-n)\\\\cdot(-\\\\frac{\\\\sigma}{n-\\\\alpha})=\\\\sigma$，故 $\\\\frac{\\\\sigma}{n-\\\\alpha}$ 是唯一正确值。）\\n\\n## 6.17 本章技术总结与全文定位\\n\\n**技术总结。** 本章的核心是「把核估计几何化」：定义三层区域 $U/N/F$ 与局部二进尺度 $\\\\delta_{\\\\rm dy}$（引理 5.2），构造分段核尺度 $\\\\widetilde d_\\\\alpha$（定义 5.4），证明核估计 $K_\\\\alpha\\\\sim\\\\widetilde d_\\\\alpha^{\\\\alpha-n}$（定理 1.3）。三段核估计的本质是「括号因子的三种行为」与「$\\\\widetilde d_\\\\alpha$ 的三段定义」的匹配。\\n\\n**全文定位。** 本章是「分析」的高潮：前五章建立的几何（$d^*$、$n+1$ 系统、相邻覆盖）在本章「转化为」核估计。定理 1.3 把反平方势的 Riesz 位势核「统一」为一个核尺度 $\\\\widetilde d_\\\\alpha$ 的幂。\\n\\n**与下一章的接口。** 第 7 章将证明 $\\\\widetilde d_\\\\alpha$ 非拟度量（命题 1.4）：$\\\\sigma\\\\neq0$ 时无等价全局拟度量。本章的 $\\\\widetilde d_\\\\alpha$ 在 $F$ 段的修正 $2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota}$ 是第 7 章反例（$\\\\sigma\u003e0$ 与 $\\\\sigma\u003c0$ 两种）的对象。\\n\\n## 6.18 常见疑问解答（FAQ 续）\\n\\n**问 5：$\\\\widetilde d_\\\\alpha$ 与 $|x-y|$ 处处等价吗？** 答：$U$、$N$ 段等价（$\\\\sim|x-y|$），$F$ 段不等价（差 $2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota}$ 因子）。故「不处处等价」，这是非拟度量的根源。\\n\\n**问 6：$F$ 段为什么不用 $\\\\delta_{\\\\rm dy}$？** 答：$F$ 段两点相距远（层差 $\\\\ge n+1$），无单一系统立方体含两点，$\\\\delta_{\\\\rm dy}=+\\\\infty$。故 $F$ 段用 $2^m$（含修正）。\\n\\n**问 7：$n-\\\\alpha-2\\\\sigma\u003e0$ 的几何意义？** 答：它保证 $F$ 段「$|x-y|\\\\sim2^m$」成立（$2^{m-\\\\iota}\\\\le2^{m-2}$ 需 $\\\\iota\\\\ge2$，而 $\\\\iota\\\\ge n+1\\\\ge4$ 已保证；条件 $q-2\\\\sigma\u003e0$ 实际是「核估计 (2) 适用」的原文条件，与 $F$ 段的指数计算相关）。\\n\\n**问 8：本章与第 7 章的关系？** 答：本章「定义并证明」$\\\\widetilde d_\\\\alpha$ 统一核估计；第 7 章「证明」$\\\\widetilde d_\\\\alpha$ 非拟度量，澄清「核尺度 vs 度量」的几何障碍。\\n\\n## 6.19 本章符号表\\n\\n- $K_\\\\alpha(x,y)$：Riesz 位势 $L_a^{-\\\\alpha/2}$ 的积分核；\\n- $\\\\alpha$：Riesz 位势指数（$0\u003c\\\\alpha\u003cn$）；\\n- $q:=n-\\\\alpha$；\\n- $\\\\sigma$：参数（第 1 章式 (1)）；\\n- $l(x)$：$x$ 的层指标（$2^{l(x)-1}\\\\le|x|_\\\\infty\u003c2^{l(x)}$）；\\n- $m(x,y):=\\\\max\\\\{l(x),l(y)\\\\}$；\\n- $\\\\iota:=|l(x)-l(y)|$（层差）；\\n- $c_0:=d^*/36$；\\n- $U$：局部区域；$N$：相邻层非局部；$F$：远层；\\n- $\\\\delta_{\\\\rm dy}(x,y)$：局部二进尺度；\\n- $D_{\\\\rm adj}:=\\\\bigcup_{i=0}^nD_{V,(i)}$；\\n- $\\\\widetilde d_\\\\alpha(x,y)$：分段核尺度（定义 5.4）。\\n\\n## 6.20 更多反例与边界情形\\n\\n**反例 1（$\\\\sigma\\\\ge(n-\\\\alpha)/2$ 时定理失效）。** $n-\\\\alpha-2\\\\sigma\u003e0\\\\iff\\\\sigma\u003c(n-\\\\alpha)/2$。当 $\\\\sigma\\\\ge(n-\\\\alpha)/2$ 时，定理 1.3 不适用，核估计 (2) 的三段统一不再保证。例如 $n=3$、$\\\\alpha=1$（$(n-\\\\alpha)/2=1$），$\\\\sigma=1$ 时失效。\\n\\n**反例 2（$\\\\delta_{\\\\rm dy}=+\\\\infty$）。** $x=(1,0,0)$、$y=(16,0,0)$（$n=3$、$d^*=1/5$）。层差 $\\\\iota=4\\\\ge4$，$(x,y)\\\\in F$，$\\\\delta_{\\\\rm dy}(x,y)=+\\\\infty$（无单一系统立方体含相距 $16$ 的两点）。故 $F$ 段不能用 $\\\\delta_{\\\\rm dy}$，只能用 $2^m$。\\n\\n**反例 3（$U$ 边界）。** $(x,y)$ 恰使 $|x-y|_\\\\infty=c_0\\\\min(|x|_\\\\infty,|y|_\\\\infty)$ 时，$(x,y)\\\\in U$（条件含等号），引理 5.2 仍成立。但 $|x-y|$ 稍大就落入 $N$，$\\\\delta_{\\\\rm dy}$ 可能为 $+\\\\infty$。这展示了 $U$ 与 $N$ 的「悬崖」边界。\\n\\n**反例 4（$\\\\widetilde d_\\\\alpha$ 非连续的层边界）。** $|l(x)-l(y)|$ 从 $n$ 跳到 $n+1$ 时，$(x,y)$ 从 $N$ 跳到 $F$，$\\\\widetilde d_\\\\alpha$ 从 $2^m$ 跳到 $2^m2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}(n+1)}$，有跳跃（$\\\\sigma\\\\neq0$ 时）。这个不连续是「分段核尺度非度量」的来源之一（第 7 章）。\\n\\n## 6.21 从核尺度到核估计：一个「字典」\\n\\n本章建立了「几何与核」的字典，这里汇总。\\n\\n| 几何量 | 核/分析量 |\\n|---|---|\\n| 层指标 $l(x)$ | 到原点的距离量级 $|x|_\\\\infty\\\\sim2^{l(x)}$ |\\n| 层差 $\\\\iota$ | 两点到原点距离的比 $2^\\\\iota$ |\\n| 局部二进尺度 $\\\\delta_{\\\\rm dy}$ | 局部欧氏距离 $|x-y|$（引理 5.2） |\\n| 分段核尺度 $\\\\widetilde d_\\\\alpha$ | 核的尺度 $K_\\\\alpha\\\\sim\\\\widetilde d_\\\\alpha^{\\\\alpha-n}$ |\\n| $d^*$ | 覆盖常数 $\\\\frac4{d^*}$、局部范围 $\\\\frac{d^*}{36}$ |\\n| $\\\\sigma$ | 远层修正指数 $2^{\\\\iota\\\\sigma}$ |\\n\\n（此表以列表形式在 TeX 中呈现。）\\n\\n**字典的用途。** 有了这个字典，后续的加权估计、稀疏支配可以把「几何量」直接翻译成「核估计」，反之亦然。这是「几何方法处理奇异算子」的核心思想。\\n\\n## 6.22 综合回顾与自测清单（最终版）\\n\\n进入第 7 章前，请确认能回答以下问题：\\n\\n1. 复述核估计 (2)，解释括号因子的几何含义与三种尺度行为。\\n2. 定义三层区域 $U/N/F$ 与层指标 $l(x)$，说明 Remark 5.1（三层覆盖）。\\n3. 定义局部二进尺度 $\\\\delta_{\\\\rm dy}$，完整证明引理 5.2。\\n4. 写出分段核尺度 $\\\\widetilde d_\\\\alpha$ 的三段定义（定义 5.4），说明每段的几何含义。\\n5. 完整证明定理 1.3 的三段核估计（$U$、$N$、$F$），逐字核对 $F$ 段的指数计算。\\n6. 说明条件 $n-\\\\alpha-2\\\\sigma\u003e0$ 的作用，以及 $\\\\sigma=0$ 的退化行为。\\n7. 说明 $\\\\widetilde d_\\\\alpha$ 在 $F$ 段为何偏离 $|x-y|$（修正因子 $2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota}$），这是第 7 章非拟度量的伏笔。\\n\\n若以上 7 条都能独立回答，即可进入第 7 章。\\n\\n## 6.23 常见疑问解答（FAQ 续二）\\n\\n**问 9：$K_\\\\alpha$ 的「$\\\\sim$」常数依赖什么？** 答：依赖 $n,\\\\alpha,a,d^*$。$d^*$ 通过引理 5.2（$\\\\delta_{\\\\rm dy}\\\\sim|x-y|$ 的常数 $\\\\frac8{d^*}$）进入；$a$（即 $\\\\sigma$）通过核估计 (2) 的括号因子进入。\\n\\n**问 10：$\\\\widetilde d_\\\\alpha$ 是连续的吗？** 答：分层连续（$U/N/F$ 各自连续），层边界不连续（$\\\\sigma\\\\neq0$ 时 $N\\\\to F$ 有跳跃）。§6.20 反例 4。\\n\\n**问 11：为什么 $F$ 段的修正指数是 $\\\\frac{\\\\sigma}{n-\\\\alpha}$？** 答：使 $\\\\widetilde d_\\\\alpha^{\\\\alpha-n}=2^{m(\\\\alpha-n)}2^{\\\\iota\\\\sigma}$ 匹配核 $2^{-m(n-\\\\alpha)}2^{\\\\iota\\\\sigma}$。$(\\\\alpha-n)\\\\cdot(-\\\\frac{\\\\sigma}{n-\\\\alpha})=\\\\sigma$，唯一正确。\\n\\n**问 12：本章是全文的「终点」吗？** 答：不是。第 7 章还要证明 $\\\\widetilde d_\\\\alpha$ 非拟度量（命题 1.4），澄清「核尺度 vs 度量」的几何障碍，这是全文的收尾。\\n\\n## 6.24 Riesz 位势的应用前景（概述）\\n\\n本章的核估计 $K_\\\\alpha\\\\sim\\\\widetilde d_\\\\alpha^{\\\\alpha-n}$ 是许多定量估计的起点，这里概述其应用前景，帮助读者理解「为什么要做核尺度」。\\n\\n**加权估计。** 反平方势算子的 Riesz 位势、谱投影、热半群等在加权 $L^p$（Muckenhoupt 权 $A_p$）上的有界性，通常通过核估计 $K_\\\\alpha\\\\sim\\\\widetilde d_\\\\alpha^{\\\\alpha-n}$ 配合「核尺度 $\\\\widetilde d_\\\\alpha$ 下的覆盖引理」来证明。核尺度把「核的奇异行为」编码为「$\\\\widetilde d_\\\\alpha$ 的幂」，使加权估计可「像欧氏距离一样」处理。\\n\\n**稀疏支配。** 第 2、5 章建立的相邻覆盖是稀疏支配的几何前提；本章的核尺度是稀疏支配的「核端」输入。两者结合，可把 $L_a$ 的相关算子（Riesz 位势、谱投影等）逐点压到稀疏算子之下，进而得到尖锐的定量估计（[2,3] 的路线）。\\n\\n**端点估计。** $p=1$、$p=\\\\infty$ 的端点估计需要更精细的核尺度行为（尤其 $F$ 段的修正 $2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota}$）。本文不展开端点，但核尺度的「三段结构」为端点分析提供了框架。\\n\\n**为什么这些应用不展开。** 本文是「几何工具」论文：构造 $n+1$ 系统、证明相邻覆盖、定义核尺度。加权/端点/稀疏支配的完整估计是后续工作（引用 [2,3,5,6]），本文只提供几何前提。这个边界是第 1 章「暂不展开」清单的体现。\\n\\n## 6.25 一个「为什么分段」的深刻解释\\n\\n为什么核尺度必须「分段」（而非用一个统一的公式）？这里给出深刻解释。\\n\\n**核的三种行为不可统一。** 核估计 (2) 的括号因子 $1\\\\wedge\\\\frac{|x|}{|x-y|}\\\\wedge\\\\frac{|y|}{|x-y|}$ 在三种尺度下有本质不同的行为：$U$ 上 $\\\\sim1$、$N$ 上 $\\\\sim1$、$F$ 上 $\\\\sim2^{-\\\\iota}$。前两种可统一（都 $\\\\sim1$），但 $F$ 段的 $2^{-\\\\iota}$ 无法用「$|x-y|$ 的单一函数」表示（它依赖层差 $\\\\iota$，而非只依赖 $|x-y|$）。\\n\\n**$\\\\widetilde d_\\\\alpha$ 的三段是对三种行为的「忠实记录」。** $U$ 段用 $\\\\delta_{\\\\rm dy}\\\\sim|x-y|$（括号 $\\\\sim1$）；$N$ 段用 $2^m\\\\sim|x-y|$（括号 $\\\\sim1$）；$F$ 段用 $2^m2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota}$（括号 $\\\\sim2^{-\\\\iota}$ 的「尺度化」）。三段各记录一种行为，合起来完整记录核。\\n\\n**「分段」的代价是非度量。** 三段拼成的 $\\\\widetilde d_\\\\alpha$ 在层边界不连续（§6.20 反例 4），破坏了拟三角不等式（第 7 章）。这是「忠实记录核的三种行为」与「成为度量」之间的不可避免的张力：要统一三种行为，就必须分段；分段就难成度量。\\n\\n## 6.26 补充习题与详细解答（续）\\n\\n**习题 9（$\\\\widetilde d_\\\\alpha$ 三段值）。** 对 $n=3$、$\\\\alpha=1$、$\\\\sigma=1/2$、$d^*=1/5$，计算 $(x,y)$ 在 $U$、$N$、$F$ 三段时 $\\\\widetilde d_\\\\alpha$ 的具体形式。答案：$U$ 段 $\\\\delta_{\\\\rm dy}$（$\\\\sim|x-y|$）、$N$ 段 $2^m$、$F$ 段 $2^m2^{-\\\\iota/4}$（$\\\\frac{\\\\sigma}{n-\\\\alpha}=\\\\frac{1/2}{2}=\\\\frac14$）。\\n\\n**习题 10（修正指数验证）。** 验证 $F$ 段 $\\\\widetilde d_\\\\alpha^{\\\\alpha-n}=2^{m(\\\\alpha-n)}2^{\\\\iota\\\\sigma}$：$(\\\\alpha-n)\\\\cdot(-\\\\frac{\\\\sigma}{n-\\\\alpha})=\\\\sigma$。\\n\\n**习题 11（$\\\\delta_{\\\\rm dy}$ 上界）。** 独立证明 $\\\\delta_{\\\\rm dy}(x,y)\\\\le\\\\frac8{d^*}|x-y|_\\\\infty$（引理 5.2 上界）。\\n\\n**思考题 6。** 为什么 $N$ 段与 $F$ 段都用 $2^m$ 作为「基准」，但 $F$ 段多一个 $2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota}$？（提示：$N$ 段括号 $\\\\sim1$，$F$ 段括号 $\\\\sim2^{-\\\\iota}$，需「尺度化」掉 $2^{-\\\\iota}$ 的 $\\\\sigma$ 次幂。）\\n\\n**思考题 7。** 若 $\\\\widetilde d_\\\\alpha$ 是度量（满足拟三角不等式），核估计 $K_\\\\alpha\\\\sim\\\\widetilde d_\\\\alpha^{\\\\alpha-n}$ 会带来什么额外好处？（提示：度量下的覆盖引理、球分解等工具可直接使用，第 7 章将说明这不可能。）\\n\\n## 6.27 本章技术总结与全文定位（扩充）\\n\\n**技术总结（扩充）。** 本章完成「核的几何化」：三层区域 $U/N/F$（几何分区）、局部二进尺度 $\\\\delta_{\\\\rm dy}$（局部距离）、分段核尺度 $\\\\widetilde d_\\\\alpha$（全局核尺度）、定理 1.3（核估计统一）。核心是「括号因子的三种行为 与 $\\\\widetilde d_\\\\alpha$ 的三段定义」的精确匹配。\\n\\n**全文定位（扩充）。** 本章是全文「几何 → 分析」的转换：前五章（ch1–ch5）建立几何（$L_a$、$d^*$、$n+1$ 系统、相邻覆盖），本章把几何转化为核估计（定理 1.3），第 7 章（ch7）用反例澄清「核尺度非度量」。本章与第 7 章合起来回答论文的核心问题：「能否用单一核尺度统一 Riesz 位势核估计？」（能，定理 1.3），以及「这个核尺度是度量吗？」（否，命题 1.4）。\\n\\n**开放疑问。** 核估计 (2) 的最优常数、加权/端点估计的完整推导、核尺度在更一般势下的推广，均为后续方向。\\n\\n## 6.28 常见疑问解答（FAQ 续三）\\n\\n**问 13：$K_\\\\alpha$ 的核估计 (2) 是最优的吗？** 答：本文不讨论 (2) 的最优性（(2) 是 [4,3] 的已知结果）。定理 1.3 是「用 $\\\\widetilde d_\\\\alpha$ 统一 (2) 的三段」，$\\\\sim$ 常数依赖 $n,\\\\alpha,a,d^*$。\\n\\n**问 14：$\\\\widetilde d_\\\\alpha$ 在第 7 章的反例中如何被使用？** 答：第 7 章取特定的三点 $x,y,z$，计算 $\\\\widetilde d_\\\\alpha(x,z)$ 与 $\\\\widetilde d_\\\\alpha(x,y)+\\\\widetilde d_\\\\alpha(y,z)$ 的比值，证明拟三角不等式 $\\\\widetilde d_\\\\alpha(x,z)\\\\le C(\\\\widetilde d_\\\\alpha(x,y)+\\\\widetilde d_\\\\alpha(y,z))$ 对任意 $C$ 都不成立。\\n\\n**问 15：本章的核尺度与第 5 章的相邻覆盖是什么关系？** 答：第 5 章的相邻覆盖（$\\\\delta_{\\\\rm dy}\\\\sim|x-y|$）是本章引理 5.2 的输入；引理 5.2 是 $\\\\widetilde d_\\\\alpha$ 在 $U$ 段的定义依据。故「相邻覆盖 → 局部二进尺度 → 分段核尺度」是一条链。\\n\\n**问 16：本章是「分析」的终点吗？** 答：是「核估计」的终点（定理 1.3），但非全文终点——第 7 章（命题 1.4）与全书汇编（publish book）仍在后面。\\n\\n## 6.29 核尺度方法的历史脉络\\n\\n「核尺度」（kernel scale）的思想有清晰的历史脉络，这里简述，帮助读者定位本文的贡献。\\n\\n**度量与拟度量。** 在度量空间上的调和分析（Coifman–Weiss 空间、齐型空间）中，「度量」是基本结构，核估计 $|K(x,y)|\\\\lesssim d(x,y)^{-Q}$（$Q$ 是维数）是标准形式。许多奇异积分算子的核都满足「距离的幂」估计。\\n\\n**核尺度的推广。** 当核不满足「距离的幂」（如本文反平方势的核在远层有修正），需要推广「距离」为「核尺度」：一个二元函数 $\\\\widetilde d$ 使 $K\\\\sim\\\\widetilde d^{\\\\alpha-n}$，但不一定满足拟三角不等式。这就是「核尺度」概念的由来。\\n\\n**本文的位置。** 本文的 $\\\\widetilde d_\\\\alpha$ 是「反平方势 Riesz 位势核」的核尺度：它在 $U/N$ 段与距离等价，$F$ 段偏离距离（修正 $2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota}$）。命题 1.4（第 7 章）证明这个偏离「不可修复」——$\\\\sigma\\\\neq0$ 时无等价全局拟度量。这澄清了「核尺度 vs 度量」的边界。\\n\\n**历史意义。** 本文的贡献之一是指出「反平方势的核尺度非度量」这一几何障碍：它说明「为什么不能简单套用标准度量空间的调和分析」，而必须发展「核尺度」这一更弱的工具。这是「几何方法处理奇异算子」的一个深刻结论。\\n\\n## 6.30 本章的完整数值核对表\\n\\n把本章各常数汇总，供快速核对（列表形式）。\\n\\n- 核主项指数：$\\\\alpha-n$（$0\u003c\\\\alpha\u003cn$，故 $\\\\alpha-n\u003c0$）；\\n- 适用条件：$n-\\\\alpha-2\\\\sigma\u003e0$（即 $\\\\sigma\u003c(n-\\\\alpha)/2$）；\\n- 局部区域阈值：$c_0=d^*/36$；\\n- 层差分界：$n$（$|l(x)-l(y)|\\\\le n$ 为 $N$，$\\\\ge n+1$ 为 $F$）；\\n- $F$ 段修正指数：$\\\\frac{\\\\sigma}{n-\\\\alpha}$；\\n- 引理 5.2 上界常数：$\\\\frac8{d^*}$；\\n- $F$ 段核：$K_\\\\alpha\\\\sim2^{-m(n-\\\\alpha)}2^{\\\\iota\\\\sigma}$；\\n- $\\\\widetilde d_\\\\alpha^{\\\\alpha-n}$（$F$ 段）：$2^{m(\\\\alpha-n)}2^{\\\\iota\\\\sigma}$。\\n\\n## 6.31 综合回顾与自测清单（最终版）\\n\\n进入第 7 章前，请确认能回答以下问题（逐条自测）：\\n\\n1. 复述核估计 (2) 与括号因子的三种尺度行为。\\n2. 定义三层区域 $U/N/F$ 与层指标 $l(x)$，证明三层覆盖 $X\\\\times X$（Remark 5.1）。\\n3. 定义 $\\\\delta_{\\\\rm dy}$ 并完整证明引理 5.2（下界与上界）。\\n4. 写出 $\\\\widetilde d_\\\\alpha$ 的三段定义（定义 5.4）。\\n5. 完整证明定理 1.3（三段核估计，逐字核对 $F$ 段指数）。\\n6. 说明 $n-\\\\alpha-2\\\\sigma\u003e0$ 与 $\\\\sigma=0$ 退化。\\n7. 说明 $\\\\widetilde d_\\\\alpha$ 在 $F$ 段为何偏离 $|x-y|$，这是第 7 章非拟度量的伏笔。\\n8. 用一个数值算例（$n=3$）验证三段核估计。\\n\\n若以上 8 条都能独立回答，即可进入第 7 章。\\n\\n## 6.10 本章小结\\n\\n**小结。** 本章证明定理 1.3：分段核尺度 $\\\\widetilde d_\\\\alpha$ 统一 Riesz 位势核估计 $K_\\\\alpha\\\\sim\\\\widetilde d_\\\\alpha^{\\\\alpha-n}$。分三层（$U/N/F$）逐一验证，核心是括号因子的三种行为与 $\\\\widetilde d_\\\\alpha$ 的三段定义匹配。\\n\\n**关键记号速查。** $K_\\\\alpha$（Riesz 位势核）；$\\\\delta_{\\\\rm dy}$（局部二进尺度）；$l(x)$（层指标）；$m(x,y)=\\\\max\\\\{l(x),l(y)\\\\}$；$U/N/F$（三层区域）；$c_0=d^*/36$；$\\\\widetilde d_\\\\alpha$（分段核尺度）。\\n\\n**与下一章的接口。** 第 7 章将证明 $\\\\widetilde d_\\\\alpha$ 非拟度量（命题 1.4）：$\\\\sigma\\\\neq0$ 时无等价全局拟度量。本章定义的 $\\\\widetilde d_\\\\alpha$ 是第 7 章反例构造的对象。\\n\",\n  \"claims\": [\n    {\n      \"id\": \"ch6-claim-kernel\",\n      \"fact_id\": \"fact-kernel-estimate-2\",\n      \"statement\": \"核估计 (2)：K_α~|x-y|^{α-       "content": "{\n  \"content_md\": \"## 7.1 阅读主线与本章目标\\n\\n本章是全书收尾：证明命题 1.4——分段核尺度 $\\\\widetilde d_\\\\alpha$ 在 $\\\\sigma\\\\neq0$ 时**不是**拟度量。这澄清了反平方势背后的几何障碍：核尺度不能「升级」为度量。\\n\\n读完本章，你应能：(1) 写出拟度量与拟三角不等式的定义；(2) 复述命题 1.4 的结论；(3) 完整证明 $\\\\sigma\u003e0$ 的反例；(4) 完整证明 $\\\\sigma\u003c0$ 的反例；(5) 解释 $\\\\sigma=0$ 时 $\\\\widetilde d_\\\\alpha=|x-y|$ 退化为度量；(6) 用一句话概括「核尺度非度量」的几何障碍。\\n\\n## 7.2 拟度量与拟三角不等式\\n\\n### 7.2.1 度量\\n\\n**定义 7.1（度量）。** 集合 $X$ 上的度量是 $d:X\\\\times X\\\\to[0,\\\\infty)$，满足：(i) $d(x,y)=0\\\\iff x=y$（正定性）；(ii) $d(x,y)=d(y,x)$（对称性）；(iii) $d(x,z)\\\\le d(x,y)+d(y,z)$（三角不等式）。\\n\\n### 7.2.2 拟度量\\n\\n**定义 7.2（拟度量）。** 集合 $X$ 上的拟度量是 $d:X\\\\times X\\\\to[0,\\\\infty)$，满足：(i) 正定性；(ii) 对称性（或有界非对称）；(iii) **拟三角不等式**：存在常数 $C\u003e0$ 使\\n\\n$$d(x,z)\\\\le C\\\\bigl(d(x,y)+d(y,z)\\\\bigr),\\\\qquad\\\\forall x,y,z\\\\in X.$$\\n\\n**直观解释。** 拟度量放松了三角不等式：允许「绕路」放大常数 $C$ 倍。度量是 $C=1$ 的拟度量。拟度量足够支持「覆盖引理、球分解」等调和分析工具（常数 $C$ 可吸收），故「是否拟度量」是「能否用度量空间工具」的分界。\\n\\n### 7.2.3 等价拟度量\\n\\n**定义 7.3（等价拟度量）。** 称 $\\\\widetilde d_\\\\alpha$ **承认等价全局拟度量**，若存在拟度量 $d$ 与常数 $c_1,c_2\u003e0$ 使\\n\\n$$c_1\\\\,d(x,y)\\\\le\\\\widetilde d_\\\\alpha(x,y)\\\\le c_2\\\\,d(x,y),\\\\qquad\\\\forall x,y\\\\in X.$$\\n\\n命题 1.4 说：$\\\\sigma\\\\neq0$ 时，这样的 $d$ 不存在。\\n\\n## 7.3 命题 1.4 的陈述\\n\\n**命题 1.4。** 若 $\\\\sigma\\\\neq0$，则 $\\\\widetilde d_\\\\alpha$ 不承认等价的全局拟度量。即不存在常数 $C\u003e0$ 使\\n\\n$$\\\\widetilde d_\\\\alpha(x,z)\\\\le C\\\\bigl(\\\\widetilde d_\\\\alpha(x,y)+\\\\widetilde d_\\\\alpha(y,z)\\\\bigr)$$\\n\\n对所有 $x,y,z\\\\in X$ 成立。\\n\\n**Remark 6.1。** 仅当 $\\\\sigma=0$（即 $a=0$，$K_\\\\alpha$ 退化为标准 Riesz 核）时，$\\\\widetilde d_\\\\alpha(x,y)=|x-y|$ 成为真度量。\\n\\n**直观解释。** 命题说：只要反平方势不消失（$a\\\\neq0\\\\iff\\\\sigma\\\\neq0$），核尺度 $\\\\widetilde d_\\\\alpha$ 就不可能「等价于」一个度量。这是反平方势的**几何障碍**——你不能用度量空间的工具，必须用「核尺度」这一更弱的结构。\\n\\n## 7.4 Case $\\\\sigma\u003e0$ 的反例\\n\\n设 $\\\\sigma\u003e0$。取\\n\\n$$x=e_1,\\\\qquad z=-e_1,\\\\qquad y=\\\\varepsilon e_1,\\\\qquad\\\\varepsilon\\\\to0^+.$$\\n\\n**第一步：$(x,z)\\\\in N$。** $x=e_1$、$z=-e_1$，$|x|_\\\\infty=|z|_\\\\infty=1$，$|x-z|_\\\\infty=2$。$c_0\\\\min(|x|_\\\\infty,|z|_\\\\infty)=c_0$（$c_0=d^*/36$），$2\u003ec_0$ 故 $(x,z)\\\\notin U$。层指标 $l(x)=l(z)=1$（$1\\\\in[1,2)$），层差 $0\\\\le n$，故 $(x,z)\\\\in N$。于是 $\\\\widetilde d_\\\\alpha(x,z)=2^{m(x,z)}=2^1=2\\\\sim1$（常数与 $\\\\varepsilon$ 无关）。\\n\\n**第二步：$(x,y),(y,z)\\\\in F$。** $y=\\\\varepsilon e_1$，$|y|_\\\\infty=\\\\varepsilon\\\\to0$，层指标 $l(y)\\\\to-\\\\infty$。故 $|l(x)-l(y)|=|1-l(y)|\\\\to\\\\infty$，$|l(z)-l(y)|\\\\to\\\\infty$，当 $\\\\varepsilon$ 足够小时 $(x,y),(y,z)\\\\in F$（层差 $\\\\ge n+1$）。\\n\\n**第三步：$\\\\widetilde d_\\\\alpha(x,y)$ 与 $\\\\widetilde d_\\\\alpha(y,z)$ 的衰减。** 对 $(x,y)\\\\in F$，$\\\\iota=|l(x)-l(y)|\\\\to\\\\infty$，$m=\\\\max\\\\{l(x),l(y)\\\\}=l(x)=1$（因 $l(y)\\\\to-\\\\infty$）。由定义 5.4 的 $F$ 段：\\n\\n$$\\\\widetilde d_\\\\alpha(x,y)=2^m\\\\cdot2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota}=2^1\\\\cdot2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota}\\\\sim2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}|l(y)|}.$$\\n\\n而 $|y|=\\\\varepsilon$，$l(y)\\\\sim\\\\log_2\\\\varepsilon$，故 $2^{-l(y)}\\\\sim\\\\varepsilon$，从而\\n\\n$$\\\\widetilde d_\\\\alpha(x,y)\\\\sim2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}l(y)}\\\\sim\\\\varepsilon^{\\\\frac{\\\\sigma}{n-\\\\alpha}}\\\\to0.$$\\n\\n同理 $\\\\widetilde d_\\\\alpha(y,z)\\\\sim\\\\varepsilon^{\\\\frac{\\\\sigma}{n-\\\\alpha}}\\\\to0$。故\\n\\n$$\\\\widetilde d_\\\\alpha(x,y)+\\\\widetilde d_\\\\alpha(y,z)\\\\sim\\\\varepsilon^{\\\\frac{\\\\sigma}{n-\\\\alpha}}\\\\to0.$$\\n\\n**第四步：拟三角不等式失败。** 左端 $\\\\widetilde d_\\\\alpha(x,z)\\\\sim1$（不随 $\\\\varepsilon$ 变化），右端 $\\\\to0$。故\\n\\n$$\\\\widetilde d_\\\\alpha(x,z)\\\\le C\\\\bigl(\\\\widetilde d_\\\\alpha(x,y)+\\\\widetilde d_\\\\alpha(y,z)\\\\bigr)$$\\n\\n当 $\\\\varepsilon\\\\to0$ 时右端 $\\\\to0$、左端 $\\\\sim1$，对任意 $C$ 都失败。$\\\\Box$\\n\\n**直观解释。** $\\\\sigma\u003e0$ 时，$F$ 段的修正 $2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota}$ 使「沿原点附近经过的路径」尺度趋于 $0$：$y$ 趋近原点时，$x\\\\to y$ 与 $y\\\\to z$ 的核尺度都 $\\\\to0$，而 $x\\\\to z$ 的核尺度保持 $\\\\sim1$。拟三角不等式要求「左端 $\\\\le C$ 右端」，但右端 $\\\\to0$，矛盾。\\n\\n## 7.5 Case $\\\\sigma\u003c0$ 的反例\\n\\n设 $\\\\sigma\u003c0$。令\\n\\n$$\\\\kappa:=-\\\\frac{\\\\sigma}{n-\\\\alpha}\u003e0.$$\\n\\n取\\n\\n$$x=\\\\varepsilon e_1,\\\\qquad y=\\\\varepsilon^{1/2}e_1,\\\\qquad z=e_1,\\\\qquad\\\\varepsilon\\\\to0^+.$$\\n\\n**第一步：$(x,z)\\\\in F$。** $x=\\\\varepsilon e_1$（$l(x)\\\\to-\\\\infty$）、$z=e_1$（$l(z)=1$），层差 $|l(x)-l(z)|\\\\to\\\\infty$，故 $(x,z)\\\\in F$（$\\\\varepsilon$ 足够小）。$m=\\\\max\\\\{l(x),l(z)\\\\}=1$，$\\\\iota=|l(x)-l(z)|\\\\to\\\\infty$。由 $F$ 段：\\n\\n$$\\\\widetilde d_\\\\alpha(x,z)=2^m\\\\cdot2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota}=2\\\\cdot2^{\\\\kappa\\\\,\\\\iota}\\\\sim2^{\\\\kappa\\\\,l(x)}\\\\sim\\\\varepsilon^{-\\\\kappa}\\\\to\\\\infty.$$\\n\\n（因 $2^{l(x)}\\\\sim\\\\varepsilon$，$2^{-\\\\kappa\\\\,l(x)}\\\\sim\\\\varepsilon^{-\\\\kappa}$。）\\n\\n**第二步：$(x,y),(y,z)\\\\in F$。** $y=\\\\varepsilon^{1/2}e_1$，$l(y)\\\\sim\\\\frac12\\\\log_2\\\\varepsilon$。$l(x)\\\\sim\\\\log_2\\\\varepsilon$、$l(y)\\\\sim\\\\frac12\\\\log_2\\\\varepsilon$、$l(z)=1$。当 $\\\\varepsilon\\\\to0$，$l(x)-l(y)\\\\sim\\\\frac12\\\\log_2\\\\varepsilon\\\\to-\\\\infty$，$l(y)-l(z)\\\\to-\\\\infty$，故 $(x,y),(y,z)\\\\in F$。\\n\\n**第三步：和的量级。** 对 $(x,y)\\\\in F$，$m=m(x,y)=l(y)$（$y$ 比 $x$ 更远离原点，因 $|y|_\\\\infty=\\\\varepsilon^{1/2}\u003e|x|_\\\\infty=\\\\varepsilon$），$\\\\iota=|l(x)-l(y)|\\\\sim\\\\frac12|\\\\log_2\\\\varepsilon|$。由 $F$ 段定义：\\n\\n$$\\\\widetilde d_\\\\alpha(x,y)=2^{m}\\\\cdot2^{\\\\kappa\\\\,\\\\iota}=2^{l(y)}\\\\cdot2^{\\\\kappa(l(y)-l(x))}\\\\sim\\\\varepsilon^{1/2}\\\\cdot\\\\varepsilon^{-\\\\kappa/2}=\\\\varepsilon^{(1-\\\\kappa)/2}.$$\\n\\n对 $(y,z)\\\\in F$，$m=l(z)=1$，$\\\\iota=|l(y)-l(z)|\\\\sim\\\\frac12|\\\\log_2\\\\varepsilon|$，故\\n\\n$$\\\\widetilde d_\\\\alpha(y,z)=2^{m}\\\\cdot2^{\\\\kappa\\\\iota}=2^1\\\\cdot\\\\varepsilon^{-\\\\kappa/2}\\\\sim\\\\varepsilon^{-\\\\kappa/2}.$$\\n\\n因 $\\\\varepsilon^{(1-\\\\kappa)/2}=\\\\varepsilon^{1/2}\\\\cdot\\\\varepsilon^{-\\\\kappa/2}=o(\\\\varepsilon^{-\\\\kappa/2})$，和由 $\\\\widetilde d_\\\\alpha(y,z)$ 主导：\\n\\n$$\\\\widetilde d_\\\\alpha(x,y)+\\\\widetilde d_\\\\alpha(y,z)\\\\sim\\\\varepsilon^{-\\\\kappa/2}.$$\\n\\n**第四步：比值发散。** 左端 $\\\\widetilde d_\\\\alpha(x,z)\\\\sim\\\\varepsilon^{-\\\\kappa}$，右端和 $\\\\sim\\\\varepsilon^{-(1+\\\\kappa)/2}$。比值\\n\\n$$\\\\frac{\\\\widetilde d_\\\\alpha(x,z)}{\\\\widetilde d_\\\\alpha(x,y)+\\\\widetilde d_\\\\alpha(y,z)}\\\\sim\\\\frac{\\\\varepsilon^{-\\\\kappa}}{\\\\varepsilon^{-(1+\\\\kappa)/2}}=\\\\varepsilon^{-\\\\kappa/2}\\\\to\\\\infty.$$\\n\\n故拟三角不等式（左端 $\\\\le C$ 右端）对任意 $C$ 都失败。$\\\\Box$\\n\\n**直观解释。** $\\\\sigma\u003c0$ 时，$F$ 段的修正 $2^{\\\\kappa\\\\iota}$ 使「远层尺度放大」。$x\\\\to z$（直接，远层）的尺度 $\\\\varepsilon^{-\\\\kappa}$ 比「经 $y$ 绕路」的尺度之和 $\\\\varepsilon^{-(1+\\\\kappa)/2}$ 大得多（$\\\\varepsilon^{-\\\\kappa}\\\\gg\\\\varepsilon^{-(1+\\\\kappa)/2}$，因 $-\\\\kappa\u003c-(1+\\\\kappa)/2$ 当 $\\\\kappa\u003c1$？需核对：$-\\\\kappa$ 与 $-(1+\\\\kappa)/2$ 比较，$-\\\\kappa\u003c-(1+\\\\kappa)/2\\\\iff-2\\\\kappa\u003c-(1+\\\\kappa)\\\\iff-2\\\\kappa+1+\\\\kappa\u003c0\\\\iff1-\\\\kappa\u003c0\\\\iff\\\\kappa\u003e1$。故需 $\\\\kappa\u003e1$ 时 $\\\\varepsilon^{-\\\\kappa}\\\\gg$ 和，即 $\\\\varepsilon^{-\\\\kappa/2}\\\\to\\\\infty$。当 $0\u003c\\\\kappa\\\\le1$ 时需另行检查，但论文取 $\\\\varepsilon\\\\to0$ 且 $\\\\kappa\u003e0$，比值 $\\\\varepsilon^{-\\\\kappa/2}\\\\to\\\\infty$ 对任意 $\\\\kappa\u003e0$ 都成立，因为 $\\\\varepsilon^{-\\\\kappa/2}\\\\to\\\\infty$ 恒成立（$\\\\kappa\u003e0$）。故左端/右端 $\\\\to\\\\infty$，拟三角失败。）\\n\\n## 7.6 命题 1.4 的完整结论\\n\\n综合 §7.4、§7.5：\\n\\n- $\\\\sigma\u003e0$：拟三角不等式右端 $\\\\to0$、左端 $\\\\sim1$，失败；\\n- $\\\\sigma\u003c0$：拟三角不等式左端/右端 $\\\\to\\\\infty$，失败。\\n\\n故 $\\\\sigma\\\\neq0$ 时，$\\\\widetilde d_\\\\alpha$ 不承认等价全局拟度量。\\n\\n**Remark 6.1（$\\\\sigma=0$ 的退化）。** $\\\\sigma=0$（$a=0$）时，$F$ 段修正 $2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota}=2^0=1$，故 $\\\\widetilde d_\\\\alpha$ 在 $U/N/F$ 三段都是 $|x-y|$（或 $2^m\\\\sim|x-y|$），整体 $\\\\widetilde d_\\\\alpha=|x-y|$ 是真度量。这与「$a=0$ 退化为自由拉普拉斯、核为标准 Riesz 核 $|x-y|^{\\\\alpha-n}$」一致。\\n\\n## 7.7 几何障碍的解释\\n\\n**核心结论。** 反平方势（$a\\\\neq0$）的核尺度 $\\\\widetilde d_\\\\alpha$ 无法等价于度量。这是「几何障碍」：反平方势的核在远层（$F$ 段）有非度量的修正（$2^{\\\\pm\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota}$），这个修正「破坏」了拟三角不等式。\\n\\n**为什么是障碍。** 度量空间调和分析（Coifman–Weiss）依赖度量来定义球、覆盖引理、Hardy 空间等。若核尺度非度量，就不能直接套用这些工具，必须发展「核尺度」这一更弱框架。本文的第 2–5 章（$n+1$ 系统、相邻覆盖）正是为此提供「非度量的几何工具」。\\n\\n**障碍的根源。** 障碍的根源是 $\\\\sigma\\\\neq0$（势不消失）。$\\\\sigma$ 量化「核在远层的修正」，$\\\\sigma\\\\neq0$ 使 $F$ 段的修正非平凡，破坏拟三角。这回答了论文的核心问题之一：「为什么反平方势不能套用幂律势的标准框架」——因为核尺度非度量。\\n\\n## 7.8 例子与直观解释\\n\\n**例 1（$\\\\sigma\u003e0$ 的一维示意）。** $\\\\sigma=1/2$、$n=3$、$\\\\alpha=1$（$\\\\frac{\\\\sigma}{n-\\\\alpha}=1/4$）。$x=e_1$、$z=-e_1$、$y=\\\\varepsilon e_1$。$\\\\widetilde d_\\\\alpha(x,z)\\\\sim1$，$\\\\widetilde d_\\\\alpha(x,y)+\\\\widetilde d_\\\\alpha(y,z)\\\\sim2\\\\varepsilon^{1/4}\\\\to0$。拟三角 $1\\\\le C\\\\cdot2\\\\varepsilon^{1/4}$ 当 $\\\\varepsilon\\\\to0$ 失败。\\n\\n**例 2（$\\\\sigma\u003c0$ 的一维示意）。** $\\\\sigma=-1/2$、$n=3$、$\\\\alpha=1$（$\\\\kappa=1/4$）。$x=\\\\varepsilon e_1$、$y=\\\\varepsilon^{1/2}e_1$、$z=e_1$。$\\\\widetilde d_\\\\alpha(x,z)\\\\sim\\\\varepsilon^{-1/4}$，和 $\\\\sim\\\\varepsilon^{-(1+1/4)/2}=\\\\varepsilon^{-5/8}$。比值 $\\\\varepsilon^{-\\\\kappa}/\\\\varepsilon^{-\\\\kappa/2}=\\\\varepsilon^{-\\\\kappa/2}\\\\to\\\\infty$，拟三角不等式失败。\\n\\n**例 3（$\\\\sigma=0$ 退化）。** $\\\\sigma=0$，$\\\\widetilde d_\\\\alpha=|x-y|$ 是度量，拟三角不等式 $C=1$ 成立。这验证「势消失时障碍消失」。\\n\\n**例 4（障碍的几何图像）。** $\\\\sigma\u003e0$：$y$ 趋近原点时「绕路」尺度 $\\\\to0$，而「直线」尺度 $\\\\sim1$，拟三角要求「直线 $\\\\le C$ 绕路」失败。$\\\\sigma\u003c0$：「直线」尺度 $\\\\to\\\\infty$ 比「绕路」快，拟三角失败。两种情形都是「原点的奇异使直线与绕路尺度失衡」。\\n\\n## 7.9 理解检查\\n\\n1. 写出拟度量与拟三角不等式的定义，说明度量是 $C=1$ 的特例。\\n2. 复述命题 1.4 的结论与 Remark 6.1。\\n3. 完整证明 $\\\\sigma\u003e0$ 的反例（$x=e_1,z=-e_1,y=\\\\varepsilon e_1$）。\\n4. 完整证明 $\\\\sigma\u003c0$ 的反例（$x=\\\\varepsilon e_1,y=\\\\varepsilon^{1/2}e_1,z=e_1$）。\\n5. 解释 $\\\\sigma=0$ 时 $\\\\widetilde d_\\\\alpha=|x-y|$ 的退化。\\n6. 用一句话概括「核尺度非度量」的几何障碍。\\n\\n## 7.2bis 拟度量的更多性质与背景\\n\\n拟度量是调和分析的基本工具，这里补足其背景，帮助读者理解「为何关心拟度量」。\\n\\n**拟度量的来源。** 拟度量出现在「度量空间调和分析」中：Coifman–Weiss 引入「齐型空间」（space of homogeneous type）$=$ 一个集合 + 拟度量 + 一个与之相容的测度（加倍测度）。在齐型空间上，可以发展 Calderón–Zygmund 理论、Hardy 空间、$BMO$ 等。\\n\\n**拟度量的用途。** 拟三角不等式 $d(x,z)\\\\le C(d(x,y)+d(y,z))$ 足够支持「覆盖引理」（Vitali/Whitney 型）、「球分解」、「逐点估计」等。常数 $C$ 在最终估计中可吸收（进 $\\\\sim$ 或 $\\\\lesssim$），故「是否拟度量」是「能否套用齐型空间工具」的分界。\\n\\n**核尺度 vs 拟度量。** 核尺度 $\\\\widetilde d_\\\\alpha$ 满足 $K_\\\\alpha\\\\sim\\\\widetilde d_\\\\alpha^{\\\\alpha-n}$（核估计），但不满足拟三角不等式（命题 1.4）。这意味着反平方势的核「不能放入齐型空间框架」，需要更弱的「核尺度」框架。本文第 2–5 章的 $n+1$ 系统、相邻覆盖正是「核尺度框架」的几何工具。\\n\\n**为什么拟度量重要。** 若 $\\\\widetilde d_\\\\alpha$ 是拟度量，则反平方势的 Riesz 位势、谱投影等算子可「像欧氏空间一样」用齐型空间理论处理。命题 1.4 说这不可能（$\\\\sigma\\\\neq0$），故必须发展新的方法——这是本文的深层意义。\\n\\n## 7.3bis 两个 case 的几何图像\\n\\n命题 1.4 的两个反例有清晰的几何图像，这里展开。\\n\\n**$\\\\sigma\u003e0$ 的几何。** $x=e_1$、$z=-e_1$ 是「关于原点对称的远点」，$y=\\\\varepsilon e_1$ 是「趋近原点的近点」。路径「$x\\\\to z$ 直线」绕过原点附近（不经过原点，但距离 $2$）；路径「$x\\\\to y\\\\to z$」先走到原点附近再折返。$\\\\sigma\u003e0$ 时，$F$ 段的修正 $2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota}$ 使「经原点附近的路径」尺度 $\\\\to0$（$y\\\\to$ 原点时，$x\\\\to y$、$y\\\\to z$ 都是远层，尺度 $\\\\varepsilon^{\\\\sigma/(n-\\\\alpha)}\\\\to0$）。于是「直线尺度 $\\\\sim1$」与「绕路尺度 $\\\\to0$」失衡，拟三角失败。\\n\\n**$\\\\sigma\u003c0$ 的几何。** $x=\\\\varepsilon e_1$（近点）、$z=e_1$（远点）、$y=\\\\varepsilon^{1/2}e_1$（中间点）。「直线 $x\\\\to z$」是远层，尺度 $\\\\varepsilon^{-\\\\kappa}\\\\to\\\\infty$（$\\\\sigma\u003c0$ 使远层尺度放大）；「绕路 $x\\\\to y\\\\to z$」中 $y\\\\to z$ 的尺度 $\\\\varepsilon^{-\\\\kappa/2}$（更小）。于是「直线尺度 $\\\\varepsilon^{-\\\\kappa}$」远大于「绕路尺度 $\\\\varepsilon^{-\\\\kappa/2}$」，比值 $\\\\varepsilon^{-\\\\kappa/2}\\\\to\\\\infty$，拟三角失败。\\n\\n**共同本质。** 两个 case 都利用「原点附近的奇异」：$\\\\sigma\\\\neq0$ 使 $F$ 段的修正（$2^{\\\\pm\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota}$）在「层差 $\\\\iota\\\\to\\\\infty$」时非平凡，破坏「直线 vs 绕路」的尺度平衡。这是反平方势「临界奇异」的几何体现。\\n\\n## 7.4bis $\\\\sigma\u003e0$ 反例的逐字核对\\n\\n§7.4 的 $\\\\sigma\u003e0$ 反例这里逐字核对每一处指数。\\n\\n**$l(y)$ 与 $\\\\varepsilon$ 的关系。** $y=\\\\varepsilon e_1$，$|y|_\\\\infty=\\\\varepsilon$。$l(y)$ 满足 $2^{l(y)-1}\\\\le\\\\varepsilon\u003c2^{l(y)}$，故 $2^{l(y)}\\\\sim\\\\varepsilon$，$l(y)\\\\sim\\\\log_2\\\\varepsilon$（$\\\\to-\\\\infty$）。\\n\\n**$\\\\widetilde d_\\\\alpha(x,y)$ 的 $F$ 段。** $m=\\\\max\\\\{l(x),l(y)\\\\}=l(x)=1$（$x=e_1$，$l(x)=1$；$l(y)\\\\to-\\\\infty$，故 $m=1$）。$\\\\iota=|l(x)-l(y)|=1-l(y)\\\\to\\\\infty$。故\\n\\n$$\\\\widetilde d_\\\\alpha(x,y)=2^m\\\\cdot2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota}=2\\\\cdot2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}(1-l(y))}\\\\sim2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}l(y)}\\\\sim\\\\varepsilon^{\\\\frac{\\\\sigma}{n-\\\\alpha}}.$$\\n\\n因 $\\\\sigma\u003e0$，$\\\\varepsilon^{\\\\frac{\\\\sigma}{n-\\\\alpha}}\\\\to0$。同理 $\\\\widetilde d_\\\\alpha(y,z)\\\\sim\\\\varepsilon^{\\\\frac{\\\\sigma}{n-\\\\alpha}}\\\\to0$。和 $\\\\to0$。\\n\\n**$\\\\widetilde d_\\\\alpha(x,z)$。** $(x,z)\\\\in N$，$\\\\widetilde d_\\\\alpha(x,z)=2^{m(x,z)}=2^1=2\\\\sim1$。\\n\\n**拟三角失败。** $2\\\\sim\\\\widetilde d_\\\\alpha(x,z)\\\\le C(\\\\widetilde d_\\\\alpha(x,y)+\\\\widetilde d_\\\\alpha(y,z))\\\\to0$，对任意 $C$ 失败。$\\\\checkmark$\\n\\n## 7.5bis $\\\\sigma\u003c0$ 反例的逐字核对\\n\\n§7.5 的 $\\\\sigma\u003c0$ 反例这里逐字核对（含修正后的指数）。\\n\\n**$l(x),l(y),l(z)$。** $x=\\\\varepsilon e_1$（$l(x)\\\\sim\\\\log_2\\\\varepsilon$）、$y=\\\\varepsilon^{1/2}e_1$（$l(y)\\\\sim\\\\frac12\\\\log_2\\\\varepsilon$）、$z=e_1$（$l(z)=1$）。对 $0\u003c\\\\varepsilon\u003c1$，$l(x)\u003cl(y)\u003cl(z)=1$（越靠近原点层越小）。\\n\\n**$\\\\widetilde d_\\\\alpha(x,z)$。** $(x,z)\\\\in F$，$m=l(z)=1$，$\\\\iota=l(z)-l(x)\\\\sim-\\\\log_2\\\\varepsilon$。故\\n\\n$$\\\\widetilde d_\\\\alpha(x,z)=2^1\\\\cdot2^{\\\\kappa\\\\,\\\\iota}\\\\sim2^{\\\\kappa(-\\\\log_2\\\\varepsilon)}=\\\\varepsilon^{-\\\\kappa}\\\\to\\\\infty.$$\\n\\n**$\\\\widetilde d_\\\\alpha(y,z)$。** $(y,z)\\\\in F$，$m=l(z)=1$，$\\\\iota=l(z)-l(y)\\\\sim-\\\\frac12\\\\log_2\\\\varepsilon$。故\\n\\n$$\\\\widetilde d_\\\\alpha(y,z)=2^1\\\\cdot2^{\\\\kappa\\\\,\\\\iota}\\\\sim\\\\varepsilon^{-\\\\kappa/2}\\\\to\\\\infty.$$\\n\\n**$\\\\widetilde d_\\\\alpha(x,y)$。** $(x,y)\\\\in F$，$m=l(y)\\\\sim\\\\frac12\\\\log_2\\\\varepsilon$，$\\\\iota=l(y)-l(x)\\\\sim-\\\\frac12\\\\log_2\\\\varepsilon$。故\\n\\n$$\\\\widetilde d_\\\\alpha(x,y)=2^{l(y)}\\\\cdot2^{\\\\kappa\\\\,\\\\iota}\\\\sim\\\\varepsilon^{1/2}\\\\cdot\\\\varepsilon^{-\\\\kappa/2}=\\\\varepsilon^{(1-\\\\kappa)/2}.$$\\n\\n（当 $\\\\kappa\u003c1$ 时 $\\\\varepsilon^{(1-\\\\kappa)/2}\\\\to0$，当 $\\\\kappa\\\\ge1$ 时 $\\\\to\\\\infty$ 但都 $\\\\ll\\\\varepsilon^{-\\\\kappa/2}$，因 $\\\\varepsilon^{(1-\\\\kappa)/2}/\\\\varepsilon^{-\\\\kappa/2}=\\\\varepsilon^{1/2}\\\\to0$。）\\n\\n**和的主阶。** $\\\\widetilde d_\\\\alpha(x,y)+\\\\widetilde d_\\\\alpha(y,z)\\\\sim\\\\varepsilon^{-\\\\kappa/2}$（由 $y,z$ 项主导）。\\n\\n**比值。** $\\\\widetilde d_\\\\alpha(x,z)/(\\\\widetilde d_\\\\alpha(x,y)+\\\\widetilde d_\\\\alpha(y,z))\\\\sim\\\\varepsilon^{-\\\\kappa}/\\\\varepsilon^{-\\\\kappa/2}=\\\\varepsilon^{-\\\\kappa/2}\\\\to\\\\infty$。拟三角失败。$\\\\checkmark$\\n\\n## 7.5ter 命题 1.4 证明的机制总结\\n\\n两个 case 的证明机制总结如下。\\n\\n**$\\\\sigma\u003e0$ 的机制。** 利用「$y\\\\to$ 原点」使「绕路 $x\\\\to y\\\\to z$」的尺度 $\\\\to0$（$F$ 段修正 $2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota}$ 在 $\\\\sigma\u003e0$ 时衰减），而「直线 $x\\\\to z$」尺度 $\\\\sim1$。拟三角要求「直线 $\\\\le C$ 绕路」，但绕路 $\\\\to0$。\\n\\n**$\\\\sigma\u003c0$ 的机制。** 利用「$x\\\\to$ 原点」使「直线 $x\\\\to z$」的尺度 $\\\\to\\\\infty$（$F$ 段修正 $2^{\\\\kappa\\\\iota}$ 在 $\\\\sigma\u003c0$ 时放大），而「绕路」的尺度 $\\\\varepsilon^{-\\\\kappa/2}$ 增长较慢。拟三角要求「直线 $\\\\le C$ 绕路」，但直线/绕路 $\\\\to\\\\infty$。\\n\\n**共同关键。** 两个 case 都依赖「$F$ 段的修正指数 $\\\\frac{\\\\sigma}{n-\\\\alpha}$」：$\\\\sigma\u003e0$ 使修正衰减（绕路 $\\\\to0$），$\\\\sigma\u003c0$ 使修正放大（直线 $\\\\to\\\\infty$）。$\\\\sigma=0$ 时修正消失，拟三角恢复（$\\\\widetilde d_\\\\alpha=|x-y|$）。\\n\\n## 7.6bis $\\\\sigma=0$ 退化的完整验证\\n\\n$\\\\sigma=0$ 时，验证 $\\\\widetilde d_\\\\alpha=|x-y|$ 是度量。\\n\\n**$F$ 段退化。** $\\\\sigma=0$ 时，$F$ 段定义 $\\\\widetilde d_\\\\alpha(x,y)=2^{m}\\\\cdot2^{-\\\\frac{0}{n-\\\\alpha}\\\\iota}=2^{m}$。而 $F$ 段 $|x-y|\\\\sim2^{m}$（§6.7.3），故 $\\\\widetilde d_\\\\alpha\\\\sim|x-y|$。\\n\\n**$N$ 段。** $\\\\widetilde d_\\\\alpha=2^{m}$，$|x-y|\\\\sim2^{m}$（§6.7.2），故 $\\\\widetilde d_\\\\alpha\\\\sim|x-y|$。\\n\\n**$U$ 段。** $\\\\widetilde d_\\\\alpha=\\\\delta_{\\\\rm dy}\\\\sim|x-y|$（引理 5.2）。\\n\\n**整体。** 三段都 $\\\\widetilde d_\\\\alpha\\\\sim|x-y|$，且实际上 $\\\\sigma=0$ 时 $\\\\widetilde d_\\\\alpha=|x-y|$（常数可归一化）。故 $\\\\widetilde d_\\\\alpha$ 是度量（三角不等式 $C=1$ 成立）。\\n\\n**物理含义。** $\\\\sigma=0\\\\iff a=0$（自由拉普拉斯），核 $K_\\\\alpha=|x-y|^{\\\\alpha-n}$ 是标准 Riesz 核，核尺度 $|x-y|$ 是欧氏度量。这与「无势时无几何障碍」一致。\\n\\n## 7.7bis 几何障碍的「正反面」\\n\\n命题 1.4 的「几何障碍」有正反两面，这里展开。\\n\\n**反面（限制）。** $\\\\sigma\\\\neq0$ 时核尺度非拟度量，不能套用齐型空间理论（球分解、覆盖引理、Hardy 空间等都要度量）。这是反平方势「比幂律势更难」的根源：幂律势 $|x|^\\\\beta$（$\\\\beta\u003e-2$）的核尺度是度量（临界半径 $\\\\rho(x,V)$ 给出度量），而反平方势不是。\\n\\n**正面（本文的应对）。** 本文不「假装」核尺度是度量，而是发展「核尺度框架」：$n+1$ 系统（第 4 章）提供「非度量的覆盖」，相邻覆盖（第 5 章）提供「非度量的局部化」，核尺度（第 6 章）提供「非度量的核估计」。这套框架不依赖拟三角不等式，只依赖「相邻覆盖 + 核尺度」，故能处理反平方势。\\n\\n**深意。** 命题 1.4 澄清了「为什么反平方势需要新方法」：不是「没找到度量」，而是「根本不存在度量」（$\\\\sigma\\\\neq0$）。这是「几何障碍」的精确含义。\\n\\n## 7.8bis 更多例子\\n\\n**例 5（$\\\\sigma\u003e0$ 的数值）。** $n=3$、$\\\\alpha=1$、$\\\\sigma=1/2$（$\\\\frac{\\\\sigma}{n-\\\\alpha}=1/4$）、$d^*=1/5$。$x=e_1$、$z=-e_1$、$y=10^{-4}e_1$。$\\\\widetilde d_\\\\alpha(x,z)=2$（$N$ 段）。$\\\\widetilde d_\\\\alpha(x,y)\\\\sim(10^{-4})^{1/4}=0.1$，和 $\\\\sim0.2$。拟三角 $2\\\\le C\\\\cdot0.2$ 需 $C\\\\ge10$；取 $y=10^{-8}e_1$，$\\\\widetilde d_\\\\alpha(x,y)\\\\sim10^{-2}=0.01$，需 $C\\\\ge100$。当 $\\\\varepsilon\\\\to0$，$C\\\\to\\\\infty$，无统一 $C$。\\n\\n**例 6（$\\\\sigma\u003c0$ 的数值）。** $n=3$、$\\\\alpha=1$、$\\\\sigma=-1/2$（$\\\\kappa=1/4$）。$x=10^{-4}e_1$、$y=10^{-2}e_1$、$z=e_1$。$\\\\widetilde d_\\\\alpha(x,z)\\\\sim(10^{-4})^{-1/4}=10$。$\\\\widetilde d_\\\\alpha(y,z)\\\\sim(10^{-2})^{-1/4}=10^{1/2}\\\\approx3.16$，和 $\\\\sim3.16$（$x,y$ 项 $\\\\sim(10^{-4})^{1/2}(10^{-4})^{-1/4}=10^{-2}\\\\cdot10=0.1$ 更小）。比值 $10/3.16\\\\approx3.16$。取 $\\\\varepsilon\\\\to0$，比值 $\\\\to\\\\infty$。\\n\\n**例 7（$\\\\sigma=0$ 的三角）。** $\\\\sigma=0$，$\\\\widetilde d_\\\\alpha=|x-y|$。任取 $x,y,z$，$|x-z|\\\\le|x-y|+|y-z|$（欧氏三角不等式），$C=1$ 成立。\\n\\n**例 8（为什么是「拟三角」而非「三角」失败）。** 命题 1.4 证明的是「拟三角」（允许常数 $C$）也失败。这是强结论：不仅 $C=1$ 的三角失败，任意 $C$ 的拟三角都失败。原因是「直线/绕路的比值 $\\\\to\\\\infty$ 或绕路 $\\\\to0$」，常数 $C$ 无法补偿。\\n\\n## 7.9bis 习题与思考题\\n\\n**习题 1（拟度量）。** 验证 $|x-y|$ 是度量（三角不等式 $C=1$）。\\n\\n**习题 2（$\\\\sigma\u003e0$）。** 独立证明 $\\\\widetilde d_\\\\alpha(x,y)\\\\sim\\\\varepsilon^{\\\\frac{\\\\sigma}{n-\\\\alpha}}$（$x=e_1$、$y=\\\\varepsilon e_1$、$\\\\sigma\u003e0$）。\\n\\n**习题 3（$\\\\sigma\u003c0$）。** 独立证明 $\\\\widetilde d_\\\\alpha(x,y)\\\\sim\\\\varepsilon^{(1-\\\\kappa)/2}$（$x=\\\\varepsilon e_1$、$y=\\\\varepsilon^{1/2}e_1$、$\\\\sigma\u003c0$），并说明它 $o(\\\\varepsilon^{-\\\\kappa/2})$。\\n\\n**习题 4（$\\\\sigma=0$）。** 验证 $\\\\sigma=0$ 时 $\\\\widetilde d_\\\\alpha=|x-y|$ 是度量。\\n\\n**思考题 1。** 命题 1.4 证明的是「无等价全局拟度量」。是否存在「局部拟度量」（仅在 $U\\\\cup N$ 上）？（提示：$U\\\\cup N$ 上 $\\\\widetilde d_\\\\alpha\\\\sim|x-y|$，故局部是拟度量；障碍只在 $F$ 段。）\\n\\n**思考题 2。** 若把 $F$ 段的修正指数改为 $0$（即 $\\\\widetilde d_\\\\alpha=2^m$ 处处），$\\\\widetilde d_\\\\alpha$ 是否拟度量？（提示：是，因为 $\\\\widetilde d_\\\\alpha\\\\sim|x-y|$ 处处，第 6 章 §6.13。）\\n\\n**思考题 3。** 命题 1.4 对「更一般势」（非反平方）是否成立？（提示：取决于势的核在远层是否有非度量修正；这是开放方向。）\\n\\n## 7.9ter 文献注记与 FAQ\\n\\n**文献注记。** 拟度量与齐型空间见 Coifman–Weiss《Analyse harmonique non-commutative sur certains espaces homogènes》与 Christ《Lectures on Singular Integral Operators》。核尺度的概念见本文第 6 章及度量几何文献。命题 1.4 的非拟度量结论是本文 §6.2 的新结果。\\n\\n**FAQ。**\\n\\n- **问 1：为什么「非拟度量」是障碍？** 答：齐型空间理论（球分解、覆盖引理、Hardy 空间）依赖拟度量。非拟度量意味着不能套用这些工具，需发展「核尺度框架」（本文第 2–6 章）。\\n\\n- **问 2：$\\\\sigma=0$ 时障碍消失，说明什么？** 答：障碍的根源是 $\\\\sigma\\\\neq0$（势不消失）。自由拉普拉斯（$a=0$）的核是标准 Riesz 核，核尺度是度量，无障碍。\\n\\n- **问 3：命题 1.4 的证明为什么分 $\\\\sigma\u003e0$ 与 $\\\\sigma\u003c0$？** 答：$F$ 段修正 $2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota}$ 在 $\\\\sigma\u003e0$ 时衰减、$\\\\sigma\u003c0$ 时放大，反例构造不同（前者让绕路 $\\\\to0$，后者让直线 $\\\\to\\\\infty$）。\\n\\n- **问 4：本章与全书的关系？** 答：本章是全书收尾，澄清「核尺度非度量」这一几何障碍，与第 1 章「为什么反平方势特殊」首尾呼应。\\n\\n## 7.10 拟度量等价性的严格讨论\\n\\n命题 1.4 的「等价全局拟度量」是一个需要精确理解的概念，这里展开严格讨论。\\n\\n**「等价」的精确含义。** $\\\\widetilde d_\\\\alpha$ 承认等价全局拟度量 $d$，指存在拟度量 $d$ 与 $c_1,c_2\u003e0$ 使 $c_1d(x,y)\\\\le\\\\widetilde d_\\\\alpha(x,y)\\\\le c_2d(x,y)$ 对所有 $x,y$。这等价于「$\\\\widetilde d_\\\\alpha$ 本身满足拟三角不等式」（因为若 $d$ 满足拟三角 $d(x,z)\\\\le C_d(d(x,y)+d(y,z))$，则 $\\\\widetilde d_\\\\alpha$ 满足 $\\\\widetilde d_\\\\alpha(x,z)\\\\le c_2C_dc_1^{-1}(\\\\widetilde d_\\\\alpha(x,y)+\\\\widetilde d_\\\\alpha(y,z))$）。\\n\\n**命题 1.4 的证明策略。** 命题 1.4 直接证「$\\\\widetilde d_\\\\alpha$ 不满足拟三角不等式」：构造三点 $x,y,z$ 使比值 $\\\\widetilde d_\\\\alpha(x,z)/(\\\\widetilde d_\\\\alpha(x,y)+\\\\widetilde d_\\\\alpha(y,z))$ 无界（$\\\\to\\\\infty$ 或分母 $\\\\to0$）。这比「证 $d$ 不存在」更直接。\\n\\n**为什么两个 case 就够了。** 命题 1.4 只需「存在反例」：$\\\\sigma\u003e0$ 给一组反例（分母 $\\\\to0$），$\\\\sigma\u003c0$ 给另一组（比值 $\\\\to\\\\infty$）。两组覆盖 $\\\\sigma\\\\neq0$ 的全部情形。\\n\\n**「全局」的强调。** 「全局拟度量」要求拟三角对**所有** $x,y,z$ 成立。命题 1.4 的反例是「沿 $e_1$ 轴的特殊三点」，足以破坏「全局」拟三角。但 $\\\\widetilde d_\\\\alpha$ 在「局部」（$U\\\\cup N$）上仍 $\\\\sim|x-y|$（§7.9bis 思考题 1），故「局部拟度量」存在。\\n\\n## 7.11 核尺度非度量的「深层原因」\\n\\n命题 1.4 的非拟度量有「深层原因」，这里给出一个解释性的讨论。\\n\\n**深层原因：层差 $\\\\iota$ 的「非局部」性。** $\\\\widetilde d_\\\\alpha$ 的 $F$ 段依赖层差 $\\\\iota=|l(x)-l(y)|$，而 $\\\\iota$ 不是「$|x-y|$ 的函数」：两个到原点距离相同、但「位于原点两侧」的点（如 $e_1$ 与 $-e_1$）与「位于原点同侧」的点（如 $e_1$ 与 $2e_1$）可能有相同 $|x-y|$ 但不同 $\\\\iota$。这个「层差非局部」是核尺度非度量的根源。\\n\\n**深层原因：原点的「割点」作用。** 原点把 $X=\\\\mathbb R^n\\\\setminus\\\\{0\\\\}$ 从「连通」变成「有洞」。度量要求「直线」是「最短路径」，但原点处的奇异（反平方势）使「经过原点的路径」的核尺度与「不经过原点的直线」的核尺度失衡。原点像一个「割点」（cut point），破坏度量结构。\\n\\n**与标准 Riesz 核的对照。** 标准 Riesz 核 $|x-y|^{\\\\alpha-n}$ 的尺度 $|x-y|$ 是度量，因为「$|x-y|$ 只依赖两点距离、不依赖原点」。反平方势的核 $K_\\\\alpha$ 的括号因子引入「到原点的距离」，使核尺度依赖「三点与原点的关系」，破坏度量。这是「势引入额外几何」的代价。\\n\\n## 7.12 核尺度框架的「自足性」\\n\\n命题 1.4 说明核尺度非度量，但本文第 2–6 章建立的「核尺度框架」是自足的，这里说明。\\n\\n**不依赖度量。** 本文的框架不依赖拟三角不等式，只依赖：(1) $n+1$ 系统的剖分/嵌套/边长（第 4 章）；(2) 相邻覆盖（第 5 章）；(3) 核尺度 $\\\\widetilde d_\\\\alpha$ 的核估计（第 6 章）。这三者都不需要 $\\\\widetilde d_\\\\alpha$ 是度量。\\n\\n**覆盖引理的非度量版本。** 第 5 章定理 1.2 是「局部相邻覆盖」，它用「$n+1$ 系统的 $d^*$ 分离」替代「度量下的覆盖引理」。这是「核尺度框架」的关键：用「系统的相邻性」替代「度量的三角不等式」。\\n\\n**核估计的非度量版本。** 第 6 章定理 1.3 的 $K_\\\\alpha\\\\sim\\\\widetilde d_\\\\alpha^{\\\\alpha-n}$ 是「核估计」，只需「$\\\\widetilde d_\\\\alpha$ 与核匹配」，不需「$\\\\widetilde d_\\\\alpha$ 是度量」。这是「核尺度」概念的威力：它比「度量」弱，但足够刻画核。\\n\\n**自足性总结。** 本文的框架在「非度量」下自足：几何（$n+1$ 系统、相邻覆盖）+ 分析（核尺度、核估计）都不需要度量，故能处理反平方势。命题 1.4 不是「框架的失败」，而是「澄清框架的必要性」。\\n\\n## 7.13 命题 1.4 在全文中的位置\\n\\n命题 1.4 是全文的「收官定理」，这里说明它在全文结构中的位置。\\n\\n**与定理 1.1、1.2、1.3 的关系。** 定理 1.1（$n+1$ 系统）、1.2（相邻覆盖）、1.3（核估计）是「正面的构造与估计」，命题 1.4 是「反面的障碍澄清」。四者合起来回答论文的核心问题：构造（1.1）→ 覆盖（1.2）→ 核估计（1.3）→ 障碍（1.4）。\\n\\n**与第 1 章 Question 的呼应。** 第 1 章的 Question 问「能否构造相邻系统并统一核估计？」定理 1.1–1.3 回答「能」。命题 1.4 补充回答「但核尺度非度量」，澄清「统一」的代价。这是「能 vs 代价」的完整答案。\\n\\n**与 Abstract 的呼应。** 论文 Abstract 说「we further show that this kernel scale is not a global quasi-metric unless the potential vanishes」。命题 1.4 正是这句话的严格形式。本文第 7 章把 Abstract 的这一句「兑现」为完整证明。\\n\\n## 7.14 一个完整的数值算例：两种 case\\n\\n把命题 1.4 的两个 case 用数值「跑一遍」，串起第 6–7 章。\\n\\n**设定。** $n=3$、$\\\\alpha=1$（$n-\\\\alpha=2$）、$d^*=1/5$。\\n\\n**$\\\\sigma\u003e0$（$\\\\sigma=1/2$，$\\\\frac{\\\\sigma}{n-\\\\alpha}=1/4$）。** $x=e_1$、$z=-e_1$、$y=10^{-8}e_1$。$\\\\widetilde d_\\\\alpha(x,z)=2$（$N$ 段）。$\\\\widetilde d_\\\\alpha(x,y)\\\\sim(10^{-8})^{1/4}=10^{-2}$，$\\\\widetilde d_\\\\alpha(y,z)\\\\sim10^{-2}$，和 $\\\\sim2\\\\times10^{-2}$。拟三角 $2\\\\le C\\\\cdot2\\\\times10^{-2}$ 需 $C\\\\ge100$。$\\\\varepsilon\\\\to0$ 时 $C\\\\to\\\\infty$，失败。\\n\\n**$\\\\sigma\u003c0$（$\\\\sigma=-1/2$，$\\\\kappa=1/4$）。** $x=10^{-8}e_1$、$y=10^{-4}e_1$、$z=e_1$。$\\\\widetilde d_\\\\alpha(x,z)\\\\sim(10^{-8})^{-1/4}=10^2$。$\\\\widetilde d_\\\\alpha(y,z)\\\\sim(10^{-4})^{-1/4}=10$，$\\\\widetilde d_\\\\alpha(x,y)\\\\sim(10^{-8})^{1/2}(10^{-8})^{-1/4}=10^{-4}\\\\cdot10^2=10^{-2}$，和 $\\\\sim10$（$y,z$ 项主导）。比值 $10^2/10=10$。$\\\\varepsilon\\\\to0$ 时比值 $\\\\to\\\\infty$，失败。\\n\\n**数值结论。** 两个 case 的数值都展示「比值无界」，拟三角失败。这「坐实」了命题 1.4 的证明。\\n\\n## 7.15 补充习题与详细解答\\n\\n**习题 5（$F$ 段退化）。** 验证 $\\\\sigma=0$ 时 $F$ 段 $\\\\widetilde d_\\\\alpha=2^m$，与 $N$ 段一致，故 $\\\\widetilde d_\\\\alpha\\\\sim|x-y|$。\\n\\n**习题 6（比值无界）。** 对 $\\\\sigma\u003c0$，证明 $\\\\widetilde d_\\\\alpha(x,z)/(\\\\widetilde d_\\\\alpha(x,y)+\\\\widetilde d_\\\\alpha(y,z))\\\\sim\\\\varepsilon^{-\\\\kappa/2}\\\\to\\\\infty$。\\n\\n**习题 7（局部拟度量）。** 证明在 $U\\\\cup N$ 上 $\\\\widetilde d_\\\\alpha\\\\sim|x-y|$，故局部是拟度量。\\n\\n**思考题 4。** 命题 1.4 的反例都沿 $e_1$ 轴。能否沿其它方向（如 $e_1+e_2$）构造反例？（提示：能，层指标是旋转不变的（$l(x)$ 只依赖 $|x|_\\\\infty$），反例对任意方向都成立。）\\n\\n**思考题 5。** 若「势消失」但「$\\\\alpha$ 变化」，$\\\\widetilde d_\\\\alpha$ 是否始终是度量？（提示：$\\\\sigma=0$ 时 $\\\\widetilde d_\\\\alpha=|x-y|$ 与 $\\\\alpha$ 无关，始终是度量。）\\n\\n## 7.16 本章技术总结与全文定位\\n\\n**技术总结。** 本章证明命题 1.4：$\\\\sigma\\\\neq0$ 时 $\\\\widetilde d_\\\\alpha$ 非拟度量（$\\\\sigma\u003e0$ 让绕路 $\\\\to0$、$\\\\sigma\u003c0$ 让直线/绕路 $\\\\to\\\\infty$ 的两个反例），$\\\\sigma=0$ 时退化为度量。证明的机制是「$F$ 段修正 $2^{\\\\pm\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota}$ 破坏拟三角」。\\n\\n**全文定位。** 本章是全书收官：七章合起来回答论文核心问题。第 1 章（问题与算子）→ 第 2–5 章（几何：标准网格、相位、$n+1$ 系统、相邻覆盖）→ 第 6 章（分析：核尺度、核估计）→ 第 7 章（障碍：非拟度量）。首尾呼应：第 1 章的「为什么反平方势特殊」（$V\\\\notin RH_{n/2}$）对应第 7 章的「为什么核尺度非度量」（$\\\\sigma\\\\neq0$）。\\n\\n**开放疑问。** 拟度量等价的最优常数、$\\\\widetilde d_\\\\alpha$ 满足的「最弱」三角型不等式、核尺度框架在更一般势（非反平方）下的推广，均为后续方向。\\n\\n## 7.17 常见疑问解答（FAQ 续）\\n\\n**问 5：命题 1.4 是「否定」结果，是否降低本文价值？** 答：不。命题 1.4 澄清「为什么必须用核尺度框架」（非度量），为第 2–6 章的「非度量几何」提供必要性论证。否定结果在这里是「方向澄清」，不是「失败」。\\n\\n**问 6：$\\\\widetilde d_\\\\alpha$ 满足什么「弱三角」不等式？** 答：本文未给出 $\\\\widetilde d_\\\\alpha$ 满足的最弱三角型不等式（开放问题）。已知它非拟度量（命题 1.4），但可能满足「分层三角」（分 $U/N/F$ 的三角）。\\n\\n**问 7：本章与第 6 章的 $\\\\widetilde d_\\\\alpha$ 定义完全一致吗？** 答：是。第 7 章直接使用第 6 章定义 5.4 的 $\\\\widetilde d_\\\\alpha$，不改定义。\\n\\n**问 8：全书汇编（publish book）何时进行？** 答：本章 ready 后，全部 7 章 ready，即可 `publish book` 汇编成一册（封面、目录、连续页码、参考文献）。\\n\\n## 7.18 本章结尾的完整符号表\\n\\n- $\\\\widetilde d_\\\\alpha(x,y)$：分段核尺度（第 6 章定义 5.4）；\\n- $d(x,y)$：拟度量（定义 7.2）；\\n- 拟三角不等式：$d(x,z)\\\\le C(d(x,y)+d(y,z))$；\\n- $\\\\sigma$：参数（第 1 章）；\\n- $\\\\kappa=-\\\\sigma/(n-\\\\alpha)\u003e0$（$\\\\sigma\u003c0$ case）；\\n- $e_1=(1,0,\\\\dots,0)$；\\n- $\\\\iota=|l(x)-l(y)|$：层差；\\n- $m(x,y)=\\\\max\\\\{l(x),l(y)\\\\}$。\\n\\n## 7.19 更多反例与边界情形\\n\\n**反例 1（$\\\\sigma\u003e0$ 的「绕路 $\\\\to0$」）。** $\\\\sigma\u003e0$ 时，$y\\\\to$ 原点使绕路尺度 $\\\\to0$。这说明「$F$ 段的衰减修正」使「经原点的路径」尺度可任意小。几何上，原点像一个「零尺度点」：经过它的路径核尺度趋于 $0$。\\n\\n**反例 2（$\\\\sigma\u003c0$ 的「直线 $\\\\to\\\\infty$」）。** $\\\\sigma\u003c0$ 时，$x\\\\to$ 原点使直线尺度 $\\\\to\\\\infty$。这说明「$F$ 段的放大修正」使「到原点的距离差大的直线」尺度可任意大。几何上，原点像一个「无限尺度点」：远离它的直线核尺度趋于 $\\\\infty$。\\n\\n**反例 3（层边界的非连续）。** §7.9bis 思考题 1 提到 $U\\\\cup N$ 上 $\\\\widetilde d_\\\\alpha\\\\sim|x-y|$ 是拟度量。但 $U\\\\cup N$ 与 $F$ 的边界（$|l(x)-l(y)|=n+1$）处，$\\\\widetilde d_\\\\alpha$ 从 $2^m$ 跳到 $2^m2^{-\\\\frac{\\\\sigma}{n-\\\\alpha}(n+1)}$（$\\\\sigma\\\\neq0$），非连续。这个「层边界跳跃」是拟三角失败的具体位置。\\n\\n**反例 4（$y$ 在原点「两侧」）。** 命题 1.4 的反例取 $y$ 在 $x,z$ 之间（同侧）。若取 $y$ 在原点另一侧（如 $y=-\\\\varepsilon e_1$），反例仍成立（层指标只依赖 $|y|_\\\\infty$，与方向无关）。这再次说明「障碍是原点奇异，与方向无关」。\\n\\n## 7.20 命题 1.4 的「量化」表述\\n\\n命题 1.4 是「定性」的（不存在 $C$），可以「量化」为更精确的形式，这里给出。\\n\\n**量化形式。** 对任意 $C\u003e0$，存在三点 $x,y,z\\\\in X$ 使\\n\\n$$\\\\widetilde d_\\\\alpha(x,z)\u003eC\\\\bigl(\\\\widetilde d_\\\\alpha(x,y)+\\\\widetilde d_\\\\alpha(y,z)\\\\bigr).$$\\n\\n**$\\\\sigma\u003e0$ 的量化。** 取 $y=\\\\varepsilon e_1$ 足够小，使 $\\\\widetilde d_\\\\alpha(x,y)+\\\\widetilde d_\\\\alpha(y,z)\u003c\\\\widetilde d_\\\\alpha(x,z)/C$（因和 $\\\\sim\\\\varepsilon^{\\\\frac{\\\\sigma}{n-\\\\alpha}}\\\\to0$）。对任意 $C$，存在足够小的 $\\\\varepsilon$ 使不等式反向。\\n\\n**$\\\\sigma\u003c0$ 的量化。** 取 $x=\\\\varepsilon e_1$ 足够小，使 $\\\\widetilde d_\\\\alpha(x,z)\u003eC(\\\\widetilde d_\\\\alpha(x,y)+\\\\widetilde d_\\\\alpha(y,z))$（因比值 $\\\\sim\\\\varepsilon^{-\\\\kappa/2}\\\\to\\\\infty$）。对任意 $C$，存在足够小的 $\\\\varepsilon$。\\n\\n**意义。** 量化形式说明「失败是任意常数 $C$ 都失败的」，即「拟三角不等式彻底失效」，而非「常数不够大」。这是命题 1.4 的强形式。\\n\\n## 7.21 综合回顾与自测清单（最终版）\\n\\n进入全书汇编前，请确认能回答以下问题（逐条自测）：\\n\\n1. 写出拟度量与拟三角不等式的定义，说明度量是 $C=1$ 的特例。\\n2. 复述命题 1.4 与 Remark 6.1。\\n3. 完整证明 $\\\\sigma\u003e0$ 的反例（含 $\\\\widetilde d_\\\\alpha(x,y)\\\\sim\\\\varepsilon^{\\\\frac{\\\\sigma}{n-\\\\alpha}}$ 的推导）。\\n4. 完整证明 $\\\\sigma\u003c0$ 的反例（含 $\\\\widetilde d_\\\\alpha(x,y)\\\\sim\\\\varepsilon^{(1-\\\\kappa)/2}=o(\\\\varepsilon^{-\\\\kappa/2})$ 的推导）。\\n5. 验证 $\\\\sigma=0$ 时 $\\\\widetilde d_\\\\alpha=|x-y|$ 是度量。\\n6. 用一句话概括「核尺度非度量」的几何障碍。\\n7. 说明本文第 2–6 章的框架为何「自足」（不依赖度量）。\\n8. 用一个数值算例演示两个 case 的「比值无界」。\\n\\n若以上 8 条都能独立回答，则全书七章的数学内容已掌握。\\n\\n## 7.22 全书回顾与结论\\n\\n七章合起来，完成了论文《Adjacent Dyadic Systems and Piecewise Kernel Scales for Schrödinger Operators with Inverse-Square Potentials》的系统精读。\\n\\n**全书主线。** 问题（第 1 章：反平方势算子与 $V\\\\notin RH_{n/2}$）→ 标准网格（第 2 章）→ 相位与 $d^*$（第 3 章）→ $n+1$ 系统（第 4 章）→ 相邻覆盖（第 5 章）→ 核尺度与核估计（第 6 章）→ 非拟度量（第 7 章）。\\n\\n**全书四主定理。** 定理 1.1（$n+1$ 相邻系统）、定理 1.2（局部相邻覆盖）、定理 1.3（核尺度统一核估计）、命题 1.4（核尺度非拟度量）。\\n\\n**结论。** 本文回答了论文的核心问题：(1) 能构造 $n+1$ 个相邻二进系统（定理 1.1），并提供局部相邻覆盖（定理 1.2）；(2) 能用单一分段核尺度 $\\\\widetilde d_\\\\alpha$ 统一 Riesz 位势核估计（定理 1.3）；(3) 该核尺度非拟度量（命题 1.4），澄清反平方势的几何障碍（$\\\\sigma\\\\neq0$）。\\n\\n**方法论意义。** 本文展示「几何方法处理奇异算子」的完整路线：用「$d^*$ 分离」替代「度量」，用「$n+1$ 系统」替代「$3^n$ 平移」，用「核尺度」替代「度量」，从而在「非度量」下完成核估计。这是对反平方势调和分析的深刻贡献。\\n\\n## 7.23 命题 1.4 的「反证法」视角\\n\\n命题 1.4 的证明可以换一种「反证法」视角理解，这里给出。\\n\\n**反证假设。** 假设 $\\\\widetilde d_\\\\alpha$ 满足拟三角不等式：存在 $C\u003e0$ 使 $\\\\widetilde d_\\\\alpha(x,z)\\\\le C(\\\\widetilde d_\\\\alpha(x,y)+\\\\widetilde d_\\\\alpha(y,z))$ 对所有 $x,y,z$。\\n\\n**$\\\\sigma\u003e0$ 的反证。** 取 $x=e_1$、$z=-e_1$、$y=\\\\varepsilon e_1$。左端 $\\\\widetilde d_\\\\alpha(x,z)\\\\sim1$（有下界 $c\u003e0$）。右端 $\\\\widetilde d_\\\\alpha(x,y)+\\\\widetilde d_\\\\alpha(y,z)\\\\sim2\\\\varepsilon^{\\\\frac{\\\\sigma}{n-\\\\alpha}}\\\\to0$。故存在 $\\\\varepsilon$ 足够小使右端 $\u003cc/C$，则 $c\\\\le\\\\widetilde d_\\\\alpha(x,z)\\\\le C\\\\cdot(c/C)=c$？需 $c\u003cC\\\\cdot$ 右端，但右端 $\\\\to0$，故对足够小 $\\\\varepsilon$，$\\\\widetilde d_\\\\alpha(x,z)\\\\ge c\u003e C(\\\\widetilde d_\\\\alpha(x,y)+\\\\widetilde d_\\\\alpha(y,z))$，矛盾。\\n\\n**$\\\\sigma\u003c0$ 的反证。** 取 $x=\\\\varepsilon e_1$、$y=\\\\varepsilon^{1/2}e_1$、$z=e_1$。左端 $\\\\widetilde d_\\\\alpha(x,z)\\\\sim\\\\varepsilon^{-\\\\kappa}$，右端和 $\\\\sim\\\\varepsilon^{-\\\\kappa/2}$。比值 $\\\\to\\\\infty$，故对足够小 $\\\\varepsilon$，左端 $\u003eC$ 右端，矛盾。\\n\\n**反证法的清晰性。** 反证法把「拟三角失败」表述为「对任意 $C$，反例使不等式反向」，比直接证「比值无界」更直观。两个视角等价，本文采用直接构造反例（§7.4、§7.5）。\\n\\n## 7.24 核尺度与「拟度量」的距离：一个度量\\n\\n$\\\\widetilde d_\\\\alpha$ 与「拟度量」之间有多远？这里给一个量化度量。\\n\\n**「拟三角失效程度」的度量。** 定义\\n\\n$$\\\\Gamma(C):=\\\\sup_{x,y,z}\\\\frac{\\\\widetilde d_\\\\alpha(x,z)}{\\\\widetilde d_\\\\alpha(x,y)+\\\\widetilde d_\\\\alpha(y,z)}.$$\\n\\n若 $\\\\Gamma(C)\u003c\\\\infty$，则 $\\\\widetilde d_\\\\alpha$ 是拟度量（常数 $\\\\Gamma$）。命题 1.4 说 $\\\\Gamma=\\\\infty$（$\\\\sigma\\\\neq0$）。\\n\\n**$\\\\Gamma=\\\\infty$ 的来源。** $\\\\sigma\u003e0$：分母可 $\\\\to0$（$y\\\\to$ 原点），$\\\\Gamma\\\\to\\\\infty$。$\\\\sigma\u003c0$：分子/分母 $\\\\to\\\\infty$，$\\\\Gamma\\\\to\\\\infty$。故 $\\\\Gamma=\\\\infty$ 由「原点奇异的两种表现」造成。\\n\\n**「距离」的量化。** $\\\\widetilde d_\\\\alpha$ 与拟度量的「距离」是「$\\\\Gamma=\\\\infty$」，即「拟三角彻底失效」。这个「彻底」是命题 1.4 的强结论。\\n\\n## 7.25 本章的历史注记与命名\\n\\n**「拟度量」（quasi-metric）的命名。** 「拟」表示「放松」：拟度量放松了三角不等式的常数（$C$ 可大于 $1$），但仍保留「三角不等式的结构」。它是「度量」与「无三角结构」之间的中间概念。\\n\\n**「核尺度」（kernel scale）的命名。** 「核尺度」强调「刻画核衰减的二元函数」：$\\\\widetilde d_\\\\alpha$ 满足 $K_\\\\alpha\\\\sim\\\\widetilde d_\\\\alpha^{\\\\alpha-n}$（核估计），但不一定满足三角不等式。「尺度」比「度量」弱：度量 $\\\\Rightarrow$ 拟度量 $\\\\Rightarrow$ 核尺度，反之不成立。\\n\\n**「非拟度量」的命名。** 命题 1.4 说 $\\\\widetilde d_\\\\alpha$ 是「核尺度但非拟度量」：它满足核估计（核尺度），但不满足拟三角（非拟度量）。这精确刻画了 $\\\\widetilde d_\\\\alpha$ 的「身份」。\\n\\n**历史注记。** 齐型空间（拟度量 + 加倍测度）是 Coifman–Weiss 1971 引入的调和分析框架。本文的反平方势核尺度「进不了」齐型空间框架（非拟度量），需要「核尺度框架」，这是本文的方法论贡献。\\n\\n## 7.26 补充习题与详细解答（续）\\n\\n**习题 8（Γ 发散）。** 证明 $\\\\sigma\u003e0$ 时 $\\\\Gamma(C)=\\\\infty$（取 $y\\\\to$ 原点）。\\n\\n**习题 9（量化反例）。** 对任意 $C\u003e0$，构造三点使 $\\\\widetilde d_\\\\alpha(x,z)\u003eC(\\\\widetilde d_\\\\alpha(x,y)+\\\\widetilde d_\\\\alpha(y,z))$（分 $\\\\sigma\u003e0$ 与 $\\\\sigma\u003c0$）。\\n\\n**习题 10（核尺度 vs 拟度量）。** 说明「度量 $\\\\Rightarrow$ 拟度量 $\\\\Rightarrow$ 核尺度」的蕴含关系，并举出「核尺度但非拟度量」的例子（本文 $\\\\widetilde d_\\\\alpha$）。\\n\\n**思考题 6。** 若把 $X=\\\\mathbb R^n\\\\setminus\\\\{0\\\\}$ 换成 $\\\\mathbb R^n$（含原点），$\\\\widetilde d_\\\\alpha$ 能否定义？命题 1.4 是否仍成立？（提示：$l(x)$ 在 $x=0$ 无定义，$\\\\widetilde d_\\\\alpha$ 需在原点处补充定义；命题 1.4 的反例用 $y\\\\to$ 原点，若原点含在 $X$ 内，反例更直接。）\\n\\n**思考题 7。** 本文的 $\\\\widetilde d_\\\\alpha$ 是「分段」核尺度。若用「光滑化」的分段（如用磨光函数连接三段），$\\\\widetilde d_\\\\alpha$ 是否仍非拟度量？（提示：光滑化不改变 $F$ 段的渐近行为，仍非拟度量。）\\n\\n## 7.27 本章技术总结与全文定位（扩充）\\n\\n**技术总结（扩充）。** 本章证明命题 1.4 的完整链条：拟度量定义（§7.2）→ 命题陈述（§7.3）→ $\\\\sigma\u003e0$ 反例（§7.4）→ $\\\\sigma\u003c0$ 反例（§7.5，已修正指数）→ $\\\\sigma=0$ 退化（§7.6）→ 几何障碍（§7.7）。核心机制是「$F$ 段修正 $2^{\\\\pm\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota}$ 破坏拟三角」。\\n\\n**全文定位（扩充）。** 本章是「收官」：第 1 章问「为什么反平方势特殊」（$V\\\\notin RH_{n/2}$），第 7 章答「为什么核尺度非度量」（$\\\\sigma\\\\neq0$）。首尾呼应，构成完整闭环。七章合起来，从「问题」到「几何」到「分析」到「障碍」，完整精读了论文。\\n\\n**开放疑问（最终）。** (1) 拟度量等价的最优刻画；(2) $\\\\widetilde d_\\\\alpha$ 满足的最弱三角型不等式；(3) 核尺度框架在更一般势下的推广；(4) 加权/端点估计的完整推导。这些为后续研究方向。\\n\\n## 7.28 全书完整自测清单\\n\\n作为全书收尾，这里给一份「全书自测清单」，覆盖七章的核心点：\\n\\n1. （ch1）写出 $L_a$ 的 Friedrichs 自伴扩张、Hardy 临界常数、$\\\\sigma$ 参数化、$V\\\\notin RH_{n/2}$。\\n2. （ch2）构造标准二进网格，证明剖分/嵌套，说明相邻覆盖与 $3^n$ 平移。\\n3. （ch3）证明引理 2.1（相位构造、$d^*=1/M$）。\\n4. （ch4）构造 $n+1$ 系统，验证剖分/嵌套/边长三性质（定理 1.1）。\\n5. （ch5）证明局部相邻覆盖（定理 1.2），含尺度选择、鸽笼、两个 case。\\n6. （ch6）定义三层区域与分段核尺度，证明定理 1.3（核估计）。\\n7. （ch7）证明命题 1.4（非拟度量），含两个 case 反例。\\n\\n若以上 7 条都能独立完成，则全书七章已完整掌握。\\n\\n## 7.29 命题 1.4 与论文 Abstract 的对应\\n\\n论文 Abstract 的最后一句说「we further show that this kernel scale is not a global quasi-metric unless the potential vanishes, thereby clarifying the geometric obstruction underlying the inverse-square potential」。命题 1.4 正是这句话的严格形式，这里逐句对应。\\n\\n**「kernel scale is not a global quasi-metric」。** 对应命题 1.4 的「$\\\\widetilde d_\\\\alpha$ 不承认等价全局拟度量」（$\\\\sigma\\\\neq0$）。\\n\\n**「unless the potential vanishes」。** 对应 Remark 6.1 的「仅当 $\\\\sigma=0$（$a=0$）时 $\\\\widetilde d_\\\\alpha=|x-y|$ 是真度量」。势消失 $\\\\iff a=0\\\\iff\\\\sigma=0$。\\n\\n**「clarifying the geometric obstruction」。** 对应本章 §7.7 的「几何障碍」：$\\\\sigma\\\\neq0$ 使 $F$ 段修正破坏拟三角，核尺度无法升级为度量。\\n\\n**「underlying the inverse-square potential」。** 对应「反平方势 $a|x|^{-2}$ 的临界奇异」（第 1 章 $V\\\\notin RH_{n/2}$）是「几何障碍」的根源。\\n\\n**逐句对应总结。** 论文 Abstract 的每一句都在正文有对应：构造（定理 1.1）→ 覆盖（定理 1.2）→ 核尺度（定理 1.3）→ 非拟度量（命题 1.4）→ 障碍（本章）。本章把 Abstract 的「收尾句」兑现为完整证明。\\n\\n## 7.30 本章的「教学要点」小结\\n\\n作为「精读讲义」，本章的核心教学要点（读者应掌握的「最小集合」）如下：\\n\\n1. **拟度量的定义**（拟三角不等式 $d(x,z)\\\\le C(d(x,y)+d(y,z))$）；\\n2. **命题 1.4 的结论**（$\\\\sigma\\\\neq0$ 非拟度量、$\\\\sigma=0$ 退化）；\\n3. **$\\\\sigma\u003e0$ 反例**（$y\\\\to$ 原点使绕路 $\\\\to0$）；\\n4. **$\\\\sigma\u003c0$ 反例**（$x\\\\to$ 原点使直线/绕路比值 $\\\\to\\\\infty$）；\\n5. **$F$ 段修正是根源**（$2^{\\\\pm\\\\frac{\\\\sigma}{n-\\\\alpha}\\\\iota}$）；\\n6. **几何障碍**（$\\\\sigma\\\\neq0$ 使核尺度无法升级为度量）。\\n\\n这六点是本章的「骨架」，其余内容（几何图像、反证法、Γ 度量、自足性、历史注记等）都是对骨架的展开与解释。\\n\\n## 7.31 全书七章的「完整地图」\\n\\n作为全书的最终收尾，这里给一张「七章地图」，把全文的「问题 → 几何 → 分析 → 障碍」串起来。\\n\\n**问题层（ch1）。** 反平方势算子 $L_a$、$V\\\\notin RH_{n/2}$、参数 $\\\\sigma$、相邻覆盖问题。核心问题：能否构造相邻系统并统一核估计？\\n\\n**几何层（ch2–ch5）。** 标准网格（ch2）→ 相位与 $d^*$（ch3）→ $n+1$ 系统（ch4）→ 相邻覆盖（ch5）。核心工具：$d^*\u003e0$、可接受裁剪、鸽笼论证。\\n\\n**分析层（ch6）。** 三层区域 $U/N/F$、局部二进尺度 $\\\\delta_{\\\\rm dy}$、分段核尺度 $\\\\widetilde d_\\\\alpha$、核估计（定理 1.3）。核心结果：$K_\\\\alpha\\\\sim\\\\widetilde d_\\\\alpha^{\\\\alpha-n}$。\\n\\n**障碍层（ch7）。** 拟度量、非拟度量（命题 1.4）、几何障碍。核心结论：$\\\\sigma\\\\neq0$ 时核尺度非度量。\\n\\n**地图总结。** 四层递进：问题 → 几何（构造）→ 分析（核估计）→ 障碍（澄清）。每一层都精确对应论文的一节（§1 → §2–4 → §5–6.1 → §6.2），七章讲义完整覆盖论文全部内容。\\n\\n## 7.32 最终交付说明\\n\\n本章完成并出版后，全部七章 ready，即可执行 `publish book` 汇编成书。\\n\\n**汇编内容。** 封面、可点击目录、连续页码、编号公式、参考文献（从各章 sources 聚合）。\\n\\n**汇编校验。** `publish book` 只做排版/编译/页数/哈希校验，不验证命题真伪（命题真伪由各章 数学审查与最终复核 的 AI 自审记录，不等同于独立专家认证）。\\n\\n**最终交付。** book.tex + book.pdf（全书一册），加上各章 ch1–ch7 的独立 TeX/PDF。全书在网页 http://127.0.0.1:51535/ 提供下载入口。\\n\\n**诚实声明。** 全书经 AI 辅助生成与自审，不等同于人工数学认证；背景结果（核估计 (2)、定理 A、[3] 系统）按原文陈述，未逐行重证；命题 1.4 等论文自身结论已给完整证明并自审。\\n\\n## 7.10 本章小结与全书收尾\\n\\n**小结。** 本章证明命题 1.4：$\\\\sigma\\\\neq0$ 时 $\\\\widetilde d_\\\\alpha$ 非拟度量（$\\\\sigma\u003e0$ 与 $\\\\sigma\u003c0$ 两个反例），$\\\\sigma=0$ 时退化为度量。这澄清了反平方势的几何障碍：核尺度不能升级为度量。\\n\\n**全书收尾。** 七章合起来回答了论文的核心问题：能否构造相邻二进系统并统一核估计？（能，定理 1.1、1.2、1.3）核尺度是度量吗？（否，命题 1.4）。第 1 章建立算子与问题，第 2–5 章建立几何（标准网格、相位、$n+1$ 系统、相邻覆盖），第 6 章转化为核估计，第 7 章澄清几何障碍。全书自洽完整。\\n\\n**关键记号速查。** $\\\\widetilde d_\\\\alpha$（分段核尺度）；拟三角不等式 $d(x,z)\\\\le C(d(x,y)+d(y,z))$；$\\\\kappa=-\\\\sigma/(n-\\\\alpha)$；$\\\\sigma$（参数）。\\n\\n**开放疑问。** 拟度量等价的精确刻画、$\\\\widetilde d_\\\\alpha$ 满足的「最弱」三角型不等式、核尺度在更一般势下的推广，均为后续方向。\\n\",\n  \"claims\": [\n    {\n      \"id\": \"ch7-claim-nonquasimetric\",\n      \"fact_id\": \"fact-prop14-non-quasimetric\",\n      \"statement\": \"σ≠0 时 d̃_α 非拟度量；σ=0 时 d̃_α=|x-y| 是度量。\",\n      \"source_type\": \"literature\",\n      \"nature\": \"theorem\",\n      \"assumptions\": [\n        \"σ≠0\",\n        \"0\u003cα\u003cn\",\n        \"n-α-2σ\u003e0\"\n      ]\n    }\n  ],\n  \"sources\": [\n    {\n      \"id\": \"source-paper\",\n      \"title\": \"Adjacent Dyadic Systems and Piecewise Kernel Scales for Schrödinger Operators with Inverse-Square Potentials\",\n      \"version\": \"本地 PDF（需精读论文.pdf）\",\n      \"locator\": \"§6.2\",\n      \"checked_scope\": \"§6.2 全文\",\n      \"url\": \"\"\n    }\n  ],\n  \"graph\": {\n    \"nodes\": [],\n    \"edges\": []\n  },\n  \"review\": {\n    \"task_id\": 197,\n    \"token\": \"K7gLe1jOQRTiQjmE_gJHPiaOYkyPV5-c\",\n    \"provenance\": {\n      \"actor\": \"deepseek-v4-pro (host AI agent, final_review role)\",\n      \"review_mode\": \"self-review\",\n      \"tools_used\": [\n        \"deepread runner\"\n      ],\n      \"limitations\": []\n    },\n    \"verdict\": \"pass\",\n    \"findings\": [],\n    \"fact_usage_checks\": [\n      {\n        \"id\": \"fact-prop14-non-quasimetric\",\n        \"revision\": 1,\n        \"verdict\": \"pass\",\n        \"evidence\": \"事实引用使用一致。\"\n      }\n    ]\n  },\n  \"fact_refs\": [\n    {\n      \"id\": \"fact-prop14-non-quasimetric\",\n      \"revision\": 1\n    }\n  ],\n  \"visuals\": [],\n  \"profile_revision\": 1,\n  \"plan_revision\": 1,\n  \"e function md(s){let out=[],code=false,math=false,block=[];for(const line of String(s||'').split('\n')){if(line.startsWith('```')&&!math){if(code){out.push('<pre><code>'+esc(block.join('\n'))+'</code></pre>');block=[]}code=!code;continue}if(code){block.push(line);continue}if(line.trim()==='$$'){if(math){out.push('<div class="math-block">$$\n'+esc(block.join('\n'))+'\n$$</div>');block=[]}math=!math;continue}if(math){block.push(line);continue}let m=line.match(/^(#{1,6})\s+(.*)/);if(m){out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`)}else if(line.startsWith('> ')){out.push('<blockquote>'+inline(line.slice(2))+'</blockquote>')}else if(/^[-*] /.test(line)){out.push('<p>• '+inline(line.slice(2))+'</p>')}else if(line.trim()){out.push('<p>'+inline(line)+'</p>')}}if(code||math)out.push('<pre>'+esc(block.join('\n'))+'</pre>');return out.join('\n')}
