function current(){return state.chapters.find(c=>c.id===selected)}
function render(){if(!state)return;$('title').textContent=state.topic;$('summary').innerHTML=`<span class="badge">${state.paused?'已暂停':'允许运行'}</span><span class="badge">间隔 ${state.interval_seconds/60} 分钟</span><span class="badge">${state.chapters.filter(c=>c.version).length} / ${state.chapters.length} 章已交付</span>`;$('nav').replaceChildren();for(const [id,label] of [['overview','总纲讲义'],['popular','科普导读'],['map','知识地图'],['framework','全书框架'],...(state.fact_graph?.enabled?[['facts','事实图谱']]:[]),['profile','读者画像与问答'],...(state.mode==='guided'?[['routes','个性化路线'],['evidence','证据与检查点']]:[]),...state.chapters.map(c=>[c.id,c.title])]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{selected=id;render()};if(id===selected)b.style.borderColor='#e8720c';$('nav').append(b)}
let title='',body='';const ov=state.overview;if(selected==='overview'){title='总纲讲义';body=artifactsView()+downloadsView()+md(state.reading_plan?.outline_md||ov?.outline_md||'材料已绑定。请先运行总纲任务。')+(state.reading_plan?'<details><summary>查看画像确认前的临时总纲</summary>'+md(ov?.outline_md)+'</details>':'')}else if(selected==='popular'){title='科普导读';body=md(ov?.popular_md||'总纲任务同时生成科普导读。')}else if(selected==='profile'){title='读者画像与诊断';body='<h2>诊断问题</h2>'+md((ov?.questions||[]).map((q,i)=>`${i+1}. ${typeof q==='string'?q:JSON.stringify(q)}`).join('\n'))+'<textarea id="answers" placeholder="请按编号回答，也可以说明阅读目标和偏好。"></textarea><button id="sendAnswers">提交回答，生成画像</button><h2>当前画像</h2><pre>'+esc(JSON.stringify(state.profile,null,2))+'</pre><button id="approveProfile">确认画像，规划阅读路线</button><button id="approvePilot">已试读首章，允许继续</button><p class="muted">每次重新诊断后，需要再次确认画像；已有画像和实际回答仍保留在任务历史中。</p>'}else if(selected==='facts'){title='命题、依据与阅读桥梁';body=factsView()}else if(selected==='routes'){title='个性化阅读路线';body=routeView()}else if(selected==='evidence'){title='证据与恢复检查点';body=evidenceView()}else if(selected==='map'){title='知识地图';body='<p class="muted">实线：证明依赖或包含；虚线：启发或类比。图示不替代证明。</p><div class="graph-wrap" id="graph"></div>'}else if(selected==='framework'){title='全书框架';body=artifactsView()+(state.overview_map_svg?('<p class="muted">橙色为当前主路线；依赖细节见「知识地图」。本图由脚本从数据库状态生成，仅用于确认全局结构。</p><div class="graph-wrap">'+state.overview_map_svg+'</div>'):'<p>尚未生成总纲框架图；请运行 <code>publish overview-map</code> 后刷新本页。</p>')}else{const ch=current();if(ch){title=ch.title;const data=JSON.parse(ch.content);body=`<span class="badge">${esc(statusNames[ch.status]||ch.status)}</span><span class="badge">版本 ${ch.version}</span>`+downloadsView(ch.id)+(ch.status==='stale'?'<p class="warn">前置内容已有更新，本章需重新核查，暂不纳入汇编。</p>':'')+(state.fact_graph?.enabled?'<details><summary>查看本章事实依据与版本</summary><div class="toolbar">'+factButtons(data.fact_refs)+'</div></details>':'')+md((data.content_md||'尚未交付；请查看执行任务。').replace(/^# .*\n/,''))+'<div id="visuals"></div>'+'<details><summary>来源、论断与审读记录</summary><pre>'+esc(JSON.stringify({sources:data.sources,claims:data.claims,review:data.review},null,2))+'</pre></details><div class="graph-wrap" id="graph"></div>'}}
$('heading').textContent=title;$('body').innerHTML=body;
if(current()){const hs=[...$('body').querySelectorAll('h2,h3')].filter(h=>!h.closest('details'));if(hs.length){const toc=document.createElement('details');toc.className='reading-toc';const summary=document.createElement('summary');summary.textContent='讲义目录 · 点击展开';toc.append(summary);hs.forEach((h,i)=>{h.id='reading-section-'+i;const a=document.createElement('a');a.textContent=h.textContent;a.href='#'+h.id;a.style.paddingLeft=h.tagName==='H3'?'18px':'0';a.onclick=e=>{e.preventDefault();h.scrollIntoView({behavior:'smooth',block:'start'})};toc.append(a)});const p=$('body').querySelector('p,blockquote,h2');if(p)p.before(toc);else $('body').append(toc)}}
if(selected==='profile'){$('sendAnswers').onclick=()=>action('answers',{answers:$('answers').value});$('approveProfile').onclick=()=>action('approve',{what:'profile'});$('approvePilot').onclick=()=>action('approve',{what:'pilot'})}
if(current())drawVisuals(JSON.parse(current().content).visuals||[]);
if(selected==='facts'){const g=state.fact_graph;drawGraph({nodes:g.nodes.map(n=>({id:n.id,label:n.id,subtitle:'v'+n.revision+' · '+(factStatus[n.status]||n.status)})),edges:g.edges},n=>showFact(n.id));if(g.nodes.length)showFact(selectedFact||g.nodes[0].id)}
if(selected==='map')drawGraph(aggregateGraph());else if(current())drawGraph(JSON.parse(current().content).graph||{nodes:[],edges:[]});
const ch=current();$('learning').textContent=ch?state.learning.filter(l=>l.chapter===ch.id).map(l=>`${l.reader} · v${l.version} · ${l.status}`).join('；'):'请选择一个已有版本的章节。';
const pending=state.tasks.find(t=>t.status==='pending');$('next').textContent=pending?'下一项最早启动：'+new Date(pending.due*1000).toLocaleString()+'（需运行器在线）':'暂无待运行任务；可能需要问答、确认或已完成。';$('tasklist').innerHTML=state.tasks.slice(-12).reverse().map(t=>`<div class="task">#${t.id} ${esc(t.chapter||'全局')} · ${esc(t.kind)}<br>${esc(statusNames[t.status]||t.status)}${t.error?'<br>'+esc(t.error):''}</div>`).join('');if(window.MathJax?.typesetPromise)window.MathJax.typesetPromise([$ ('body')]).catch(()=>{})}
function routeView(){const p=state.reading_plan;if(!p)return '<p>等待真人确认画像后，规划者会重新组织章节与知识桥梁。</p>';return '<p>'+esc(p.rationale)+'</p>'+p.routes.map(r=>'<section class="card"><span class="badge">'+(r.status==='selected'?'当前主路线':'暂缓路线')+'</span><h2>'+esc(r.title)+'</h2><p>'+esc(r.reason)+'</p><p class="muted">重新考虑条件：'+esc(r.revisit_when)+'</p></section>').join('')+p.chapters.map(c=>'<section class="card"><h3>'+esc(c.title)+'</h3><p><strong>目标：</strong>'+esc(c.objective)+'</p><p><strong>知识桥梁：</strong>'+esc(c.bridge)+'</p><p><strong>原文锚点：</strong>'+esc(c.paper_anchor)+'</p><p><strong>展开深度：</strong>'+esc(c.depth)+'</p><p><strong>停止补课条件：</strong>'+esc(c.stop_when)+'</p></section>').join('')}
function evidenceView(){return '<p class="warn">AI 审查记录不等于形式化认证，也不代表真人已经理解。版本变化后，旧记录只保留为历史。</p>'+(state.evidence||[]).map(e=>'<details><summary>'+esc(e.chapter)+' · '+esc(e.status)+' · 画像 v'+e.profile_revision+'</summary><pre>'+esc(JSON.stringify(e,null,2))+'</pre></details>').join('')+'<h2>最近检查点</h2>'+(state.checkpoints||[]).map(c=>'<details><summary>#'+c.id+' · '+esc(c.reason)+'</summary><pre>'+esc(JSON.stringify(c,null,2))+'</pre></details>').join('')}
function drawVisuals(visuals){const host=$('visuals');if(!host)return;for(const v of visuals){if(v.type!=='steps')continue;let step=0;const card=document.createElement('section');card.className='card';const renderStep=()=>{const item=v.steps[step];card.innerHTML='<h3>'+esc(v.title)+'</h3><p class="muted">'+esc(v.purpose)+'</p><div class="badge">'+(step+1)+' / '+v.steps.length+'</div><h3>'+esc(item.label)+'</h3><p>'+inline(item.explanation)+'</p><div class="toolbar"><button class="step-prev">上一步</button><button class="step-next">下一步</button></div><p class="muted">'+esc(v.limitation)+'</p>';const prev=card.querySelector('.step-prev'),next=card.querySelector('.step-next');prev.disabled=step===0;next.disabled=step===v.steps.length-1;prev.onclick=()=>{step--;renderStep()};next.onclick=()=>{step++;renderStep()};if(window.MathJax?.typesetPromise)window.MathJax.typesetPromise([card]).catch(()=>{})};host.append(card);renderStep()}}
function aggregateGraph(){const nodes=new Map(),edges=new Map();const graphs=[state.overview?.graph,...state.chapters.filter(c=>c.version).map(c=>JSON.parse(c.content).graph)];for(const g of graphs){if(!g)continue;for(const n of g.nodes){const old=nodes.get(n.id)||{};nodes.set(n.id,{...old,...n,fact_ids:[...new Set([...(old.fact_ids||[]),...(n.fact_ids||[])])]})};for(const e of g.edges)edges.set(e.source+'|'+e.target+'|'+e.relation,e)}return {nodes:[...nodes.values()],edges:[...edges.values()]}}
function drawGraph(g,onSelect){const el=$('graph');if(!el)return;if(!g.nodes?.length){el.textContent='此阶段尚未生成知识图。';return}const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');const cols=2,w=660,h=Math.ceil(g.nodes.length/cols)*125+40;svg.setAttribute('viewBox',`0 0 ${w} ${h}`);const defs=document.createElementNS(ns,'defs');defs.innerHTML='<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8295ae"/></marker>';svg.append(defs);const pos={};g.nodes.forEach((n,i)=>pos[n.id]={x:25+(i%cols)*325,y:25+Math.floor(i/cols)*125});for(const e of g.edges){if(!pos[e.source]||!pos[e.target])continue;const a=pos[e.source],b=pos[e.target],line=document.createElementNS(ns,'line');for(const [k,v]of Object.entries({x1:a.y===b.y?a.x+285:a.x+140,y1:a.y===b.y?a.y+35:a.y+70,x2:a.y===b.y?b.x:b.x+140,y2:a.y===b.y?b.y+35:b.y,stroke:'#8295ae','stroke-width':2,'marker-end':'url(#arrow)'}))line.setAttribute(k,v);if(['analogy','motivates'].includes(e.relation))line.setAttribute('stroke-dasharray','6 4');svg.append(line)}for(const n of g.nodes){const p=pos[n.id],gr=document.createElementNS(ns,'g');gr.setAttribute('class','node');gr.setAttribute('tabindex','0');const rect=document.createElementNS(ns,'rect');for(const[k,v]of Object.entries({x:p.x,y:p.y,width:285,height:70,rx:6,fill:'#e3ebf5',stroke:'#3f6491'}))rect.setAttribute(k,v);gr.append(rect);const txt=document.createElementNS(ns,'text');txt.setAttribute('x',p.x+14);txt.setAttribute('y',p.y+30);txt.setAttribute('fill','#1a2e4b');txt.setAttribute('font-size','15');txt.textContent=(n.label||n.id).slice(0,22);gr.append(txt);const sub=document.createElementNS(ns,'text');sub.setAttribute('x',p.x+14);sub.setAttribute('y',p.y+53);sub.setAttribute('font-size','11');sub.textContent=n.subtitle||({definition:'定义',theorem:'定理',question:'问题',method:'方法',example:'例子'})[n.kind]||'知识节点';gr.append(sub);const show=()=>{if(onSelect){onSelect(n);return}$('nodeDetail').innerHTML='<strong>'+esc(n.label||n.id)+'</strong><p>'+esc(n.description||'')+'</p><p>来源：'+esc(n.source||'未指定')+'</p><p>核查状态：'+esc(n.status||'待核查')+'</p><p>'+g.edges.filter(e=>e.source===n.id||e.target===n.id).map(e=>esc(`${e.source} → ${e.target}：${({depends:'证明依赖',contains:'包含',analogy:'类比',motivates:'启发'})[e.relation]}`)).join('<br>')+'</p>';if(n.chapter){const b=document.createElement('button');b.textContent='阅读对应章节';b.onclick=()=>{selected=n.chapter;render()};$('nodeDetail').append(b)}factNodeExtras(n)};gr.onclick=show;gr.onkeydown=e=>{if(e.key==='Enter')show()};svg.append(gr)}el.append(svg)}
function sendFeedback(){const c=current();if(!c?.version)return notify('请先选择已有交付版本的章节。');action('feedback',{chapter:c.id,message:$('feedback').value})}
function saveLearning(){const c=current();if(!c?.version)return notify('请先选择已有交付版本的章节。');action('learning',{reader:$('reader').value,chapter:c.id,status:$('understanding').value})}
const factStatus={candidate:'候选 · 待核查',ai_reviewed:'AI 已核查',blocked:'核查未通过',stale:'依据待复核',revoked:'已撤回'};
let selectedFact=null;
function factButtons(refs){return (refs||[]).map(r=>'<button data-fact="'+esc(r.id)+'" data-revision="'+r.revision+'">'+esc(r.id)+' · v'+r.revision+'</button>').join(' ')}
function factsView(){const g=state.fact_graph;if(!g?.enabled)return '<p>此项目尚未启用事实图。</p>';return '<p>事实图保存命题及其论证依据；知识地图组织概念；章节安排阅读顺序；读者画像决定知识桥梁。</p><p class="warn">箭头从前置依据指向后继命题。AI 已核查不等于形式化证明或真人已掌握。</p><span class="badge">事实图修订 '+g.revision+'</span><span class="badge">'+g.nodes.length+' 个命题</span><div class="graph-wrap" id="graph"></div><section class="card" id="factDetail"><p>点击命题，查看版本、条件和关联材料。</p></section><h2>概念与读者的连接</h2>'+Object.entries(g.concepts).map(([id,r])=>'<section class="card"><h3>'+esc(r.concept.label)+'</h3><p>'+esc(r.concept.description)+'</p><p><strong>阅读准备：</strong>'+esc(r.learning_need)+'</p><p class="muted">'+esc(r.ability?('画像记录：'+r.ability.concept+' · '+r.ability.level+'；依据：'+r.ability.evidence):'尚无画像映射，不能推定掌握或不掌握。')+'</p><p>'+esc(r.mapping_reason||'')+'</p><div class="toolbar">'+g.nodes.filter(n=>n.payload.concept_ids.includes(id)).map(n=>'<button data-fact="'+esc(n.id)+'">'+esc(n.id)+'</button>').join('')+'</div></section>').join('')}
function showFact(id,revision){const n=state.fact_graph.nodes.find(n=>n.id===id),host=$('factDetail');if(!n||!host)return;selectedFact=id;const v=revision?n.history.find(v=>v.revision===Number(revision)):n;if(!v){host.textContent='找不到该历史版本。';return}const p=v.payload;const downstream=new Set([id]);let count=0;do{count=downstream.size;for(const e of state.fact_graph.edges)if(downstream.has(e.source))downstream.add(e.target)}while(downstream.size>count);host.innerHTML='<h2>'+esc(id)+' · v'+v.revision+'</h2><span class="badge">'+esc(factStatus[v.status]||v.status)+'</span><span class="badge">'+esc(p.evidence_kind)+'</span>'+(v.revision!==n.revision?'<p class="warn">正在查看历史修订；当前修订为 v'+n.revision+'。</p>':'')+md(p.statement)+'<h3>假设与边界</h3>'+md(p.assumptions.map(x=>'- '+x).join('\n'))+md(p.limitations.map(x=>'- '+x).join('\n'))+'<h3>前置事实</h3><div class="toolbar">'+(factButtons(p.depends)||'无已声明的前置事实。')+'</div><h3>所需概念与准备</h3>'+p.concept_ids.map(c=>{const r=state.fact_graph.concepts[c];return '<p><strong>'+esc(r?.concept.label||c)+'</strong>：'+esc(r?.learning_need||'待诊断')+'</p>'}).join('')+'<h3>使用该事实的章节</h3><div class="toolbar">'+(n.chapter_uses.map(c=>'<button data-chapter="'+esc(c.id)+'">'+esc(c.title)+' · v'+c.version+'</button>').join('')||'尚无已交付章节引用。')+'</div><p class="muted">这里显示当前章节引用；选择历史事实版本不会把章节切换为历史正文。</p><h3>当前依赖影响范围</h3><p>'+esc([...downstream].join('、'))+'</p><p class="muted">列出可达节点集合，不表示它们一定构成一条线性链；依据变化只意味着需复核。</p><details><summary>展开证明或证据</summary>'+md(p.proof_or_evidence)+'</details><details><summary>来源、核查记录与哈希</summary><pre>'+esc(JSON.stringify({sources:p.sources,locator:p.locator,review:v.review,hash:v.hash,provenance:v.provenance},null,2))+'</pre></details><h3>保留的修订</h3><div class="toolbar">'+factButtons(n.history.map(v=>({id,revision:v.revision})))+'</div>';if(window.MathJax?.typesetPromise)window.MathJax.typesetPromise([host]).catch(()=>{})}
function factNodeExtras(n){const box=$('nodeDetail'),g=state.fact_graph;if(!g?.enabled)return;const r=g.concepts[n.concept_id];if(r){const p=document.createElement('p');p.textContent='阅读准备：'+r.learning_need;box.append(p)}for(const id of n.fact_ids||[]){const b=document.createElement('button');b.textContent='事实：'+id;b.onclick=()=>{selected='facts';selectedFact=id;render()};box.append(b)}}
$('body').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.fact){selectedFact=b.dataset.fact;selected='facts';render();showFact(selectedFact,b.dataset.revision)}else if(b.dataset.chapter){selected=b.dataset.chapter;render()}});

render();setInterval(()=>{if(token&&!['TEXTAREA','INPUT','SELECT'].includes(document.activeElement?.tagName))refresh()},15000);
</script></body></html>
