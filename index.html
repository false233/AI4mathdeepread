        "rationale": "默认读者分析/Fourier/Sobolev/泛函基础扎实，但缺本文专用二进几何工具。故先以 ch1 建立算子与几何问题，ch2 补标准二进网格与相邻覆盖动机，再沿相位构造→n+1系统→局部覆盖→核尺度→非拟度量推进；深度上论文自身结论完整证明，背景结果按原文陈述并标注。",
        "outline_md": "# 个性化精读路线总纲：反平方势薛定谔算子的相邻二进系统与分段核尺度\n\n\u003e 依据已确认画像（默认「数学系本科毕业生」，用户明确指示采用默认画像）制定。读者已具备数学分析、测度论、泛函分析、Fourier 分析、Sobolev 空间基础；本文专用工具（二进网格相邻覆盖、临界半径函数与 $RH_p$ 类、反平方势的 Friedrichs 扩张、Riesz 位势核、稀疏支配、拟度量）逐章设桥梁。\n\n## 一、问题与目标\n\n论文研究反平方势薛定谔算子 $L_a=-\\Delta+\\frac{a}{|x|^2}$（$n\\ge3$，$a\\ge-((n-2)/2)^2$，Friedrichs 自伴扩张）。要建立尖锐定量估计，需要与算子内蕴几何相适应的二进系统；单系统缺相邻覆盖性质，经典 $3^n$ 平移技巧因自适应边长失效。论文的答案是：$n+1$ 个相邻二进系统（定理 1.1）+ 局部相邻覆盖（定理 1.2）+ 分段核尺度统一 Riesz 位势核估计（定理 1.3），并证明该核尺度非拟度量（命题 1.4）。\n\n**阅读目标**：能复述每个主要定理的精确假设与结论；能补出 Lemma 2.1、Lemma 3.1、Lemma 5.2 与定理 1.2、1.3、命题 1.4 的关键推导；能说明 $d^*\u003e0$ 与 $\\sigma\\neq0$ 这两个量如何分别控制覆盖效率与「核尺度非度量」的几何障碍。\n\n## 二、主路线\n\n**ch1 → ch2 → ch3 → ch4 → ch5 → ch6 → ch7**（必读主线）。ch1 建立算子与几何问题；ch2 补标准二进网格与相邻覆盖动机（选读性质，可与 ch1 并读）；ch3–ch5 完成 n+1 系统构造与覆盖证明（核心）；ch6 建立核尺度并证定理 1.3；ch7 证命题 1.4（选读但建议读）。\n\n## 三、概念底座与桥梁\n\n- 已掌握直接引用：Hölder/Minkowski、控制收敛、Fubini、紧性与弱收敛、Fourier 变换、标准 Sobolev 空间记号。\n- 每章在使用本文专用工具前设知识桥梁：标准二进网格与相邻覆盖（ch2）；相对距离与相位构造（ch3）；反平方势的 Friedrichs 扩张与 Hardy 常数（ch1）；临界半径函数与 $RH_{n/2}$（ch1）；Riesz 位势核估计 (2)（ch6）；拟度量（ch7）。\n\n## 四、核心结果与条件（摘要）\n\n- 定理 1.1：$n+1$ 系统 $D_{V,(i)}$，剖分/嵌套/边长 $\\ell(Q)\\sim2^{-k}|x|$。\n- 定理 1.2：$r\\le\\frac{d^*}{36}|x|_\\infty$ 时存在 $Q\\in D_{V,(i)}$，$J\\subseteq Q$，$\\ell(Q)\\le\\frac4{d^*}r$。\n- 定理 1.3：$0\u003c\\alpha\u003cn$，$n-\\alpha-2\\sigma\u003e0$ 时 $K_\\alpha(x,y)\\sim\\widetilde d_\\alpha(x,y)^{\\alpha-n}$。\n- 命题 1.4：$\\sigma\\neq0$ 时 $\\widetilde d_\\alpha$ 无等价全局拟度量；$\\sigma=0$ 时 $\\widetilde d_\\alpha=|x-y|$。\n\n## 五、必读 / 选读 / 暂不展开\n\n- 必读：ch1、ch3、ch4、ch5、ch6；选读：ch2、ch7。\n- 暂不展开：稀疏支配的完整机器与端点/加权范数估计（作为动机引用）；谱理论精细背景。\n\n## 六、核查边界\n\n背景结果（定理 A [2]、扰动系统 [3]、核估计 (2) [4,3]）按原文陈述并标注来源，不逐行重证；论文自身结论（引理 2.1、3.1、5.2，定理 1.1–1.3，命题 1.4）给完整分步证明并回原文核对。\n",

        "rationale": "默认读者分析/Fourier/Sobolev/泛函基础扎实，但缺本文专用二进几何工具。故先以 ch1 建立算子与几何问题，ch2 补标准二进网格与相邻覆盖动机，再沿相位构造→n+1系统→局部覆盖→核尺度→非拟度量推进；深度上论文自身结论完整证明，背景结果按原文陈述并标注。",
        "outline_md": "# 个性化精读路线总纲：反平方势薛定谔算子的相邻二进系统与分段核尺度\n\n\u003e 依据已确认画像（默认「数学系本科毕业生」，用户明确指示采用默认画像）制定。读者已具备数学分析、测度论、泛函分析、Fourier 分析、Sobolev 空间基础；本文专用工具（二进网格相邻覆盖、临界半径函数与 $RH_p$ 类、反平方势的 Friedrichs 扩张、Riesz 位势核、稀疏支配、拟度量）逐章设桥梁。\n\n## 一、问题与目标\n\n论文研究反平方势薛定谔算子 $L_a=-\\Delta+\\frac{a}{|x|^2}$（$n\\ge3$，$a\\ge-((n-2)/2)^2$，Friedrichs 自伴扩张）。要建立尖锐定量估计，需要与算子内蕴几何相适应的二进系统；单系统缺相邻覆盖性质，经典 $3^n$ 平移技巧因自适应边长失效。论文的答案是：$n+1$ 个相邻二进系统（定理 1.1）+ 局部相邻覆盖（定理 1.2）+ 分段核尺度统一 Riesz 位势核估计（定理 1.3），并证明该核尺度非拟度量（命题 1.4）。\n\n**阅读目标**：能复述每个主要定理的精确假设与结论；能补出 Lemma 2.1、Lemma 3.1、Lemma 5.2 与定理 1.2、1.3、命题 1.4 的关键推导；能说明 $d^*\u003e0$ 与 $\\sigma\\neq0$ 这两个量如何分别控制覆盖效率与「核尺度非度量」的几何障碍。\n\n## 二、主路线\n\n**ch1 → ch2 → ch3 → ch4 → ch5 → ch6 → ch7**（必读主线）。ch1 建立算子与几何问题；ch2 补标准二进网格与相邻覆盖动机（选读性质，可与 ch1 并读）；ch3–ch5 完成 n+1 系统构造与覆盖证明（核心）；ch6 建立核尺度并证定理 1.3；ch7 证命题 1.4（选读但建议读）。\n\n## 三、概念底座与桥梁\n\n- 已掌握直接引用：Hölder/Minkowski、控制收敛、Fubini、紧性与弱收敛、Fourier 变换、标准 Sobolev 空间记号。\n- 每章在使用本文专用工具前设知识桥梁：标准二进网格与相邻覆盖（ch2）；相对距离与相位构造（ch3）；反平方势的 Friedrichs 扩张与 Hardy 常数（ch1）；临界半径函数与 $RH_{n/2}$（ch1）；Riesz 位势核估计 (2)（ch6）；拟度量（ch7）。\n\n## 四、核心结果与条件（摘要）\n\n- 定理 1.1：$n+1$ 系统 $D_{V,(i)}$，剖分/嵌套/边长 $\\ell(Q)\\sim2^{-k}|x|$。\n- 定理 1.2：$r\\le\\frac{d^*}{36}|x|_\\infty$ 时存在 $Q\\in D_{V,(i)}$，$J\\subseteq Q$，$\\ell(Q)\\le\\frac4{d^*}r$。\n- 定理 1.3：$0\u003c\\alpha\u003cn$，$n-\\alpha-2\\sigma\u003e0$ 时 $K_\\alpha(x,y)\\sim\\widetilde d_\\alpha(x,y)^{\\alpha-n}$。\n- 命题 1.4：$\\sigma\\neq0$ 时 $\\widetilde d_\\alpha$ 无等价全局拟度量；$\\sigma=0$ 时 $\\widetilde d_\\alpha=|x-y|$。\n\n## 五、必读 / 选读 / 暂不展开\n\n- 必读：ch1、ch3、ch4、ch5、ch6；选读：ch2、ch7。\n- 暂不展开：稀疏支配的完整机器与端点/加权范数估计（作为动机引用）；谱理论精细背景。\n\n## 六、核查边界\n\n背景结果（定理 A [2]、扰动系统 [3]、核估计 (2) [4,3]）按原文陈述并标注来源，不逐行重证；论文自身结论（引理 2.1、3.1、5.2，定理 1.1–1.3，命题 1.4）给完整分步证明并回原文核对。\n",

        "rationale": "默认读者分析/Fourier/Sobolev/泛函基础扎实，但缺本文专用二进几何工具。故先以 ch1 建立算子与几何问题，ch2 补标准二进网格与相邻覆盖动机，再沿相位构造→n+1系统→局部覆盖→核尺度→非拟度量推进；深度上论文自身结论完整证明，背景结果按原文陈述并标注。",
        "outline_md": "# 个性化精读路线总纲：反平方势薛定谔算子的相邻二进系统与分段核尺度\n\n\u003e 依据已确认画像（默认「数学系本科毕业生」，用户明确指示采用默认画像）制定。读者已具备数学分析、测度论、泛函分析、Fourier 分析、Sobolev 空间基础；本文专用工具（二进网格相邻覆盖、临界半径函数与 $RH_p$ 类、反平方势的 Friedrichs 扩张、Riesz 位势核、稀疏支配、拟度量）逐章设桥梁。\n\n## 一、问题与目标\n\n论文研究反平方势薛定谔算子 $L_a=-\\Delta+\\frac{a}{|x|^2}$（$n\\ge3$，$a\\ge-((n-2)/2)^2$，Friedrichs 自伴扩张）。要建立尖锐定量估计，需要与算子内蕴几何相适应的二进系统；单系统缺相邻覆盖性质，经典 $3^n$ 平移技巧因自适应边长失效。论文的答案是：$n+1$ 个相邻二进系统（定理 1.1）+ 局部相邻覆盖（定理 1.2）+ 分段核尺度统一 Riesz 位势核估计（定理 1.3），并证明该核尺度非拟度量（命题 1.4）。\n\n**阅读目标**：能复述每个主要定理的精确假设与结论；能补出 Lemma 2.1、Lemma 3.1、Lemma 5.2 与定理 1.2、1.3、命题 1.4 的关键推导；能说明 $d^*\u003e0$ 与 $\\sigma\\neq0$ 这两个量如何分别控制覆盖效率与「核尺度非度量」的几何障碍。\n\n## 二、主路线\n\n**ch1 → ch2 → ch3 → ch4 → ch5 → ch6 → ch7**（必读主线）。ch1 建立算子与几何问题；ch2 补标准二进网格与相邻覆盖动机（选读性质，可与 ch1 并读）；ch3–ch5 完成 n+1 系统构造与覆盖证明（核心）；ch6 建立核尺度并证定理 1.3；ch7 证命题 1.4（选读但建议读）。\n\n## 三、概念底座与桥梁\n\n- 已掌握直接引用：Hölder/Minkowski、控制收敛、Fubini、紧性与弱收敛、Fourier 变换、标准 Sobolev 空间记号。\n- 每章在使用本文专用工具前设知识桥梁：标准二进网格与相邻覆盖（ch2）；相对距离与相位构造（ch3）；反平方势的 Friedrichs 扩张与 Hardy 常数（ch1）；临界半径函数与 $RH_{n/2}$（ch1）；Riesz 位势核估计 (2)（ch6）；拟度量（ch7）。\n\n## 四、核心结果与条件（摘要）\n\n- 定理 1.1：$n+1$ 系统 $D_{V,(i)}$，剖分/嵌套/边长 $\\ell(Q)\\sim2^{-k}|x|$。\n- 定理 1.2：$r\\le\\frac{d^*}{36}|x|_\\infty$ 时存在 $Q\\in D_{V,(i)}$，$J\\subseteq Q$，$\\ell(Q)\\le\\frac4{d^*}r$。\n- 定理 1.3：$0\u003c\\alpha\u003cn$，$n-\\alpha-2\\sigma\u003e0$ 时 $K_\\alpha(x,y)\\sim\\widetilde d_\\alpha(x,y)^{\\alpha-n}$。\n- 命题 1.4：$\\sigma\\neq0$ 时 $\\widetilde d_\\alpha$ 无等价全局拟度量；$\\sigma=0$ 时 $\\widetilde d_\\alpha=|x-y|$。\n\n## 五、必读 / 选读 / 暂不展开\n\n- 必读：ch1、ch3、ch4、ch5、ch6；选读：ch2、ch7。\n- 暂不展开：稀疏支配的完整机器与端点/加权范数估计（作为动机引用）；谱理论精细背景。\n\n## 六、核查边界\n\n背景结果（定理 A [2]、扰动系统 [3]、核估计 (2) [4,3]）按原文陈述并标注来源，不逐行重证；论文自身结论（引理 2.1、3.1、5.2，定理 1.1–1.3，命题 1.4）给完整分步证明并回原文核对。\n",

        "rationale": "默认读者分析/Fourier/Sobolev/泛函基础扎实，但缺本文专用二进几何工具。故先以 ch1 建立算子与几何问题，ch2 补标准二进网格与相邻覆盖动机，再沿相位构造→n+1系统→局部覆盖→核尺度→非拟度量推进；深度上论文自身结论完整证明，背景结果按原文陈述并标注。",
        "outline_md": "# 个性化精读路线总纲：反平方势薛定谔算子的相邻二进系统与分段核尺度\n\n\u003e 依据已确认画像（默认「数学系本科毕业生」，用户明确指示采用默认画像）制定。读者已具备数学分析、测度论、泛函分析、Fourier 分析、Sobolev 空间基础；本文专用工具（二进网格相邻覆盖、临界半径函数与 $RH_p$ 类、反平方势的 Friedrichs 扩张、Riesz 位势核、稀疏支配、拟度量）逐章设桥梁。\n\n## 一、问题与目标\n\n论文研究反平方势薛定谔算子 $L_a=-\\Delta+\\frac{a}{|x|^2}$（$n\\ge3$，$a\\ge-((n-2)/2)^2$，Friedrichs 自伴扩张）。要建立尖锐定量估计，需要与算子内蕴几何相适应的二进系统；单系统缺相邻覆盖性质，经典 $3^n$ 平移技巧因自适应边长失效。论文的答案是：$n+1$ 个相邻二进系统（定理 1.1）+ 局部相邻覆盖（定理 1.2）+ 分段核尺度统一 Riesz 位势核估计（定理 1.3），并证明该核尺度非拟度量（命题 1.4）。\n\n**阅读目标**：能复述每个主要定理的精确假设与结论；能补出 Lemma 2.1、Lemma 3.1、Lemma 5.2 与定理 1.2、1.3、命题 1.4 的关键推导；能说明 $d^*\u003e0$ 与 $\\sigma\\neq0$ 这两个量如何分别控制覆盖效率与「核尺度非度量」的几何障碍。\n\n## 二、主路线\n\n**ch1 → ch2 → ch3 → ch4 → ch5 → ch6 → ch7**（必读主线）。ch1 建立算子与几何问题；ch2 补标准二进网格与相邻覆盖动机（选读性质，可与 ch1 并读）；ch3–ch5 完成 n+1 系统构造与覆盖证明（核心）；ch6 建立核尺度并证定理 1.3；ch7 证命题 1.4（选读但建议读）。\n\n## 三、概念底座与桥梁\n\n- 已掌握直接引用：Hölder/Minkowski、控制收敛、Fubini、紧性与弱收敛、Fourier 变换、标准 Sobolev 空间记号。\n- 每章在使用本文专用工具前设知识桥梁：标准二进网格与相邻覆盖（ch2）；相对距离与相位构造（ch3）；反平方势的 Friedrichs 扩张与 Hardy 常数（ch1）；临界半径函数与 $RH_{n/2}$（ch1）；Riesz 位势核估计 (2)（ch6）；拟度量（ch7）。\n\n## 四、核心结果与条件（摘要）\n\n- 定理 1.1：$n+1$ 系统 $D_{V,(i)}$，剖分/嵌套/边长 $\\ell(Q)\\sim2^{-k}|x|$。\n- 定理 1.2：$r\\le\\frac{d^*}{36}|x|_\\infty$ 时存在 $Q\\in D_{V,(i)}$，$J\\subseteq Q$，$\\ell(Q)\\le\\frac4{d^*}r$。\n- 定理 1.3：$0\u003c\\alpha\u003cn$，$n-\\alpha-2\\sigma\u003e0$ 时 $K_\\alpha(x,y)\\sim\\widetilde d_\\alpha(x,y)^{\\alpha-n}$。\n- 命题 1.4：$\\sigma\\neq0$ 时 $\\widetilde d_\\alpha$ 无等价全局拟度量；$\\sigma=0$ 时 $\\widetilde d_\\alpha=|x-y|$。\n\n## 五、必读 / 选读 / 暂不展开\n\n- 必读：ch1、ch3、ch4、ch5、ch6；选读：ch2、ch7。\n- 暂不展开：稀疏支配的完整机器与端点/加权范数估计（作为动机引用）；谱理论精细背景。\n\n## 六、核查边界\n\n背景结果（定理 A [2]、扰动系统 [3]、核估计 (2) [4,3]）按原文陈述并标注来源，不逐行重证；论文自身结论（引理 2.1、3.1、5.2，定理 1.1–1.3，命题 1.4）给完整分步证明并回原文核对。\n",

        "outline_md": "# 个性化精读路线总纲：反平方势薛定谔算子的相邻二进系统与分段核尺度\n\n\u003e 依据已确认画像（默认「数学系本科毕业生」，用户明确指示采用默认画像）制定。读者已具备数学分析、测度论、泛函分析、Fourier 分析、Sobolev 空间基础；本文专用工具（二进网格相邻覆盖、临界半径函数与 $RH_p$ 类、反平方势的 Friedrichs 扩张、Riesz 位势核、稀疏支配、拟度量）逐章设桥梁。\n\n## 一、问题与目标\n\n论文研究反平方势薛定谔算子 $L_a=-\\Delta+\\frac{a}{|x|^2}$（$n\\ge3$，$a\\ge-((n-2)/2)^2$，Friedrichs 自伴扩张）。要建立尖锐定量估计，需要与算子内蕴几何相适应的二进系统；单系统缺相邻覆盖性质，经典 $3^n$ 平移技巧因自适应边长失效。论文的答案是：$n+1$ 个相邻二进系统（定理 1.1）+ 局部相邻覆盖（定理 1.2）+ 分段核尺度统一 Riesz 位势核估计（定理 1.3），并证明该核尺度非拟度量（命题 1.4）。\n\n**阅读目标**：能复述每个主要定理的精确假设与结论；能补出 Lemma 2.1、Lemma 3.1、Lemma 5.2 与定理 1.2、1.3、命题 1.4 的关键推导；能说明 $d^*\u003e0$ 与 $\\sigma\\neq0$ 这两个量如何分别控制覆盖效率与「核尺度非度量」的几何障碍。\n\n## 二、主路线\n\n**ch1 → ch2 → ch3 → ch4 → ch5 → ch6 → ch7**（必读主线）。ch1 建立算子与几何问题；ch2 补标准二进网格与相邻覆盖动机（选读性质，可与 ch1 并读）；ch3–ch5 完成 n+1 系统构造与覆盖证明（核心）；ch6 建立核尺度并证定理 1.3；ch7 证命题 1.4（选读但建议读）。\n\n## 三、概念底座与桥梁\n\n- 已掌握直接引用：Hölder/Minkowski、控制收敛、Fubini、紧性与弱收敛、Fourier 变换、标准 Sobolev 空间记号。\n- 每章在使用本文专用工具前设知识桥梁：标准二进网格与相邻覆盖（ch2）；相对距离与相位构造（ch3）；反平方势的 Friedrichs 扩张与 Hardy 常数（ch1）；临界半径函数与 $RH_{n/2}$（ch1）；Riesz 位势核估计 (2)（ch6）；拟度量（ch7）。\n\n## 四、核心结果与条件（摘要）\n\n- 定理 1.1：$n+1$ 系统 $D_{V,(i)}$，剖分/嵌套/边长 $\\ell(Q)\\sim2^{-k}|x|$。\n- 定理 1.2：$r\\le\\frac{d^*}{36}|x|_\\infty$ 时存在 $Q\\in D_{V,(i)}$，$J\\subseteq Q$，$\\ell(Q)\\le\\frac4{d^*}r$。\n- 定理 1.3：$0\u003c\\alpha\u003cn$，$n-\\alpha-2\\sigma\u003e0$ 时 $K_\\alpha(x,y)\\sim\\widetilde d_\\alpha(x,y)^{\\alpha-n}$。\n- 命题 1.4：$\\sigma\\neq0$ 时 $\\widetilde d_\\alpha$ 无等价全局拟度量；$\\sigma=0$ 时 $\\widetilde d_\\alpha=|x-y|$。\n\n## 五、必读 / 选读 / 暂不展开\n\n- 必读：ch1、ch3、ch4、ch5、ch6；选读：ch2、ch7。\n- 暂不展开：稀疏支配的完整机器与端点/加权范数估计（作为动机引用）；谱理论精细背景。\n\n## 六、核查边界\n\n背景结果（定理 A [2]、扰动系统 [3]、核估计 (2) [4,3]）按原文陈述并标注来源，不逐行重证；论文自身结论（引理 2.1、3.1、5.2，定理 1.1–1.3，命题 1.4）给完整分步证明并回原文核对。\n",

        "outline_md": "# 个性化精读路线总纲：反平方势薛定谔算子的相邻二进系统与分段核尺度\n\n\u003e 依据已确认画像（默认「数学系本科毕业生」，用户明确指示采用默认画像）制定。读者已具备数学分析、测度论、泛函分析、Fourier 分析、Sobolev 空间基础；本文专用工具（二进网格相邻覆盖、临界半径函数与 $RH_p$ 类、反平方势的 Friedrichs 扩张、Riesz 位势核、稀疏支配、拟度量）逐章设桥梁。\n\n## 一、问题与目标\n\n论文研究反平方势薛定谔算子 $L_a=-\\Delta+\\frac{a}{|x|^2}$（$n\\ge3$，$a\\ge-((n-2)/2)^2$，Friedrichs 自伴扩张）。要建立尖锐定量估计，需要与算子内蕴几何相适应的二进系统；单系统缺相邻覆盖性质，经典 $3^n$ 平移技巧因自适应边长失效。论文的答案是：$n+1$ 个相邻二进系统（定理 1.1）+ 局部相邻覆盖（定理 1.2）+ 分段核尺度统一 Riesz 位势核估计（定理 1.3），并证明该核尺度非拟度量（命题 1.4）。\n\n**阅读目标**：能复述每个主要定理的精确假设与结论；能补出 Lemma 2.1、Lemma 3.1、Lemma 5.2 与定理 1.2、1.3、命题 1.4 的关键推导；能说明 $d^*\u003e0$ 与 $\\sigma\\neq0$ 这两个量如何分别控制覆盖效率与「核尺度非度量」的几何障碍。\n\n## 二、主路线\n\n**ch1 → ch2 → ch3 → ch4 → ch5 → ch6 → ch7**（必读主线）。ch1 建立算子与几何问题；ch2 补标准二进网格与相邻覆盖动机（选读性质，可与 ch1 并读）；ch3–ch5 完成 n+1 系统构造与覆盖证明（核心）；ch6 建立核尺度并证定理 1.3；ch7 证命题 1.4（选读但建议读）。\n\n## 三、概念底座与桥梁\n\n- 已掌握直接引用：Hölder/Minkowski、控制收敛、Fubini、紧性与弱收敛、Fourier 变换、标准 Sobolev 空间记号。\n- 每章在使用本文专用工具前设知识桥梁：标准二进网格与相邻覆盖（ch2）；相对距离与相位构造（ch3）；反平方势的 Friedrichs 扩张与 Hardy 常数（ch1）；临界半径函数与 $RH_{n/2}$（ch1）；Riesz 位势核估计 (2)（ch6）；拟度量（ch7）。\n\n## 四、核心结果与条件（摘要）\n\n- 定理 1.1：$n+1$ 系统 $D_{V,(i)}$，剖分/嵌套/边长 $\\ell(Q)\\sim2^{-k}|x|$。\n- 定理 1.2：$r\\le\\frac{d^*}{36}|x|_\\infty$ 时存在 $Q\\in D_{V,(i)}$，$J\\subseteq Q$，$\\ell(Q)\\le\\frac4{d^*}r$。\n- 定理 1.3：$0\u003c\\alpha\u003cn$，$n-\\alpha-2\\sigma\u003e0$ 时 $K_\\alpha(x,y)\\sim\\widetilde d_\\alpha(x,y)^{\\alpha-n}$。\n- 命题 1.4：$\\sigma\\neq0$ 时 $\\widetilde d_\\alpha$ 无等价全局拟度量；$\\sigma=0$ 时 $\\widetilde d_\\alpha=|x-y|$。\n\n## 五、必读 / 选读 / 暂不展开\n\n- 必读：ch1、ch3、ch4、ch5、ch6；选读：ch2、ch7。\n- 暂不展开：稀疏支配的完整机器与端点/加权范数估计（作为动机引用）；谱理论精细背景。\n\n## 六、核查边界\n\n背景结果（定理 A [2]、扰动系统 [3]、核估计 (2) [4,3]）按原文陈述并标注来源，不逐行重证；论文自身结论（引理 2.1、3.1、5.2，定理 1.1–1.3，命题 1.4）给完整分步证明并回原文核对。\n",

        "outline_md": "# 个性化精读路线总纲：反平方势薛定谔算子的相邻二进系统与分段核尺度\n\n\u003e 依据已确认画像（默认「数学系本科毕业生」，用户明确指示采用默认画像）制定。读者已具备数学分析、测度论、泛函分析、Fourier 分析、Sobolev 空间基础；本文专用工具（二进网格相邻覆盖、临界半径函数与 $RH_p$ 类、反平方势的 Friedrichs 扩张、Riesz 位势核、稀疏支配、拟度量）逐章设桥梁。\n\n## 一、问题与目标\n\n论文研究反平方势薛定谔算子 $L_a=-\\Delta+\\frac{a}{|x|^2}$（$n\\ge3$，$a\\ge-((n-2)/2)^2$，Friedrichs 自伴扩张）。要建立尖锐定量估计，需要与算子内蕴几何相适应的二进系统；单系统缺相邻覆盖性质，经典 $3^n$ 平移技巧因自适应边长失效。论文的答案是：$n+1$ 个相邻二进系统（定理 1.1）+ 局部相邻覆盖（定理 1.2）+ 分段核尺度统一 Riesz 位势核估计（定理 1.3），并证明该核尺度非拟度量（命题 1.4）。\n\n**阅读目标**：能复述每个主要定理的精确假设与结论；能补出 Lemma 2.1、Lemma 3.1、Lemma 5.2 与定理 1.2、1.3、命题 1.4 的关键推导；能说明 $d^*\u003e0$ 与 $\\sigma\\neq0$ 这两个量如何分别控制覆盖效率与「核尺度非度量」的几何障碍。\n\n## 二、主路线\n\n**ch1 → ch2 → ch3 → ch4 → ch5 → ch6 → ch7**（必读主线）。ch1 建立算子与几何问题；ch2 补标准二进网格与相邻覆盖动机（选读性质，可与 ch1 并读）；ch3–ch5 完成 n+1 系统构造与覆盖证明（核心）；ch6 建立核尺度并证定理 1.3；ch7 证命题 1.4（选读但建议读）。\n\n## 三、概念底座与桥梁\n\n- 已掌握直接引用：Hölder/Minkowski、控制收敛、Fubini、紧性与弱收敛、Fourier 变换、标准 Sobolev 空间记号。\n- 每章在使用本文专用工具前设知识桥梁：标准二进网格与相邻覆盖（ch2）；相对距离与相位构造（ch3）；反平方势的 Friedrichs 扩张与 Hardy 常数（ch1）；临界半径函数与 $RH_{n/2}$（ch1）；Riesz 位势核估计 (2)（ch6）；拟度量（ch7）。\n\n## 四、核心结果与条件（摘要）\n\n- 定理 1.1：$n+1$ 系统 $D_{V,(i)}$，剖分/嵌套/边长 $\\ell(Q)\\sim2^{-k}|x|$。\n- 定理 1.2：$r\\le\\frac{d^*}{36}|x|_\\infty$ 时存在 $Q\\in D_{V,(i)}$，$J\\subseteq Q$，$\\ell(Q)\\le\\frac4{d^*}r$。\n- 定理 1.3：$0\u003c\\alpha\u003cn$，$n-\\alpha-2\\sigma\u003e0$ 时 $K_\\alpha(x,y)\\sim\\widetilde d_\\alpha(x,y)^{\\alpha-n}$。\n- 命题 1.4：$\\sigma\\neq0$ 时 $\\widetilde d_\\alpha$ 无等价全局拟度量；$\\sigma=0$ 时 $\\widetilde d_\\alpha=|x-y|$。\n\n## 五、必读 / 选读 / 暂不展开\n\n- 必读：ch1、ch3、ch4、ch5、ch6；选读：ch2、ch7。\n- 暂不展开：稀疏支配的完整机器与端点/加权范数估计（作为动机引用）；谱理论精细背景。\n\n## 六、核查边界\n\n背景结果（定理 A [2]、扰动系统 [3]、核估计 (2) [4,3]）按原文陈述并标注来源，不逐行重证；论文自身结论（引理 2.1、3.1、5.2，定理 1.1–1.3，命题 1.4）给完整分步证明并回原文核对。\n",

        "outline_md": "# 个性化精读路线总纲：反平方势薛定谔算子的相邻二进系统与分段核尺度\n\n\u003e 依据已确认画像（默认「数学系本科毕业生」，用户明确指示采用默认画像）制定。读者已具备数学分析、测度论、泛函分析、Fourier 分析、Sobolev 空间基础；本文专用工具（二进网格相邻覆盖、临界半径函数与 $RH_p$ 类、反平方势的 Friedrichs 扩张、Riesz 位势核、稀疏支配、拟度量）逐章设桥梁。\n\n## 一、问题与目标\n\n论文研究反平方势薛定谔算子 $L_a=-\\Delta+\\frac{a}{|x|^2}$（$n\\ge3$，$a\\ge-((n-2)/2)^2$，Friedrichs 自伴扩张）。要建立尖锐定量估计，需要与算子内蕴几何相适应的二进系统；单系统缺相邻覆盖性质，经典 $3^n$ 平移技巧因自适应边长失效。论文的答案是：$n+1$ 个相邻二进系统（定理 1.1）+ 局部相邻覆盖（定理 1.2）+ 分段核尺度统一 Riesz 位势核估计（定理 1.3），并证明该核尺度非拟度量（命题 1.4）。\n\n**阅读目标**：能复述每个主要定理的精确假设与结论；能补出 Lemma 2.1、Lemma 3.1、Lemma 5.2 与定理 1.2、1.3、命题 1.4 的关键推导；能说明 $d^*\u003e0$ 与 $\\sigma\\neq0$ 这两个量如何分别控制覆盖效率与「核尺度非度量」的几何障碍。\n\n## 二、主路线\n\n**ch1 → ch2 → ch3 → ch4 → ch5 → ch6 → ch7**（必读主线）。ch1 建立算子与几何问题；ch2 补标准二进网格与相邻覆盖动机（选读性质，可与 ch1 并读）；ch3–ch5 完成 n+1 系统构造与覆盖证明（核心）；ch6 建立核尺度并证定理 1.3；ch7 证命题 1.4（选读但建议读）。\n\n## 三、概念底座与桥梁\n\n- 已掌握直接引用：Hölder/Minkowski、控制收敛、Fubini、紧性与弱收敛、Fourier 变换、标准 Sobolev 空间记号。\n- 每章在使用本文专用工具前设知识桥梁：标准二进网格与相邻覆盖（ch2）；相对距离与相位构造（ch3）；反平方势的 Friedrichs 扩张与 Hardy 常数（ch1）；临界半径函数与 $RH_{n/2}$（ch1）；Riesz 位势核估计 (2)（ch6）；拟度量（ch7）。\n\n## 四、核心结果与条件（摘要）\n\n- 定理 1.1：$n+1$ 系统 $D_{V,(i)}$，剖分/嵌套/边长 $\\ell(Q)\\sim2^{-k}|x|$。\n- 定理 1.2：$r\\le\\frac{d^*}{36}|x|_\\infty$ 时存在 $Q\\in D_{V,(i)}$，$J\\subseteq Q$，$\\ell(Q)\\le\\frac4{d^*}r$。\n- 定理 1.3：$0\u003c\\alpha\u003cn$，$n-\\alpha-2\\sigma\u003e0$ 时 $K_\\alpha(x,y)\\sim\\widetilde d_\\alpha(x,y)^{\\alpha-n}$。\n- 命题 1.4：$\\sigma\\neq0$ 时 $\\widetilde d_\\alpha$ 无等价全局拟度量；$\\sigma=0$ 时 $\\widetilde d_\\alpha=|x-y|$。\n\n## 五、必读 / 选读 / 暂不展开\n\n- 必读：ch1、ch3、ch4、ch5、ch6；选读：ch2、ch7。\n- 暂不展开：稀疏支配的完整机器与端点/加权范数估计（作为动机引用）；谱理论精细背景。\n\n## 六、核查边界\n\n背景结果（定理 A [2]、扰动系统 [3]、核估计 (2) [4,3]）按原文陈述并标注来源，不逐行重证；论文自身结论（引理 2.1、3.1、5.2，定理 1.1–1.3，命题 1.4）给完整分步证明并回原文核对。\n",

        "outline_md": "# 个性化精读路线总纲：反平方势薛定谔算子的相邻二进系统与分段核尺度\n\n\u003e 依据已确认画像（默认「数学系本科毕业生」，用户明确指示采用默认画像）制定。读者已具备数学分析、测度论、泛函分析、Fourier 分析、Sobolev 空间基础；本文专用工具（二进网格相邻覆盖、临界半径函数与 $RH_p$ 类、反平方势的 Friedrichs 扩张、Riesz 位势核、稀疏支配、拟度量）逐章设桥梁。\n\n## 一、问题与目标\n\n论文研究反平方势薛定谔算子 $L_a=-\\Delta+\\frac{a}{|x|^2}$（$n\\ge3$，$a\\ge-((n-2)/2)^2$，Friedrichs 自伴扩张）。要建立尖锐定量估计，需要与算子内蕴几何相适应的二进系统；单系统缺相邻覆盖性质，经典 $3^n$ 平移技巧因自适应边长失效。论文的答案是：$n+1$ 个相邻二进系统（定理 1.1）+ 局部相邻覆盖（定理 1.2）+ 分段核尺度统一 Riesz 位势核估计（定理 1.3），并证明该核尺度非拟度量（命题 1.4）。\n\n**阅读目标**：能复述每个主要定理的精确假设与结论；能补出 Lemma 2.1、Lemma 3.1、Lemma 5.2 与定理 1.2、1.3、命题 1.4 的关键推导；能说明 $d^*\u003e0$ 与 $\\sigma\\neq0$ 这两个量如何分别控制覆盖效率与「核尺度非度量」的几何障碍。\n\n## 二、主路线\n\n**ch1 → ch2 → ch3 → ch4 → ch5 → ch6 → ch7**（必读主线）。ch1 建立算子与几何问题；ch2 补标准二进网格与相邻覆盖动机（选读性质，可与 ch1 并读）；ch3–ch5 完成 n+1 系统构造与覆盖证明（核心）；ch6 建立核尺度并证定理 1.3；ch7 证命题 1.4（选读但建议读）。\n\n## 三、概念底座与桥梁\n\n- 已掌握直接引用：Hölder/Minkowski、控制收敛、Fubini、紧性与弱收敛、Fourier 变换、标准 Sobolev 空间记号。\n- 每章在使用本文专用工具前设知识桥梁：标准二进网格与相邻覆盖（ch2）；相对距离与相位构造（ch3）；反平方势的 Friedrichs 扩张与 Hardy 常数（ch1）；临界半径函数与 $RH_{n/2}$（ch1）；Riesz 位势核估计 (2)（ch6）；拟度量（ch7）。\n\n## 四、核心结果与条件（摘要）\n\n- 定理 1.1：$n+1$ 系统 $D_{V,(i)}$，剖分/嵌套/边长 $\\ell(Q)\\sim2^{-k}|x|$。\n- 定理 1.2：$r\\le\\frac{d^*}{36}|x|_\\infty$ 时存在 $Q\\in D_{V,(i)}$，$J\\subseteq Q$，$\\ell(Q)\\le\\frac4{d^*}r$。\n- 定理 1.3：$0\u003c\\alpha\u003cn$，$n-\\alpha-2\\sigma\u003e0$ 时 $K_\\alpha(x,y)\\sim\\widetilde d_\\alpha(x,y)^{\\alpha-n}$。\n- 命题 1.4：$\\sigma\\neq0$ 时 $\\widetilde d_\\alpha$ 无等价全局拟度量；$\\sigma=0$ 时 $\\widetilde d_\\alpha=|x-y|$。\n\n## 五、必读 / 选读 / 暂不展开\n\n- 必读：ch1、ch3、ch4、ch5、ch6；选读：ch2、ch7。\n- 暂不展开：稀疏支配的完整机器与端点/加权范数估计（作为动机引用）；谱理论精细背景。\n\n## 六、核查边界\n\n背景结果（定理 A [2]、扰动系统 [3]、核估计 (2) [4,3]）按原文陈述并标注来源，不逐行重证；论文自身结论（引理 2.1、3.1、5.2，定理 1.1–1.3，命题 1.4）给完整分步证明并回原文核对。\n",

        "rationale": "默认读者分析/Fourier/Sobolev/泛函基础扎实，但缺本文专用二进几何工具。故先以 ch1 建立算子与几何问题，ch2 补标准二进网格与相邻覆盖动机，再沿相位构造→n+1系统→局部覆盖→核尺度→非拟度量推进；深度上论文自身结论完整证明，背景结果按原文陈述并标注。",
        "outline_md": "# 个性化精读路线总纲：反平方势薛定谔算子的相邻二进系统与分段核尺度\n\n\u003e 依据已确认画像（默认「数学系本科毕业生」，用户明确指示采用默认画像）制定。读者已具备数学分析、测度论、泛函分析、Fourier 分析、Sobolev 空间基础；本文专用工具（二进网格相邻覆盖、临界半径函数与 $RH_p$ 类、反平方势的 Friedrichs 扩张、Riesz 位势核、稀疏支配、拟度量）逐章设桥梁。\n\n## 一、问题与目标\n\n论文研究反平方势薛定谔算子 $L_a=-\\Delta+\\frac{a}{|x|^2}$（$n\\ge3$，$a\\ge-((n-2)/2)^2$，Friedrichs 自伴扩张）。要建立尖锐定量估计，需要与算子内蕴几何相适应的二进系统；单系统缺相邻覆盖性质，经典 $3^n$ 平移技巧因自适应边长失效。论文的答案是：$n+1$ 个相邻二进系统（定理 1.1）+ 局部相邻覆盖（定理 1.2）+ 分段核尺度统一 Riesz 位势核估计（定理 1.3），并证明该核尺度非拟度量（命题 1.4）。\n\n**阅读目标**：能复述每个主要定理的精确假设与结论；能补出 Lemma 2.1、Lemma 3.1、Lemma 5.2 与定理 1.2、1.3、命题 1.4 的关键推导；能说明 $d^*\u003e0$ 与 $\\sigma\\neq0$ 这两个量如何分别控制覆盖效率与「核尺度非度量」的几何障碍。\n\n## 二、主路线\n\n**ch1 → ch2 → ch3 → ch4 → ch5 → ch6 → ch7**（必读主线）。ch1 建立算子与几何问题；ch2 补标准二进网格与相邻覆盖动机（选读性质，可与 ch1 并读）；ch3–ch5 完成 n+1 系统构造与覆盖证明（核心）；ch6 建立核尺度并证定理 1.3；ch7 证命题 1.4（选读但建议读）。\n\n## 三、概念底座与桥梁\n\n- 已掌握直接引用：Hölder/Minkowski、控制收敛、Fubini、紧性与弱收敛、Fourier 变换、标准 Sobolev 空间记号。\n- 每章在使用本文专用工具前设知识桥梁：标准二进网格与相邻覆盖（ch2）；相对距离与相位构造（ch3）；反平方势的 Friedrichs 扩张与 Hardy 常数（ch1）；临界半径函数与 $RH_{n/2}$（ch1）；Riesz 位势核估计 (2)（ch6）；拟度量（ch7）。\n\n## 四、核心结果与条件（摘要）\n\n- 定理 1.1：$n+1$ 系统 $D_{V,(i)}$，剖分/嵌套/边长 $\\ell(Q)\\sim2^{-k}|x|$。\n- 定理 1.2：$r\\le\\frac{d^*}{36}|x|_\\infty$ 时存在 $Q\\in D_{V,(i)}$，$J\\subseteq Q$，$\\ell(Q)\\le\\frac4{d^*}r$。\n- 定理 1.3：$0\u003c\\alpha\u003cn$，$n-\\alpha-2\\sigma\u003e0$ 时 $K_\\alpha(x,y)\\sim\\widetilde d_\\alpha(x,y)^{\\alpha-n}$。\n- 命题 1.4：$\\sigma\\neq0$ 时 $\\widetilde d_\\alpha$ 无等价全局拟度量；$\\sigma=0$ 时 $\\widetilde d_\\alpha=|x-y|$。\n\n## 五、必读 / 选读 / 暂不展开\n\n- 必读：ch1、ch3、ch4、ch5、ch6；选读：ch2、ch7。\n- 暂不展开：稀疏支配的完整机器与端点/加权范数估计（作为动机引用）；谱理论精细背景。\n\n## 六、核查边界\n\n背景结果（定理 A [2]、扰动系统 [3]、核估计 (2) [4,3]）按原文陈述并标注来源，不逐行重证；论文自身结论（引理 2.1、3.1、5.2，定理 1.1–1.3，命题 1.4）给完整分步证明并回原文核对。\n",

    "outline_md": "# 总纲：反平方势薛定谔算子的相邻二进系统与分段核尺度\n\n\u003e 本总纲是**临时阅读规划**；读者画像确认后将重新制定个性化路线。默认目标读者为「数学系本科毕业生」，默认已掌握数学分析、线性代数、常微分方程、测度论（Lebesgue 积分）、泛函分析（Hilbert 空间、弱收敛、紧性）、Fourier 分析、Sobolev 空间与 PDE 的基本工具；本文特有的二进网格、临界半径函数、反平方势几何等将逐章设置知识桥梁。\n\n## 一、问题动机\n\n薛定谔算子 $-\\Delta+V$ 源自量子力学的 Hamiltonian 表述，其谱与估计理论是调和分析与 PDE 的共同基石。本文研究**反平方势**（inverse-square potential）\n\n$$L_a = -\\Delta + \\frac{a}{|x|^2},\\qquad n\\ge 3,\\quad a\\ge -\\Bigl(\\frac{n-2}{2}\\Bigr)^2,$$\n\n其中 $L_a$ 理解为形式算子 $-\\Delta + a|x|^{-2}$（初域 $C_c^\\infty(\\mathbb R^n\\setminus\\{0\\})$）的 **Friedrichs 自伴扩张**；$a\\ge -((n-2)/2)^2$ 恰是 Hardy 不等式保证算子非负的临界条件。引入参数\n\n$$\\sigma := \\frac{n-2}{2}-\\frac{1}{2}\\sqrt{(n-2)^2+4a}\\ \\in\\ \\Bigl(-\\infty,\\ \\frac{n-2}{2}\\Bigr],$$\n\n它把 $a$ 的取值范围线性化地映到 $\\sigma$，是全文几乎所有常数的依赖对象。\n\n调和分析中，为了对这类算子建立**尖锐的定量估计**（稀疏支配、加权范数、Riesz 位势核估计），需要一套与算子内蕴几何相适应的**二进立方体系统**：立方体边长应随点到原点的距离缩放。对幂律位势 $V(x)=b|x|^\\beta$（$b\u003e0$，$\\beta\\in(-2,\\infty)$），Cao–Chen–Deng–Wu 用**临界半径函数** $\\rho(x,V)$ 构造了扰动二进系统 $D_V$。但反平方势 $V(x)=a|x|^{-2}$ 满足 $V\\notin RH_{n/2}$，临界半径函数不复存在；Cao–Chen–Deng 退而求其次，引入局部化临界半径 $\\rho_{\\rm loc}(x,V)\\sim |x|$，构造出边长满足 $\\ell(Q)\\sim 2^{-k}|x|$ 的扰动系统 $D_V$。\n\n**核心困难**：单个二进系统缺乏**相邻覆盖性质**——给任意立方体 $J$，未必存在系统中立方体 $Q$ 使 $J\\subseteq Q$ 且 $|Q|\\lesssim |J|$。这一性质是稀疏支配下建立精确估计的关键。经典情形用 $3^n$ 个平移标准网格解决；但对边长空间自适应的扰动系统，简单平移不再可行。\n\n**本文问题**：能否为反平方势算子 $L_a$ 构造一族相邻二进系统，使局部相邻覆盖性质成立？能否用单一的**分段核尺度**统一 Riesz 位势核估计？\n\n## 二、概念底座\n\n- **标准二进网格**、平移相邻系统（$3^n$ 个）与相邻覆盖性质；\n- **反平方势算子** $L_a$ 的 Friedrichs 自伴扩张、Hardy 临界常数与参数 $\\sigma$；\n- **临界半径函数** $\\rho(x,V)$ 与反向 Hölder 类 $RH_{n/2}$；反平方势为何不属于 $RH_{n/2}$；\n- **扰动二进系统** $D_V$ 与局部化临界半径 $\\rho_{\\rm loc}\\sim |x|$；\n- **Riesz 位势** $L_a^{-\\alpha/2}$ 及其核估计 (2)；\n- **稀疏支配**与相邻覆盖性质的作用；\n- **拟度量**与拟三角不等式。\n\n## 三、核心结果及条件\n\n- **定理 1.1**（$n+1$ 个相邻二进系统）：设 $V(x)=a|x|^{-2}$，$a\\ge -((n-2)/2)^2$，$X=\\mathbb R^n\\setminus\\{0\\}$。存在 $n+1$ 个系统 $D_{V,(i)}$（$i\\in\\{0,\\dots,n\\}$），每个都满足：(i) 剖分 $X$ 且内部两两不交；(ii) 跨尺度嵌套（$Q\\cap P\\in\\{\\varnothing,P\\}$）；(iii) 边长 $\\ell(Q)\\sim 2^{-k}|x|$。且 $D_{V,(0)}$ 与 [3] 的系统一致。\n- **定理 1.2**（局部相邻覆盖）：设 $d^*\u003e0$ 为相对距离。若轴平行半开立方体 $J$ 以 $x\\neq 0$ 为中心、边长 $r$，且 $r\\le \\frac{d^*}{36}|x|_\\infty$，则存在 $i$ 与 $Q\\in D_{V,(i)}$ 使 $J\\subseteq Q$、$\\ell(Q)\\le \\frac4{d^*}r$，从而 $|Q|\\le (4/d^*)^n|J|$。\n- **定理 1.3**（分段核尺度）：设 $0\u003c\\alpha\u003cn$ 且 $n-\\alpha-2\\sigma\u003e0$，则存在分段核尺度 $\\widetilde d_\\alpha:X\\times X\\to[0,\\infty)$ 使 Riesz 位势核满足 $K_\\alpha(x,y)\\sim \\widetilde d_\\alpha(x,y)^{\\alpha-n}$。\n- **命题 1.4**（非拟度量）：若 $\\sigma\\neq 0$，$\\widetilde d_\\alpha$ 不承认等价的全局拟度量（拟三角不等式处处失败）；仅当 $\\sigma=0$（即 $a=0$，退化到标准 Riesz 核）时 $\\widetilde d_\\alpha=|x-y|$ 是真度量。\n\n## 四、章节依赖与阅读路线\n\n临时主线为 **ch1 → ch2 → ch3 → ch4 → ch5 → ch6 → ch7**。其中 ch2 可与 ch1 并读；ch6 依赖 ch5 的覆盖性质与 ch1 的核估计 (2)；ch7 依赖 ch6 定义的 $\\widetilde d_\\alpha$。\n\n## 五、必读 / 选读 / 暂不展开\n\n- **必读**：ch1（问题动机与参数 $\\sigma$）、ch3（相对距离与相位构造，引理 2.1）、ch4（$n+1$ 系统构造与定理 1.1 三性质验证）、ch5（局部相邻覆盖证明）、ch6（三段核估计与定理 1.3）。\n- **选读**：ch2（经典 $3^n$ 平移系统的完整动机）、ch7（命题 1.4 的反例构造，理解「核尺度而非度量」的几何障碍）。\n- **暂不展开**：稀疏支配的完整机器、加权/端点范数估计、谱理论精细背景；仅在需要处引用并标注缺口。\n\n## 六、已知核查缺口\n\n- 本文以单一 PDF 为源（`pdftotext` 提取，状态 `pdf_extracted_check_formulas`）；关键公式已对照原页核对，但非 LaTeX 源码，个别上下标在正式撰写时须逐处对照原页。\n- 定理 A（[2]）与核估计 (2)（[4],[3]）为引用的已有结果，本次仅按原文陈述，其完整证明未逐行复核。\n- 反平方势的 Friedrichs 自伴扩张与 Hardy 临界常数的精细谱结论属背景，将按需补讲并标注来源。\n",
    "popular_md": "# 科普导读：给反平方势算子配一套「会伸缩的放大镜」\n\n## 一、一句话版\n\n这篇文章回答的是一个**几何工具**问题：研究带 $1/|x|^2$ 奇异项的薛定谔算子时，怎样造一套**随位置自动伸缩的网格**，使得任意一小块区域都能被网格里一个「大小差不多」的格子盖住？以及，能不能用一个**分段定义的「距离」**把算子的 Riesz 位势核统一地描述出来？\n\n## 二、直观对象\n\n- **反平方势算子**：量子力学的动能 $-\\Delta$ 加上一个在原点按 $a/|x|^2$ 发散的势。离原点越近，势越强；$a$ 越大势越「斥」，$a$ 取 Hardy 临界值 $-((n-2)/2)^2$ 时势「陷」到极限，但算子仍非负。\n- **二进网格**：像地图上的经纬线，边长按 $2^{-k}$ 逐级减半，各级彼此嵌套（小格要么完全在大格内、要么不相交）。标准网格是刚性均匀的。\n- **扰动二进网格**：为了让格子「贴合」算子的奇异性，格子边长随位置缩放——离原点远格子大，离原点近格子小。这正是 $\\ell(Q)\\sim 2^{-k}|x|$ 的含义。\n- **相邻覆盖**：给定任意小方块 $J$，希望系统里有一个格子 $Q$ 能整个装下 $J$，且 $Q$ 不比 $J$ 大太多（$|Q|\\lesssim |J|$）。这是做「稀疏支配」这类精确估计时绕不开的一步。\n- **核尺度**：用 $K_\\alpha(x,y)\\sim \\widetilde d_\\alpha(x,y)^{\\alpha-n}$ 把「两点间的相互作用强度」压缩成一个数 $\\widetilde d_\\alpha$；它像「距离」，但不是真正的距离。\n\n## 三、一个低维简单模型\n\n想象一维直线上的标准二分格：以 $0,1,2,\\dots$ 为端点，边长 $1$；下一级端点取 $0,\\tfrac12,1,\\dots$，边长 $\\tfrac12$。任取一个长度 $r$ 的区间，若它恰好跨过一个二分端点，就会被「劈」成两半，装不进任何一个边长 $\\le Cr$ 的格子。经典办法是再平移出两个网格（端点整体挪 $1/3$、$2/3$）：任何长度 $\\le 1/3$ 的区间，至少有一个网格的端点不落在它内部，于是能被该网格的一个格子盖住。这就是一维 $3$ 个相邻系统（$n$ 维 $3^n$ 个）的思想。\n\n反平方势的难点：格子边长要随 $|x|$ 缩放，不能再整体平移。本文改用 $n+1$ 个「相位不同」的网格（相位由 $\\theta_i(j)$ 控制），并证明这些相位之间的**相对距离** $d^*\u003e0$，从而把经典论证**局部化**地搬到自适应网格上。\n\n\u003e 提醒：这里的「格子」「放大镜」是类比，不是证明；一维现象不能直接推出高维结论。\n\n## 四、困难与意义\n\n**困难**：(1) 反平方势破坏了临界半径函数的存在性（$V\\notin RH_{n/2}$），原有幂律构造失效；(2) 自适应的边长使平移技巧失效，需要新的「相位分离」论证；(3) 要把三个区域（局部 / 相邻层非局部 / 远层）的核估计压进一个统一核尺度，而这个核尺度**不是**拟度量。\n\n**意义**：它澄清了反平方势背后的**几何障碍**——算子核尺度之所以不能成为全局拟度量，根源正是 $\\sigma\\neq 0$（即势不消失）。这为后续基于稀疏支配的尖锐定量估计、加权与端点估计提供了可用的相邻二进工具，也解释了为何对反平方势不能套用幂律势的标准框架。\n\n## 五、边界声明\n\n本导读只建立图景，不替代严格证明；严格结论、假设与端点处理以总纲与分章讲义为准。\n",

      "content": "{\n  \"content_md\": \"## 1.1 阅读主线与本章目标\\n\\n本章是全书的地基。我们先回答三个问题：**反平方势薛定谔算子 $L_a$ 究竟是什么**、**参数 $\\\\sigma$ 从哪里来**、**为什么反平方势会把「临界半径函数」这条标准路线堵死**。这三个问题的答案共同把读者引向全文的核心问题——如何为 $L_a$ 构造一族相邻的二进立方体系统。\\n\\n读完本章，你应能：(1) 写出 $L_a$ 的 Friedrichs 自伴扩张的由来；(2) 独立证明 Hardy 不等式并说明 $a\\\\ge-((n-2)/2)^2$ 的临界意义；(3) 推导 $\\\\sigma$ 与 $a$ 的相互表示；(4) 用反向 Hölder 类的定义验证 $a|x|^{-2}\\\\notin RH_{n/2}$；(5) 复述「相邻覆盖性质」要解决什么困难。\\n\\n本章在全书中的位置：它是第 2 章（标准二进网格与相邻覆盖）的前置，也是第 4、6 章反复引用的基础（$\\\\sigma$、Hardy 常数、$V\\\\notin RH_{n/2}$）。建议先通读建立图景，再回到 §1.4 与 §1.6 逐行补证明。\\n\\n## 1.2 研究背景与核心问题\\n\\n### 1.2.1 薛定谔算子的来源\\n\\n设 $\\\\Delta=\\\\sum_{j=1}^n \\\\partial_{x_j}^2$ 为 $\\\\mathbb R^n$ 上的 Laplace 算子，$V$ 为一个实值势函数。薛定谔算子\\n\\n$$H_V := -\\\\Delta + V$$\\n\\n源自量子力学的 Hamiltonian 表述。回顾量子力学的公理：一个量子系统的状态由 Hilbert 空间 $L^2(\\\\mathbb R^n)$ 中的波函数 $\\\\psi$ 描述，可观测量的期望由自伴算子给出，系统的能量由 Hamiltonian 算子 $H$ 表示。态的时间演化满足薛定谔方程\\n\\n$$i\\\\partial_t\\\\psi = H\\\\psi,$$\\n\\n其解 $\\\\psi(t)=e^{-itH}\\\\psi(0)$ 由酉群 $e^{-itH}$ 给出。这要求 $H$ 是**自伴**的：自伴算子谱为实数，且由谱定理可定义 $e^{-itH}$（Stone 定理）。因此，理解一个量子系统，首先要把形式上的微分表达式 $- \\\\Delta+V$ 提升为一个明确定义的自伴算子。\\n\\n$-\\\\Delta$ 对应自由粒子的动能，$V$ 对应势能。对 $V\\\\equiv 0$，$-\\\\Delta$ 是自由粒子的能量算子，其谱为 $[0,\\\\infty)$，纯绝对连续。加入 $V$ 后，$H_V$ 的谱结构（本征值、本征函数、谱的连续部分、谱测度的正则性）刻画了系统的定态、散射与共振。\\n\\n**谱论视角。** 调和分析关心的是「谱如何通过函数空间估计被量化」：例如 $H_V$ 的谱投影、Riesz 位势 $H_V^{-\\\\alpha/2}$、热半群 $e^{-tH_V}$ 在 $L^p$ 上的范数，以及这些范数如何被势 $V$ 的几何（临界半径、二进结构）控制。对奇异势，谱的定性行为（是否有正本征值、谱是否连续、$0$ 是否临界）高度依赖 $V$ 在奇异点附近的增长阶。反平方势 $a|x|^{-2}$ 正是「临界」的一个典型：它的增长阶 $\\\\beta=-2$ 恰好卡在「可摄动」与「需重新构造」的分界线上。\\n\\n**为什么反平方势值得单独研究。** 在数学物理中，反平方势出现在多个经典模型里。一是「落向中心」（fall to the center）问题：当 $a$ 低于 Hardy 临界常数时，形式算子不再下半有界，经典粒子会「落向原点」，量子系统失去稳定的基态；当 $a$ 恰好等于临界值时，系统处于「临界稳定」的边界。二是多体与散射问题中出现的 $1/r^2$ 型相互作用。这些现象都指向同一个数学事实：$a=-((n-2)/2)^2$ 是算子能否下半有界的临界值（§1.4 证明）。\\n\\n### 1.2.2 幂律势与扰动二进系统\\n\\n调和分析处理奇异算子的标准范式是：先构造一套**与算子内蕴几何相适配的二进立方体系统**，再借助该系统的**稀疏支配**把算子的各类范数估计化归为对稀疏算子的估计。这套范式的起点，是 Cao–Chen–Deng–Wu 在文献 [2] 中针对幂律势建立的「几何扰动框架」。\\n\\n他们考虑的势是\\n\\n$$V(x)=b|x|^\\\\beta,\\\\qquad b\u003e0,\\\\quad \\\\beta\\\\in(-2,\\\\infty).$$\\n\\n这种势的核心工具是**临界半径函数** $\\\\rho(x,V)$：对每个 $x$，$\\\\rho(x,V)$ 是使「局部平均的势」达到某个归一化阈值的半径。有了 $\\\\rho$，就可以构造一族**扰动二进立方体** $D_V$，其边长满足\\n\\n$$\\\\ell(Q)\\\\sim 2^{-k}\\\\,\\\\rho(x,V),\\\\qquad x\\\\in Q.$$\\n\\n也就是说，立方体的边长随位置 $x$ 处的临界半径缩放：势越强的地方（离原点越近），格子越小。这样格子就「贴合」了势的奇异性。\\n\\n**定理 A（[2]）**：设 $V(x)=b|x|^\\\\beta$，$b\u003e0$，$\\\\beta\\\\in(-2,\\\\infty)$，则存在一族 $D_V=\\\\bigcup_{k\\\\in\\\\mathbb Z_+}D_V^k$ 的立方体，满足：\\n\\n(i) 每个 $k\\\\in\\\\mathbb Z_+$，$D_V^k$ 构成 $\\\\mathbb R^n$ 的一个剖分，立方体内部两两不交；\\n(ii) 跨尺度嵌套：$k\u003el$ 时，$Q\\\\in D_V^l$、$P\\\\in D_V^k$ 要么 $Q\\\\cap P=\\\\varnothing$，要么 $P\\\\subseteq Q$；\\n(iii) 边长 $\\\\ell(Q)\\\\sim 2^{-k}\\\\rho(x,V)$。\\n\\n**直观解释。** 条件 (i) 说每个尺度 $k$ 的立方体铺满全空间且不重叠；(ii) 说不同尺度之间是「嵌套」的——细格要么完全包含在粗格内、要么与其不交，这保证了可以定义「$Q$ 的第 $k$ 代后代」；(iii) 是关键：边长由临界半径 $\\\\rho(x,V)$ 决定，使格子「感知」势的局部强弱。这三条是「二进系统」的定义性要求，本文定理 1.1 构造的 $n+1$ 个系统都要满足同型的三条性质。\\n\\n**为什么边长要随 $\\\\rho(x,V)$ 缩放。** 二进系统的用途是把全空间分解为「势近乎常数的方块」。若格子在势剧烈变化的区域仍然取统一的边长，就无法捕捉势的局部尺度。临界半径 $\\\\rho(x,V)$ 恰好是「势在 $x$ 附近保持大致常数」的尺度：在 $B(x,\\\\rho(x,V))$ 内，势的波动与动能尺度 $\\\\rho^{-2}$ 相当（见 §1.6.3 的尺度分析）。因此让 $\\\\ell(Q)\\\\sim\\\\rho(x,V)$ 是自然的选择。\\n\\n### 1.2.3 反平方势的特殊性\\n\\n本文研究的是 $\\\\beta=-2$ 的极端情形：\\n\\n$$V(x)=\\\\frac{a}{|x|^2},\\\\qquad n\\\\ge 3,\\\\quad a\\\\ge-\\\\Bigl(\\\\frac{n-2}{2}\\\\Bigr)^2.$$\\n\\n这时的算子记作\\n\\n$$L_a = -\\\\Delta + \\\\frac{a}{|x|^2}.$$\\n\\n它与幂律势的本质区别在于：**$V=a|x|^{-2}$ 不属于反向 Hölder 类 $RH_{n/2}$**（本节 §1.6 给出完整验证）。而临界半径函数 $\\\\rho(x,V)$ 的可用性恰恰依赖于 $V\\\\in RH_{n/2}$。因此，构造扰动二进系统 $D_V$ 的核心工具 $\\\\rho(x,V)$ 对反平方势**不复存在**。\\n\\nCao–Chen–Deng 在文献 [3] 中观察到这一点，并给出退而求其次的替代：引入**局部化临界半径**\\n\\n$$\\\\rho_{\\\\rm loc}(x,V)\\\\sim |x|,$$\\n\\n据此构造出边长满足 $\\\\ell(Q)\\\\sim 2^{-k}|x|$ 的扰动二进系统 $D_V$。这恢复了单个系统的存在性，但埋下了下一个困难。\\n\\n**为什么 $\\\\beta=-2$ 是临界情形？** 考察势的尺度分析。在球 $B(x,\\\\rho)$ 内（$\\\\rho\\\\ll|x|$ 时），幂律势的平均贡献是\\n\\n$$\\\\frac1{|B(x,\\\\rho)|}\\\\int_{B(x,\\\\rho)}|y|^\\\\beta\\\\,dy \\\\sim |x|^\\\\beta .$$\\n\\n动能项 $-\\\\Delta$ 的特征尺度是 $\\\\rho^{-2}$。让二者「平衡」即令 $|x|^\\\\beta\\\\sim\\\\rho^{-2}$，得 $\\\\rho\\\\sim|x|^{-\\\\beta/2}$。当 $\\\\beta\\\\to-2$ 时，$\\\\rho\\\\sim|x|$，恰好是到原点的距离——这是合理的尺度。但问题出在 $RH_p$ 类：$\\\\beta=-2$ 时 $V^{n/2}=|x|^{-n}$ 恰好不可积（见 §1.6），破坏了临界半径函数赖以成立的积分条件。这就是反平方势「临界」二字的由来。\\n\\n### 1.2.4 相邻覆盖困难\\n\\n单个二进系统 $D_V$ 有一个根本缺陷：它**不具备相邻覆盖性质**。所谓相邻覆盖性质是指：\\n\\n\u003e 给定任意立方体 $J$，总能找到系统中的立方体 $Q$，使得 $J\\\\subseteq Q$ 且 $|Q|\\\\lesssim |J|$（$Q$ 的体积不比 $J$ 大出常数倍）。\\n\\n这一性质是稀疏支配下建立**尖锐**定量估计的钥匙。经典（无势）情形用 $3^n$ 个平移的标准二进网格解决：任意轴平行立方体 $J$，总有一个平移网格的端点不落在 $J$ 内部，从而 $J$ 被该网格的一个立方体盖住。\\n\\n但对扰动系统 $D_V$，立方体边长是**空间自适应**的（$\\\\ell(Q)\\\\sim 2^{-k}|x|$），不能靠整体平移来生成相邻系统：平移会破坏「边长与 $|x|$ 匹配」这一几何约束。平移技巧失效。\\n\\n**本文的核心问题（Question）**：能否为反平方势算子 $L_a$ 构造一族相邻二进系统，使局部相邻覆盖性质成立？能否用单一的**分段核尺度**统一 Riesz 位势核估计？\\n\\n本文给出肯定回答：$n+1$ 个相邻二进系统（定理 1.1）+ 局部相邻覆盖（定理 1.2）+ 分段核尺度（定理 1.3），并证明该核尺度非拟度量（命题 1.4）。\\n\\n## 1.3 基本设置、符号与定义\\n\\n### 1.3.1 空间与范数\\n\\n全文在 $\\\\mathbb R^n$（$n\\\\ge 3$）上工作，并设\\n\\n$$X := \\\\mathbb R^n\\\\setminus\\\\{0\\\\}.$$\\n\\n用 $|x|=(x_1^2+\\\\cdots+x_n^2)^{1/2}$ 记欧氏范数，用\\n\\n$$|x|_\\\\infty := \\\\max_{1\\\\le j\\\\le n}|x_j|$$\\n\\n记 $\\\\ell^\\\\infty$ 范数。二者满足 $|x|_\\\\infty\\\\le |x|\\\\le\\\\sqrt n\\\\,|x|_\\\\infty$。所有立方体取**半开**（axis-parallel half-open cubes），$Q(x,l)$ 表示以 $x$ 为中心、边长为 $l$、边平行坐标轴的立方体，$\\\\ell(Q)$ 记其边长，$|Q|=\\\\ell(Q)^n$ 记其体积。\\n\\n**为什么要半开？** 半开约定（如 $[a,a+l)$ 的形式）保证同一尺度下的立方体既铺满空间又两两不交——若用闭立方体，相邻立方体会在边界上重叠，破坏「剖分」的严格性。这是二进分析的一个标准约定，后续第 2 章构造标准二进网格时还会用到。\\n\\n### 1.3.2 记号约定\\n\\n$\\\\mathbb N=\\\\{1,2,\\\\dots\\\\}$，$\\\\mathbb Z_+=\\\\mathbb N\\\\cup\\\\{0\\\\}$，$\\\\mathbb Z$ 为整数集。$C$ 表示与主要参数无关的正常数，可逐行变化。$f\\\\lesssim g$ 表示 $f\\\\le Cg$；$f\\\\sim g$ 表示 $f\\\\lesssim g\\\\lesssim f$。$\\\\chi_E$ 记集合 $E$ 的特征函数。$u\\\\wedge v:=\\\\min\\\\{u,v\\\\}$。$\\\\operatorname{dist}_\\\\infty(W,0):=\\\\inf_{y\\\\in W}|y|_\\\\infty$ 记 $W$ 到原点的 $\\\\ell^\\\\infty$ 距离。\\n\\n### 1.3.3 形式算子与对象的存在性\\n\\n形式微分算子定义为\\n\\n$$-\\\\Delta + a|x|^{-2},\\\\qquad \\\\text{初域 } C_c^\\\\infty(\\\\mathbb R^n\\\\setminus\\\\{0\\\\}).$$\\n\\n由于 $|x|^{-2}$ 在原点奇异，这个形式算子要成为真正的自伴算子，需要选取一个自伴扩张。这里必须回答「对象是否存在」：形式算子 $-\\\\Delta+a|x|^{-2}$ 是否下半有界？下半有界对称算子是否总有 Friedrichs 自伴扩张？答案是：当 $a\\\\ge-((n-2)/2)^2$ 时，Hardy 不等式保证二次型非负（§1.4），从而下半有界；而下半有界对称算子总存在 Friedrichs 自伴扩张（§1.4.1）。记号 $L_a$ 始终表示这个自伴扩张，而不是形式算子本身。\\n\\n**定义 1.1（反平方势薛定谔算子 $L_a$）。** 设 $n\\\\ge 3$，$a\\\\ge-((n-2)/2)^2$。记 $L_a$ 为形式算子 $-\\\\Delta+a|x|^{-2}$（初域 $C_c^\\\\infty(\\\\mathbb R^n\\\\setminus\\\\{0\\\\})$）的 Friedrichs 自伴扩张。\\n\\n### 1.3.4 为什么要求 $n\\\\ge 3$\\n\\n本文要求 $n\\\\ge 3$，这不是技术性的武断，而是由 Hardy 不等式的结构决定的。Hardy 常数是 $((n-2)/2)^2$：当 $n=2$ 时它等于 $0$，此时 Hardy 不等式退化为平凡（$|x|^{-2}$ 在二维的 $1/|x|^2$ 权是「临界不可控」的，$\\\\int|\\\\nabla u|^2$ 不再控制 $\\\\int u^2/|x|^2$）；当 $n=1$ 时原点把 $\\\\mathbb R$ 分成两个连通分支，奇异性按不同的方式处理。只有 $n\\\\ge 3$ 时，$((n-2)/2)^2\u003e0$，Hardy 不等式给出非平凡的控制，且 $X=\\\\mathbb R^n\\\\setminus\\\\{0\\\\}$ 保持连通，二进几何构造才能正常进行。因此 $n\\\\ge 3$ 是反平方势调和分析的自然工作范围。\\n\\n## 1.4 Friedrichs 自伴扩张与 Hardy 临界常数\\n\\n### 1.4.1 为什么要自伴扩张，以及 Friedrichs 扩张是什么\\n\\n量子力学要求能量算子自伴，因为自伴算子具有实谱，且由 Stone 定理可定义酉演化群 $e^{itL_a}$。形式算子 $-\\\\Delta+a|x|^{-2}$ 在 $C_c^\\\\infty(\\\\mathbb R^n\\\\setminus\\\\{0\\\\})$ 上是对称的，但未必自伴。当势「足够温和」时，形式算子是本质自伴的，自伴扩张唯一；当势在原点有强奇异时，可能出现多个自伴扩张，需要物理或数学准则来挑选。\\n\\n**定义 1.1$'$（Friedrichs 自伴扩张）。** 设 $q$ 是 Hilbert 空间 $\\\\mathcal H$ 上**稠密定义**、**下半有界**的二次型，即存在 $c\\\\in\\\\mathbb R$ 使 $q(u)\\\\ge c\\\\|u\\\\|^2$。在形式定义域上引入范数\\n\\n$$\\\\|u\\\\|_q^2 := q(u)+(1-c)\\\\|u\\\\|^2,$$\\n\\n取其闭包得到 Hilbert 空间 $\\\\mathcal H_q$。由表示定理，存在 $\\\\mathcal H$ 上的自伴算子 $A$，使 $q(u,v)=\\\\langle Au,v\\\\rangle$ 对 $u\\\\in D(A)\\\\subseteq D(q)$ 成立，且 $A\\\\ge cI$。这个 $A$ 称为二次型 $q$ 对应的自伴算子。当 $q(u)=\\\\int(|\\\\nabla u|^2+a|x|^{-2}|u|^2)$ 取为形式算子的二次型时，对应的 $A$ 就是 **Friedrichs 自伴扩张** $L_a$。\\n\\n**直观解释。** Friedrichs 扩张是「最小」的自伴扩张：它把形式算子的二次型延拓到「由形式范数逼近的极限函数」上，保持下半有界常数（下确界）不变。对于反平方势，这个扩张是物理上自然的选择——它对应「原点处不附加边界条件」的 Dirichlet 型实现。本章不需要掌握表示定理的证明，只需记住：**下半有界二次型 $\\\\Rightarrow$ 存在唯一的 Friedrichs 自伴扩张**。因此 §1.4.2 证明下半有界（Hardy 不等式）就足够确立 $L_a$ 的存在性。\\n\\n### 1.4.2 Hardy 不等式\\n\\n**命题 1.2（Hardy 不等式）。** 设 $n\\\\ge 3$。对任意 $u\\\\in C_c^\\\\infty(\\\\mathbb R^n\\\\setminus\\\\{0\\\\})$，\\n\\n$$\\\\int_{\\\\mathbb R^n}|\\\\nabla u|^2\\\\,dx \\\\;\\\\ge\\\\; \\\\Bigl(\\\\frac{n-2}{2}\\\\Bigr)^2 \\\\int_{\\\\mathbb R^n}\\\\frac{|u|^2}{|x|^2}\\\\,dx .$$\\n\\n**直观解释。** 左边是 $u$ 的「总动能」，右边是 $u$ 被 $|x|^{-1}$ 加权后的「势能」。Hardy 不等式说：动能至少以常数 $((n-2)/2)^2$ 控制势能。直观上，函数若要在原点附近「聚拢」以增大 $|u|^2/|x|^2$ 的积分，就必然付出巨大的梯度（动能）代价。常数 $((n-2)/2)^2$ 是最优的（等号在径向函数 $|x|^{-(n-2)/2}$ 的意义下达到），本文只需要下界，最优性作为经典结果引用。\\n\\n**证明。** 这是全章第一个完整证明，采用「平方配方法 + 分部积分」。\\n\\n**第一步：构造平方非负项。** 对任意实数 $\\\\lambda$，在 $\\\\mathbb R^n\\\\setminus\\\\{0\\\\}$ 上逐点成立\\n\\n$$0\\\\le \\\\Bigl|\\\\nabla u + \\\\lambda\\\\, u\\\\,\\\\frac{x}{|x|^2}\\\\Bigr|^2 .$$\\n\\n展开得\\n\\n$$0\\\\le |\\\\nabla u|^2 + 2\\\\lambda\\\\, u\\\\,(\\\\nabla u)\\\\cdot\\\\frac{x}{|x|^2} + \\\\lambda^2\\\\,\\\\frac{|u|^2}{|x|^2}.$$\\n\\n对两边积分：\\n\\n$$0\\\\le \\\\int|\\\\nabla u|^2\\\\,dx + 2\\\\lambda\\\\int u\\\\,(\\\\nabla u)\\\\cdot\\\\frac{x}{|x|^2}\\\\,dx + \\\\lambda^2\\\\int\\\\frac{|u|^2}{|x|^2}\\\\,dx .$$\\n\\n**第二步：处理交叉项。** 注意 $u\\\\,(\\\\nabla u)\\\\cdot x = \\\\frac12\\\\, x\\\\cdot\\\\nabla(u^2)$，于是\\n\\n$$2\\\\int u\\\\,(\\\\nabla u)\\\\cdot\\\\frac{x}{|x|^2}\\\\,dx\\n=\\\\int \\\\frac{x}{|x|^2}\\\\cdot\\\\nabla(u^2)\\\\,dx .$$\\n\\n分部积分（$u$ 支集远离原点，边界项消失；这正是 $u\\\\in C_c^\\\\infty(\\\\mathbb R^n\\\\setminus\\\\{0\\\\})$ 的作用）：\\n\\n$$\\\\int \\\\frac{x}{|x|^2}\\\\cdot\\\\nabla(u^2)\\\\,dx\\n= -\\\\int \\\\mathrm{div}\\\\Bigl(\\\\frac{x}{|x|^2}\\\\Bigr)\\\\, u^2\\\\,dx .$$\\n\\n**第三步：计算散度。** 逐分量\\n\\n$$\\\\partial_{x_j}\\\\Bigl(\\\\frac{x_j}{|x|^2}\\\\Bigr)\\n= \\\\frac{1}{|x|^2} - \\\\frac{2x_j^2}{|x|^4},$$\\n\\n对 $j$ 从 $1$ 到 $n$ 求和：\\n\\n$$\\\\mathrm{div}\\\\Bigl(\\\\frac{x}{|x|^2}\\\\Bigr)\\n= \\\\frac{n}{|x|^2}-\\\\frac{2|x|^2}{|x|^4}\\n= \\\\frac{n-2}{|x|^2}.$$\\n\\n于是\\n\\n$$2\\\\int u\\\\,(\\\\nabla u)\\\\cdot\\\\frac{x}{|x|^2}\\\\,dx = -(n-2)\\\\int\\\\frac{|u|^2}{|x|^2}\\\\,dx .$$\\n\\n**第四步：代入并配方。** 代入第一步的展开式，得\\n\\n$$0\\\\le \\\\int|\\\\nabla u|^2\\\\,dx - \\\\lambda(n-2)\\\\int\\\\frac{|u|^2}{|x|^2}\\\\,dx + \\\\lambda^2\\\\int\\\\frac{|u|^2}{|x|^2}\\\\,dx .$$\\n\\n即对任意 $\\\\lambda$，\\n\\n$$\\\\int|\\\\nabla u|^2\\\\,dx \\\\ge \\\\bigl[\\\\lambda(n-2)-\\\\lambda^2\\\\bigr]\\\\int\\\\frac{|u|^2}{|x|^2}\\\\,dx .$$\\n\\n**第五步：选取最优 $\\\\lambda$。** 右端系数 $\\\\lambda(n-2)-\\\\lambda^2$ 是 $\\\\lambda$ 的二次函数，在 $\\\\lambda=(n-2)/2$ 处取最大值\\n\\n$$\\\\frac{n-2}{2}(n-2)-\\\\Bigl(\\\\frac{n-2}{2}\\\\Bigr)^2 = \\\\Bigl(\\\\frac{n-2}{2}\\\\Bigr)^2 .$$\\n\\n代入即得 Hardy 不等式。$\\\\Box$\\n\\n**证明机制总结。** 证明的关键是「平方配方法」：把 $\\\\int|\\\\nabla u|^2$ 与 $\\\\int u^2/|x|^2$ 通过一个可调参数 $\\\\lambda$ 和一个「好散度」的向量场 $x/|x|^2$ 联系起来。向量场 $x/|x|^2$ 的散度恰为 $(n-2)/|x|^2$，使得交叉项恰好产生 $u^2/|x|^2$ 的积分；再对 $\\\\lambda$ 取最优，即得临界常数。这一方法本质上是「Hardy 型不等式的第一积分法」，可推广到更一般的「Hardy 位势」。**关键假设**是 $u$ 的支集远离原点，否则分部积分的边界项不为零，证明会多出边界项。\\n\\n### 1.4.3 非负性与 Friedrichs 扩张\\n\\n**推论 1.3。** 设 $a\\\\ge-((n-2)/2)^2$。则形式算子 $-\\\\Delta+a|x|^{-2}$ 在 $C_c^\\\\infty(\\\\mathbb R^n\\\\setminus\\\\{0\\\\})$ 上**下半有界**（事实上非负），其 Friedrichs 自伴扩张 $L_a$ 存在且非负。\\n\\n**证明。** 对 $u\\\\in C_c^\\\\infty(\\\\mathbb R^n\\\\setminus\\\\{0\\\\})$，由 Hardy 不等式与 $a\\\\ge-((n-2)/2)^2$，\\n\\n$$\\\\int \\\\bigl(|\\\\nabla u|^2 + a|x|^{-2}|u|^2\\\\bigr)\\\\,dx\\n\\\\ge \\\\Bigl[\\\\Bigl(\\\\frac{n-2}{2}\\\\Bigr)^2+a\\\\Bigr]\\\\int\\\\frac{|u|^2}{|x|^2}\\\\,dx \\\\ge 0 .$$\\n\\n故二次型 $q(u)=\\\\int(|\\\\nabla u|^2+a|x|^{-2}|u|^2)$ 非负、下半有界，按 §1.4.1 的 Friedrichs 定理存在唯一的自伴扩张 $L_a$，其下确界不小于 $0$。$\\\\Box$\\n\\n**直观解释。** 这里的逻辑是：反平方势 $a|x|^{-2}$ 是「向下拉」的（$a\u003c0$ 时），但 Hardy 不等式保证动能的控制力恰好能抵消到临界值 $a=-((n-2)/2)^2$。一旦 $a$ 低于这个临界值，算子就不再下半有界，量子系统会「塌缩」（谱下方无界）。因此 $a\\\\ge-((n-2)/2)^2$ 是算子保持非负的**临界条件**。这正是 §1.2.1 提到的「落向中心」的数学表述。\\n\\n## 1.5 参数 $\\\\sigma$ 及其几何意义\\n\\n### 1.5.1 定义与基本关系\\n\\n为把 $a$ 的取值范围「线性化」，引入参数\\n\\n$$\\\\sigma := \\\\frac{n-2}{2}-\\\\frac{1}{2}\\\\sqrt{(n-2)^2+4a}.$$\\n\\n**命题 1.4（$\\\\sigma$ 参数化）。** 设 $n\\\\ge 3$，$a\\\\ge-((n-2)/2)^2$。则\\n\\n$$a=\\\\sigma^2-(n-2)\\\\sigma=-\\\\sigma(n-2-\\\\sigma),$$\\n\\n且映射 $a\\\\mapsto\\\\sigma$ 严格单调递减，值域为 $(-\\\\infty,(n-2)/2]$。特别地，$a=0\\\\iff\\\\sigma=0$，$a=-((n-2)/2)^2\\\\iff\\\\sigma=(n-2)/2$。\\n\\n**证明。** 由定义，\\n\\n$$\\\\frac{n-2}{2}-\\\\sigma = \\\\frac12\\\\sqrt{(n-2)^2+4a}.$$\\n\\n因 $\\\\sigma\\\\le(n-2)/2$，两边非负，可平方：\\n\\n$$\\\\Bigl(\\\\frac{n-2}{2}-\\\\sigma\\\\Bigr)^2 = \\\\frac{(n-2)^2+4a}{4}.$$\\n\\n展开左边并乘以 $4$：\\n\\n$$(n-2)^2-4(n-2)\\\\sigma+4\\\\sigma^2 = (n-2)^2+4a,$$\\n\\n消去 $(n-2)^2$ 并除以 $4$：\\n\\n$$a=\\\\sigma^2-(n-2)\\\\sigma.$$\\n\\n端点核对：$a=0\\\\Rightarrow\\\\sigma^2-(n-2)\\\\sigma=0\\\\Rightarrow\\\\sigma=0$（因 $\\\\sigma\\\\le(n-2)/2$ 排除 $\\\\sigma=n-2$ 分支）；$a=-((n-2)/2)^2\\\\Rightarrow$ 判别式为 $0\\\\Rightarrow\\\\sigma=(n-2)/2$。单调性：$\\\\frac{d\\\\sigma}{da}=-( (n-2)^2+4a)^{-1/2}\u003c0$。$\\\\Box$\\n\\n### 1.5.2 直观解释：$\\\\sigma$ 的角色\\n\\n**为什么引入 $\\\\sigma$？** 反平方势的全部定量行为最终只通过一个标量进入估计，这个标量就是 $\\\\sigma$。可以把它理解为「有效势强度」：$\\\\sigma$ 越大，势的「奇异效应」越弱；$\\\\sigma=(n-2)/2$ 对应最温和的临界势（$a$ 取 Hardy 临界值），$\\\\sigma\\\\to-\\\\infty$ 对应 $a\\\\to+\\\\infty$ 的强斥势；$\\\\sigma=0$ 对应自由拉普拉斯（$a=0$）。\\n\\n**几何意义。** 后面（§1.6 与后续章节）会看到，Riesz 位势核 $K_\\\\alpha(x,y)$ 的估计中出现因子\\n\\n$$1\\\\wedge\\\\frac{|x|}{|x-y|}\\\\wedge\\\\frac{|y|}{|x-y|},$$\\n\\n其「远层」（$|x-y|$ 远大于 $|x|,|y|$）衰减指数正是 $\\\\sigma$。换句话说，$\\\\sigma$ 量化了核在远距离上的修正衰减，是反平方势留下的唯一几何痕迹。这也是为什么全文几乎所有常数都只依赖 $n,\\\\alpha,a$（即依赖 $\\\\sigma$）。\\n\\n**三个标志值。** $\\\\sigma=(n-2)/2$：最温和的临界势；$\\\\sigma=0$：自由拉普拉斯（无势，标准 Riesz 核）；$\\\\sigma\u003c0$：强斥势，核在远层额外衰减（$\\\\sigma$ 越负衰减越快）。这些标志值在后续各章会反复出现，特别是第 7 章命题 1.4 用 $\\\\sigma\\\\neq0$ 区分「核尺度是否为度量」。\\n\\n### 1.5.3 例子：$n=3$ 的具体取值\\n\\n取 $n=3$，则临界常数为 $((n-2)/2)^2=1/4$。下表给出几个典型 $a$ 与 $\\\\sigma$ 的对应：\\n\\n- $a=0$（自由拉普拉斯）：$\\\\sigma=0$；\\n- $a=-1/4$（Hardy 临界值）：$\\\\sigma=1/2$；\\n- $a=3/4$：$\\\\sigma=\\\\frac12-\\\\frac12\\\\sqrt{1+3}=\\\\frac12-1=-\\\\frac12$；\\n- $a=2$：$\\\\sigma=\\\\frac12-\\\\frac12\\\\sqrt{9}=\\\\frac12-\\\\frac32=-1$。\\n\\n可验证 $a=\\\\sigma^2-\\\\sigma$（$n=3$ 时 $n-2=1$），例如 $a=-1/4$ 时 $\\\\sigma=1/2$，$\\\\sigma^2-\\\\sigma=1/4-1/2=-1/4$。$\\\\checkmark$\\n\\n## 1.6 反向 Hölder 类与临界半径函数\\n\\n### 1.6.1 反向 Hölder 类 $RH_p$\\n\\n**定义 1.5（反向 Hölder 类 $RH_p$）。** 设 $1\u003cp\u003c\\\\infty$。称非负局部可积函数 $V\\\\in RH_p$，若存在常数 $C\u003e0$，使得对任意球 $B\\\\subset\\\\mathbb R^n$，\\n\\n$$\\\\Bigl(\\\\frac1{|B|}\\\\int_B V^p\\\\,dx\\\\Bigr)^{1/p}\\\\;\\\\le\\\\; C\\\\,\\\\frac1{|B|}\\\\int_B V\\\\,dx .$$\\n\\n**直观解释。** 普通 Hölder 不等式给的是 $\\\\frac1{|B|}\\\\int_B V\\\\le(\\\\frac1{|B|}\\\\int_B V^p)^{1/p}$，即「$L^1$ 平均 $\\\\le$ $L^p$ 平均」。$RH_p$ 要求**反向**的不等式：$L^p$ 平均被 $L^1$ 平均常数倍控制。这迫使 $V$ 不能「局部剧烈集中」——因为 $p$ 次幂会放大尖峰，若 $V$ 在某处有尖锐的峰，$L^p$ 平均会远大于 $L^1$ 平均。因此 $RH_p$ 是「势的局部均匀性」条件。\\n\\n**例子：谁在 $RH_p$ 里，谁不在？** 常数函数 $V\\\\equiv c\u003e0$ 显然在 $RH_p$（两端都等于 $c$）。光滑正函数（局部有界且远离零）也在 $RH_p$。幂律势 $|x|^\\\\beta$（$\\\\beta\u003e-2$）在 $RH_p$（对适当 $p$），因为 $|x|^{p\\\\beta}$ 在原点附近可积当且仅当 $p\\\\beta\u003e-n$。但 $|x|^{-2}$ 取 $p=n/2$ 时 $p\\\\beta=-n$，恰好不可积（见 §1.6.2），被排除在 $RH_{n/2}$ 之外。这是「$\\\\beta=-2$ 临界」的精确含义。\\n\\n**为什么 $p=n/2$ 是相关指标。** 在薛定谔算子的尺度分析中，$n/2$ 次幂对应「势的 $n/2$ 阶尺度」：当把 $V$ 与 $|x|^{-2}$ 比较时，$V^{n/2}$ 的局部可积性恰好是 $RH_{n/2}$ 成立与否的分界。这正是 [2] 构造临界半径函数所需的指标。\\n\\n### 1.6.2 反平方势不属于 $RH_{n/2}$\\n\\n**命题 1.6。** 设 $n\\\\ge 3$，$V(x)=a|x|^{-2}$，$a\\\\neq0$。则 $V\\\\notin RH_{n/2}$。\\n\\n**证明。** 取 $p=n/2$。对 $V=a|x|^{-2}$，有\\n\\n$$V^{n/2}=|a|^{n/2}\\\\,|x|^{-n}.$$\\n\\n取以原点为中心的球 $B=B(0,r)$。右端的 $L^1$ 平均有限：\\n\\n$$\\\\frac1{|B|}\\\\int_B V\\\\,dx = |a|\\\\,\\\\frac1{|B|}\\\\int_{B(0,r)}|x|^{-2}\\\\,dx \\\\sim r^{-2}\u003c\\\\infty .$$\\n\\n但左端的 $L^{n/2}$ 平均发散，因为 $|x|^{-n}$ 在原点附近不可积：\\n\\n$$\\\\int_{B(0,r)} V^{n/2}\\\\,dx = |a|^{n/2}\\\\int_{B(0,r)}|x|^{-n}\\\\,dx = +\\\\infty .$$\\n\\n因此反向 Hölder 不等式（左端 $\\\\le C$ 右端）对 $B(0,r)$ 不可能成立，$V\\\\notin RH_{n/2}$。$\\\\Box$\\n\\n**直观解释。** 反平方势 $|x|^{-2}$ 在原点附近「太尖」：$n/2$ 次幂后变成 $|x|^{-n}$，恰好达到不可积的临界阶。这正是 $V\\\\notin RH_{n/2}$ 的根源，也是反平方势区别于幂律势 $|x|^\\\\beta$（$\\\\beta\u003e-2$，此时 $V^{n/2}=|x|^{n\\\\beta/2}$ 在原点附近仍可积）的本质原因。\\n\\n### 1.6.3 临界半径函数及其失效\\n\\n**定义 1.7（临界半径函数，[2]，示意）。** 对满足 $V\\\\in RH_q$（适当 $q$）的非负势 $V$，临界半径函数 $\\\\rho(x,V)$ 由如下平衡条件确定（示意）：\\n\\n$$\\\\frac1{|B(x,\\\\rho(x,V))|}\\\\int_{B(x,\\\\rho(x,V))} V(y)\\\\,dy \\\\sim \\\\rho(x,V)^{-2},$$\\n\\n即「球内的平均势」与「半径平方的倒数」同阶。它给出了构造扰动二进系统时立方体边长应取的尺度。\\n\\n**尺度分析（为什么是 $\\\\rho^{-2}$）。** 考虑在点 $x$ 附近取半径 $\\\\rho$ 的球。动能 $-\\\\Delta$ 的局部特征尺度是 $\\\\rho^{-2}$（这是 Laplace 算子对尺度 $\\\\rho$ 的齐次性：$\\\\Delta$ 在伸缩 $y\\\\mapsto\\\\rho y$ 下按 $\\\\rho^{-2}$ 缩放）。势的局部平均贡献是 $\\\\frac1{|B(x,\\\\rho)|}\\\\int_{B(x,\\\\rho)}V$。当这两个尺度同阶时，即 $\\\\frac1{|B|}\\\\int_B V\\\\sim\\\\rho^{-2}$，势与动能「平衡」，此时 $\\\\rho$ 就是势的「特征尺度」——在这个尺度上，势的影响与动能的影响相当。临界半径函数 $\\\\rho(x,V)$ 就是把这个平衡尺度写成 $x$ 的函数。对幂律势 $|x|^\\\\beta$，解这个平衡条件得 $\\\\rho(x,V)\\\\sim|x|^{-\\\\beta/2}$，与 §1.2.3 的尺度分析一致。\\n\\n**推论 1.8。** 对反平方势 $V=a|x|^{-2}$，$V\\\\notin RH_{n/2}$，故 $RH_{n/2}$ 框架下的临界半径函数 $\\\\rho(x,V)$ 不可用；[3] 退而引入局部化临界半径 $\\\\rho_{\\\\rm loc}(x,V)\\\\sim|x|$。\\n\\n**说明。** 本推论是本文的叙述事实：论文 §1 明确写道「$V\\\\notin RH_{n/2}$，so the critical radius function $\\\\rho(x,V)$ is no longer available」。局部化临界半径 $\\\\rho_{\\\\rm loc}\\\\sim|x|$ 反映的直观是：反平方势的「特征尺度」就是到原点的距离 $|x|$ 本身——离原点多远，势的变化尺度就是多大。这为边长 $\\\\ell(Q)\\\\sim 2^{-k}|x|$ 提供了几何依据。\\n\\n## 1.7 相邻覆盖问题与本文目标\\n\\n### 1.7.1 相邻覆盖性质与稀疏支配\\n\\n**定义 1.9（相邻覆盖性质）。** 称一族立方体系统 $\\\\mathcal D$ 具有（局部）相邻覆盖性质，若存在常数 $C$，使得对任意（满足适当局部性条件的）立方体 $J$，存在 $Q\\\\in\\\\mathcal D$ 满足 $J\\\\subseteq Q$ 且 $|Q|\\\\le C|J|$。\\n\\n**什么是稀疏支配（一句定义）。** 稀疏支配是把算子的范数估计（如 $L^p$、加权 $L^p$）化归为对**稀疏算子**的估计的框架：一个算子 $T$ 被一个稀疏算子 $A_{\\\\mathcal S}$（对某个稀疏族 $\\\\mathcal S$——即两两不相交的立方体族上的平均算子）逐点控制，即 $|Tf|\\\\lesssim A_{\\\\mathcal S}|f|$。相邻覆盖性质正是构造稀疏族 $\\\\mathcal S$ 时「把任意立方体局部化到系统立方体」的关键一步。\\n\\n**为什么重要。** 在稀疏支配中，需要把算子的作用「局部化」到不相交的稀疏立方体族上。若系统不能相邻覆盖，一个任意给定的立方体 $J$ 可能横跨系统的多个小格，导致局部化失败或损失常数。相邻覆盖保证每个 $J$ 都能被「略大」的系统立方体吞下，从而把局部化的常数损失控制在可接受范围。\\n\\n### 1.7.2 经典情形的解决：$3^n$ 平移网格的完整论证\\n\\n先看一维。标准二分格的端点集是 $2^j\\\\mathbb Z$（$j\\\\in\\\\mathbb Z$）。取三个平移网格，其端点集分别为\\n\\n$$2^j\\\\mathbb Z,\\\\qquad 2^j\\\\Bigl(\\\\mathbb Z+\\\\frac13\\\\Bigr),\\\\qquad 2^j\\\\Bigl(\\\\mathbb Z+\\\\frac23\\\\Bigr).$$\\n\\n**断言。** 任意长度 $r\\\\le 2^j/3$ 的区间 $J$，三个平移网格中至少一个的端点不落在 $J$ 的内部，从而 $J$ 被该网格的一个边长 $2^j$ 的格子盖住。\\n\\n**证明。** 反设三个网格都在 $J$ 的内部有端点。三个网格的端点集两两之间的最小距离是 $2^j/3$（因为相位差 $1/3$ 对应的端点间隔至少 $2^j/3$），所以若 $J$ 同时含三个网格的端点，则 $J$ 的长度至少 $2^j/3$（实际上至少 $2^j/3$ 的两倍间距需要至少两个不同网格的端点相距 $\\\\ge 2^j/3$）。这与 $r\\\\le 2^j/3$ 矛盾。更精确地，任何两个不同网格的端点在区间内的最小间距 $\\\\ge 2^j/3$，故一个长度 $\u003c2^j/3$ 的区间至多含一个网格的一个端点。于是至多 $2$ 个网格被排除（每个方向至多一个），三个网格中至少一个「干净」，其边长 $2^j$ 的格子盖住 $J$。$\\\\Box$\\n\\n推广到 $n$ 维：每个坐标方向独立地需要「$3$ 选 $1$」的干净网格，组合起来需要 $3^n$ 个平移网格（每个方向取 $0,1/3,2/3$ 三种相位）。这就是经典 $3^n$ 相邻系统的完整来源。\\n\\n**反平方势的困难。** 对扰动系统 $D_V$，立方体边长 $\\\\ell(Q)\\\\sim2^{-k}|x|$ 随位置自适应，**不能**靠整体平移生成相邻系统：平移会破坏「边长与 $|x|$ 匹配」这一几何约束。因此需要全新的构造——这正是后续第 3、4 章的主题（相位分离与 $n+1$ 个相邻二进系统）。第 4 章会揭示一个反直觉的事实：对反平方势，只需 $n+1$ 个（而非 $3^n$ 个）系统即可，因为自适应边长本身承担了部分「局部化」。\\n\\n### 1.7.3 本文的目标\\n\\n综上所述，本文要回答：\\n\\n\u003e **问题**：能否为 $L_a$ 构造 $n+1$ 个相邻二进系统，使局部相邻覆盖性质成立？能否用单一分段核尺度统一 Riesz 位势核估计？\\n\\n答案是肯定的（定理 1.1、1.2、1.3），且核尺度非拟度量（命题 1.4）。本章建立的地基——$L_a$、$\\\\sigma$、Hardy 常数、$RH_{n/2}$ 的失效——将在后续各章反复使用。\\n\\n## 1.8 例子与反例\\n\\n**例 1（一维二分格与相邻覆盖，为第 2 章预热）。** 在一维直线 $\\\\mathbb R$ 上，标准二分格以 $\\\\{2^j m : m\\\\in\\\\mathbb Z\\\\}$ 为端点（$j\\\\in\\\\mathbb Z$），相邻端点间距 $2^j$。任取长度 $r$ 的区间 $J$：若 $J$ 内部含有一个二分端点，则 $J$ 跨两个相邻格，无法被边长 $\\\\le Cr$ 的格子盖住。经典解法是再取两个平移网格（端点整体平移 $2^j/3$、$2\\\\cdot 2^j/3$）：对长度 $\\\\le 2^j/3$ 的区间，三个网格中至少一个的端点不落在 $J$ 内部。这就是 $n=1$ 时「$3$ 个相邻系统」的由来（完整的端点计数论证见 §1.7.2）。\\n\\n**例 2（Hardy 不等式的径向检验）。** 取 $n=3$，$u(x)=|x|^{-1/2}\\\\varphi(x)$，其中 $\\\\varphi\\\\in C_c^\\\\infty$ 在 $B(0,1)$ 内恒为 $1$、在 $B(0,2)$ 外为 $0$。用球坐标 $dx=r^{2}\\\\,dr\\\\,d\\\\omega$（$d\\\\omega$ 为单位球面测度）计算。在 $B(0,1)$ 内 $u=|x|^{-1/2}$，故\\n\\n$$\\\\nabla u = -\\\\frac12 |x|^{-3/2}\\\\frac{x}{|x|},\\\\qquad |\\\\nabla u|^2=\\\\frac14|x|^{-3},$$\\n\\n于是\\n\\n$$\\\\int_{B(0,1)}|\\\\nabla u|^2\\\\,dx = \\\\frac14\\\\int_0^1 r^{-3}\\\\,r^2\\\\,dr = \\\\frac14\\\\int_0^1 r^{-1}\\\\,dr = +\\\\infty,$$\\n\\n而\\n\\n$$\\\\int_{B(0,1)}\\\\frac{|u|^2}{|x|^2}\\\\,dx = \\\\int_0^1 r^{-1}\\\\,r^{-2}\\\\,r^2\\\\,dr = \\\\int_0^1 r^{-1}\\\\,dr = +\\\\infty.$$\\n\\n这说明 Hardy 不等式是「同阶发散」的临界情形：左右两端同时发散，常数 $((n-2)/2)^2$ 由发散的主阶比值决定。光滑截断 $\\\\varphi$ 在 $1\u003c|x|\u003c2$ 的过渡贡献是有限的，不改变发散主阶，故本例的定性结论成立。\\n\\n**例 3（$a$ 取临界值时的紧致性丧失）。** 当 $a=-((n-2)/2)^2$ 时，Hardy 不等式等号在「无紧致性」意义下由径向函数 $|x|^{-(n-2)/2}$ 达到（形式上），这导致算子 $L_a$ 的谱在 $0$ 处有临界行为。这一现象解释了为何反平方势在临界常数处的研究需要特别的几何构造（本文正是为此引入相邻二进系统）。此为定性说明，严格的谱论分析不在本书范围。\\n\\n**例 4（$\\\\sigma$ 的单调性检验）。** 固定 $n=3$。函数 $\\\\sigma(a)=\\\\frac12-\\\\frac12\\\\sqrt{1+4a}$ 在 $a\\\\in[-\\\\frac14,\\\\infty)$ 上严格递减：$\\\\sigma(-\\\\frac14)=\\\\frac12$，$\\\\sigma(0)=0$，$\\\\sigma(2)=-1$，且 $\\\\lim_{a\\\\to\\\\infty}\\\\sigma(a)=-\\\\infty$。这与命题 1.4 的「值域 $(-\\\\infty,\\\\frac12]$」一致。直观上，$a$ 越大（势越斥），$\\\\sigma$ 越负，势的「奇异效应」越强。\\n\\n**例 5（$RH_p$ 的正反例对照）。** 取 $n=3$。幂律势 $V(x)=|x|^{-1}$（$\\\\beta=-1\u003e-2$）对 $p=n/2=3/2$ 有 $V^{3/2}=|x|^{-3/2}$，在原点附近可积（$\\\\int_0^1 r^{-3/2}r^2\\\\,dr=\\\\int_0^1 r^{1/2}\\\\,dr\u003c\\\\infty$），故 $|x|^{-1}\\\\in RH_{3/2}$（对原点附近的球，反向 Hölder 常数有界）。而 $V(x)=|x|^{-2}$ 对 $p=3/2$ 有 $V^{3/2}=|x|^{-3}$，在原点不可积（$\\\\int_0^1 r^{-3}r^2\\\\,dr=\\\\int_0^1 r^{-1}\\\\,dr=\\\\infty$），故 $|x|^{-2}\\\\notin RH_{3/2}$。这个对照直观地展示了「$\\\\beta=-2$ 临界」：把幂次从 $-1$ 降到 $-2$，$V^{3/2}$ 的可积性恰好从「可积」翻转为「不可积」。\\n\\n## 1.8bis 层分解与局部化临界半径（为第 3–5 章预热）\\n\\n反平方势的后续构造（第 3 章 $n+1$ 系统、第 5 章核尺度）反复用到一种**按到原点距离分层的分解**。这里提前引入，避免后续重复定义。\\n\\n**定义 1.10（层分解）。** 对 $l\\\\in\\\\mathbb Z$，定义第 $l$ 层\\n\\n$$L_l := [-2^l,2^l)^n \\\\setminus [-2^{l-1},2^{l-1})^n,$$\\n\\n并设层尺度（layer scale）\\n\\n$$b_l := 2^{l-2}.$$\\n\\n直观上，$L_l$ 是「半径在 $2^{l-1}$ 与 $2^l$ 之间的环带」（用 $\\\\ell^\\\\infty$ 立方体近似）。对 $x\\\\in L_l$，有 $2^{l-1}\\\\le |x|_\\\\infty\u003c2^l$，即 $|x|_\\\\infty\\\\sim 2^l$。因此 $b_l\\\\sim 2^l$ 与 $|x|_\\\\infty$ 同阶。\\n\\n**为什么层尺度取 $b_l=2^{l-2}$。** 在第 3 章，反平方势的扰动二进系统 $D_V$ 的边长要满足 $\\\\ell(Q)\\\\sim2^{-k}|x|$。把「到原点距离」离散化为层 $L_l$ 之后，第 $l$ 层内的边长基准取为 $b_l=2^{l-2}$，它是 $2^l$ 的 $1/4$，从而保证该层内格子边长与 $|x|\\\\sim2^l$ 同阶，且不同层之间通过 $k$（代际）参数细分。系数 $1/4$ 的选择是为了给「可接受条件」（第 4 章）留出余地。\\n\\n**局部化临界半径。** 有了层分解，反平方势的「局部化临界半径」可写成\\n\\n$$\\\\rho_{\\\\rm loc}(x,V)\\\\sim 2^{l(x)}\\\\sim |x|,$$\\n\\n其中 $l(x)$ 是满足 $x\\\\in L_{l(x)}$ 的唯一层指标。这正是 [3] 用「层尺度 $b_l$ 替代临界半径 $\\\\rho(x,V)$」的方式：反平方势没有 $RH_{n/2}$ 意义上的临界半径，但到原点的距离 $|x|$ 本身就是自然的尺度，层分解把它离散化。\\n\\n## 1.8ter Riesz 位势核估计 (2) 的预览（为第 6 章预热）\\n\\n第 6 章的目标是把 Riesz 位势 $L_a^{-\\\\alpha/2}$ 的积分核 $K_\\\\alpha(x,y)$ 统一写成一个「分段核尺度」的幂。这里提前给出 [4,3] 建立的核估计 (2)，理解它为何需要本章的 $\\\\sigma$ 与第 5 章的相邻覆盖。\\n\\n**核估计 (2)。** 设 $0\u003c\\\\alpha\u003cn$。Riesz 位势 $L_a^{-\\\\alpha/2}$ 的积分核 $K_\\\\alpha(x,y)$ 满足\\n\\n$$K_\\\\alpha(x,y)\\\\;\\\\sim\\\\; |x-y|^{\\\\alpha-n}\\\\Bigl(1\\\\wedge \\\\frac{|x|}{|x-y|}\\\\wedge \\\\frac{|y|}{|x-y|}\\\\Bigr)^{-\\\\sigma},\\\\qquad x\\\\neq y,$$\\n\\n其中 $u\\\\wedge v=\\\\min\\\\{u,v\\\\}$，常数只依赖 $n,\\\\alpha,a$。\\n\\n**括号因子的几何含义。** 主项 $|x-y|^{\\\\alpha-n}$ 是标准 Riesz 核（自由拉普拉斯的情形，$a=0$ 即 $\\\\sigma=0$ 时括号因子为 $1$）。括号因子 $1\\\\wedge\\\\frac{|x|}{|x-y|}\\\\wedge\\\\frac{|y|}{|x-y|}$ 反映反平方势的修正：当 $|x-y|$ 远大于 $|x|,|y|$ 时（两点都离原点很近、相距很远），$\\\\frac{|x|}{|x-y|},\\\\frac{|y|}{|x-y|}$ 都小，括号因子取其中的较小者，按 $-\\\\sigma$ 次幂给出**额外的衰减或增长**。这正是 $\\\\sigma$ 作为「远层修正指数」的由来（呼应 §1.5.2）。\\n\\n**三段结构。** 核估计 (2) 把 $X\\\\times X$ 自然分成三段：局部区域（$|x-y|$ 小，括号因子 $\\\\sim1$）、相邻层非局部区域（$|x|\\\\sim|y|\\\\sim|x-y|$）、远层区域（$|x-y|$ 远大于 $|x|,|y|$，括号因子 $\\\\sim|x|/|x-y|$）。第 6 章的分段核尺度 $\\\\widetilde d_\\\\alpha$ 正是为这三段各配一个尺度，使 $K_\\\\alpha\\\\sim\\\\widetilde d_\\\\alpha^{\\\\alpha-n}$ 处处成立。本章的 $\\\\sigma$ 与第 5 章的相邻覆盖是完成这件事的两个前提。\\n\\n## 1.8quater 为什么是 $n+1$ 个系统：一个预览\\n\\n经典情形需要 $3^n$ 个平移网格，是因为每个坐标方向都要「$3$ 选 $1$」地挑一个干净网格（§1.7.2）。反平方势的扰动系统却只需 $n+1$ 个系统，这乍看反直觉，根子在于**自适应的边长本身承担了部分局部化**。这里给出预览，完整构造见第 3、4 章。\\n\\n**相位视角。** 第 2 章把标准二进网格写成一维端点集 $A_j=2^j\\\\mathbb Z+\\\\theta$ 的 $n$ 重笛卡尔积，其中相位 $\\\\theta\\\\in[0,1)$。反平方势的 $n+1$ 个系统对应 $n+1$ 个「相位序列」$\\\\theta_i(j)$（$i=0,\\\\dots,n$）。关键性质是这些相位之间的**相对距离** $d^*\u003e0$：任意两个不同网格的端点，在任意尺度 $j$ 都至少相距 $d^*\\\\cdot 2^j$。这保证了「端点分离」，是相邻覆盖的几何前提。\\n\\n**为什么 $n+1$ 够。** 在经典 $3^n$ 论证里，每个坐标方向需要排除「端点落在区间内部」的网格；对反平方势，$d^*\u003e0$ 使端点分离得足够开，一个长度为 $r$ 的立方体在**每个坐标方向至多排除一个**网格（因为两个网格若同时在该方向有内部端点，间距必 $\\\\le r$，与端点分离 $d^*\\\\cdot s\u003e2r$ 矛盾，见第 5 章）。于是 $n$ 个坐标方向至多排除 $n$ 个网格，$n+1$ 个网格中至少一个「全方向干净」。这正是第 4 章定理 1.1 与第 5 章定理 1.2 的核心机制。\\n\\n**为什么不需要 $3^n$。** 经典 $3^n$ 里每个方向要 $3$ 个相位（$0,1/3,2/3$），是因为标准网格「刚性均匀」，端点间距固定，$3$ 是保证「$3$ 选 $1$ 干净」的最小数。反平方势的网格边长自适应（$\\\\ell(Q)\\\\sim2^{-k}|x|$），每个方向的「干净」条件与到原点的距离耦合，$n+1$ 个相位序列（每个方向一个额外的「扰动相位」）配合 $d^*\u003e0$ 就足以同时保证所有方向的端点分离。这是一个深刻的简化，也是本文的主要贡献之一。\\n\\n## 1.8quinquies 稀疏支配如何使用相邻覆盖（概述）\\n\\n稀疏支配是近年调和分析的核心技术。这里给出其「使用相邻覆盖」的最小模板，严格机器见文献 [5,6]。\\n\\n**模板。** 设 $T$ 是一个（次线性）算子。稀疏支配的目标是证明逐点界\\n\\n$$|Tf(x)|\\\\;\\\\lesssim\\\\; \\\\sum_{Q\\\\in\\\\mathcal S}\\\\Bigl(\\\\frac1{|Q|}\\\\int_Q |f|\\\\Bigr)\\\\chi_Q(x),$$\\n\\n其中 $\\\\mathcal S$ 是一个**稀疏族**：存在两两不交的子族 $\\\\{E_Q\\\\}_{Q\\\\in\\\\mathcal S}$（$E_Q\\\\subseteq Q$，$|E_Q|\\\\ge c|Q|$），使得对每个 $Q\\\\in\\\\mathcal S$，$E_Q$ 与 $\\\\mathcal S$ 中更小的立方体不交。右端的和式就是「稀疏算子」。\\n\\n**相邻覆盖的角色。** 构造 $\\\\mathcal S$ 的典型做法是：先由算子 $T$ 产生一族「候选立方体」$\\\\mathcal Q$（例如满足某个 $Tf$ 的局部振荡条件的立方体），再从 $\\\\mathcal Q$ 中选出稀疏子族。要选出稀疏子族，需要反复使用「覆盖引理」：给定一族候选立方体，找出其中「几乎不相交」的极大立方体。**相邻覆盖性质**在这里保证：任意候选立方体 $J$ 都能被某个系统立方体 $Q$（$J\\\\subseteq Q$，$|Q|\\\\lesssim|J|$）替代，从而把候选族「整化」到系统网格上，使稀疏族的选取可控。若没有相邻覆盖，候选立方体可能横跨多个系统格子，稀疏选取就会损失常数甚至失败。\\n\\n**本文的定位。** 本文不展开稀疏支配的完整机器，而是提供它所需的**几何前提**：$n+1$ 个相邻二进系统（定理 1.1）与局部相邻覆盖（定理 1.2）。有了这两个前提，[2,3] 中针对幂律势的稀疏支配路线就可以移植到反平方势。\\n\\n## 1.2.5 本文结果一览与章节地图\\n\\n为便于后续阅读，这里给出全文的四条主要结果与七章之间的依赖地图。\\n\\n**四条主要结果。** 定理 1.1 构造 $n+1$ 个相邻二进系统 $D_{V,(i)}$（第 3、4 章）；定理 1.2 给出局部相邻覆盖性质（第 5 章）；定理 1.3 用分段核尺度 $\\\\widetilde d_\\\\alpha$ 统一 Riesz 位势核估计 $K_\\\\alpha\\\\sim\\\\widetilde d_\\\\alpha^{\\\\alpha-n}$（第 6 章）；命题 1.4 证明 $\\\\sigma\\\\neq0$ 时 $\\\\widetilde d_\\\\alpha$ 非拟度量（第 7 章）。\\n\\n**章节地图。** 本章（ch1）提供地基。第 2 章补标准二进网格与相邻覆盖的完整动机。第 3 章构造相位序列并证明相对距离 $d^*\u003e0$（引理 2.1），第 4 章用「可接受立方体」构造 $n+1$ 系统（定理 1.1）。第 5 章用鸽笼论证证局部相邻覆盖（定理 1.2）。第 6 章定义三层区域 $U/N/F$ 与分段核尺度（定理 1.3）。第 7 章用反例证非拟度量（命题 1.4）。\\n\\n**依赖关系（读图）。** ch1 与 ch2 无前置；ch3 依赖 ch2（需标准网格记号）；ch4 依赖 ch1、ch3；ch5 依赖 ch4；ch6 依赖 ch1、ch5；ch7 依赖 ch6。读者可按此顺序线性阅读，也可先通读 ch1、ch4、ch6 建立主干，再补 ch2、ch3、ch5、ch7 的细节。\\n\\n## 1.6.4 局部化临界半径 $\\\\rho_{\\\\rm loc}\\\\sim|x|$ 的进一步说明\\n\\n反平方势没有 $RH_{n/2}$ 意义上的临界半径，但 [3] 引入的局部化临界半径 $\\\\rho_{\\\\rm loc}(x,V)\\\\sim|x|$ 是「到原点距离」这一自然尺度。这里说明为什么 $|x|$ 是正确选择。\\n\\n**尺度直觉。** 反平方势 $a|x|^{-2}$ 在点 $x$ 附近的「变化尺度」由 $|x|$ 决定：在球 $B(x,\\\\rho)$ 内（$\\\\rho\\\\ll|x|$），$|y|^{-2}$ 近似等于 $|x|^{-2}$，势几乎常数；一旦 $\\\\rho$ 达到 $|x|$ 量级，势在球内就有显著变化。因此「势近乎常数」的临界尺度正是 $\\\\rho\\\\sim|x|$。这解释了 $\\\\rho_{\\\\rm loc}\\\\sim|x|$ 的几何意义。\\n\\n**与幂律势的对照。** 对幂律势 $|x|^\\\\beta$，§1.2.3 的尺度分析给出 $\\\\rho(x,V)\\\\sim|x|^{-\\\\beta/2}$。取 $\\\\beta=-2$ 得 $\\\\rho\\\\sim|x|$，与 $\\\\rho_{\\\\rm loc}\\\\sim|x|$ 一致。也就是说，$\\\\rho_{\\\\rm loc}$ 是「幂律势临界半径公式在 $\\\\beta=-2$ 的极限」，只不过 $\\\\beta=-2$ 时 $V\\\\notin RH_{n/2}$，临界半径函数严格意义下不存在，只能以 $\\\\rho_{\\\\rm loc}$ 作为替代。这统一了「为什么反平方势特殊」与「为什么 $|x|$ 是自然替代」两个问题。\\n\\n## 1.8 例子（续）\\n\\n**例 6（$n=3$ 的一个具体二进网格计算）。** 在 $\\\\mathbb R^3$ 取标准二进网格：尺度 $j=0$ 的立方体是 $Q=[0,1)^3$ 及其整数平移，边长 $\\\\ell=1$。考虑点 $x=(3,0,0)$，$|x|=3$。若要用扰动二进系统（边长 $\\\\ell(Q)\\\\sim2^{-k}|x|$）覆盖以 $x$ 为中心、边长 $r=1$ 的立方体 $J$，则需要的格子边长应 $\\\\sim|x|=3$ 量级（取 $k=0$ 时 $\\\\ell\\\\sim|x|$）。标准网格中边长 $3$ 的立方体不存在（标准网格边长是 $2^j$，只能取 $2$ 或 $4$），于是 $J$ 可能横跨多个标准格。这正是单个系统缺相邻覆盖的体现：自适应系统需要一个边长 $\\\\sim3$ 的格子，而标准网格只有 $2$ 或 $4$。第 4 章的「可接受立方体」正是为提供这类「边长随 $|x|$ 缩放」的格子而设计。\\n\\n**例 7（$|x|_\\\\infty$ 与 $|x|$ 的换算）。** 设 $x\\\\in\\\\mathbb R^n$，$|x|_\\\\infty=\\\\max_j|x_j|$。由 $|x|_\\\\infty^2\\\\le\\\\sum_j x_j^2\\\\le n|x|_\\\\infty^2$ 得 $|x|_\\\\infty\\\\le|x|\\\\le\\\\sqrt n\\\\,|x|_\\\\infty$。这个换算在后续章节反复用于「层指标 $l(x)$」与「欧氏距离」之间的切换：第 5 章用 $|x|_\\\\infty$ 定义层与局部条件，第 6 章用 $|x|$ 写核估计 (2)，两者靠这个换算衔接，只损失常数 $\\\\sqrt n$。\\n\\n## 1.11 进一步阅读提示\\n\\n本章的地基涉及若干经典理论，读者可按需查阅：\\n\\n- **自伴扩张与二次型**：Kato, *Perturbation Theory for Linear Operators* [9] 是标准参考；Friedrichs 扩张的构造见该书「二次型方法」章节。\\n- **Hardy 不等式**：经典结果，$n\\\\ge3$ 时 $|x|^{-2}$ 是最优的 Hardy 位势；最优性证明见标准泛函分析或 PDE 教材。\\n- **反向 Hölder 类与 Muckenhoupt 权**：$RH_p$ 是调和分析的基本工具，与 $A_p$ 权理论密切相关。\\n- **扰动二进系统**：[2]（幂律势）与 [3]（反平方势）是本文的直接前作，定理 A 与 $D_V$ 的完整构造见原文。\\n- **Riesz 位势核**：核估计 (2) 来自 [4,3]，与「Sobolev 空间适配于反平方势算子」的研究一脉相承。\\n\\n这些文献在正式出版时将以参考文献表呈现（见各章末尾的来源与审读记录）。本章未逐行核对的部分（Hardy 最优性、$\\\\rho$ 精确定义、核估计 (2) 的证明）已在上文与开放疑问中如实标注。\\n## 1.9 理解检查\\n\\n1. 写出 $L_a$ 的 Friedrichs 自伴扩张的完整定义链条：形式算子 → 二次型 → 下半有界 → Friedrichs 扩张。\\n2. 独立完成 Hardy 不等式的证明，并指出哪一步用到了「$u$ 支集远离原点」。\\n3. 由 $\\\\sigma$ 的定义反解 $a=\\\\sigma^2-(n-2)\\\\sigma$，并核对 $a=0$、$a=-(n-2)^2/4$ 两个端点。\\n4. 写出 $RH_p$ 的定义，并说明为何 $|x|^{-2}$ 的 $n/2$ 次幂在原点不可积导致 $V\\\\notin RH_{n/2}$。\\n5. 用一句话说明「相邻覆盖性质」在稀疏支配中的作用，以及为何平移技巧对扰动系统 $D_V$ 失效。\\n6. 用球坐标重算例 2 的两个积分，并说明为什么它们同阶发散。\\n7. 复述 §1.7.2 的端点计数论证，并说明一维为何是 $3$ 个系统、$n$ 维为何是 $3^n$ 个。\\n\\n## 1.10 本章小结、符号速查与开放疑问\\n\\n**小结。** 本章建立了：(1) 反平方势算子 $L_a$ 的 Friedrichs 自伴扩张；(2) Hardy 不等式与临界常数 $((n-2)/2)^2$ 的完整证明；(3) 参数 $\\\\sigma$ 的精确参数化 $a=\\\\sigma^2-(n-2)\\\\sigma$；(4) $V=a|x|^{-2}\\\\notin RH_{n/2}$ 的验证及其后果（临界半径函数失效、退化为 $\\\\rho_{\\\\rm loc}\\\\sim|x|$）；(5) 相邻覆盖困难的表述与本文问题。\\n\\n**关键记号速查。** $L_a=-\\\\Delta+a|x|^{-2}$（Friedrichs 自伴扩张）；$X=\\\\mathbb R^n\\\\setminus\\\\{0\\\\}$；$|x|_\\\\infty=\\\\max_j|x_j|$；$\\\\sigma=\\\\frac{n-2}{2}-\\\\frac12\\\\sqrt{(n-2)^2+4a}$；$RH_p$ 为反向 Hölder 类；$\\\\rho(x,V)$ 为临界半径函数；$\\\\rho_{\\\\rm loc}(x,V)\\\\sim|x|$ 为局部化临界半径；$\\\\ell(Q)$、$|Q|$ 分别为立方体边长与体积。\\n\\n\\n\\n**本章定理与定义索引。** 定义 1.1（反平方势算子 $L_a$）；定义 1.1$'$（Friedrichs 自伴扩张）；命题 1.2（Hardy 不等式）；推论 1.3（非负性与扩张存在）；命题 1.4（$\\\\sigma$ 参数化）；定义 1.5（$RH_p$）；命题 1.6（$V\\\\notin RH_{n/2}$）；定义 1.7（临界半径函数 $\\\\rho$，示意）；推论 1.8（$\\\\rho$ 失效、$\\\\rho_{\\\\rm loc}\\\\sim|x|$）；定义 1.9（相邻覆盖性质）；定义 1.10（层分解 $L_l$、$b_l$）。\\n**开放疑问。** (1) Hardy 常数的最优性如何严格证明（经典结果，本书未展开）？(2) 临界半径函数 $\\\\rho(x,V)$ 的精确定义与 $RH_q$ 指标 $q$ 的最优选取（依赖 [2]，未逐行核对）？(3) $\\\\rho_{\\\\rm loc}(x,V)\\\\sim|x|$ 的精确常数（依赖 [3]）？这些将在后续章节按需回访或明确标注为未核查项。\\n\",\n  \"claims\": [\n    {\n      \"id\": \"ch1-claim-sigma\",\n      \"fact_id\": \"fact-sigma-param\",\n      \"statement\": \"σ 参数化：a=σ²-(n-2)σ，a↦σ 单调递减，值域 (-∞,(n-2)/2]。\",\n      \"source_type\": \"literature\",\n      \"nature\": \"theorem\",\
